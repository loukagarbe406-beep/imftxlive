<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>IMFTX+ — PSG - Strasbourg</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <style>
    html, body { height: 100%; margin: 0; }
    body{
      font-family:'Outfit',system-ui,-apple-system,"Segoe UI",Roboto,Arial;
      color:#fff; overflow-x:hidden;
    }
    .soft-bg{
      background:
        radial-gradient(1400px 620px at 50% -10%, rgba(255,255,255,.10), transparent 60%),
        radial-gradient(1000px 520px at 50% 30%, rgba(255,255,255,.08), transparent 62%),
        radial-gradient(900px 520px at 20% 90%, rgba(255,255,255,.06), transparent 60%),
        linear-gradient(135deg, #16181c 0%, #111317 45%, #0c0e12 100%);
    }
    .player-box{
      border-radius:22px; overflow:hidden;
      border:1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.04);
      box-shadow: 0 30px 120px rgba(0,0,0,.85);
      position:relative;
    }
    video{ width:100%; height:100%; display:block; background:#000; }

    .cover{
      position:absolute; inset:0; z-index:15; cursor:pointer;
      background:
        linear-gradient(180deg, rgba(0,0,0,.10) 0%, rgba(0,0,0,.35) 55%, rgba(0,0,0,.65) 100%),
        url("https://images.unsplash.com/photo-1521412644187-c49fa049e84d?q=80&w=1600&auto=format&fit=crop") center/cover no-repeat;
    }
    .cover-top{
      position:absolute; top:18px; left:18px;
      display:flex; align-items:center; gap:10px;
      padding:10px 12px; border-radius:18px;
      background:rgba(0,0,0,.35);
      border:1px solid rgba(255,255,255,.14);
      backdrop-filter: blur(14px);
    }
    .team-logo{ width:34px;height:34px; object-fit:contain; filter: drop-shadow(0 8px 20px rgba(0,0,0,.75)); }
    .vs{ font-weight:900; font-size:14px; opacity:.9; }

    .cover-strip{
      position:absolute; left:22px; right:22px; bottom:22px;
      height:86px; border-radius:20px;
      background:rgba(255,255,255,.14);
      border:1px solid rgba(255,255,255,.16);
      backdrop-filter: blur(16px);
      display:flex; align-items:center; justify-content:space-between;
      padding:0 22px;
    }
    .strip-title{ font-size:18px; font-weight:900; line-height:1; }
    .strip-sub{ font-size:15px; opacity:.85; font-weight:600; line-height:1.1; font-style:italic; margin-top:3px; }
    .strip-play{
      width:50px;height:50px;border-radius:999px;
      border:2px solid rgba(255,255,255,.38);
      display:grid; place-items:center;
      transition:.2s; background:rgba(0,0,0,.22);
    }
    .strip-play:hover{ transform:scale(1.08); background:rgba(0,0,0,.35); }

    .source-btn{
      height:44px; border-radius:14px;
      font-weight:900; font-size:13px; transition:.2s;
    }
    .source-btn.active{ background:#fff; color:#000; }
    .source-btn.inactive{
      background:rgba(255,255,255,.08);
      border:1px solid rgba(255,255,255,.10);
      color:#fff;
    }

    .notice{
      margin-top:14px;
      border-radius:16px;
      background:rgba(255,255,255,.10);
      border:1px solid rgba(255,255,255,.12);
      padding:14px 16px;
      display:none;
    }
    .notice b{ font-weight:900; }
    .notice p{ margin:6px 0 0; opacity:.85; font-weight:700; font-size:13px; line-height:1.35; }
    .notice a{
      display:inline-flex; margin-top:10px;
      align-items:center; gap:8px;
      padding:10px 12px; border-radius:12px;
      background:rgba(0,0,0,.30);
      border:1px solid rgba(255,255,255,.14);
      font-weight:900; color:#fbbf24; text-decoration:none;
    }
  </style>
</head>

<body class="soft-bg">
  <nav class="sticky top-0 z-40 bg-black/20 backdrop-blur-xl border-b border-white/5">
    <div class="max-w-screen-2xl mx-auto px-6 py-3 flex items-center justify-between">
      <div class="text-3xl font-extrabold tracking-tight">IMFTX+</div>
      <a href="index.html"
         class="inline-flex items-center gap-2 px-4 h-10 rounded-full bg-white/10 border border-white/10 hover:bg-white/15 font-bold text-sm active:scale-95 transition">
        <i class="fa-solid fa-arrow-left"></i> Retour
      </a>
    </div>
  </nav>

  <main class="max-w-screen-2xl mx-auto px-6 py-10">

    <section class="player-box w-full aspect-video">
      <div id="cover" class="cover" onclick="loadVideo(1)">
        <div class="cover-top">
          <img class="team-logo" src="https://upload.wikimedia.org/wikipedia/en/a/a7/Paris_Saint-Germain_F.C..svg" alt="PSG">
          <span class="vs">VS</span>
          <img class="team-logo" src="https://upload.wikimedia.org/wikipedia/fr/thumb/7/70/Racing_Club_de_Strasbourg_Alsace_logo_2020.svg/512px-Racing_Club_de_Strasbourg_Alsace_logo_2020.svg.png" alt="Strasbourg">
        </div>
        <div class="cover-strip">
          <div>
            <div class="strip-title">Regarder</div>
            <div class="strip-sub">PSG<br>Strasbourg</div>
          </div>
          <div class="strip-play"><i class="fa-solid fa-play"></i></div>
        </div>
      </div>

      <video id="video" class="w-full h-full" controls playsinline></video>
    </section>

    <section class="mt-5 flex flex-wrap gap-3">
      <button id="btn1" onclick="loadVideo(1)" class="source-btn active px-6">Source 1</button>
      <button id="btn2" onclick="loadVideo(2)" class="source-btn inactive px-6">Source 2</button>
      <button id="btn3" onclick="loadVideo(3)" class="source-btn inactive px-6">Source 3</button>
    </section>

    <div id="notice" class="notice">
      <b id="noticeTitle">Lecture impossible</b>
      <p id="noticeText"></p>
      <a id="directLink" href="#" target="_blank" rel="noreferrer">
        <i class="fa-solid fa-arrow-up-right-from-square"></i> Ouvrir le lien
      </a>
    </div>

  </main>

  <script>
    // Mets UNIQUEMENT des flux auxquels tu as le droit d'accéder.
    const SOURCES = {
      1: "https://cdn-live.tv/api/v1/channels/player/?name=sky+sport+nfl&code=gb&user=cdnlivetv&plan=free", // <- colle ici ton .m3u8 autorisé
      2: "#",
      3: "#"
    };

    let hls = null;

    function setActive(id){
      [1,2,3].forEach(n=>{
        const b = document.getElementById("btn"+n);
        b.className = (n===id) ? "source-btn active px-6" : "source-btn inactive px-6";
      });
    }

    function showNotice(title, text, url){
      document.getElementById("noticeTitle").textContent = title;
      document.getElementById("noticeText").textContent = text;
      const a = document.getElementById("directLink");
      a.href = url || "#";
      document.getElementById("notice").style.display = "block";
    }
    function hideNotice(){
      document.getElementById("notice").style.display = "none";
    }

    function cleanup(){
      if(hls){ try{ hls.destroy(); }catch(e){} hls = null; }
    }

    function loadVideo(id){
      const url = SOURCES[id];
      document.getElementById("cover").style.display = "none";
      setActive(id);
      hideNotice();

      const video = document.getElementById("video");
      cleanup();
      video.pause();
      video.removeAttribute("src");
      video.load();

      if(!url || url === "#"){
        showNotice("Aucune source", "Ajoute un lien .m3u8 autorisé dans SOURCES.", url);
        return;
      }

      // HLS.js (Chrome/Firefox/Edge)
      if(window.Hls && Hls.isSupported()){
        hls = new Hls({ lowLatencyMode:true });
        hls.loadSource(url);
        hls.attachMedia(video);

        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          video.play().catch(()=>{});
        });

        hls.on(Hls.Events.ERROR, (_, data) => {
          // Ici on ne contourne rien : on affiche juste un message propre.
          const isForbidden = data?.response?.code === 403;
          if(isForbidden){
            showNotice(
              "403 Unauthorized",
              "Le serveur refuse l’accès à ce flux (protection / token / restriction). Essaye une autre source ou utilise un lien auquel tu es autorisé.",
              url
            );
          } else {
            showNotice(
              "Lecture impossible",
              "Le flux ne se charge pas (lien expiré, indisponible, ou bloqué).",
              url
            );
          }
        });

        return;
      }

      // Safari/iOS (HLS natif)
      if(video.canPlayType("application/vnd.apple.mpegurl")){
        video.src = url;
        video.play().catch(()=> {
          showNotice("Lecture impossible", "Le flux est refusé ou inaccessible sur cet appareil.", url);
        });
        return;
      }

      showNotice("Non supporté", "Ton navigateur ne supporte pas HLS.", url);
    }
  </script>

</body>
</html>
