<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>IMFTX+ — PSG - Strasbourg</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

  <style>
    html, body { height: 100%; margin: 0; }
    body{
      font-family: 'Outfit', system-ui, -apple-system, "Segoe UI", Roboto, Arial;
      color:#fff;
      overflow-x:hidden;
    }

    /* ✅ FOND GRIS PRO */
    .soft-bg{
      background:
        radial-gradient(1400px 620px at 50% -10%, rgba(255,255,255,.10), transparent 60%),
        radial-gradient(1000px 520px at 50% 30%, rgba(255,255,255,.08), transparent 62%),
        radial-gradient(900px 520px at 20% 90%, rgba(255,255,255,.06), transparent 60%),
        linear-gradient(135deg, #16181c 0%, #111317 45%, #0c0e12 100%);
    }

    .player-box{
      border-radius:22px;
      overflow:hidden;
      border:1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.04);
      box-shadow: 0 30px 120px rgba(0,0,0,.85);
      position:relative;
    }
    iframe{ width:100%; height:100%; border:0; background:#000; display:block; }

    .cover{
      position:absolute;
      inset:0;
      z-index:15;
      cursor:pointer;
      background:
        linear-gradient(180deg, rgba(0,0,0,.10) 0%, rgba(0,0,0,.35) 55%, rgba(0,0,0,.65) 100%),
        url("https://images.unsplash.com/photo-1521412644187-c49fa049e84d?q=80&w=1600&auto=format&fit=crop") center/cover no-repeat;
    }

    .cover-top{
      position:absolute;
      top:18px;
      left:18px;
      display:flex;
      align-items:center;
      gap:10px;
      padding:10px 12px;
      border-radius:18px;
      background:rgba(0,0,0,.35);
      border:1px solid rgba(255,255,255,.14);
      backdrop-filter: blur(14px);
    }
    .team-logo{
      width:34px;height:34px;
      object-fit:contain;
      filter: drop-shadow(0 8px 20px rgba(0,0,0,.75));
    }
    .vs{
      font-weight:900;
      font-size:14px;
      opacity:.9;
    }

    .cover-strip{
      position:absolute;
      left:22px;
      right:22px;
      bottom:22px;
      height:86px;
      border-radius:20px;
      background:rgba(255,255,255,.14);
      border:1px solid rgba(255,255,255,.16);
      backdrop-filter: blur(16px);
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:0 22px;
    }
    .strip-title{
      font-size:18px;
      font-weight:900;
      line-height:1;
    }
    .strip-sub{
      font-size:15px;
      opacity:.85;
      font-weight:600;
      line-height:1.1;
      font-style:italic;
      margin-top:3px;
      text-transform: none;
    }
    .strip-play{
      width:50px;height:50px;
      border-radius:999px;
      border:2px solid rgba(255,255,255,.38);
      display:grid;
      place-items:center;
      transition:.2s;
      background:rgba(0,0,0,.22);
    }
    .strip-play i{ font-size:19px; }
    .strip-play:hover{ transform:scale(1.08); background:rgba(0,0,0,.35); }

    .source-btn{
      height:44px;
      border-radius:14px;
      font-weight:900;
      font-size:13px;
      transition:.2s;
    }
    .source-btn.active{ background:#fff; color:#000; }
    .source-btn.inactive{
      background:rgba(255,255,255,.08);
      border:1px solid rgba(255,255,255,.10);
      color:#fff;
    }
    .source-btn:hover{ opacity:.95; }

    .watch-bar{
      border-radius:18px;
      background:rgba(255,255,255,.10);
      border:1px solid rgba(255,255,255,.12);
      backdrop-filter: blur(16px);
      padding:16px 18px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:16px;
    }
    .watch-left{
      display:flex;
      align-items:center;
      gap:14px;
      min-width:0;
    }
    .watch-left img{
      width:40px;height:40px;
      object-fit:contain;
      filter: drop-shadow(0 6px 14px rgba(0,0,0,.7));
      flex-shrink:0;
    }
    .watch-text{ min-width:0; line-height:1.1; }
    .watch-text .small{ opacity:.8; font-weight:700; font-size:13px; }
    .watch-text .big{
      font-weight:900;
      font-size:16px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .watch-right{
      display:flex;
      align-items:center;
      gap:10px;
      flex-shrink:0;
    }
    .channel-logo{
      width:90px;
      height:auto;
      object-fit:contain;
      filter: drop-shadow(0 6px 14px rgba(0,0,0,.7));
    }

    .pill{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:7px 12px;
      border-radius:999px;
      background: rgba(0,0,0,.35);
      border:1px solid rgba(255,255,255,.14);
      backdrop-filter: blur(14px);
      font-weight:900;
      font-size:12px;
    }
    .dot{
      width:7px;height:7px;border-radius:999px;background:#f59e0b;
      box-shadow:0 0 0 4px rgba(245,158,11,.14);
    }
  </style>
</head>

<body class="soft-bg">

  <nav class="sticky top-0 z-40 bg-black/20 backdrop-blur-xl border-b border-white/5">
    <div class="max-w-screen-2xl mx-auto px-6 py-3 flex items-center justify-between">
      <div class="text-3xl font-extrabold tracking-tight">IMFTX+</div>

      <a href="index.html"
         class="inline-flex items-center gap-2 px-4 h-10 rounded-full bg-white/10 border border-white/10 hover:bg-white/15 font-bold text-sm active:scale-95 transition">
        <i class="fa-solid fa-arrow-left"></i> Retour
      </a>
    </div>
  </nav>

  <main class="max-w-screen-2xl mx-auto px-6 py-10">

    <section class="player-box w-full aspect-video">

      <div id="cover" class="cover" onclick="loadVideo(1)">
        <div style="position:absolute;top:18px;right:18px;">
          <span class="pill"><span class="dot"></span>21:00</span>
        </div>

        <div class="cover-top">
          <img class="team-logo"
               src="https://upload.wikimedia.org/wikipedia/en/a/a7/Paris_Saint-Germain_F.C..svg"
               alt="PSG">
          <span class="vs">VS</span>
          <img class="team-logo"
               src="https://upload.wikimedia.org/wikipedia/fr/thumb/7/70/Racing_Club_de_Strasbourg_Alsace_logo_2020.svg/512px-Racing_Club_de_Strasbourg_Alsace_logo_2020.svg.png"
               alt="Strasbourg">
        </div>

        <div class="cover-strip">
          <div>
            <div class="strip-title">Regarder Gratuitement</div>
            <div class="strip-sub">PSG<br>Strasbourg</div>
          </div>

          <div class="strip-play">
            <i class="fa-solid fa-play"></i>
          </div>
        </div>
      </div>

      <div id="videoTarget" class="w-full h-full"></div>
    </section>

    <section class="mt-5 flex flex-wrap gap-3">
      <button id="btn1" onclick="loadVideo(1)" class="source-btn active px-6">Source 1</button>
      <button id="btn2" onclick="loadVideo(2)" class="source-btn inactive px-6">Source 2</button>
      <button id="btn3" onclick="loadVideo(3)" class="source-btn inactive px-6">Source 3</button>
    </section>

    <div id="externalLink" class="hidden mt-4 text-center">
      <a id="directLink" href="#" target="_blank"
         class="text-amber-400 underline font-extrabold text-sm">
        Le lecteur ne s’affiche pas ? Ouvrir le lien direct
      </a>
    </div>

    <section class="mt-6 watch-bar">
      <div class="watch-left">
        <img src="https://empire-sport.world/upload/leagues/lnjvd4afeukdyr5agooauznrzjyeoh.png" alt="Compétition">
        <div class="watch-text">
          <div class="small">Vous regardez</div>
          <div class="big">PSG — Strasbourg</div>
          <div class="small">Match · 21:00</div>
        </div>
      </div>

      <div class="watch-right">
        <img class="channel-logo"
             src="https://empire-sport.world/upload/chaines/poqxsy7vbdgxxb1r2x1koldqf8tgko.png"
             alt="Chaîne">
      </div>
    </section>

    <div class="mt-8 text-center text-sm text-white/55 font-semibold">
      Si le stream bug, nous ne sommes pas responsables (connexion / lecteur externe).
      — L’équipe IMFTX+
    </div>

  </main>

  <script>
    // ✅ Mets tes liens officiels/légaux ici
    const SOURCES = {
      1: "https://cdn-live-tv.ru/api/v1/channels/es-bein-sports-n/index.m3u8?token=91f0861c5e5f18e537ddf1fff45dbaf66eefcf744d989925f2afe9d0cfcb671d.1769975944.7dd01914d1e79ae115415915d62de81e.3d0dca5f5d559b6a4852b2b749af92f7.643c46b3586f22672996107eebcbac20.bc6c8c1e81d51f33",
      2: "#",
      3: "#"
    };

    function setActive(id){
      [1,2,3].forEach(n=>{
        const b = document.getElementById("btn"+n);
        b.className = (n===id)
          ? "source-btn active px-6"
          : "source-btn inactive px-6";
      });
    }

    function loadVideo(id){
      document.getElementById("cover").style.display = "none";
      setActive(id);

      const ext = document.getElementById("externalLink");
      const link = document.getElementById("directLink");
      link.href = SOURCES[id];
      ext.classList.add("hidden");

      const target = document.getElementById("videoTarget");
      target.innerHTML = `
        <iframe
          id="streamFrame"
          src="${SOURCES[id]}"
          allowfullscreen
          scrolling="no"
          frameborder="0"
          allow="autoplay; fullscreen; picture-in-picture; encrypted-media"
          referrerpolicy="origin"
          sandbox="allow-scripts allow-same-origin allow-forms allow-presentation">
        </iframe>
      `;

      setTimeout(() => {
        const iframe = document.getElementById("streamFrame");
        if(!iframe) return;
        try { iframe.contentWindow.location.href; }
        catch(e){ ext.classList.remove("hidden"); }
      }, 2000);
    }
  </script>

</body>
</html>
