<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Lecteur Vidéo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0d0d0d;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: sans-serif;
    }
    #player-wrapper {
      position: relative;
      width: 100%;
      max-width: 960px;
      aspect-ratio: 16/9;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 0 30px rgba(0,0,0,0.8);
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
    /* Couche transparente pour bloquer les clics sur les zones de pub */
    #click-shield {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 10;
      /* pointer-events: none; — désactivé pour permettre le contrôle du player */
    }
    #status {
      position: absolute;
      bottom: 8px;
      right: 12px;
      background: rgba(0,200,100,0.15);
      color: #00e676;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 4px;
      z-index: 20;
      pointer-events: none;
    }
  </style>
</head>
<body>

<div id="player-wrapper">
  <iframe
    id="stream-frame"
    src="https://viewembed.ru/channel/BeINSport1%5BFrance%5D"
    allowfullscreen
    allow="autoplay; fullscreen; encrypted-media"
    scrolling="no"
  ></iframe>
  <div id="click-shield"></div>
  <div id="status">🛡️ Anti-popup actif</div>
</div>

<script>
  /* ── 1. Bloque window.open ── */
  window.open = function() { return null; };

  /* ── 2. Bloque window.location redirect ── */
  const _assign = window.location.assign.bind(window.location);
  try {
    Object.defineProperty(window.location, 'href', {
      set(url) {
        if (new URL(url, location.href).origin === location.origin) _assign(url);
      }
    });
  } catch(e) {}

  /* ── 3. Bloque les liens _blank ── */
  document.addEventListener('click', function(e) {
    const a = e.target.closest('a');
    if (a && a.target === '_blank') { e.preventDefault(); e.stopPropagation(); }
  }, true);

  /* ── 4. Overlay anti-premier-clic piégé ── */
  const shield = document.getElementById('click-shield');
  shield.addEventListener('click', function(e) {
    shield.style.display = 'none';
    setTimeout(() => { shield.style.display = 'block'; }, 400);
  });

  /* ── 5. Blur trick : reprend le focus si une page s'ouvre ── */
  window.addEventListener('blur', function() {
    setTimeout(() => { window.focus(); }, 50);
  });

  /* ── 6. Supprime les iframes parasites injectées ── */
  const observer = new MutationObserver(mutations => {
    for (const m of mutations) {
      for (const node of m.addedNodes) {
        if (node.tagName === 'IFRAME' && node !== document.getElementById('stream-frame')) {
          node.remove();
        }
      }
    }
  });
  observer.observe(document.body, { childList: true, subtree: true });

  /* ── 7. Plein écran double-clic ── */
  const wrapper = document.getElementById('player-wrapper');
  document.addEventListener('dblclick', () => {
    if (!document.fullscreenElement) wrapper.requestFullscreen().catch(()=>{});
    else document.exitFullscreen();
  });

  console.log('%c🛡️ Anti-popup actif', 'color:#00e676;font-weight:bold');
</script>

</body>
</html>
