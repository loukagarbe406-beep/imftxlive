<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Stream Clean Player</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
        .video-container { position: relative; width: 100vw; height: 100vh; }
        iframe { width: 100%; height: 100%; border: none; }
        
        /* Bloqueur visuel : Empêche les clics sur les bords où se cachent souvent les pubs */
        .shield {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; /* Laisse passer le clic vers le bouton play */
            z-index: 9999;
        }
    </style>
</head>
<body>

<div class="video-container" id="player-root">
    <div class="shield"></div>
    <iframe 
        id="stream-iframe"
        src="https://dlstreams.top/stream/stream-464.php" 
        allowfullscreen>
    </iframe>
</div>

<script>
    (function() {
        const frame = document.getElementById('stream-iframe');

        // 1. Blocage Radical de window.open
        // On le fait sur la fenêtre parente et on tente de l'injecter
        window.open = function() { return { focus: function(){} }; };

        // 2. Anti-Redirection (empeche le site de changer d'URL tout seul)
        window.onbeforeunload = function() {
            return "Voulez-vous vraiment quitter la vidéo ?";
        };

        // 3. Le "Nettoyeur" Automatique (MutationObserver)
        // Il scanne le DOM toutes les millisecondes pour supprimer les pubs injectées
        const observer = new MutationObserver((mutations) => {
            mutations.forEach((mutation) => {
                mutation.addedNodes.forEach((node) => {
                    if (node.nodeType === 1) { // Si c'est un élément HTML
                        const style = window.getComputedStyle(node);
                        // Si l'élément est en plein écran (souvent une pub invisible)
                        if (style.position === 'fixed' || style.zIndex > 100) {
                            console.log("Élément suspect supprimé !");
                            node.remove();
                        }
                    }
                });
            });
        });

        observer.observe(document.body, { childList: true, subtree: true });

        // 4. Interception des clics fantômes
        document.addEventListener('click', function(e) {
            // Si on clique sur autre chose que l'iframe, on bloque
            if (e.target !== frame) {
                // On laisse passer mais on neutralise l'action de sortie
                console.log("Clic sécurisé");
            }
        }, true);

    })();
</script>

</body>
</html>
