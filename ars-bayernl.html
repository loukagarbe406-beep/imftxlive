<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Lecteur Vidéo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0d0d0d;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: sans-serif;
    }
    #player-wrapper {
      position: relative;
      width: 100%;
      max-width: 960px;
      aspect-ratio: 16/9;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 0 30px rgba(0,0,0,0.8);
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
    /* Couche transparente pour bloquer les clics sur les zones de pub */
    #click-shield {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 10;
      /* pointer-events: none; — désactivé pour permettre le contrôle du player */
    }
    #status {
      position: absolute;
      bottom: 8px;
      right: 12px;
      background: rgba(0,200,100,0.15);
      color: #00e676;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 4px;
      z-index: 20;
      pointer-events: none;
    }
  </style>
</head>
<body>

<div id="player-wrapper">
  <iframe
    id="stream-frame"
    src="https://dlstreams.top/cast/stream-463.php"
    allowfullscreen
    allow="autoplay; fullscreen; encrypted-media"
    scrolling="no"
  ></iframe>
  <div id="click-shield"></div>
  <div id="status">🛡️ Anti-popup actif</div>
</div>

<script>
  /* ── Anti-popup : intercepte window.open avant qu'il s'exécute ── */
  const _origOpen = window.open;
  window.open = function(...args) {
    console.warn('[Anti-popup] Fenêtre bloquée :', args[0]);
    return null; // bloque tout window.open
  };

  /* ── Bloque les redirections automatiques via location ── */
  const _origAssign   = window.location.assign.bind(window.location);
  const _origReplace  = window.location.replace.bind(window.location);
  try {
    Object.defineProperty(window.location, 'href', {
      set(url) {
        // Autorise uniquement si c'est la même origine
        if (new URL(url, location.href).origin === location.origin) {
          _origAssign(url);
        } else {
          console.warn('[Anti-redirect] Bloqué :', url);
        }
      }
    });
  } catch(e) {}

  /* ── Bloque les nouveaux onglets via faux clic ── */
  document.addEventListener('click', function(e) {
    const a = e.target.closest('a');
    if (a && a.target === '_blank') {
      e.preventDefault();
      e.stopPropagation();
      console.warn('[Anti-popup] Lien _blank bloqué :', a.href);
    }
  }, true);

  /* ── Supprime les iframes cachées injectées dynamiquement ── */
  const observer = new MutationObserver(mutations => {
    for (const m of mutations) {
      for (const node of m.addedNodes) {
        if (node.tagName === 'IFRAME' && node !== document.getElementById('stream-frame')) {
          console.warn('[Anti-popup] Iframe parasite supprimée');
          node.remove();
        }
        // Supprime aussi les div/script de pub connus
        if (node.tagName === 'SCRIPT' && node.src && !node.src.includes('dlstreams')) {
          node.remove();
        }
      }
    }
  });
  observer.observe(document.body, { childList: true, subtree: true });

  /* ── Bloque focus() automatique (trick classique pour popup) ── */
  const _origFocus = window.focus;
  window.focus = function() {};

  /* ── Gère le plein écran natif (double-clic) ── */
  const wrapper = document.getElementById('player-wrapper');
  document.addEventListener('dblclick', () => {
    if (!document.fullscreenElement) {
      wrapper.requestFullscreen().catch(()=>{});
    } else {
      document.exitFullscreen();
    }
  });

  console.log('%c🛡️ Anti-popup chargé avec succès', 'color:#00e676;font-weight:bold');
</script>

</body>
</html>
