
<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a0a0a">
  <title>IMFTX — Chelsea - Man City</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' };
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0a0a;
      --surface: #1a1a1b;
      --border: rgba(255, 255, 255, 0.06);
      --text: #ffffff;
      --muted: #8e8e8e;
      --red: #ef4444;
      --discord: #5865f2;
      --chat-blue: #2b63f1;
      --iptv-green: #16a34a;
      /* Couleurs footer / boutons (références marques) */
      --discord-blurple: #5865f2;
      --x-tile-bg: #1f1f1f;
      --x-tile-border: #3f3f46;
      --x-icon: #e4e4e7;
      --iptv-pill: #22c55e;
      --iptv-pill-hover: #16a34a;
      --telegram-blue: #229ed9;
      /* Compteur spectateurs (ref. saumon sur noir) */
      --viewer-coral: #ff7070;
      /* Rail chaînes live (ref. gris très foncé, pas de blanc) */
      --rail-bg: #18181b;
      --rail-border: rgba(255, 255, 255, 0.05);
      --rail-placeholder: #adadb8;
      /* Chat + bande sous bannière : même teinte que le fond page (#0a0a0a) */
      --chat-panel-bg: var(--bg);
      --chat-welcome: #7a8691;
      --chat-banner-bg: var(--bg);
    }
    html, body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }
    a { color: inherit; text-decoration: none; }
    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      background: none;
      color: inherit;
    }

    /* ── Grille principale (rail | lecteur | chat Twitch) ── */
    .shell {
      display: grid;
      grid-template-columns: minmax(168px, 208px) 1fr minmax(260px, 300px);
      height: calc(100vh - 64px);
      min-height: 0;
      max-width: 100%;
      margin: 0 auto;
      overflow: hidden;
    }
    .shell.rail-collapsed {
      grid-template-columns: 46px 1fr minmax(260px, 300px);
    }

    /* ── Rail chaînes live ── */
    .live-channels-rail {
      background: var(--rail-bg);
      border-right: 1px solid var(--rail-border);
      display: flex;
      flex-direction: column;
      min-height: 0;
      min-width: 0;
      overflow: hidden;
    }
    .live-rail__header {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 14px 12px;
      border-bottom: 1px solid var(--rail-border);
    }
    .live-rail__title {
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      letter-spacing: -0.02em;
    }
    .live-rail__collapse {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(255, 255, 255, 0.92);
      transition: background 0.15s, color 0.15s;
    }
    .live-rail__collapse:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
    }
    .live-rail__collapse-icon {
      display: block;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: -0.06em;
      line-height: 1;
      transition: transform 0.2s;
    }
    .shell.rail-collapsed .live-rail__collapse-icon { transform: rotate(180deg); }
    .shell.rail-collapsed .live-rail__title { display: none; }
    .shell.rail-collapsed .live-rail__body { display: none; }
    .shell.rail-collapsed .live-rail__header {
      justify-content: center;
      border-bottom: none;
      padding: 12px 0;
    }
    .live-rail__body {
      flex: 1;
      overflow-y: auto;
      padding: 12px 10px;
      min-height: 0;
    }
    .live-rail__empty {
      font-size: 12px;
      font-weight: 500;
      color: var(--rail-placeholder);
      text-align: center;
      line-height: 1.5;
      padding: 10px 4px;
    }
    .live-channels {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    /* ── Colonne centrale ── */
    .col-center {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      background: var(--bg);
    }
    .player-shell {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .live-player-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      flex: 0 0 auto;
      background: var(--bg);
      border-bottom: none;
      overflow: hidden;
    }
    .live-player-inner {
      position: absolute;
      inset: 0;
      background: var(--bg);
    }
    .live-player-inner iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: var(--bg);
    }

    /* Barre sous le lecteur — même logique que l’overlay téléphone / desktop fourni */
    .player-footer {
      flex-shrink: 0;
      width: 100%;
      box-sizing: border-box;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 16px;
      min-height: 96px;
      padding: 14px 20px 16px;
      margin: 0;
      background: var(--bg);
      border-top: 1px solid var(--border);
    }
    .player-footer > .match-inline {
      grid-column: 1;
      justify-self: start;
      min-width: 0;
      max-width: min(380px, 48vw);
    }
    .player-footer > .btn-group {
      grid-column: 2;
    }
    .player-footer__viewers {
      grid-column: 3;
      justify-self: end;
      align-self: center;
    }
    .player-footer .match-inline {
      display: block;
      font-size: clamp(15px, 2.2vw, 18px);
      font-weight: 800;
      margin: 0;
      line-height: 1.22;
      letter-spacing: -0.02em;
      color: #ffffff;
      text-transform: none;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    /* Toujours une seule ligne « équipe A vs équipe B » (priorité sur tout autre style). */
    #matchFooter.match-inline {
      white-space: nowrap !important;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .btn-group {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      justify-self: center;
    }
    .stream-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      height: 40px;
      padding: 0 16px;
      border-radius: 11px;
      font-weight: 800;
      border: 1px solid transparent;
      color: #fff;
      cursor: pointer;
      text-decoration: none;
      line-height: 1;
      white-space: nowrap;
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s, filter 0.2s;
      position: relative;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    }
    .stream-btn::before {
      content: "";
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
      transition: left 0.5s;
      z-index: 1;
      pointer-events: none;
    }
    .stream-btn:hover::before {
      left: 100%;
    }
    .stream-btn > svg,
    .stream-btn > .btn-label,
    .stream-btn > .btn-iptv-emoji {
      position: relative;
      z-index: 2;
    }
    .stream-btn:hover {
      transform: translateY(-3px) scale(1.05);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5), 0 0 20px currentColor;
    }
    .stream-btn:active {
      transform: translateY(-1px) scale(0.98);
    }
    .stream-btn svg {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }
    .stream-btn .btn-label {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0;
    }
    .btn-discord-sm {
      background: #5865f2;
      border-color: rgba(255, 255, 255, 0.08);
      color: #ffffff;
    }
    .btn-x-sm {
      background: #070707;
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #ffffff;
    }
    .btn-telegram-sm {
      background: #289cd8;
      border-color: rgba(255, 255, 255, 0.08);
      color: #ffffff;
    }
    .btn-iptv-emoji {
      display: inline;
      font-size: 16px;
      line-height: 1;
    }
    .btn-iptv {
      background: #12bb57;
      border-color: rgba(255, 255, 255, 0.08);
      min-height: 40px;
      height: 40px;
      padding: 0 18px;
      border-radius: 11px;
      color: #ffffff;
      gap: 8px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    }
    .stream-btn.btn-iptv:hover {
      filter: brightness(1.06);
      background: #0fa84d;
    }
    .btn-iptv .btn-label {
      color: #fff;
    }

    .viewer-mini {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: #ff6b6b;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1;
      background: transparent;
      padding: 3px 0 0;
      margin: 0;
      flex-shrink: 0;
    }
    .viewer-mini svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
      flex-shrink: 0;
    }
    /* ── Colonne chat (décoratif, pas de vrai chat ni Twitch) ── */
    .col-right {
      background: var(--chat-panel-bg);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      min-height: 0;
      min-width: 0;
      overflow: hidden;
    }
    .chat-header {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      background: var(--chat-panel-bg);
    }
    .chat-header__title {
      font-size: 13px;
      font-weight: 700;
      color: #ffffff;
    }
    .chat-header__actions {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .chat-header__icon {
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      color: rgba(255, 255, 255, 0.75);
      font-size: 15px;
      font-weight: 700;
      line-height: 1;
      user-select: none;
    }
    .chat-header__icon:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.06);
    }
    .chat-header__icon svg {
      width: 16px;
      height: 16px;
    }
    /* Bannière : même ratio que l’asset (1860×371) pour afficher l’affiche entière, sans crop bancal */
    .chat-banner {
      flex-shrink: 0;
      position: relative;
      width: 100%;
      aspect-ratio: 1860 / 371;
      overflow: hidden;
      border-bottom: 1px solid var(--border);
      background: var(--chat-banner-bg);
    }
    .chat-banner img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center center;
      display: block;
    }
    .twitch-chat-wrap {
      flex: 1;
      min-height: 0;
      position: relative;
      background: var(--chat-panel-bg);
    }
    .twitch-chat-wrap iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    @media (max-width: 1100px) {
      .shell,
      .shell.rail-collapsed {
        grid-template-columns: 1fr;
        height: auto;
        min-height: calc(100vh - 64px);
      }
      .live-channels-rail { display: none; }
      .col-center { order: 1; }
      .col-right {
        order: 2;
        border-left: none;
        border-top: 1px solid var(--border);
        max-height: 55vh;
        margin: 0 14px;
        border-radius: 14px 14px 0 0;
      }
      .live-player-wrap { max-height: none; }
    }

    /* ── Mobile (≤760px) : même overlay que le script de référence (header compact + footer colonne) ── */
    @media (max-width: 760px) {
      .col-center .player-shell {
        padding: 0 14px;
      }
      .live-player-wrap {
        border-radius: 12px;
        overflow: hidden;
        margin-top: 6px;
      }
      .player-footer {
        display: grid;
        grid-template-columns: 1fr auto;
        grid-template-rows: auto auto;
        align-items: start;
        column-gap: 10px;
        row-gap: 12px;
        padding: 14px 12px 16px;
        min-height: 0;
        border-top: none;
      }
      .player-footer > .match-inline {
        grid-column: 1;
        grid-row: 1;
        max-width: 100%;
        margin: 0;
        font-size: 24px;
        line-height: 1.25;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .player-footer__viewers {
        grid-column: 2;
        grid-row: 1;
        justify-self: end;
        align-self: start;
        font-size: 16px;
        padding-top: 4px;
      }
      .player-footer__viewers svg {
        width: 16px;
        height: 16px;
      }
      .player-footer > .btn-group {
        grid-column: 1 / -1;
        grid-row: 2;
        width: 100%;
        justify-content: flex-start;
        gap: 8px;
      }
      .btn-group .stream-btn {
        border-radius: 10px;
      }
      .stream-btn {
        height: 38px;
        min-height: 38px;
        padding: 0 12px;
      }
      .stream-btn .btn-label {
        font-size: 11px;
      }
      .btn-iptv {
        height: 38px;
        min-height: 38px;
        width: fit-content;
        max-width: 100%;
        padding: 0 12px;
      }
      .btn-iptv-emoji {
        font-size: 15px;
      }
      /* Chat plus grand sur téléphone (zone messages prête pour un futur vrai chat) */
      .col-right {
        max-height: min(92vh, 960px);
        min-height: 58vh;
      }
      .twitch-chat-wrap {
        min-height: min(44vh, 360px);
      }
    }
  </style>
</head>

  <script>
    (function () {
      function initNavChrome() {
        var root = document.documentElement;
        var stored = null;
        try { stored = localStorage.getItem("imftx-theme"); } catch (e) {}
        if (stored === "light") root.classList.remove("dark");
        else if (stored === "dark") root.classList.add("dark");

        var themeBtn = document.getElementById("theme-toggle");
        if (themeBtn) {
          themeBtn.addEventListener("click", function () {
            root.classList.toggle("dark");
            try {
              localStorage.setItem("imftx-theme", root.classList.contains("dark") ? "dark" : "light");
            } catch (e) {}
          });
        }

        var burger = document.getElementById("burgerBtn");
        var mobileNav = document.getElementById("mobileNav");
        if (burger && mobileNav) {
          burger.addEventListener("click", function () {
            var open = mobileNav.classList.toggle("hidden") === false;
            burger.setAttribute("aria-expanded", open ? "true" : "false");
          });
        }
      }

      function initTwitchChatEmbed() {
        var el = document.getElementById("twitch-chat-embed");
        if (!el) return;
        var channel = String(el.dataset.twitchChannel || "imftx").trim();
        var host = window.location.hostname;
        if (!host) host = "localhost";
        var parents = [host];
        if (host.indexOf(".") > 0 && host.indexOf("www.") !== 0) {
          parents.push("www." + host);
        }
        var qs = parents.map(function (p) { return "parent=" + encodeURIComponent(p); }).join("&");
        el.src = "https://www.twitch.tv/embed/" + encodeURIComponent(channel) + "/chat?" + qs + "&darkpopout";
      }

      function capWord(w) {
        if (!w) return w;
        var lower = w.toLowerCase();
        /* Acronymes très courts (ex. PSG, OM, AS) : tout en majuscules */
        if (w.length <= 3 && w === w.toUpperCase() && /^[A-ZÀ-Ÿ]+$/.test(w)) {
          return w.toUpperCase();
        }
        return lower.charAt(0).toUpperCase() + lower.slice(1);
      }

      function titleCaseWords(str) {
        return String(str).trim().split(/\s+/).filter(Boolean).map(capWord).join(" ");
      }

      /** Une seule ligne : « équipe A vs équipe B » (vs en minuscules, jamais de retour à la ligne). */
      function formatMatchTitle(full) {
        var s = String(full).trim()
          .replace(/<br\s*\/?>/gi, " ")
          .replace(/<[^>]+>/g, " ")
          .replace(/\s*[\r\n\u2028\u2029]+\s*/g, " ")
          .replace(/\u00a0/g, " ")
          .replace(/\s+/g, " ");
        if (!s) return s;
        var parts = s.split(/\s+vs\s+/i);
        if (parts.length < 2) {
          if (/\s+-\s+/.test(s)) {
            var h = s.split(/\s+-\s+/);
            if (h.length >= 2) {
              return titleCaseWords(h[0]) + " vs " + titleCaseWords(h.slice(1).join(" - "));
            }
          }
          return titleCaseWords(s);
        }
        var home = parts[0].trim();
        var away = parts.slice(1).join(" vs ").trim();
        return titleCaseWords(home) + " vs " + titleCaseWords(away);
      }

      function applyTitleFromQuery() {
        var params = new URLSearchParams(window.location.search);
        var title = params.get("match");
        var footer = document.getElementById("matchFooter");
        if (!footer) return;

        var line;
        if (title) {
          try { title = decodeURIComponent(title); } catch (e) {}
          line = formatMatchTitle(title);
          document.title = "IMFTX — " + line;
        } else {
          line = formatMatchTitle(footer.textContent);
        }
        line = String(line).replace(/\s*[\r\n\u2028\u2029]+\s*/g, " ").trim();
        footer.textContent = line;
      }

      var pageSlug = "tfc-losc";

      function getSessionId() {
        var sessionId = localStorage.getItem("live_session_id");
        if (!sessionId) {
          sessionId = "sess_" + Math.random().toString(36).slice(2) + Date.now();
          localStorage.setItem("live_session_id", sessionId);
        }
        return sessionId;
      }

      async function sendViewer(action) {
        action = action || "ping";
        var formData = new FormData();
        formData.append("page_slug", pageSlug);
        formData.append("session_id", getSessionId());
        formData.append("action", action);

        try {
          var res = await fetch("/viewer_ping.php", {
            method: "POST",
            body: formData
          });
          var data = await res.json();
          var el = document.getElementById("counterMatch1");
          if (el && typeof data.viewers !== "undefined") {
            el.textContent = data.viewers;
          }
        } catch (e) {
          console.error(e);
        }
      }

      function boot() {
        initNavChrome();
        initTwitchChatEmbed();
        applyTitleFromQuery();
        window.addEventListener("load", applyTitleFromQuery);

        var shell = document.getElementById("mainShell");
        var railBtn = document.getElementById("liveRailCollapse");
        if (shell && railBtn) {
          railBtn.addEventListener("click", function () {
            var c = shell.classList.toggle("rail-collapsed");
            railBtn.setAttribute("aria-expanded", c ? "false" : "true");
            railBtn.setAttribute("aria-label", c ? "Afficher le panneau chaînes live" : "Réduire le panneau chaînes live");
          });
        }

        sendViewer("ping");
        setInterval(function () { sendViewer("ping"); }, 15000);

        window.addEventListener("beforeunload", function () {
          var data = new URLSearchParams();
          data.append("page_slug", pageSlug);
          data.append("session_id", getSessionId());
          data.append("action", "leave");
          navigator.sendBeacon("/viewer_ping.php", data);
        });
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", boot);
      } else {
        boot();
      }
    })();
  </script>
