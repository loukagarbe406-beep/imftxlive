<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IMFTX+ — bayern-unionsg</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

  <style>
    html,body{
      height:100%;margin:0;
      font-family:'Outfit',system-ui,-apple-system,"Segoe UI",Roboto,Arial;
      background:#070708;
      color:#fff;
      overflow-x:hidden;
    }
    .player-box{
      border-radius:22px;
      overflow:hidden;
      border:1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.04);
      box-shadow: 0 30px 120px rgba(0,0,0,.85);
      position:relative;
    }
    iframe{width:100%;height:100%;border:0;background:#000;display:block}

    .cover{
      position:absolute;
      inset:0;
      z-index:15;
      cursor:pointer;
      background:
        linear-gradient(180deg, rgba(0,0,0,.10) 0%, rgba(0,0,0,.35) 55%, rgba(0,0,0,.65) 100%),
        url("https://empire-sport.work/upload/events/dppvmrcbq0ewebtrnyrlqna7bvnfqr.jpg") center/cover no-repeat;
    }

    .cover-top{
      position:absolute;
      top:18px;
      left:18px;
      display:flex;
      align-items:center;
      gap:10px;
      padding:10px 12px;
      border-radius:18px;
      background:rgba(0,0,0,.35);
      border:1px solid rgba(255,255,255,.14);
      backdrop-filter: blur(14px);
    }

    .team-logo{
      width:34px;height:34px;
      object-fit:contain;
      filter: drop-shadow(0 8px 20px rgba(0,0,0,.75));
    }

    .vs{font-weight:900;font-size:14px;opacity:.9}

    .cover-strip{
      position:absolute;
      left:22px;
      right:22px;
      bottom:22px;
      height:86px;
      border-radius:20px;
      background:rgba(255,255,255,.14);
      border:1px solid rgba(255,255,255,.16);
      backdrop-filter: blur(16px);
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:0 22px;
    }

    .strip-title{font-size:18px;font-weight:900}
    .strip-sub{
      font-size:15px;
      opacity:.85;
      font-weight:600;
      font-style:italic;
      margin-top:3px;
      line-height:1.1;
    }

    .strip-play{
      width:50px;height:50px;
      border-radius:999px;
      border:2px solid rgba(255,255,255,.38);
      display:grid;
      place-items:center;
      background:rgba(0,0,0,.22);
      transition:.2s;
    }
    .strip-play:hover{transform:scale(1.08)}

    .source-btn{
      height:44px;
      border-radius:14px;
      font-weight:900;
      font-size:13px;
      transition:.2s;
    }
    .source-btn.active{background:#fff;color:#000}
    .source-btn.inactive{
      background:rgba(255,255,255,.08);
      border:1px solid rgba(255,255,255,.10);
      color:#fff;
    }

    .watch-bar{
      border-radius:18px;
      background:rgba(255,255,255,.10);
      border:1px solid rgba(255,255,255,.12);
      backdrop-filter: blur(16px);
      padding:16px 18px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:16px;
    }

    .watch-left{
      display:flex;
      align-items:center;
      gap:14px;
      min-width:0;
    }

    .watch-left img{
      width:38px;height:38px;
      object-fit:contain;
      filter: drop-shadow(0 6px 14px rgba(0,0,0,.7));
    }

    .watch-text .small{opacity:.8;font-weight:700;font-size:13px}
    .watch-text .big{font-weight:900;font-size:16px}

    .channel-logo{
      width:86px;
      filter: drop-shadow(0 6px 14px rgba(0,0,0,.7));
    }
  </style>
</head>

<body>

<nav class="sticky top-0 z-40 bg-black/20 backdrop-blur-xl border-b border-white/5">
  <div class="max-w-screen-2xl mx-auto px-6 py-3 flex justify-between items-center">
    <div class="text-3xl font-extrabold">IMFTX+</div>
    <a href="index.html" class="px-4 h-10 flex items-center gap-2 rounded-full bg-white/10 border border-white/10 font-bold text-sm">
      <i class="fa-solid fa-arrow-left"></i> Retour
    </a>
  </div>
</nav>

<main class="max-w-screen-2xl mx-auto px-6 py-10">

<section class="player-box w-full aspect-video">

  <div id="cover" class="cover" onclick="loadVideo(1)">
    <div class="cover-top">
      <img class="team-logo" src="https://upload.wikimedia.org/wikipedia/commons/thumb/1/1f/Logo_FC_Bayern_M%C3%BCnchen_%282002%E2%80%932017%29.svg/960px-Logo_FC_Bayern_M%C3%BCnchen_%282002%E2%80%932017%29.svg.png">
      <span class="vs">VS</span>
      <img class="team-logo" src="https://upload.wikimedia.org/wikipedia/fr/thumb/8/87/Logo_Royale_Union_Saint-Gilloise_2025.svg/langfr-250px-Logo_Royale_Union_Saint-Gilloise_2025.svg.png">
    </div>

    <div class="cover-strip">
      <div>
        <div class="strip-title">Regarder Gratuitement</div>
        <div class="strip-sub">Bayern Munich<br>Union Saint-Gilloise</div>
      </div>
      <div class="strip-play">
        <i class="fa-solid fa-play"></i>
      </div>
    </div>
  </div>

  <div id="videoTarget" class="w-full h-full"></div>
</section>

<section class="mt-5 flex gap-3">
  <button id="btn1" onclick="loadVideo(1)" class="source-btn active px-6">Source 1</button>
  <button id="btn2" onclick="loadVideo(2)" class="source-btn inactive px-6">Source 2</button>
  <button id="btn3" onclick="loadVideo(3)" class="source-btn inactive px-6">Source 3</button>
</section>

<section class="mt-6 watch-bar">
  <div class="watch-left">
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR2SEOeAXKHYlD2DoyK5OzQM44Du_1u3W2bTQ&s">
    <div class="watch-text">
      <div class="small">Vous regardez</div>
      <div class="big">Bayern Munich - Union Saint-Gilloise</div>
      <div class="small">21h00</div>
    </div>
  </div>
  <img class="channel-logo" src="https://upload.wikimedia.org/wikipedia/commons/5/5d/Logo_Canal%2B_1995.svg">
</section>

</main>

<script>
const SOURCES={
  1:"https://bolaloca.my/player/4/34",
  2:"https://bolaloca.my/player/2/34",
  3:"https://bolaloca.my/player/3/34"
};
function setActive(id){
  [1,2,3].forEach(n=>{
    document.getElementById("btn"+n).className=
      n===id?"source-btn active px-6":"source-btn inactive px-6";
  });
}
function loadVideo(id){
  document.getElementById("cover").style.display="none";
  setActive(id);
  document.getElementById("videoTarget").innerHTML=
    `<iframe src="${SOURCES[id]}" allowfullscreen allow="autoplay; fullscreen"></iframe>`;
}
</script>

</body>
</html>
