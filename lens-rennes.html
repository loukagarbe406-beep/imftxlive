<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>IMFTX+ — brest - lorient </title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

  <style>
    html, body { height: 100%; margin: 0; }
    body{
      font-family: 'Outfit', system-ui, -apple-system, "Segoe UI", Roboto, Arial;
      color:#fff;
      overflow-x:hidden;
    }

    /* ✅ FOND GRIS SOMBRE */
    .soft-bg{
      background:
        radial-gradient(1100px 520px at 15% 15%, rgba(255,255,255,.08), transparent 55%),
        radial-gradient(900px 520px at 85% 25%, rgba(255,255,255,.06), transparent 60%),
        radial-gradient(900px 520px at 30% 95%, rgba(255,255,255,.05), transparent 62%),
        linear-gradient(135deg, #141518 0%, #0f1012 55%, #0b0c0f 100%);
    }

    .glass{
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.09);
      backdrop-filter: blur(14px);
      box-shadow: 0 30px 120px rgba(0,0,0,.75);
    }

    .player-box{
      border-radius:22px;
      overflow:hidden;
      position:relative;
    }
    iframe{ width:100%; height:100%; border:0; background:#000; display:block; }

    /* ✅ COVER bannière */
    .cover{
      position:absolute;
      inset:0;
      z-index:15;
      cursor:pointer;
      background:
        linear-gradient(180deg, rgba(0,0,0,.10) 0%, rgba(0,0,0,.35) 55%, rgba(0,0,0,.70) 100%),
        url("https://empire-sport.online/upload/events/pgmhdra6rnvzvw6x6g0wkcr0evi2ig.jpg") center/cover no-repeat; /* 🔁 change bannière */
      transform: translateZ(0);
    }

    /* ✅ TOP logos */
    .cover-top{
      position:absolute;
      top:16px;
      left:16px;
      display:flex;
      align-items:center;
      gap:10px;
      padding:10px 12px;
      border-radius:18px;
      background:rgba(0,0,0,.40);
      border:1px solid rgba(255,255,255,.14);
      backdrop-filter: blur(14px);
    }
    .team-logo{
      width:34px;height:34px;
      object-fit:contain;
      filter: drop-shadow(0 8px 20px rgba(0,0,0,.75));
    }
    .vs{ font-weight:900; font-size:14px; opacity:.92; }

    /* ✅ STRIP bottom */
    .cover-strip{
      position:absolute;
      left:16px;
      right:16px;
      bottom:16px;
      height:84px;
      border-radius:20px;
      background: rgba(160,160,160,.35);
      border: 1px solid rgba(255,255,255,.18);
      backdrop-filter: blur(16px);
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:0 18px;
    }
    .strip-left{ display:flex; align-items:center; gap:12px; min-width:0; }
    .strip-icon{
      width:28px;height:28px;
      opacity:.9;
      filter: drop-shadow(0 6px 14px rgba(0,0,0,.35));
    }
    .strip-title{ font-size:16px; font-weight:900; line-height:1; }
    .strip-sub{
      font-size:15px;
      opacity:.92;
      font-weight:600;
      line-height:1.1;
      font-style:italic;
      margin-top:4px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .strip-play{
      width:44px;height:44px;
      border-radius:999px;
      border:2px solid rgba(255,255,255,.45);
      display:grid;
      place-items:center;
      transition:.2s;
      background:rgba(0,0,0,.15);
    }
    .strip-play i{ font-size:18px; }
    .strip-play:hover{ transform:scale(1.06); background:rgba(0,0,0,.25); }

    /* heure */
    .pill{
      position:absolute;
      top:16px;
      right:16px;
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:7px 12px;
      border-radius:999px;
      background: rgba(0,0,0,.40);
      border:1px solid rgba(255,255,255,.14);
      backdrop-filter: blur(14px);
      font-weight:900;
      font-size:12px;
      z-index:20;
    }
    .dot{
      width:7px;height:7px;border-radius:999px;background:#f59e0b;
      box-shadow:0 0 0 4px rgba(245,158,11,.14);
    }

    /* sources */
    .source-btn{
      height:42px;
      border-radius:14px;
      font-weight:900;
      font-size:13px;
      transition:.2s;
    }
    .source-btn.active{ background:#fff; color:#000; }
    .source-btn.inactive{
      background:rgba(255,255,255,.08);
      border:1px solid rgba(255,255,255,.10);
      color:#fff;
    }

    /* ✅ “Vous regardez” */
    .watch-bar{
      border-radius:18px;
      background:rgba(255,255,255,.10);
      border:1px solid rgba(255,255,255,.12);
      backdrop-filter: blur(16px);
      padding:14px 16px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:14px;
    }
    .watch-left{ display:flex; align-items:center; gap:12px; min-width:0; }
    .watch-left img{
      width:38px;height:38px;
      object-fit:contain;
      filter: drop-shadow(0 6px 14px rgba(0,0,0,.7));
      flex-shrink:0;
    }
    .watch-text{ min-width:0; line-height:1.1; }
    .watch-text .small{ opacity:.8; font-weight:700; font-size:13px; }
    .watch-text .big{
      font-weight:900;
      font-size:15px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .channel-logo{
      width:94px;
      height:auto;
      object-fit:contain;
      filter: drop-shadow(0 6px 14px rgba(0,0,0,.7));
      flex-shrink:0;
    }

    /* ✅ Chat */
    .chat-box{ border-radius:22px; overflow:hidden; min-height:520px; }

    /* ✅ Safe click (anti-misclick) */
    .player-wrap{ position:relative; }
    .click-guard{
      position:absolute;
      inset:0;
      z-index:60;
      background:rgba(0,0,0,0);
      pointer-events:auto;
    }
    .guard-ui{
      position:absolute;
      z-index:70;
      right:14px;
      bottom:14px;
      display:flex;
      gap:10px;
    }
    .guard-btn{
      height:40px;
      padding:0 14px;
      border-radius:999px;
      font-weight:900;
      font-size:12px;
      background:rgba(0,0,0,.45);
      border:1px solid rgba(255,255,255,.14);
      backdrop-filter: blur(14px);
    }
    .guard-badge{
      height:40px;
      display:flex;
      align-items:center;
      gap:8px;
      padding:0 12px;
      border-radius:999px;
      font-weight:900;
      font-size:12px;
      background:rgba(255,255,255,.08);
      border:1px solid rgba(255,255,255,.10);
      backdrop-filter: blur(14px);
      opacity:.9;
    }
    .guard-dot{
      width:7px;height:7px;border-radius:999px;background:#22c55e;
      box-shadow:0 0 0 4px rgba(34,197,94,.14);
    }
  </style>
</head>

<body class="soft-bg">

  <nav class="sticky top-0 z-40 bg-black/25 backdrop-blur-xl border-b border-white/5">
    <div class="max-w-screen-2xl mx-auto px-6 py-3 flex items-center justify-between">
      <div class="text-2xl md:text-3xl font-extrabold tracking-tight">IMFTX+</div>
      <a href="index.html"
         class="inline-flex items-center gap-2 px-4 h-10 rounded-full bg-white/10 border border-white/10 hover:bg-white/15 font-bold text-sm active:scale-95 transition">
        <i class="fa-solid fa-arrow-left"></i> Retour
      </a>
    </div>
  </nav>

  <main class="max-w-screen-2xl mx-auto px-6 py-8">
    <section class="grid grid-cols-1 lg:grid-cols-[1fr_420px] gap-6">

      <!-- LEFT -->
      <div>
        <!-- PLAYER -->
        <section class="player-box glass w-full aspect-video">

          <div id="cover" class="cover" onclick="loadVideo(1)">
            <div class="pill"><span class="dot"></span>21:00</div>

            <div class="cover-top">
              <!-- 🔁 Remplace logos -->
              <img class="team-logo" src="https://upload.wikimedia.org/wikipedia/fr/1/14/Logo_Stade_Brestois.svg" alt="Newcastle">
              <span class="vs">VS</span>
              <img class="team-logo" src="https://upload.wikimedia.org/wikipedia/en/2/2a/Brentford_FC_crest.svg" alt="Brentford">
            </div>

            <div class="cover-strip">
              <div class="strip-left">
                <!-- 🔁 Remplace logo comp -->
                <img class="strip-icon" src="https://upload.wikimedia.org/wikipedia/en/f/f2/Premier_League_Logo.svg" alt="Compétition">
                <div style="min-width:0">
                  <div class="strip-title">Regarder Gratuitement</div>
                  <div class="strip-sub">Brest<br>Lorient</div>
                </div>
              </div>

              <div class="strip-play">
                <i class="fa-solid fa-play"></i>
              </div>
            </div>
          </div>

          <!-- ✅ WRAP + SAFE CLICK -->
          <div class="player-wrap w-full h-full">
            <div id="videoTarget" class="w-full h-full"></div>

            <div id="clickGuard" class="click-guard"></div>

            <div class="guard-ui">
              <div class="guard-badge" id="guardStatus">
                <span class="guard-dot"></span> Safe click
              </div>
              <button class="guard-btn" id="unlockBtn" type="button">
                Activer interactions 10s
              </button>
            </div>
          </div>

        </section>

        <!-- SOURCES -->
        <section class="mt-4 flex flex-wrap gap-3">
          <button id="btn1" onclick="loadVideo(1)" class="source-btn active px-6">Source 1</button>
          <button id="btn2" onclick="loadVideo(2)" class="source-btn inactive px-6">Source 2</button>
          <button id="btn3" onclick="loadVideo(3)" class="source-btn inactive px-6">Source 3</button>
        </section>

        <!-- DIRECT LINK -->
        <div id="externalLink" class="hidden mt-3 text-center">
          <a id="directLink" href="#" target="_blank" rel="noreferrer"
             class="text-amber-400 underline font-extrabold text-sm">
            Le lecteur ne s’affiche pas ? Ouvrir le lien direct
          </a>
        </div>

        <!-- VOUS REGARDEZ -->
        <section class="mt-5 watch-bar glass">
          <div class="watch-left">
            <!-- 🔁 Remplace logo comp -->
            <img src="https://upload.wikimedia.org/wikipedia/en/f/f2/Premier_League_Logo.svg" alt="Compétition">
            <div class="watch-text">
              <div class="small">Vous regardez</div>
              <div class="big">Brest - Lorient</div>
              <div class="small">ligue 1 · 21:00</div>
            </div>
          </div>

          <!-- 🔁 Remplace logo chaîne -->
          <img class="channel-logo"
               src="https://upload.wikimedia.org/wikipedia/commons/5/5d/Logo_Canal%2B_1995.svg"
               alt="Chaîne">
        </section>

        <div class="mt-6 text-center text-sm text-white/45 font-semibold">
          Si le stream bug, nous ne sommes pas responsables (connexion / lecteur externe). — IMFTX+
        </div>
      </div>

      <!-- RIGHT : CHAT -->
      <aside class="chat-box glass">
        <iframe id="chatFrame" src="" allow="autoplay" referrerpolicy="no-referrer-when-downgrade"></iframe>
      </aside>

    </section>
  </main>

  <script>
    // ✅ Mets tes liens OFFICIELS ici
    const SOURCES = {
      1: "https://spiderembed.top/embed/746594/brest-lorient/hd/1",
      2: "https://spiderembed.top/embed/746594/brest-lorient/hd/1",
      3: "#"
    };

    // ✅ Chat Twitch : seulement l’iframe
    (function(){
      const parentDomain = window.location.hostname;
      const channel = "thestreameast"; // 🔁 change si tu veux
      document.getElementById("chatFrame").src =
        `https://www.twitch.tv/embed/${channel}/chat?darkpopout&parent=${encodeURIComponent(parentDomain)}`;
    })();

    function setActive(id){
      [1,2,3].forEach(n=>{
        const b = document.getElementById("btn"+n);
        b.className = (n===id)
          ? "source-btn active px-6"
          : "source-btn inactive px-6";
      });
    }

    function loadVideo(id){
      document.getElementById("cover").style.display = "none";
      setActive(id);

      const ext = document.getElementById("externalLink");
      const link = document.getElementById("directLink");
      link.href = SOURCES[id] || "#";
      ext.classList.add("hidden");

      const target = document.getElementById("videoTarget");

      if(!SOURCES[id] || SOURCES[id] === "#"){
        target.innerHTML = `
          <div class="w-full h-full grid place-items-center text-white/70 font-extrabold">
            Ajoute un lien dans SOURCES (Source ${id})
          </div>`;
        return;
      }

      target.innerHTML = `
        <iframe
          id="streamFrame"
          src="${SOURCES[id]}"
          allowfullscreen
          scrolling="no"
          frameborder="0"
          allow="autoplay; fullscreen; picture-in-picture; encrypted-media"
          referrerpolicy="origin">
        </iframe>
      `;

      // fallback si embed bloqué
      setTimeout(() => {
        const iframe = document.getElementById("streamFrame");
        if(!iframe) return;
        try { iframe.contentWindow.location.href; }
        catch(e){ ext.classList.remove("hidden"); }
      }, 2000);
    }

    /* ✅ Safe click (anti-misclick) */
    const clickGuard = document.getElementById("clickGuard");
    const unlockBtn  = document.getElementById("unlockBtn");
    const guardStatus= document.getElementById("guardStatus");

    function lockGuard(){
      clickGuard.style.pointerEvents = "auto";
      guardStatus.style.opacity = ".9";
      unlockBtn.textContent = "Activer interactions 10s";
    }
    function unlockGuard(ms=10000){
      clickGuard.style.pointerEvents = "none";
      guardStatus.style.opacity = ".55";
      unlockBtn.textContent = "Interactions ON";
      window.clearTimeout(window.__guardTimer);
      window.__guardTimer = window.setTimeout(lockGuard, ms);
    }

    lockGuard();
    unlockBtn.addEventListener("click", () => unlockGuard(10000));
    clickGuard.addEventListener("click", (e) => {
      e.preventDefault();
      e.stopPropagation();
    }, true);
  </script>

</body>
</html>
