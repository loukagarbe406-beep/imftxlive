<!doctype html>
<meta charset="utf-8" />
<video id="v" controls autoplay playsinline style="width:100vw;height:100vh;"></video>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script>
  const video = document.getElementById("v");
  const src = "http://81340-movie.ott-di.com/live/7c91697cda/addf2b013f50/770798.m3u8";

  if (window.Hls && Hls.isSupported()) {
    const hls = new Hls();
    hls.loadSource(src);
    hls.attachMedia(video);
    hls.on(Hls.Events.ERROR, (e, data) => console.log("HLS error:", data));
  } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
    // Safari/iPhone
    video.src = src;
  } else {
    alert("HLS non supporté sur ce navigateur");
  }
</script>
