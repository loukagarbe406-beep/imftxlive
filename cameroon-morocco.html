<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Test HLS</title>
</head>
<body style="margin:0;background:#000;">
  <video id="v" controls autoplay playsinline style="width:100vw;height:100vh;"></video>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script>
    const url = "http://81340-movie.ott-di.com/live/7c91697cda/addf2b013f50/770798.m3u8";
    const video = document.getElementById("v");

    // iOS Safari lit souvent le HLS nativement
    if (video.canPlayType("application/vnd.apple.mpegurl")) {
      video.src = url;
      video.play().catch(()=>{});
    } else if (window.Hls && Hls.isSupported()) {
      const hls = new Hls({
        // petits réglages tolérants
        enableWorker: true,
        lowLatencyMode: false,
      });
      hls.loadSource(url);
      hls.attachMedia(video);

      hls.on(Hls.Events.ERROR, (evt, data) => {
        console.log("HLS ERROR:", data);
        // Si tu vois ici "CORS" / "403" / "mixed content" -> c'est la cause
      });
    } else {
      document.body.innerHTML = "<p style='color:white;padding:20px'>HLS non supporté sur ce navigateur.</p>";
    }
  </script>
</body>
</html>
