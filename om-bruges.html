<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>IMFTX+ — Marseille - Club Bruges</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

  <style>
    html, body { height: 100%; margin: 0; }
    body{
      font-family: 'Outfit', system-ui, -apple-system, "Segoe UI", Roboto, Arial;
      color:#fff;
      overflow-x:hidden;
    }

    .soft-bg{
      background:
        radial-gradient(1400px 620px at 50% -10%, rgba(255,255,255,.05), transparent 60%),
        radial-gradient(1000px 520px at 50% 30%, rgba(255,255,255,.035), transparent 62%),
        #000;
    }

    .player-box{
      border-radius:22px;
      overflow:hidden;
      border:1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.04);
      box-shadow: 0 30px 120px rgba(0,0,0,.85);
      position:relative;
    }
    iframe{ width:100%; height:100%; border:0; background:#000; display:block; }

    .cover{
      position:absolute;
      inset:0;
      z-index:15;
      cursor:pointer;
      background:
        linear-gradient(180deg, rgba(0,0,0,.10) 0%, rgba(0,0,0,.35) 55%, rgba(0,0,0,.65) 100%),
        url("https://empire-sport.world/upload/events/xxwg7hgcydgq6dkm13iqjvrases0y3.jpg") center/cover no-repeat;
    }

    .cover-top{
      position:absolute;
      top:18px;
      left:18px;
      display:flex;
      align-items:center;
      gap:10px;
      padding:10px 12px;
      border-radius:18px;
      background:rgba(0,0,0,.35);
      border:1px solid rgba(255,255,255,.14);
      backdrop-filter: blur(14px);
    }
    .team-logo{
      width:34px;height:34px;
      object-fit:contain;
      filter: drop-shadow(0 8px 20px rgba(0,0,0,.75));
    }
    .vs{
      font-weight:900;
      font-size:14px;
      opacity:.9;
    }

    .cover-strip{
      position:absolute;
      left:22px;
      right:22px;
      bottom:22px;
      height:86px;
      border-radius:20px;
      background:rgba(255,255,255,.14);
      border:1px solid rgba(255,255,255,.16);
      backdrop-filter: blur(16px);
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:0 22px;
    }
    .strip-title{
      font-size:18px;
      font-weight:900;
    }
    .strip-sub{
      font-size:15px;
      opacity:.85;
      font-weight:600;
      font-style:italic;
      margin-top:3px;
    }
    .strip-play{
      width:50px;height:50px;border-radius:999px;
      border:2px solid rgba(255,255,255,.38);
      display:grid;place-items:center;
      background:rgba(0,0,0,.22);
      transition:.2s;
    }
    .strip-play:hover{ transform:scale(1.08); background:rgba(0,0,0,.35); }

    .source-btn{
      height:44px;
      border-radius:14px;
      font-weight:900;
      font-size:13px;
    }
    .source-btn.active{ background:#fff; color:#000; }
    .source-btn.inactive{
      background:rgba(255,255,255,.08);
      border:1px solid rgba(255,255,255,.10);
      color:#fff;
    }

    .watch-bar{
      border-radius:18px;
      background:rgba(255,255,255,.10);
      border:1px solid rgba(255,255,255,.12);
      backdrop-filter: blur(16px);
      padding:16px 18px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:16px;
    }
    .watch-left{ display:flex; align-items:center; gap:14px; }
    .watch-left img{ width:40px; filter: drop-shadow(0 6px 14px rgba(0,0,0,.7)); }
    .watch-text .small{ opacity:.8; font-weight:700; font-size:13px; }
    .watch-text .big{ font-weight:900; font-size:16px; }
    .channel-logo{ width:90px; filter: drop-shadow(0 6px 14px rgba(0,0,0,.7)); }

    .pill{
      display:inline-flex; align-items:center; gap:8px;
      padding:7px 12px; border-radius:999px;
      background:rgba(0,0,0,.35);
      border:1px solid rgba(255,255,255,.14);
      font-weight:900; font-size:12px;
    }
    .dot{
      width:7px;height:7px;border-radius:999px;
      background:#f59e0b;
      box-shadow:0 0 0 4px rgba(245,158,11,.14);
    }
  </style>
</head>

<body class="soft-bg">

<nav class="sticky top-0 z-40 bg-black/20 backdrop-blur-xl border-b border-white/5">
  <div class="max-w-screen-2xl mx-auto px-6 py-3 flex justify-between items-center">
    <div class="text-3xl font-extrabold">IMFTX+</div>
    <a href="index.html" class="px-4 h-10 flex items-center gap-2 rounded-full bg-white/10 border border-white/10 font-bold text-sm">
      <i class="fa-solid fa-arrow-left"></i> Retour
    </a>
  </div>
</nav>

<main class="max-w-screen-2xl mx-auto px-6 py-10">

<section class="player-box w-full aspect-video">
  <div id="cover" class="cover" onclick="loadVideo(1)">
    <div style="position:absolute;top:18px;right:18px;">
      <span class="pill"><span class="dot"></span>21:00</span>
    </div>

    <div class="cover-top">
      <img class="team-logo"
           src="https://upload.wikimedia.org/wikipedia/fr/thumb/4/43/Logo_Olympique_de_Marseille.svg/960px-Logo_Olympique_de_Marseille.svg.png">
      <span class="vs">VS</span>
      <img class="team-logo"
           src="https://upload.wikimedia.org/wikipedia/fr/thumb/d/dc/Logo_Club_Brugge_KV_2024.svg/512px-Logo_Club_Brugge_KV_2024.svg.png">
    </div>

    <div class="cover-strip">
      <div>
        <div class="strip-title">Regarder Gratuitement</div>
        <div class="strip-sub">Marseille<br>Club Bruges</div>
      </div>
      <div class="strip-play"><i class="fa-solid fa-play"></i></div>
    </div>
  </div>

  <div id="videoTarget" class="w-full h-full"></div>
</section>

<section class="mt-6 watch-bar">
  <div class="watch-left">
    <img src="https://empire-sport.world/upload/leagues/lnjvd4afeukdyr5agooauznrzjyeoh.png">
    <div class="watch-text">
      <div class="small">Vous regardez</div>
      <div class="big">Marseille — Club Bruges</div>
      <div class="small">Ligue des Champions · 21:00</div>
    </div>
  </div>
  <img class="channel-logo" src="https://upload.wikimedia.org/wikipedia/commons/5/5d/Logo_Canal%2B_1995.svg">
</section>

</main>

<script>
const SOURCES={1:"#",2:"#",3:"#"};
function loadVideo(){document.getElementById("cover").style.display="none";}
</script>

</body>
</html>
