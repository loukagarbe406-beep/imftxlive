<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Accès IMFTX+</title>

<style>
body{
  margin:0;
  background:#000;
  color:#fff;
  font-family:system-ui;
  display:grid;
  place-items:center;
  min-height:100vh;
  padding:20px;
}
.box{
  max-width:480px;
  width:100%;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.15);
  border-radius:18px;
  padding:20px;
  text-align:center;
}
h1{margin:0 0 10px}
p{opacity:.7}
.btn{
  margin-top:14px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  padding:14px;
  border-radius:999px;
  background:#229ED9;
  color:#fff;
  font-weight:900;
  text-decoration:none;
}
.btn:hover{opacity:.9}
.small{
  margin-top:12px;
  font-size:13px;
  opacity:.6;
}
</style>
</head>

<body>
<div class="box">
  <h1>Accès réservé</h1>
  <p>Pour accéder à IMFTX+, clique sur le bouton ci-dessous.</p>

  <!-- 🔵 LIEN TELEGRAM -->
  <a class="btn" href="https://t.me/TON_TELEGRAM" target="_blank" onclick="unlock()">
    Rejoindre le Telegram
  </a>

  <div class="small">
    L’accès sera débloqué automatiquement.
  </div>
</div>

<script>
function unlock(){
  localStorage.setItem("imftx_access","1");
  setTimeout(()=>{
    window.location.href = "index.html";
  }, 1200);
}
</script>
</body>
</html>
