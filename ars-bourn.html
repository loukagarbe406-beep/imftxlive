
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a0a0a">
  <title>IMFTX — Arsenal VS Bournemouth</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0a0a;
      --surface: #1a1a1b;
      --border: rgba(255, 255, 255, 0.06);
      --text: #ffffff;
      --muted: #8e8e8e;
      --red: #ef4444;
      --discord: #5865f2;
      --chat-blue: #2b63f1;
      --iptv-green: #16a34a;
      /* Couleurs footer / boutons (références marques) */
      --discord-blurple: #5865f2;
      --x-tile-bg: #1f1f1f;
      --x-tile-border: #3f3f46;
      --x-icon: #e4e4e7;
      --iptv-pill: #22c55e;
      --iptv-pill-hover: #16a34a;
      --telegram-blue: #229ed9;
      /* Compteur spectateurs (ref. saumon sur noir) */
      --viewer-coral: #ff7070;
      /* Rail chaînes live (ref. gris très foncé, pas de blanc) */
      --rail-bg: #18181b;
      --rail-border: rgba(255, 255, 255, 0.05);
      --rail-placeholder: #adadb8;
      /* Chat + bande sous bannière : même teinte que le fond page (#0a0a0a) */
      --chat-panel-bg: var(--bg);
      --chat-welcome: #7a8691;
      --chat-banner-bg: var(--bg);
    }
    html, body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }
    a { color: inherit; text-decoration: none; }
    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      background: none;
      color: inherit;
    }

    /* ── Header site (type maquette) ── */
    .site-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 56px;
      padding: 0 20px 0 22px;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
      flex-shrink: 0;
    }
    .site-header__left {
      display: flex;
      align-items: center;
      gap: 28px;
      min-width: 0;
    }
    .site-logo {
      font-size: 17px;
      font-weight: 900;
      letter-spacing: 0.02em;
      color: var(--text);
      white-space: nowrap;
      flex-shrink: 0;
    }
    .site-logo:hover { opacity: 0.92; }
    .site-nav {
      display: flex;
      align-items: center;
      gap: 22px;
      font-size: 13px;
      font-weight: 600;
    }
    .site-nav a {
      color: var(--text);
      opacity: 0.92;
      transition: opacity 0.15s;
    }
    .site-nav a:hover { opacity: 1; }
    .site-nav a.is-danger { color: var(--red); font-weight: 700; }
    .site-header__right {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      flex-shrink: 1;
    }
    .header-toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
      min-width: 0;
    }
    .header-iptv-outline {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 0;
      max-width: min(100%, 52vw);
      height: 40px;
      padding: 0 12px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      background: transparent;
      color: #ffffff;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.04em;
      line-height: 1.15;
      text-transform: uppercase;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: background 0.15s, border-color 0.15s;
    }
    .header-iptv-outline:hover {
      background: rgba(255, 255, 255, 0.06);
      border-color: rgba(255, 255, 255, 0.32);
    }
    .header-icon-btn {
      flex-shrink: 0;
      width: 40px;
      height: 40px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      background: transparent;
      color: #ffffff;
      transition: background 0.15s, border-color 0.15s;
    }
    .header-icon-btn:hover {
      background: rgba(255, 255, 255, 0.06);
      border-color: rgba(255, 255, 255, 0.32);
    }
    .header-icon-btn svg {
      width: 20px;
      height: 20px;
    }

    @media (max-width: 900px) {
      .site-header__left { gap: 12px; }
      .header-toolbar { gap: 8px; }
      .header-iptv-outline {
        font-size: 9px;
        padding: 0 8px;
        max-width: 48vw;
      }
    }

    @media (max-width: 640px) {
      .site-header {
        height: auto;
        min-height: 52px;
        flex-wrap: nowrap;
        align-items: center;
        padding: 10px 12px 12px;
      }
      .site-header__left {
        flex: 1 1 auto;
        min-width: 0;
        gap: 16px;
      }
      .site-logo { font-size: 15px; }
      .site-nav { font-size: 12px; gap: 14px; }
      .site-header__right {
        flex: 0 0 auto;
        min-width: 0;
        width: auto;
      }
      .header-toolbar {
        justify-content: flex-end;
        gap: 0;
      }
      /* Téléphone : uniquement le bouton thème (soleil) */
      .header-toolbar > *:not(#themeToggle) {
        display: none;
      }
      #themeToggle.header-icon-btn {
        width: 40px;
        height: 40px;
      }
      #themeToggle.header-icon-btn svg {
        width: 20px;
        height: 20px;
      }
    }

    /* ── Grille principale (rail | lecteur | chat décoratif) ── */
    .shell {
      display: grid;
      grid-template-columns: minmax(168px, 208px) 1fr minmax(260px, 300px);
      height: calc(100vh - 56px);
      min-height: 0;
      max-width: 100%;
      margin: 0 auto;
      overflow: hidden;
    }
    .shell.rail-collapsed {
      grid-template-columns: 46px 1fr minmax(260px, 300px);
    }

    /* ── Rail chaînes live ── */
    .live-channels-rail {
      background: var(--rail-bg);
      border-right: 1px solid var(--rail-border);
      display: flex;
      flex-direction: column;
      min-height: 0;
      min-width: 0;
      overflow: hidden;
    }
    .live-rail__header {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 14px 12px;
      border-bottom: 1px solid var(--rail-border);
    }
    .live-rail__title {
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      letter-spacing: -0.02em;
    }
    .live-rail__collapse {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(255, 255, 255, 0.92);
      transition: background 0.15s, color 0.15s;
    }
    .live-rail__collapse:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
    }
    .live-rail__collapse-icon {
      display: block;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: -0.06em;
      line-height: 1;
      transition: transform 0.2s;
    }
    .shell.rail-collapsed .live-rail__collapse-icon { transform: rotate(180deg); }
    .shell.rail-collapsed .live-rail__title { display: none; }
    .shell.rail-collapsed .live-rail__body { display: none; }
    .shell.rail-collapsed .live-rail__header {
      justify-content: center;
      border-bottom: none;
      padding: 12px 0;
    }
    .live-rail__body {
      flex: 1;
      overflow-y: auto;
      padding: 12px 10px;
      min-height: 0;
    }
    .live-rail__empty {
      font-size: 12px;
      font-weight: 500;
      color: var(--rail-placeholder);
      text-align: center;
      line-height: 1.5;
      padding: 10px 4px;
    }
    .live-channels {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    /* ── Colonne centrale ── */
    .col-center {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      background: var(--bg);
    }
    .player-shell {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .live-player-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      flex: 0 0 auto;
      background: var(--bg);
      border-bottom: none;
      overflow: hidden;
    }
    .live-player-inner {
      position: absolute;
      inset: 0;
      background: var(--bg);
    }
    .live-player-inner iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: var(--bg);
    }

    /* Barre sous le lecteur (même fond que la page — pas de bande grise/noire) */
    .player-footer {
      flex-shrink: 0;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 16px 20px;
      min-height: 96px;
      padding: 16px 22px 20px;
      background: var(--bg);
      border-top: 1px solid var(--border);
    }
    .player-footer__left {
      min-width: 0;
      justify-self: start;
    }
    /* Titre match : une ligne, blanc lisible, style sobre (type « Arsenal vs Bayer Leverkusen ») */
    .match-inline {
      display: block;
      font-size: clamp(15px, 2vw, 20px);
      font-weight: 800;
      letter-spacing: -0.01em;
      line-height: 1.2;
      color: #ffffff;
      text-transform: none;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-shadow: none;
    }
    /* Sur desktop : les enfants participent à la grille 3 col (voir .player-footer__mid) */
    .player-footer__mid {
      display: contents;
    }
    .player-footer__center {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: nowrap;
      justify-content: center;
      justify-self: center;
    }
    .player-footer__right {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      justify-self: end;
      width: 100%;
    }
    .stream-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-weight: 800;
      border: 1px solid transparent;
      color: #fff;
      cursor: pointer;
      text-decoration: none;
      line-height: 1;
      white-space: nowrap;
      transition: transform 0.15s, filter 0.15s;
    }
    .stream-btn:hover {
      transform: translateY(-1px);
      filter: brightness(1.06);
    }
    .stream-btn svg { flex-shrink: 0; }
    .stream-btn .btn-label {
      font-size: 12px;
      font-weight: 800;
    }
    .btn-foot-square {
      width: 52px;
      height: 48px;
      min-width: 52px;
      padding: 0;
      border-radius: 12px;
      box-shadow: none;
    }
    .btn-foot-square svg {
      width: 22px;
      height: 22px;
    }
    .btn-discord-sm {
      background: var(--discord-blurple);
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: #ffffff;
    }
    .btn-x-sm {
      background: var(--x-tile-bg);
      border: 1px solid var(--x-tile-border);
      color: var(--x-icon);
    }
    .btn-tg-sm {
      background: var(--telegram-blue);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #ffffff;
    }
    .btn-foot-label {
      display: none;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .btn-iptv-emoji {
      display: none;
    }
    .btn-iptv {
      height: 42px;
      padding: 0 20px;
      border-radius: 999px;
      background: var(--iptv-pill);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: #ffffff;
      min-height: 42px;
      gap: 10px;
      box-shadow: 0 2px 14px rgba(34, 197, 94, 0.28);
    }
    .stream-btn.btn-iptv:hover {
      filter: none;
      background: var(--iptv-pill-hover);
      transform: translateY(-1px);
    }
    .btn-iptv .btn-label { color: #fff; }
    .btn-iptv svg {
      width: 18px;
      height: 18px;
    }

    .viewer-mini {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      color: var(--viewer-coral);
      font-size: 15px;
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1;
      background: transparent;
      padding: 4px 2px 4px 0;
      border-radius: 0;
    }
    .viewer-mini svg {
      width: 22px;
      height: 22px;
      stroke: currentColor;
      stroke-width: 1.65;
      fill: none;
    }
    /* ── Colonne chat (décoratif, pas de vrai chat ni Twitch) ── */
    .col-right {
      background: var(--chat-panel-bg);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      min-height: 0;
      min-width: 0;
      overflow: hidden;
    }
    .chat-header {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      background: var(--chat-panel-bg);
    }
    .chat-header__title {
      font-size: 13px;
      font-weight: 700;
      color: #ffffff;
    }
    .chat-header__actions {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .chat-header__icon {
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      color: rgba(255, 255, 255, 0.75);
      font-size: 15px;
      font-weight: 700;
      line-height: 1;
      user-select: none;
    }
    .chat-header__icon:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.06);
    }
    .chat-header__icon svg {
      width: 16px;
      height: 16px;
    }
    /* Bannière : même ratio que l’asset (1860×371) pour afficher l’affiche entière, sans crop bancal */
    .chat-banner {
      flex-shrink: 0;
      position: relative;
      width: 100%;
      aspect-ratio: 1860 / 371;
      overflow: hidden;
      border-bottom: 1px solid var(--border);
      background: var(--chat-banner-bg);
    }
    .chat-banner img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center center;
      display: block;
    }
    .chat-body {
      flex: 1;
      overflow-y: auto;
      padding: 16px 14px;
      font-size: 13px;
      line-height: 1.5;
      font-weight: 500;
      color: var(--chat-welcome);
      min-height: 120px;
      background: var(--chat-panel-bg);
    }
    .chat-input-wrap {
      flex-shrink: 0;
      display: flex;
      gap: 8px;
      align-items: center;
      padding: 12px 12px 16px;
      border-top: 1px solid var(--border);
      background: var(--chat-panel-bg);
    }
    .chat-input-wrap input {
      flex: 1;
      height: 40px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      padding: 0 12px;
      font-size: 13px;
      outline: none;
    }
    .chat-input-wrap input::placeholder { color: var(--muted); }
    .btn-chat-send {
      height: 40px;
      padding: 0 16px;
      border-radius: 10px;
      background: #2b63f1;
      color: #ffffff;
      font-size: 12px;
      font-weight: 800;
      flex-shrink: 0;
      border: none;
      cursor: default;
      font-family: inherit;
      opacity: 0.95;
    }

    @media (max-width: 1100px) {
      .shell,
      .shell.rail-collapsed {
        grid-template-columns: 1fr;
        height: auto;
        min-height: calc(100vh - 56px);
      }
      .live-channels-rail { display: none; }
      .col-center { order: 1; }
      .col-right {
        order: 2;
        border-left: none;
        border-top: 1px solid var(--border);
        max-height: 55vh;
        margin: 0 14px;
        border-radius: 14px 14px 0 0;
      }
      .live-player-wrap { max-height: none; }
    }

    /* ── Mobile : empilement type appli (lecteur → titre → X / Telegram / Discord → IPTV) ── */
    @media (max-width: 720px) {
      .col-center .player-shell {
        padding: 0 14px;
      }
      .live-player-wrap {
        border-radius: 12px;
        overflow: hidden;
        margin-top: 10px;
      }
      .player-footer {
        grid-template-columns: 1fr;
        gap: 14px;
        padding: 16px 0 20px;
        min-height: 0;
        border-top: none;
      }
      .player-footer__left {
        justify-self: stretch;
        text-align: left;
        width: 100%;
        padding: 0 2px;
      }
      .match-inline {
        font-size: clamp(17px, 4.5vw, 22px);
        font-weight: 800;
        line-height: 1.22;
        white-space: normal;
        text-overflow: clip;
        display: -webkit-box;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
        overflow: hidden;
      }
      .player-footer__mid {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 12px;
        width: 100%;
      }
      .player-footer__center {
        flex-wrap: wrap;
        justify-content: center;
        gap: 8px;
        width: 100%;
      }
      .player-footer__center .btn-foot-square {
        flex: 1 1 calc(33.333% - 8px);
        min-width: 0;
        width: auto;
        height: 46px;
        padding: 0 8px;
        gap: 6px;
      }
      .player-footer__center .btn-foot-label {
        display: inline;
        font-size: 10px;
        font-weight: 700;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .player-footer__center .btn-foot-square svg {
        width: 18px;
        height: 18px;
        flex-shrink: 0;
      }
      .player-footer__center .btn-x-sm {
        background: #000000;
        border-color: #2a2a2a;
        color: #ffffff;
      }
      .player-footer__center .btn-iptv {
        flex: 1 1 100%;
        width: 100%;
        min-height: 48px;
        height: auto;
        padding: 12px 16px;
        border-radius: 12px;
        justify-content: center;
        gap: 8px;
      }
      .player-footer__center .btn-iptv-emoji {
        display: inline;
        font-size: 18px;
        line-height: 1;
      }
      .stream-btn.btn-iptv .btn-label {
        font-size: 11px;
        letter-spacing: 0.02em;
      }
      .player-footer__right {
        justify-content: center;
        width: 100%;
        padding-top: 2px;
      }
      .viewer-mini {
        font-size: 14px;
      }
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="site-header__left">
      <a href="index.html" class="site-logo">IMFTX+</a>
      <nav class="site-nav" aria-label="Navigation principale">
        <a href="index.html">Accueil</a>
        <a href="#" class="is-danger">Lien secours</a>
      </nav>
    </div>
    <div class="site-header__right">
      <div class="header-toolbar" aria-label="Liens rapides">
        <a href="shop.html" class="header-iptv-outline">Obtenez un IPTV à partir de 9,99€</a>
        <a href="#" class="header-icon-btn" aria-label="Telegram">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/></svg>

  <script>
    (function () {
      function capWord(w) {
        if (!w) return w;
        var lower = w.toLowerCase();
        /* Acronymes très courts (ex. PSG, OM, AS) : tout en majuscules */
        if (w.length <= 3 && w === w.toUpperCase() && /^[A-ZÀ-Ÿ]+$/.test(w)) {
          return w.toUpperCase();
        }
        return lower.charAt(0).toUpperCase() + lower.slice(1);
      }

      function titleCaseWords(str) {
        return String(str).trim().split(/\s+/).filter(Boolean).map(capWord).join(" ");
      }

      /** Une seule ligne, pas de <br> : « Arsenal vs Bayer Leverkusen » (vs en minuscules) */
      function formatMatchTitle(full) {
        var s = String(full).trim().replace(/\r\n|\r|\n/g, " ").replace(/\s+/g, " ");
        if (!s) return s;
        var parts = s.split(/\s+vs\s+/i);
        if (parts.length < 2) {
          if (/\s+-\s+/.test(s)) {
            var h = s.split(/\s+-\s+/);
            if (h.length >= 2) {
              return titleCaseWords(h[0]) + " vs " + titleCaseWords(h.slice(1).join(" - "));
            }
          }
          return titleCaseWords(s);
        }
        var home = parts[0].trim();
        var away = parts.slice(1).join(" vs ").trim();
        return titleCaseWords(home) + " vs " + titleCaseWords(away);
      }

      function applyTitleFromQuery() {
        var params = new URLSearchParams(window.location.search);
        var title = params.get("match");
        var footer = document.getElementById("matchFooter");
        if (!footer) return;

        if (title) {
          try { title = decodeURIComponent(title); } catch (e) {}
          var display = formatMatchTitle(title);
          footer.textContent = display;
          document.title = "IMFTX — " + display;
        } else {
          footer.textContent = formatMatchTitle(footer.textContent);
        }
      }

      var pageSlug = "om-metz";

      function getSessionId() {
        var sessionId = localStorage.getItem("live_session_id");
        if (!sessionId) {
          sessionId = "sess_" + Math.random().toString(36).slice(2) + Date.now();
          localStorage.setItem("live_session_id", sessionId);
        }
        return sessionId;
      }

      async function sendViewer(action) {
        action = action || "ping";
        var formData = new FormData();
        formData.append("page_slug", pageSlug);
        formData.append("session_id", getSessionId());
        formData.append("action", action);

        try {
          var res = await fetch("/viewer_ping.php", {
            method: "POST",
            body: formData
          });
          var data = await res.json();
          var el = document.getElementById("counterMatch1");
          if (el && typeof data.viewers !== "undefined") {
            el.textContent = data.viewers;
          }
        } catch (e) {
          console.error(e);
        }
      }

      function boot() {
        applyTitleFromQuery();

        var shell = document.getElementById("mainShell");
        var railBtn = document.getElementById("liveRailCollapse");
        if (shell && railBtn) {
          railBtn.addEventListener("click", function () {
            var c = shell.classList.toggle("rail-collapsed");
            railBtn.setAttribute("aria-expanded", c ? "false" : "true");
            railBtn.setAttribute("aria-label", c ? "Afficher le panneau chaînes live" : "Réduire le panneau chaînes live");
          });
        }

        sendViewer("ping");
        setInterval(function () { sendViewer("ping"); }, 15000);

        window.addEventListener("beforeunload", function () {
          var data = new URLSearchParams();
          data.append("page_slug", pageSlug);
          data.append("session_id", getSessionId());
          data.append("action", "leave");
          navigator.sendBeacon("/viewer_ping.php", data);
        });
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", boot);
      } else {
        boot();
      }
    })();
  </script>
