<div style="position:relative;width:100%;height:500px;background:#000;">
  <button id="loadPlayer"
    style="position:absolute;inset:0;z-index:2;width:100%;height:100%;border:0;background:#111;color:#fff;font-size:24px;cursor:pointer;">
    Lancer le direct
  </button>

  <iframe
    id="player"
    src="about:blank"
    width="100%"
    height="100%"
    frameborder="0"
    scrolling="no"
    allowfullscreen
    sandbox="allow-scripts allow-same-origin"
    style="border:0;">
  </iframe>
</div>

<script>
  document.getElementById('loadPlayer').addEventListener('click', function () {
    document.getElementById('player').src =
      'https://viewembed.ru/channel/Canal11%5BPortugal%5D';
    this.remove();
  });
</script>
