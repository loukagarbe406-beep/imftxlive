<!DOCTYPE html>
<html>
<head>
    <style>
        body { margin: 0; background: #000; overflow: hidden; }
        #player-wrapper { width: 100vw; height: 100vh; position: relative; }
        iframe { width: 100%; height: 100%; border: 0; }
    </style>
</head>
<body>

<div id="player-wrapper">
    <div id="target"></div>
</div>

<script>
    // URL de ton flux
    const url = "https://pooembed.eu/embed/coupe-de-france/2026-03-05/lyon-rcl";

    // --- TECHNIQUE 1: Neutralisation du Prototype window.open ---
    // On remplace la fonction d'ouverture de fenêtre par une fonction vide
    // On utilise Object.defineProperty pour empêcher le player de la "réparer"
    try {
        const disabledOpen = function() { 
            console.log("Pop-up bloquée par le script parent"); 
            return null; 
        };
        Object.defineProperty(window, 'open', {
            value: disabledOpen,
            writable: false,
            configurable: false
        });
    } catch (e) {
        window.open = function() { return null; };
    }

    // --- TECHNIQUE 2: Injection de l'Iframe SANS sandbox ---
    // On ne met PAS de sandbox pour éviter le message d'erreur rouge
    document.getElementById('target').innerHTML = `
        <iframe 
            src="${url}" 
            allowfullscreen 
            scrolling="no" 
            allow="autoplay; fullscreen; picture-in-picture"
            referrerpolicy="no-referrer">
        </iframe>`;

    // --- TECHNIQUE 3: Anti-redirection (BeforeUnload) ---
    // Si la pub essaie de rediriger TA page actuelle (Tab-jacking), 
    // le navigateur affichera une alerte de confirmation.
    window.onbeforeunload = function() {
        return "Une publicité tente de vous rediriger. Rester sur le match ?";
    };

    // --- TECHNIQUE 4: Capture des clics ---
    // On essaie d'empêcher les liens invisibles de fonctionner
    document.addEventListener('click', function(e) {
        // Si le clic provient d'un lien vers un autre domaine
        if (e.target.tagName === 'A' && e.target.target === '_blank') {
            e.preventDefault();
            console.log("Lien de pub intercepté");
        }
    }, true);
</script>

</body>
</html>
