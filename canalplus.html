<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin: 0; background: #000; overflow: hidden; }
        .container {
            position: relative;
            width: 100vw;
            height: 56.25vw; /* Ratio 16:9 */
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        /* TON LIEN MORT - L'ARMURE */
        #shield {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 999999;
            background: rgba(0,0,0,0);
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">
    <a href="javascript:void(0)" id="shield"></a>
    
    <iframe 
        id="player" 
        src="https://viewembed.ru/channel/CanalSport%5BFrance%5D?autoplay=1&muted=1" 
        allow="autoplay; fullscreen"
    ></iframe>
</div>

<script>
    const shield = document.getElementById('shield');
    const player = document.getElementById('player');

    // TENTATIVE D'AUTO-LANCEMENT
    window.onload = () => {
        // On essaie de redonner le focus à l'iframe pour qu'elle se lance
        player.focus();
        
        // On simule une interaction après 1 seconde
        setTimeout(() => {
            console.log("Tentative de réveil du flux...");
            player.contentWindow.postMessage('{"event":"command","func":"playVideo","args":""}', '*');
        }, 1000);
    };

    // LE BOUCLIER ACTIF
    shield.addEventListener('touchstart', function(e) {
        // On laisse passer le clic vers l'iframe
        this.style.pointerEvents = 'none';
        
        // On le remet DIRECTEMENT après (très court) pour bloquer la popup
        // 100ms c'est trop rapide pour l'ouverture d'un onglet de pub
        setTimeout(() => {
            this.style.pointerEvents = 'auto';
        }, 100);
    });
</script>

</body>
</html>
