<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        .player-box {
            position: relative;
            width: 100%;
            height: 250px; /* Ajuste selon tes besoins */
            background: #000;
        }
        iframe { width: 100%; height: 100%; border: none; }

        /* TON LIEN MORT - INVISIBLE ET PERMANENT */
        #shield-link {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 9999;
            background: rgba(0,0,0,0);
            cursor: pointer;
            display: block;
            -webkit-tap-highlight-color: transparent;
        }
    </style>
</head>
<body>

<div class="player-box">
    <a href="javascript:void(0)" id="shield-link"></a>

    <iframe id="vid" src="https://viewembed.ru/channel/CanalSport%5BFrance%5D"></iframe>
</div>

<script>
    const shield = document.getElementById('shield-link');

    // Cette fonction s'active dès qu'on pose le doigt
    shield.addEventListener('touchstart', function() {
        // 1. On rend le lien "fantôme" (cliquable à travers)
        shield.style.pointerEvents = 'none';

        // 2. On le remet "solide" après 150ms
        // C'est trop court pour qu'une popup s'ouvre, 
        // mais assez long pour que l'iframe reçoive le clic du Play
        setTimeout(() => {
            shield.style.pointerEvents = 'auto';
            console.log("Clic transmis au lecteur, protection réactivée.");
        }, 150);
    }, {passive: true});
</script>

</body>
</html>
