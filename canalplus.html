<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        .player-container {
            position: relative;
            width: 100%;
            max-width: 600px;
            aspect-ratio: 16 / 9;
            background: #000;
            margin: auto;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        /* TON LIEN MORT PERMANENT */
        #mobile-shield {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 999999;
            display: block;
            background: rgba(0,0,0,0);
            cursor: pointer;
            -webkit-tap-highlight-color: transparent; /* Enleve le flash bleu sur mobile */
        }
    </style>
</head>
<body>

<div class="player-container">
    <a href="javascript:void(0)" id="mobile-shield"></a>

    <iframe 
        id="stream-iframe"
        src="https://viewembed.ru/channel/CanalSport%5BFrance%5D?autoplay=1&muted=1" 
        allow="autoplay; encrypted-media" 
        allowfullscreen>
    </iframe>
</div>

<script>
    const shield = document.getElementById('mobile-shield');
    const iframe = document.getElementById('stream-iframe');

    shield.addEventListener('touchstart', function(e) {
        // 1. On rend le lien "fantôme" au toucher
        this.style.pointerEvents = 'none';

        // 2. On le remet après un court instant
        // Ça permet de cliquer sur le bouton "Unmute" (son) sans déclencher de pop-up
        setTimeout(() => {
            this.style.pointerEvents = 'auto';
        }, 300);
    }, {passive: true});

    // Forcer le rechargement de l'iframe si l'autoplay galère au début
    window.onload = () => {
        iframe.src = iframe.src; 
    };
</script>

</body>
</html>
