<!DOCTYPE html>
<html>
<head>
    <style>
        .video-box {
            position: relative;
            width: 800px;
            height: 450px;
            overflow: hidden;
            background: #000;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        /* TON LIEN MORT QUI SUIT LA SOURIS */
        #anti-pub-link {
            position: absolute;
            width: 50px;  /* Petit carré sous la souris */
            height: 50px;
            z-index: 999999;
            background: rgba(255, 0, 0, 0); /* Invisible */
            cursor: pointer;
            pointer-events: auto;
        }
    </style>
</head>
<body>

<div class="video-box" id="container">
    <a href="javascript:void(0)" id="anti-pub-link"></a>
    
    <iframe id="player" src="https://viewembed.ru/channel/CanalSport%5BFrance%5D" allowfullscreen></iframe>
</div>

<script>
    const link = document.getElementById('anti-pub-link');
    const container = document.getElementById('container');

    // Le lien suit ta souris dans le cadre de la vidéo
    container.addEventListener('mousemove', (e) => {
        const rect = container.getBoundingClientRect();
        link.style.left = (e.clientX - rect.left - 25) + 'px';
        link.style.top = (e.clientY - rect.top - 25) + 'px';
    });

    // Quand tu cliques, on désactive le lien 0.1s pour laisser passer TON clic sur Play
    link.addEventListener('mousedown', () => {
        link.style.pointerEvents = 'none';
        console.log("Clic protégé envoyé !");
        
        setTimeout(() => {
            link.style.pointerEvents = 'auto';
        }, 150);
    });
</script>

</body>
</html>
