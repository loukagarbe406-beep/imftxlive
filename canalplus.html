<!DOCTYPE html>
<html>
<head>
    <style>
        .player-wrapper {
            position: relative;
            width: 100%;
            max-width: 850px;
            height: 480px;
            margin: auto;
            background: #000;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        /* La zone de clic "sécurisée" */
        #safety-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 999999;
            background: transparent;
        }
    </style>
</head>
<body>

<div class="player-wrapper">
    <div id="safety-layer"></div>
    
    <iframe id="live-player" src="https://viewembed.ru/channel/CanalSport%5BFrance%5D" allowfullscreen></iframe>
</div>

<script>
    const layer = document.getElementById('safety-layer');
    const iframe = document.getElementById('live-player');

    layer.addEventListener('mousedown', function(e) {
        // 1. On masque la couche de protection instantanément
        this.style.pointerEvents = 'none';
        
        // 2. On attend une fraction de seconde (le temps du clic sur le Play)
        setTimeout(() => {
            // 3. On remet la protection pour le prochain clic de pub
            this.style.pointerEvents = 'auto';
        }, 100); 
    });

    // Optionnel : Bloquer les alertes agaçantes
    window.alert = function() {};
</script>

</body>
</html>
