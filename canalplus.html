<!DOCTYPE html>
<html>
<head>
    <style>
        .container {
            position: relative;
            width: 800px;
            height: 450px;
            background: #000;
        }

        /* TON LIEN QUI COUVRE TOUT */
        #le-lien-mort {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 999999; /* Toujours au-dessus */
            display: block;
            cursor: pointer;
            background: rgba(0,0,0,0); /* Invisible mais présent */
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

<div class="container">
    <a href="javascript:void(0)" id="le-lien-mort"></a>

    <iframe src="https://viewembed.ru/channel/CanalSport%5BFrance%5D" allowfullscreen></iframe>
</div>

<script>
    const shield = document.getElementById('le-lien-mort');

    shield.addEventListener('mousedown', function() {
        // 1. On rend le lien "transparent" aux clics instantanément
        this.style.pointerEvents = 'none';

        // 2. On le remet "solide" après 200ms
        // C'est assez rapide pour que le script de pub ne se déclenche pas,
        // mais assez long pour que TON clic valide le bouton Play.
        setTimeout(() => {
            this.style.pointerEvents = 'auto';
            console.log("Le bouclier est de nouveau actif sur toute l'iframe");
        }, 200);
    });
</script>

</body>
</html>
