<!DOCTYPE html>
<html>
<head>
    <style>
        .video-container {
            position: relative;
            width: 800px;
            height: 450px;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        /* La zone qui bloque les clics */
        #anti-pop {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            cursor: pointer;
            background: rgba(0,0,0,0); /* Totalement transparent */
        }
    </style>
</head>
<body>

<div class="video-container">
    <div id="anti-pop" onclick="removeShield()"></div>
    
    <iframe src="https://viewembed.ru/channel/CanalSport%5BFrance%5D" allowfullscreen></iframe>
</div>

<script>
    function removeShield() {
        const shield = document.getElementById('anti-pop');
        shield.style.display = 'none';
        console.log("Premier clic intercepté, protection retirée.");
    }
</script>

</body>
</html>
