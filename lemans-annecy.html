<script>
  // 1. On paralyse window.open pour empêcher l'ouverture de nouveaux onglets
  window.open = function() { 
    console.log("Tentative de pop-up bloquée.");
    return null; 
  };

  // 2. On empêche le site dans l'iframe de rediriger TA page (Top-level navigation)
  window.onbeforeunload = function() {
    return "Voulez-vous vraiment quitter cette page ?";
  };

  // 3. Blocage des clics fantômes
  document.addEventListener('click', function(e) {
    if (e.target.tagName === 'A' && e.target.target === '_blank') {
        e.preventDefault();
    }
  }, true);
</script>

<div class="video-container">
  <iframe 
    src="https://viewembed.ru/channel/CanalSport2%5BFrance%5D" 
    width="100%" 
    height="500" 
    frameborder="0" 
    allowfullscreen>
  </iframe>
</div>
