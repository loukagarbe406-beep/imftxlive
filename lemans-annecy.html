<script>
    // On paralyse la création de nouvelles fenêtres/onglets
    window.open = function() {
        console.warn("Tentative de Pop-up bloquée par le script de sécurité.");
        return {
            focus: function() {},
            close: function() {},
            blur: function() {}
        };
    };

    // On bloque aussi les clics forcés sur des liens externes
    document.addEventListener('click', function(e) {
        if (e.target.tagName === 'A' && e.target.target === '_blank') {
            e.preventDefault();
            console.log("Lien externe bloqué.");
        }
    }, true);
</script>
