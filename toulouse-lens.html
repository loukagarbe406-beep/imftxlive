<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IMFTX+ — Toulouse - Lens</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&display=swap" rel="stylesheet">

  <style>
    html,body{
      height:100%;margin:0;
      font-family:'Outfit',system-ui,-apple-system,"Segoe UI",Roboto,Arial;
      background:
        radial-gradient(1200px 700px at 50% 0%, rgba(255,255,255,.08), transparent 60%),
        linear-gradient(180deg,#070708 0%,#0f0f10 100%);
      color:#fff;
    }
    .player-box{
      border-radius:20px;
      overflow:hidden;
      border:1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.03);
      box-shadow: 0 25px 90px rgba(0,0,0,.72);
    }
    iframe{width:100%;height:100%;border:0;background:#000;display:block}
  </style>
</head>

<body>

<nav class="sticky top-0 z-40 bg-black/20 backdrop-blur-xl border-b border-white/5">
  <div class="max-w-screen-2xl mx-auto px-6 py-3 flex items-center justify-between">
    <div class="text-3xl font-extrabold tracking-tight">IMFTX+</div>

    <a href="index.html"
       class="inline-flex items-center gap-2 px-4 h-10 rounded-full bg-white/10 border border-white/10 hover:bg-white/15 font-bold text-sm">
      ← Retour
    </a>
  </div>
</nav>

<main class="max-w-screen-2xl mx-auto px-6 py-10">

  <!-- HEADER -->
  <header class="text-center mb-8">
    <h1 class="text-3xl md:text-4xl font-extrabold tracking-tight uppercase">
      Toulouse - RC Lens
    </h1>
    <p class="mt-2 text-white/55 font-semibold">
      Ligue 1 · 20:45
    </p>
  </header>

  <!-- VIEWERS -->
  <div class="flex justify-center mb-4">
    <div class="flex items-center gap-3 text-3xl md:text-4xl font-extrabold tracking-tight">
      👤 <span id="viewerCount">0</span>
    </div>
  </div>

  <!-- PLAYER -->
  <section class="player-box relative w-full aspect-video">
    <div id="overlay" class="absolute inset-0 z-10 flex flex-col items-center justify-center bg-black/80">
      <button onclick="loadVideo(1)"
              class="px-10 py-4 rounded-full bg-amber-400 text-black font-extrabold text-lg hover:opacity-90">
        ▶ LANCER LE STREAM
      </button>
      <p class="mt-4 text-white/50 font-semibold text-sm">
        Si le player 1 ne marche pas → essaye le 2 / 3
      </p>
    </div>
    <div id="videoTarget" class="w-full h-full"></div>
  </section>

  <!-- PLAYERS -->
  <section class="mt-5 grid grid-cols-3 gap-3">
    <button id="btn1" onclick="loadVideo(1)"
            class="h-12 rounded-xl bg-white text-black font-extrabold hover:opacity-95 text-xs md:text-base">
      PLAYER 1
    </button>
    <button id="btn2" onclick="loadVideo(2)"
            class="h-12 rounded-xl bg-white/10 border border-white/10 font-extrabold hover:bg-white/15 text-xs md:text-base">
      PLAYER 2
    </button>
    <button id="btn3" onclick="loadVideo(3)"
            class="h-12 rounded-xl bg-white/10 border border-white/10 font-extrabold hover:bg-white/15 text-xs md:text-base">
      PLAYER 3
    </button>
  </section>

  <!-- DIRECT LINK -->
  <div id="externalLink" class="hidden mt-4 text-center">
    <a id="directLink" href="#" target="_blank"
       class="text-amber-400 underline font-extrabold text-sm">
      Ouvrir le lien direct
    </a>
  </div>

  <p class="mt-8 text-center text-white/40 text-sm font-semibold">
    Si le stream bug, nous ne sommes pas responsables. Cela dépend de votre connexion. — L’équipe IMFTX+
  </p>

</main>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

<script>
/* ===============================
   VIEWERS (simple + stable)
================================= */

const firebaseConfig = {
  apiKey: "AIzaSyDPP6MQDLbDaVu2f6cFy44iUvAZ1RCJPtQ",
  authDomain: "imftxlive.firebaseapp.com",
  databaseURL: "https://imftxlive-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "imftxlive",
  storageBucket: "imftxlive.firebasestorage.app",
  messagingSenderId: "117057055374",
  appId: "1:117057055374:web:af7d7542749a6ec592b7df"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const MATCH_ID = "toulouse-lens";
const countRef = db.ref(`streams/${MATCH_ID}/viewers`);
const viewerCountEl = document.getElementById("viewerCount");

function formatViewers(n){
  n = Number(n||0);
  if(n >= 1000000) return (n/1000000).toFixed(1).replace(".0","") + "M";
  if(n >= 1000) return (n/1000).toFixed(1).replace(".0","") + "k";
  return String(n);
}

const connectedRef = db.ref(".info/connected");
connectedRef.on("value", snap => {
  if(snap.val() === true){
    countRef.transaction(c => (c||0) + 1);
    countRef.onDisconnect().transaction(c => Math.max((c||1) - 1, 0));
  }
});

countRef.on("value", snap => {
  viewerCountEl.textContent = formatViewers(snap.val());
});

/* ===============================
   PLAYER
================================= */

const SOURCES = {
  1: "https://bolaloca.my/player/4/20",
  2: "https://bolaloca.my/player/2/20",
  3: "https://bolaloca.my/player/3/20"
};

function setActive(id){
  [1,2,3].forEach(n=>{
    const b = document.getElementById("btn"+n);
    b.className = (n===id)
      ? "h-12 rounded-xl bg-white text-black font-extrabold hover:opacity-95 text-xs md:text-base"
      : "h-12 rounded-xl bg-white/10 border border-white/10 font-extrabold hover:bg-white/15 text-xs md:text-base";
  });
}

function loadVideo(id){
  document.getElementById("overlay").style.display = "none";
  setActive(id);

  const ext = document.getElementById("externalLink");
  const link = document.getElementById("directLink");
  link.href = SOURCES[id];
  ext.classList.add("hidden");

  const target = document.getElementById("videoTarget");
  target.innerHTML = `
    <iframe
      id="streamFrame"
      src="${SOURCES[id]}"
      allowfullscreen
      scrolling="no"
      frameborder="0"
      allow="autoplay; fullscreen; picture-in-picture; encrypted-media"
      referrerpolicy="origin"
      sandbox="allow-scripts allow-same-origin allow-forms allow-presentation">
    </iframe>
  `;

  setTimeout(() => {
    const iframe = document.getElementById("streamFrame");
    if(!iframe) return;
    try { iframe.contentWindow.location.href; }
    catch(e){ ext.classList.remove("hidden"); }
  }, 2000);
}
</script>

</body>
</html>
