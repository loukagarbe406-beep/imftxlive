<!DOCTYPE html>
<html>
<head>
    <style>
        #video-wrapper { position: relative; width: 100%; max-width: 900px; aspect-ratio: 16/9; background: #000; overflow: hidden; }
        iframe { width: 100%; height: 100%; border: 0; }
        
        /* La couche qui protège avant le clic */
        #safety-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10; cursor: pointer; display: flex; align-items: center; justify-content: center;
            background: rgba(0,0,0,0.6); color: white; font-weight: bold; text-align: center;
        }
    </style>
</head>
<body>

<div id="video-wrapper">
    <div id="safety-layer">CLIQUE ICI POUR LANCER LE MATCH<br>(Garanti sans pub)</div>
    <div id="player-container"></div>
</div>

<script>
    const url = "https://pooembed.eu/embed/coupe-de-france/2026-03-05/lyon-rcl";
    const container = document.getElementById('player-container');
    const safety = document.getElementById('safety-layer');
    const wrapper = document.getElementById('video-wrapper');

    // On pré-charge l'iframe
    container.innerHTML = `<iframe id="thePlayer" src="${url}" allow="autoplay; fullscreen" scrolling="no"></iframe>`;

    // 1. Verrouillage total de window.open au repos
    const noPop = () => { return null; };
    window.open = noPop;

    safety.addEventListener('mousedown', function() {
        // 2. AU MOMENT DU CLIC : On laisse passer le clic vers l'iframe
        safety.style.pointerEvents = 'none'; 
        safety.style.opacity = '0';

        // 3. On tente le Fullscreen immédiatement sur le conteneur
        if (wrapper.requestFullscreen) wrapper.requestFullscreen();
        else if (wrapper.webkitRequestFullscreen) wrapper.webkitRequestFullscreen();

        // 4. PROTECTION : On réactive le bouclier après 300ms
        // Ça laisse assez de temps pour que le "Play" soit détecté, 
        // mais trop peu pour que les scripts de pubs en cascade s'activent.
        setTimeout(() => {
            safety.style.pointerEvents = 'auto';
            window.open = noPop; // On s'assure que window.open est toujours bloqué
            console.log("Protection réengagée");
        }, 300);
    });

    // 5. Anti-Redirection (pour empêcher l'onglet actuel de changer)
    window.onbeforeunload = function() { return "Bloqué"; };
</script>

</body>
</html>
