<div id="video-container" style="position:relative; width:100%; height:100vh; background:#000;">
    <div id="player-target" style="width:100%; height:100%;"></div>
    
    <div id="launcher" style="position:absolute; top:0; left:0; width:100%; height:100%; z-index:9999; display:flex; align-items:center; justify-content:center; background:rgba(0,0,0,0.5); cursor:pointer;">
        <div style="padding:20px; background:#e50914; color:white; border-radius:50px; font-weight:bold; font-size:1.2rem;">
            CLIQUEZ POUR LANCER LE MATCH (SANS PUB)
        </div>
    </div>
</div>

<script>
    // On ajoute muted=1 et autoplay=1 si le player les supporte
    const url = "https://pooembed.eu/embed/coupe-de-france/2026-03-05/lyon-rcl?autoplay=1&muted=1";
    const target = document.getElementById('player-target');
    const launcher = document.getElementById('launcher');

    // Insertion de l'iframe
    target.innerHTML = `<iframe id="myPlayer" src="${url}" allow="autoplay; fullscreen" scrolling="no" frameborder="0" style="width:100%;height:100%;border:0"></iframe>`;

    // Neutralisation agressive de window.open sur TA page
    window.open = function() { return null; };

    launcher.addEventListener('click', function() {
        const container = document.getElementById('video-container');
        
        // 1. On tente le plein écran (demande un clic utilisateur, donc ici c'est bon)
        if (container.requestFullscreen) {
            container.requestFullscreen();
        } else if (container.webkitRequestFullscreen) {
            container.webkitRequestFullscreen();
        }

        // 2. On fait disparaître le bouton pour laisser place au player
        launcher.style.display = 'none';

        // 3. Petit hack : on redonne le focus à l'iframe pour que les raccourcis clavier marchent
        document.getElementById('myPlayer').focus();
        
        console.log("Mode Cinéma activé, clics de redirection bloqués sur le parent.");
    });

    // Empêche de quitter la page par erreur sur un clic de pub résiduel
    window.onbeforeunload = function() { return "Pub bloquée"; };
</script>
