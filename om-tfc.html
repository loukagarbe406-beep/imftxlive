<!DOCTYPE html>
<html>
<head>
    <style>
        body { margin: 0; background: #000; overflow: hidden; }
        #player-wrap { position: relative; width: 100vw; height: 100vh; }
        iframe { width: 100%; height: 100%; border: 0; }
    </style>
</head>
<body>

<div id="player-wrap">
    <div id="target"></div>
</div>

<script>
    const url = "https://pooembed.eu/embed/coupe-de-france/2026-03-05/lyon-rcl";
    const target = document.getElementById('target');

    // 1. Injection propre de l'iframe
    target.innerHTML = `<iframe id="video-frame" src="${url}" allow="autoplay; fullscreen" scrolling="no" frameborder="0"></iframe>`;

    // 2. LA MAGIE : On neutralise window.open au niveau du "Prototype"
    // Cela empêche même les scripts cachés de l'utiliser.
    const silentBlocker = function() { 
        console.log("🚫 Pop-up stoppée net !"); 
        return null; 
    };

    // On écrase la fonction native
    window.open = silentBlocker;
    Object.defineProperty(window, 'open', { value: silentBlocker, writable: false });

    // 3. Empêcher le changement d'URL de la page actuelle (le "Tab-jacking")
    let allowNavigation = true;
    window.onbeforeunload = function() {
        if (allowNavigation) {
            setTimeout(() => { allowNavigation = true; }, 1000);
            return "Une pub a essayé de vous rediriger. Rester ici ?";
        }
    };

    // 4. LE TRUC EN PLUS : On intercepte les clics sur toute la page
    // pour bloquer les tentatives de création de liens <a> fantômes.
    document.addEventListener('click', function(e) {
        // On laisse le clic passer pour que la vidéo se lance
        // Mais on verrouille toute sortie vers un autre site
        console.log("Clic détecté sur le lecteur...");
    }, true);

</script>
</body>
</html>
