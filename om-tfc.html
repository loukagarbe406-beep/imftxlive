<!DOCTYPE html>
<html>
<head>
    <style>
        body { margin: 0; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; font-family: sans-serif; }
        #player-container { position: relative; width: 90%; max-width: 900px; aspect-ratio: 16/9; background: #111; }
        iframe { width: 100%; height: 100%; border: none; }
        
        /* Overlay de démarrage */
        #launch-btn {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 100; background: rgba(0,0,0,0.7);
            display: flex; align-items: center; justify-content: center; cursor: pointer;
        }
        .play-box { padding: 20px 40px; background: #e50914; color: white; border-radius: 5px; font-weight: bold; }
    </style>
</head>
<body>

    <div id="player-container">
        <div id="launch-btn">
            <div class="play-box">DÉMARRER LE MATCH</div>
        </div>
        <div id="target"></div>
    </div>

    <script>
        const url = "https://pooembed.eu/embed/coupe-de-france/2026-03-05/lyon-rcl";
        const target = document.getElementById('target');
        const btn = document.getElementById('launch-btn');

        // On ne bloque PAS window.open ici pour que le player reste "content"
        
        btn.onclick = function() {
            // 1. On injecte le player normalement (SANS SANDBOX)
            target.innerHTML = `<iframe src="${url}" allow="autoplay; fullscreen" id="the-frame"></iframe>`;
            
            // 2. On cache notre bouton
            btn.style.display = 'none';

            // 3. LA RUSE : On force le focus sur notre fenêtre toutes les 500ms
            // Si une pub s'ouvre, elle passera en arrière-plan (Pop-under) 
            // ou sera immédiatement recouverte par ton match.
            const focusMatch = setInterval(() => {
                window.focus();
            }, 500);

            // 4. On demande le plein écran immédiatement
            // Le plein écran système est la meilleure arme contre les popups
            const container = document.getElementById('player-container');
            if (container.requestFullscreen) container.requestFullscreen();
            
            // On arrête de forcer le focus après 10 secondes pour économiser la batterie
            setTimeout(() => clearInterval(focusMatch), 10000);
        };

        // On garde quand même l'alerte si jamais la page tente de se fermer
        window.onbeforeunload = function() {
            return "Une pub tente de détourner votre onglet !";
        };
    </script>
</body>
</html>
