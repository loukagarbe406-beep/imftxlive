<!DOCTYPE html>
<html>
<head>
    <style>
        #wrapper { position: relative; width: 100%; max-width: 800px; aspect-ratio: 16/9; background: #000; }
        iframe { width: 100%; height: 100%; border: 0; }
        
        /* Le bouclier qui va intercepter les 2 premières pubs */
        #ad-killer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 9999; cursor: pointer;
            background: rgba(0,0,0,0.1); /* On le laisse un peu sombre pour voir qu'il est là */
            display: flex; align-items: center; justify-content: center;
            color: white; font-family: sans-serif; font-weight: bold;
        }
    </style>
</head>
<body>

<div id="wrapper">
    <div id="ad-killer">CLIQUEZ POUR NETTOYER LES PUBS (<span id="count">2</span>)</div>
    <div id="player"></div>
</div>

<script>
    const url = "https://pooembed.eu/embed/coupe-de-france/2026-03-05/lyon-rcl";
    const player = document.getElementById('player');
    const killer = document.getElementById('ad-killer');
    const countTxt = document.getElementById('count');

    let pubsRestantes = 2; // On sait qu'il y en a deux

    // On charge l'iframe SANS sandbox
    player.innerHTML = `<iframe src="${url}" allow="autoplay; fullscreen" scrolling="no"></iframe>`;

    // BLOQUEUR RADICAL DE WINDOW.OPEN
    // On remplace la fonction par une version qui ne fait absolument rien
    window.open = function() { 
        console.log("Une pub a tenté de s'ouvrir, mais je l'ai tuée.");
        return null; 
    };

    killer.addEventListener('click', function(e) {
        pubsRestantes--;
        
        if (pubsRestantes > 0) {
            countTxt.innerText = pubsRestantes;
            console.log("Première pub absorbée.");
        } else {
            // AU DERNIER CLIC : on libère le passage
            killer.style.display = 'none';
            console.log("Chemin nettoyé. Cliquez maintenant sur le bouton PLAY du lecteur.");
            
            // On tente de passer en plein écran pour "verrouiller" l'affichage
            if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
        }
    });

    // Anti-redirection de l'onglet actuel
    window.onbeforeunload = function() { return "Une pub essaie de vous faire partir !"; };
</script>

</body>
</html>
