<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Player Sans Pop-up</title>
    <style>
        body { background: #111; color: white; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        #video-container { position: relative; width: 80%; max-width: 900px; aspect-ratio: 16/9; border: 2px solid #333; background: #000; }
        
        /* Le Bouclier Invisible */
        #ad-shield {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 9999;
            cursor: pointer;
            background: rgba(0,0,0,0.1); /* Légèrement visible pour le test, mettre à 0 ensuite */
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #shield-msg {
            background: rgba(0,0,0,0.7);
            padding: 10px 20px;
            border-radius: 5px;
            pointer-events: none; /* Le texte ne doit pas bloquer le clic sur le div parent */
        }
    </style>
</head>
<body>

    <h2>Match : Lyon vs RC Lens</h2>
    <p>Cliquez sur le lecteur pour neutraliser les pubs (2 clics requis).</p>

    <div id="video-container">
        <div id="ad-shield">
            <div id="shield-msg">Cliquez pour débloquer le lecteur (<span id="count">2</span>)</div>
        </div>
        <div id="target" style="width:100%; height:100%;"></div>
    </div>

    <script>
        const url = "https://pooembed.eu/embed/coupe-de-france/2026-03-05/lyon-rcl";
        const target = document.getElementById('target');
        const shield = document.getElementById('ad-shield');
        const countDisplay = document.getElementById('count');
        
        let clicksBlocked = 2; // Nombre de pubs à "manger" avant de libérer le bouton Play

        // Insertion de l'iframe SANS sandbox (pour ne pas fâcher le player)
        target.innerHTML = '<iframe src="'+url+'" allowfullscreen scrolling="no" frameborder="0" allow="autoplay;fullscreen;picture-in-picture" referrerpolicy="no-referrer" style="width:100%;height:100%;border:0"></iframe>';

        // Gestion du bouclier
        shield.onclick = function() {
            clicksBlocked--;
            
            if (clicksBlocked > 0) {
                countDisplay.innerText = clicksBlocked;
                console.log("Clic de pub neutralisé.");
            } else {
                // On retire le bouclier définitivement
                shield.style.display = 'none';
                console.log("Bouclier retiré. Le vrai player est accessible.");
            }
        };

        // Sécurité supplémentaire : On neutralise window.open au cas où un script "s'échappe"
        window.open = function() { 
            console.log("Tentative de popup externe bloquée par script.");
            return null; 
        };
    </script>

</body>
</html>
