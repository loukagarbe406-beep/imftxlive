<!DOCTYPE html>
<html>
<head>
    <style>
        body { margin: 0; background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; }
        #container { position: relative; width: 800px; height: 450px; background: #222; }
        iframe { width: 100%; height: 100%; border: 0; display: none; }
        
        /* LE FAUX BOUTON QUI MANGE LES PUBS */
        #fake-player {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 100; background: url('https://img.youtube.com/vi/dQw4w9WgXcQ/hqdefault.jpg') center/cover;
            display: flex; justify-content: center; align-items: center; cursor: pointer;
        }
        #play-icon { width: 80px; height: 80px; background: rgba(255,0,0,0.8); border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 40px; color: white; }
    </style>
</head>
<body>

<div id="container">
    <div id="fake-player">
        <div id="play-icon">▶</div>
    </div>
    <div id="real-player"></div>
</div>

<script>
    const url = "https://pooembed.eu/embed/coupe-de-france/2026-03-05/lyon-rcl";
    const fake = document.getElementById('fake-player');
    const real = document.getElementById('real-player');

    fake.onclick = function() {
        // 1. On ouvre les deux pubs de force vers Google pour "vider" le stock du player
        // (Certains navigateurs bloqueront ça, mais ça "casse" la file d'attente des scripts de pub)
        window.open(url, '_blank'); 
        
        // 2. On remplace tout de suite par le vrai player
        fake.style.display = 'none';
        real.innerHTML = `<iframe src="${url}" allow="autoplay; fullscreen" style="display:block;"></iframe>`;
        
        // 3. On demande le plein écran pour cacher les onglets qui s'ouvrent
        if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
    };

    // Bloque la redirection de TA page
    window.onbeforeunload = function() { return "Pub bloquée"; };
</script>

</body>
</html>
