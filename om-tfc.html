<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Lecteur Stream - No Ads</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; }
        #video-container { position: relative; width: 100%; max-width: 960px; aspect-ratio: 16/9; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

<div id="video-container">
    <div id="player-target"></div>
</div>

<script>
    const playerUrl = "https://pooembed.eu/embed/coupe-de-france/2026-03-05/lyon-rcl";

    // 1. BLOCAGE PRÉVENTIF DES POPUPS (NIVEAU JS)
    // On verrouille window.open avant même de charger l'iframe
    const noOp = () => {
        console.warn("🚫 Popup bloquée automatiquement.");
        return null;
    };
    
    try {
        Object.defineProperty(window, 'open', { value: noOp, writable: false });
    } catch(e) {
        window.open = noOp;
    }

    // 2. INJECTION DU PLAYER (SANS SANDBOX)
    document.getElementById('player-target').innerHTML = `
        <iframe 
            id="stream-frame"
            src="${playerUrl}" 
            allowfullscreen 
            allow="autoplay; fullscreen"
            referrerpolicy="no-referrer">
        </iframe>
    `;

    // 3. LA PROTECTION ANTI-REDIRECTION (LA CLÉ)
    // On surveille si l'onglet actuel essaie de charger une page de pub
    let isMatchPlaying = false;
    
    window.addEventListener('beforeunload', (event) => {
        // Si le match tourne et que la page veut changer d'URL, on bloque.
        event.preventDefault();
        event.returnValue = ''; // Affiche une alerte de confirmation navigateur
    });

    // 4. PROTECTION CONTRE LES CLICS FANTÔMES
    // Si une pub s'ouvre "sous" ton onglet (Pop-under)
    setInterval(() => {
        window.focus(); // On force le focus sur ton onglet toutes les secondes
    }, 1000);

</script>

</body>
</html>
