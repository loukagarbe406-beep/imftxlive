<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
    <title>IMFTX+ — Live</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;900&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; background: #000; color: #fff; font-family: 'Outfit', sans-serif; }
        .container { max-width: 800px; margin: 0 auto; padding: 10px; }
        
        /* PLAYER */
        .player-area { 
            width: 100%; aspect-ratio: 16/9; 
            background: #080808; border-radius: 12px; 
            overflow: hidden; position: relative;
            border: 1px solid rgba(255,255,255,0.1);
        }
        iframe { width: 100%; height: 100%; border: none; }

        .overlay {
            position: absolute; inset: 0; z-index: 10;
            background: #000; display: grid; place-items: center;
        }
        .play-btn {
            background: #fff; color: #000; border: none; padding: 14px 28px;
            border-radius: 50px; font-weight: 900; cursor: pointer;
        }

        /* SERVEURS */
        .server-list { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 15px 0; }
        .s-btn { 
            background: #111; border: 1px solid #222; color: #fff; 
            padding: 12px; border-radius: 10px; font-weight: 900; cursor: pointer; font-size: 12px;
        }
        .s-btn.active { background: #fff; color: #000; border-color: #fff; }

        /* MATCH INFO */
        .info { 
            background: #111; padding: 15px; border-radius: 15px; 
            display: flex; align-items: center; gap: 12px;
        }
        .logo { width: 40px; height: 40px; object-fit: contain; }
        .info b { display: block; font-size: 16px; }
        .info span { font-size: 12px; opacity: 0.5; }
    </style>
</head>
<body>

<div class="container">
    <div class="player-area" id="pBox">
        <div class="overlay" id="ovl">
            <button class="play-btn" onclick="start(1)">LANCER LE MATCH</button>
        </div>
        <div id="video" style="width:100%;height:100%"></div>
    </div>

    <div class="server-list">
        <button class="s-btn active" id="b1" onclick="start(1)">PLAYER 1</button>
        <button class="s-btn" id="b2" onclick="start(2)">PLAYER 2</button>
        <button class="s-btn" id="b3" onclick="start(3)">PLAYER 3</button>
    </div>

    <div class="info">
        <img class="logo" src="https://upload.wikimedia.org/wikipedia/fr/f/f7/CAN_-_Fr_-_Full_Colour.png">
        <div>
            <b>Ningeria - Tanzania</b>
            <span>Direct · CAN 2025</span>
        </div>
    </div>
</div>

<script>
    const URLS = {
        1: "https://bolaloca.my/player/4/1",
        2: "https://bolaloca.my/player/2/1",
        3: "https://bolaloca.my/player/3/1"
    };

    function start(id) {
        document.getElementById('ovl').style.display = 'none';
        document.querySelectorAll('.s-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('b' + id).classList.add('active');

        const v = document.getElementById('video');
        
        /* LE SECRET POUR MOBILE :
           On autorise 'allow-scripts' et 'allow-same-origin' pour que le flux marche.
           On NE MET PAS 'allow-popups' pour essayer de bloquer les nouvelles fenêtres.
           On ajoute 'allow-presentation' pour iPhone/Safari.
        */
        v.innerHTML = `
            <iframe 
                src="${URLS[id]}" 
                allowfullscreen 
                allow="autoplay; fullscreen"
                sandbox="allow-scripts allow-same-origin allow-forms allow-presentation"
                referrerpolicy="no-referrer-when-downgrade">
            </iframe>
        `;
    }
</script>

</body>
</html>
