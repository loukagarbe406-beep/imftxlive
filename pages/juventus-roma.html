<div id="playerBox" class="playerBox"></div>

<script>
const PLAYERS = {
  1: "https://bolaloca.my/player/4/138",
  2: "https://bolaloca.my/player/4/138",
  3: "https://bolaloca.my/player/4/138"
};

let current = 1;

function renderPlayer(url){
  const box = document.getElementById("playerBox");
  box.innerHTML = `
    <iframe
      id="player"
      class="playerFrame"
      src="${url}"
      allowfullscreen
      allow="autoplay; fullscreen; picture-in-picture"
      referrerpolicy="no-referrer"
      loading="lazy"
      sandbox="allow-scripts allow-same-origin allow-forms"
    ></iframe>

    <div class="fallback" style="padding:12px; text-align:center;">
      <a class="openBtn" href="${url}" target="_blank" rel="noopener"
         style="display:inline-flex;gap:10px;align-items:center;
                padding:12px 16px;border-radius:14px;
                background:#fff;color:#000;font-weight:900;">
        Ouvrir le stream ↗
      </a>
      <div style="margin-top:8px; opacity:.7; font-size:12px;">
        Si l’embed est bloqué sur iPhone, clique ici.
      </div>
    </div>
  `;
}

function setPlayer(n){
  current = n;
  renderPlayer(PLAYERS[n]);
}

// charge player 1
setPlayer(1);
</script>
