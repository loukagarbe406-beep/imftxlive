<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IMFTX+ — Stream</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

  <style>
    html,body{
      height:100%;margin:0;
      font-family:'Outfit',system-ui,-apple-system,"Segoe UI",Roboto,Arial;
      background:
        radial-gradient(1200px 700px at 50% 0%, rgba(255,255,255,.08), transparent 60%),
        linear-gradient(180deg,#070708 0%,#0f0f10 100%);
      color:#fff;
    }
    .player-box{
      border-radius:18px;
      overflow:hidden;
      border:1px solid rgba(255,255,255,.08);
      background: rgba(255,255,255,.03);
      box-shadow: 0 25px 85px rgba(0,0,0,.65);
    }
    iframe{width:100%;height:100%;border:0;background:#000;display:block}
  </style>
</head>

<body>

<nav class="sticky top-0 z-40 bg-black/20 backdrop-blur-xl border-b border-white/5">
  <div class="max-w-screen-2xl mx-auto px-6 py-3 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 shadow-[0_0_0_6px_rgba(52,211,153,.15)]"></span>
      <div class="text-3xl font-extrabold">IMFTX+</div>
    </div>
    <a href="../index.html"
       class="inline-flex items-center gap-2 px-4 h-10 rounded-full bg-white/10 border border-white/10 hover:bg-white/15 font-bold text-sm">
      <i class="fa-solid fa-arrow-left"></i> Retour
    </a>
  </div>
</nav>

<main class="max-w-screen-2xl mx-auto px-6 py-10">

  <section class="flex flex-col md:flex-row md:items-center md:justify-between gap-6 mb-6">
    <div>
      <h1 class="text-3xl md:text-4xl font-extrabold tracking-tight uppercase">
        LIVERPOOL - LEEDS
      </h1>
      <p class="mt-2 text-white/60 font-semibold">Premier League · 18:30</p>
    </div>

    <div class="flex items-center gap-3">
      <img class="w-12 h-12 object-contain drop-shadow-lg"
           src="https://fr.wikipedia.org/wiki/Special:FilePath/Logo%20FC%20Liverpool.svg"
           alt="Liverpool">
      <span class="text-white/40 font-bold">vs</span>
      <img class="w-12 h-12 object-contain drop-shadow-lg"
           src="https://fr.wikipedia.org/wiki/Special:FilePath/Logo%20Leeds%20United%20FC.svg"
           alt="Leeds">
    </div>
  </section>

  <div class="flex flex-wrap items-center justify-between gap-3 mb-3">
    <div class="inline-flex items-center gap-2 px-3 py-1.5 rounded-full bg-black/40 border border-white/10 text-xs font-extrabold">
      <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
      LIVE
    </div>

    <div class="inline-flex items-center gap-2 px-3 py-1.5 rounded-full bg-black/40 border border-white/10 text-xs font-extrabold">
      <i class="fa-solid fa-eye text-white/70"></i>
      <span><span id="viewerCount">--</span> en direct</span>
      <span id="viewerStatus" class="text-white/40 font-bold"></span>
    </div>
  </div>

  <section class="player-box relative w-full aspect-video">

    <div id="overlay" class="absolute inset-0 z-10 flex flex-col items-center justify-center bg-black/80">
      <button onclick="loadVideo(1)"
              class="px-8 py-4 rounded-full bg-amber-400 text-black font-extrabold text-lg hover:opacity-90">
        ▶ LANCER LE STREAM
      </button>
      <p class="mt-4 text-white/50 font-semibold text-sm">Si le player 1 ne marche pas → essaye le 2 / 3</p>
    </div>

    <div id="videoTarget" class="w-full h-full"></div>
  </section>

  <section class="mt-5 grid grid-cols-3 gap-3">
    <button id="btn1" onclick="loadVideo(1)"
            class="h-12 rounded-xl bg-white text-black font-extrabold hover:opacity-95 text-xs md:text-base">
      PLAYER 1
    </button>
    <button id="btn2" onclick="loadVideo(2)"
            class="h-12 rounded-xl bg-white/10 border border-white/10 font-extrabold hover:bg-white/15 text-xs md:text-base">
      PLAYER 2
    </button>
    <button id="btn3" onclick="loadVideo(3)"
            class="h-12 rounded-xl bg-white/10 border border-white/10 font-extrabold hover:bg-white/15 text-xs md:text-base">
      PLAYER 3
    </button>
  </section>

  <div id="externalLink" class="hidden mt-4 text-center">
    <a id="directLink" href="#" target="_blank"
       class="text-amber-400 underline font-bold text-sm">
      Le lecteur ne s’affiche pas ? Ouvrir le lien direct
    </a>
  </div>

</main>

<!-- ✅ Firebase compat (pas module) -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

<script>
  /* ---------------------------
     1) VIEWERS FIREBASE (VRAI)
     --------------------------- */
  const firebaseConfig = {
    apiKey: "AIzaSyDPP6MQDLbDaVu2f6cFy44iUvAZ1RCJPtQ",
    authDomain: "imftxlive.firebaseapp.com",
    databaseURL: "https://imftxlive-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "imftxlive",
    storageBucket: "imftxlive.firebasestorage.app",
    messagingSenderId: "117057055374",
    appId: "1:117057055374:web:af7d7542749a6ec592b7df"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  const MATCH_ID = (location.pathname.split("/").pop() || "default").replace(".html","");
  const sessionId = Math.random().toString(36).slice(2) + Date.now();

  const sessionRef = db.ref(`streams/${MATCH_ID}/sessions/${sessionId}`);
  const sessionsRoot = db.ref(`streams/${MATCH_ID}/sessions`);

  const viewerCountEl = document.getElementById("viewerCount");
  const viewerStatusEl = document.getElementById("viewerStatus");

  // si pas en http/https => firebase peut fail
  if(location.protocol === "file:"){
    viewerCountEl.textContent = "--";
    viewerStatusEl.textContent = "(offline)";
  } else {
    sessionRef.set({ joinedAt: firebase.database.ServerValue.TIMESTAMP });
    sessionRef.onDisconnect().remove();

    sessionsRoot.on("value", snap => {
      const sessions = snap.val() || {};
      viewerCountEl.textContent = Object.keys(sessions).length;
      viewerStatusEl.textContent = "";
    }, err => {
      viewerCountEl.textContent = "--";
      viewerStatusEl.textContent = "(offline)";
    });
  }

  /* ---------------------------
     2) PLAYER (comme ton code)
     --------------------------- */
  const SOURCES = {
    1: "https://bolaloca.my/player/4/2",
    2: "https://bolaloca.my/player/2/2",
    3: "https://bolaloca.my/player/3/2"
  };

  function setActive(id){
    [1,2,3].forEach(n=>{
      const b = document.getElementById("btn"+n);
      b.className = (n===id)
        ? "h-12 rounded-xl bg-white text-black font-extrabold hover:opacity-95 text-xs md:text-base"
        : "h-12 rounded-xl bg-white/10 border border-white/10 font-extrabold hover:bg-white/15 text-xs md:text-base";
    });
  }

  function loadVideo(id){
    document.getElementById("overlay").style.display = "none";
    setActive(id);

    const ext = document.getElementById("externalLink");
    const link = document.getElementById("directLink");
    ext.classList.add("hidden");
    link.href = SOURCES[id];

    const target = document.getElementById("videoTarget");
    target.innerHTML = `
      <iframe
        id="streamFrame"
        src="${SOURCES[id]}"
        allowfullscreen
        scrolling="no"
        frameborder="0"
        allow="autoplay; fullscreen; picture-in-picture; encrypted-media"
        referrerpolicy="origin"
        sandbox="allow-scripts allow-same-origin allow-forms allow-presentation">
      </iframe>
    `;

    setTimeout(() => {
      const iframe = document.getElementById("streamFrame");
      if(!iframe) return;
      try { iframe.contentWindow.location.href; }
      catch(e){ ext.classList.remove("hidden"); }
    }, 2000);
  }
</script>

</body>
</html>
