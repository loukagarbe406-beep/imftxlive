<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IMFTX+ — Stream</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

  <style>
    html,body{
      height:100%;margin:0;
      font-family:'Outfit',system-ui,-apple-system,"Segoe UI",Roboto,Arial;
      background:linear-gradient(180deg,#070708 0%,#0f0f10 100%);
      color:#fff;
    }
    .player-box{
      border-radius:18px;
      overflow:hidden;
      border:1px solid rgba(255,255,255,.06);
      background: rgba(255,255,255,.03);
      box-shadow: 0 25px 85px rgba(0,0,0,.65);
    }
    iframe{width:100%;height:100%;border:0;background:#000;display:block}
  </style>
</head>

<body>

<!-- NAVBAR -->
<nav class="sticky top-0 z-40 bg-transparent backdrop-blur-sm border-b border-zinc-800/40">
  <div class="max-w-screen-2xl mx-auto px-6 py-3 flex items-center justify-between">
    <div class="text-3xl font-extrabold">IMFTX+</div>

    <a href="../index.html"
       class="inline-flex items-center gap-2 px-4 h-10 rounded-full bg-white/10 border border-white/10 hover:bg-white/15 font-bold text-sm">
      <i class="fa-solid fa-arrow-left"></i> Retour
    </a>
  </div>
</nav>

<main class="max-w-screen-2xl mx-auto px-6 py-10">

  <!-- MATCH INFO -->
  <section class="flex flex-col md:flex-row md:items-center md:justify-between gap-6 mb-8">
    <div>
      <h1 class="text-3xl md:text-4xl font-extrabold tracking-tight" id="matchTitle">LIVERPOOL - LEEDS</h1>
      <p class="mt-2 text-white/60 font-semibold" id="matchMeta">Match · 18:30</p>
    </div>

    <div class="flex items-center gap-3">
      <img class="w-12 h-12 object-contain drop-shadow-lg"
           src="https://fr.wikipedia.org/wiki/Special:FilePath/Logo%20FC%20Liverpool.svg"
           alt="Liverpool">
      <span class="text-white/40 font-bold">vs</span>
      <img class="w-12 h-12 object-contain drop-shadow-lg"
           src="https://fr.wikipedia.org/wiki/Special:FilePath/Logo%20Leeds%20United%20FC.svg"
           alt="Leeds">
    </div>
  </section>

  <!-- PLAYER -->
  <section class="player-box relative w-full aspect-video" id="playerContainer">
    <div id="videoTarget" class="w-full h-full"></div>
  </section>

  <!-- PLAYER SELECT -->
  <section class="mt-5 grid grid-cols-3 gap-3">
    <button id="btn1" onclick="loadVideo(1)"
            class="h-12 rounded-xl bg-white text-black font-extrabold hover:opacity-95">
      PLAYER 1
    </button>
    <button id="btn2" onclick="loadVideo(2)"
            class="h-12 rounded-xl bg-white/10 border border-white/10 font-extrabold hover:bg-white/15">
      PLAYER 2
    </button>
    <button id="btn3" onclick="loadVideo(3)"
            class="h-12 rounded-xl bg-white/10 border border-white/10 font-extrabold hover:bg-white/15">
      PLAYER 3
    </button>
  </section>

  <!-- NOTE -->
  <section class="mt-8 p-5 rounded-2xl bg-white/5 border border-white/10 text-white/60 font-semibold">
    Si un player ne marche pas, passe au suivant.
  </section>

</main>

<script>
  const SOURCES = {
    1: "https://bolaloca.my/player/4/12",
    2: "https://bolaloca.my/player/2/12",
    3: "https://bolaloca.my/player/3/12"
  };

  function setActive(id){
    [1,2,3].forEach(n=>{
      const b = document.getElementById("btn"+n);
      if(n===id){
        b.className = "h-12 rounded-xl bg-white text-black font-extrabold hover:opacity-95";
      }else{
        b.className = "h-12 rounded-xl bg-white/10 border border-white/10 font-extrabold hover:bg-white/15";
      }
    });
  }

  function loadVideo(id){
    setActive(id);

    const target = document.getElementById("videoTarget");
    target.innerHTML = `
      <iframe
        src="${SOURCES[id]}"
        allowfullscreen="true"
        webkitallowfullscreen="true"
        mozallowfullscreen="true"
        scrolling="no"
        frameborder="0"
        allow="autoplay; fullscreen; picture-in-picture; encrypted-media"
        referrerpolicy="no-referrer"
        sandbox="allow-scripts allow-same-origin allow-forms">
      </iframe>
    `;
  }

  // ✅ Chargement automatique Player 1 au chargement de la page
  loadVideo(1);
</script>

</body>
</html>
