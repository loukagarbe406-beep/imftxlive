<script>
  const SOURCES = {
    1: "https://bolaloca.my/player/4/2",
    2: "https://bolaloca.my/player/2/2",
    3: "https://bolaloca.my/player/3/2"
  };

  // ✅ Détection mobile fiable
  function isMobile(){
    return window.matchMedia("(max-width: 900px)").matches 
      || /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  }

  function setActive(id){
    [1,2,3].forEach(n=>{
      const b = document.getElementById("btn"+n);
      if(!b) return;
      if(n===id){
        b.className = "h-12 rounded-xl bg-white text-black font-extrabold hover:opacity-95";
      }else{
        b.className = "h-12 rounded-xl bg-white/10 border border-white/10 font-extrabold hover:bg-white/15";
      }
    });
  }

  // ✅ fallback propre : ouvre le player directement
  function openDirect(id){
    // ✅ même onglet
    window.location.href = SOURCES[id];
  }

  // ✅ Charge iframe sur PC, redirige sur mobile
  function loadVideo(id){
    setActive(id);

    // ✅ Mobile: on redirige (évite "embedding blocked")
    if(isMobile()){
      openDirect(id);
      return;
    }

    // ✅ PC: iframe intégré
    const target = document.getElementById("videoTarget");
    target.innerHTML = `
      <iframe
        src="${SOURCES[id]}"
        allowfullscreen="true"
        webkitallowfullscreen="true"
        mozallowfullscreen="true"
        scrolling="no"
        frameborder="0"
        allow="autoplay; fullscreen; picture-in-picture; encrypted-media"
        referrerpolicy="no-referrer"
        sandbox="allow-scripts allow-same-origin allow-forms">
      </iframe>
    `;

    // ✅ Si le player est bloqué même sur PC → fallback auto après 2s
    setTimeout(() => {
      // si l'iframe n'a pas chargé, on fallback (ça arrive quand bloqué)
      const iframe = target.querySelector("iframe");
      if(!iframe) return;
      try {
        // Certaines protections bloquent l'accès → catch
        const test = iframe.contentWindow.location.href;
      } catch(e){
        // blocked -> fallback
        openDirect(id);
      }
    }, 2000);
  }

  // ✅ Charge player 1 automatiquement au démarrage
  window.addEventListener("load", () => loadVideo(1));
</script>
