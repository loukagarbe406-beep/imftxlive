<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>IMFTX+ — Live Direct</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --accent: #e11d48; --bg: #050505; --card: #121212; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: var(--bg); color: #fff; font-family: 'Outfit', sans-serif; }
        
        header { padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; background: #000; }
        .brand { font-weight: 900; font-size: 22px; color: #fff; letter-spacing: -1px; }
        .back-btn { font-size: 13px; opacity: 0.7; text-decoration: none; color: #fff; background: rgba(255,255,255,0.1); padding: 6px 14px; border-radius: 20px; }

        .content { max-width: 900px; margin: 0 auto; padding: 12px; }

        /* PLAYER BOX */
        .player-container { 
            width: 100%; 
            aspect-ratio: 16/9; 
            background: #000; 
            border-radius: 20px; 
            overflow: hidden; 
            position: relative;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
        }
        
        iframe { width: 100%; height: 100%; border: none; display: block; background: #000; }

        .overlay {
            position: absolute; inset: 0; z-index: 10;
            background: radial-gradient(circle at center, #1a1a1a 0%, #000 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }

        .play-btn {
            background: #fff; color: #000; border: none; padding: 16px 32px;
            border-radius: 50px; font-weight: 900; font-size: 16px; cursor: pointer;
            transition: transform 0.2s;
        }
        .play-btn:active { transform: scale(0.95); }

        /* SELECTION */
        .player-select { 
            display: grid; grid-template-columns: repeat(3, 1fr); 
            gap: 8px; margin: 15px 0; 
        }
        .btn-opt { 
            background: var(--card); border: 1px solid rgba(255,255,255,0.08); 
            color: rgba(255,255,255,0.6); padding: 14px; border-radius: 12px; font-weight: 700; cursor: pointer;
            font-size: 13px;
        }
        .btn-opt.active { background: #fff; color: #000; border-color: #fff; }

        /* MATCH INFO */
        .match-card {
            background: var(--card); padding: 16px; border-radius: 18px;
            display: flex; align-items: center; gap: 15px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .logo-box { width: 44px; height: 44px; background: rgba(0,0,0,0.4); border-radius: 12px; padding: 6px; flex-shrink: 0; }
        .logo-box img { width: 100%; height: 100%; object-fit: contain; }
        .details b { display: block; font-size: 17px; font-weight: 800; color: #fff; }
        .details span { font-size: 13px; opacity: 0.5; }

        .live-tag {
            margin-left: auto; color: #22c55e;
            padding: 4px 10px; border-radius: 6px; font-weight: 900; font-size: 11px;
            display: flex; align-items: center; gap: 6px; background: rgba(34, 197, 94, 0.1);
        }
        .dot { width: 8px; height: 8px; background: #22c55e; border-radius: 50%; animation: blink 1s infinite; }

        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
    </style>
</head>
<body>

<header>
    <div class="brand">IMFTX+</div>
    <a href="../index.html" class="back-btn">← Retour</a>
</header>

<div class="content">
    <div class="player-container" id="playerContainer">
        <div class="overlay" id="overlay">
            <button class="play-btn" onclick="loadVideo(1)">▶ LANCER LE STREAM</button>
        </div>
        <div id="videoTarget" style="width:100%; height:100%;"></div>
    </div>

    <div class="player-select">
        <button class="btn-opt active" id="btn1" onclick="loadVideo(1)">PLAYER 1</button>
        <button class="btn-opt" id="btn2" onclick="loadVideo(2)">PLAYER 2</button>
        <button class="btn-opt" id="btn3" onclick="loadVideo(3)">PLAYER 3</button>
    </div>

    <div class="match-card">
        <div class="logo-box">
            <img id="leagueLogo" src="https://upload.wikimedia.org/wikipedia/fr/f/f7/CAN_-_Fr_-_Full_Colour.png" alt="Cup">
        </div>
        <div class="details">
            <b id="matchName">MAROC - COMORES</b>
            <span id="matchTime">CAN 2025 · Direct 20:00</span>
        </div>
        <div class="live-tag">
            <div class="dot"></div> LIVE
        </div>
    </div>
</div>

<script>
    const SOURCES = {
        1: "https://bolaloca.my/player/4/2",
        2: "https://bolaloca.my/player/2/2",
        3: "https://bolaloca.my/player/3/2"
    };

    function loadVideo(id) {
        // Cacher l'overlay au premier clic
        document.getElementById('overlay').style.display = 'none';
        
        // Gestion de l'état actif des boutons
        document.querySelectorAll('.btn-opt').forEach(b => b.classList.remove('active'));
        document.getElementById('btn' + id).classList.add('active');

        const target = document.getElementById('videoTarget');
        
        /* SYSTEME ANTI-PUB :
           On utilise sandbox SANS 'allow-popups'. 
           Cela bloque l'ouverture de nouveaux onglets publicitaires.
        */
        target.innerHTML = `
            <iframe 
                src="${SOURCES[id]}" 
                allowfullscreen="true" 
                webkitallowfullscreen="true" 
                mozallowfullscreen="true" 
                scrolling="no" 
                frameborder="0" 
                allow="autoplay; fullscreen; picture-in-picture; encrypted-media"
                referrerpolicy="no-referrer"
                sandbox="allow-scripts allow-same-origin allow-forms">
            </iframe>
        `;
    }
</script>

</body>
</html>
