<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>IMFTX+ — Live</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;800;900&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #000; --card: #111; --accent: #ff0000; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: var(--bg); color: #fff; font-family: 'Outfit', sans-serif; height: 100vh; }
        
        header { padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
        .brand { font-weight: 900; font-size: 22px; }
        .back { opacity: 0.6; font-size: 14px; text-decoration: none; color: #fff; }

        .container { max-width: 800px; margin: 0 auto; padding: 0 12px; }

        /* PLAYER BOX - Optimisé Mobile */
        .player-box {
            width: 100%;
            aspect-ratio: 16/9;
            background: #080808;
            border-radius: 15px;
            overflow: hidden;
            position: relative;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .cover-overlay {
            position: absolute; inset: 0; z-index: 20;
            background: #000; display: flex; align-items: center; justify-content: center;
        }

        .play-btn {
            background: #fff; color: #000; border: none; padding: 15px 30px;
            border-radius: 50px; font-weight: 900; font-size: 15px; cursor: pointer;
        }

        iframe { width: 100%; height: 100%; border: none; }

        /* SELECTEUR */
        .player-nav {
            display: grid; grid-template-columns: repeat(3, 1fr);
            gap: 10px; margin: 15px 0;
        }
        .p-btn {
            background: var(--card); border: 1px solid rgba(255,255,255,0.1);
            color: #fff; padding: 12px; border-radius: 12px; font-weight: 800; cursor: pointer;
        }
        .p-btn.active { background: #fff; color: #000; }

        /* INFOS */
        .match-card {
            background: var(--card); padding: 15px; border-radius: 15px;
            display: flex; align-items: center; gap: 15px;
        }
        .match-logo { width: 45px; height: 45px; object-fit: contain; }
        .match-details b { display: block; font-size: 16px; }
        .match-details span { font-size: 12px; opacity: 0.5; }

        .live-dot {
            margin-left: auto; display: flex; align-items: center; gap: 6px;
            color: #22c55e; font-weight: 900; font-size: 12px;
        }
        .dot { width: 8px; height: 8px; background: #22c55e; border-radius: 50%; }
    </style>
</head>
<body>

<header>
    <div class="brand">IMFTX+</div>
    <a href="../index.html" class="back">← Retour</a>
</header>

<div class="container">
    <div class="player-box" id="playerBox">
        <div class="cover-overlay" id="cover">
            <button class="play-btn" onclick="injectPlayer(1)">▶ LANCER LE STREAM</button>
        </div>
    </div>

    <div class="player-nav">
        <button class="p-btn active" id="b1" onclick="injectPlayer(1)">PLAYER 1</button>
        <button class="p-btn" id="b2" onclick="injectPlayer(2)">PLAYER 2</button>
        <button class="p-btn" id="b3" onclick="injectPlayer(3)">PLAYER 3</button>
    </div>

    <div class="match-card">
        <img class="match-logo" src="https://upload.wikimedia.org/wikipedia/fr/f/f7/CAN_-_Fr_-_Full_Colour.png">
        <div class="match-details">
            <b>MAROC - COMORES</b>
            <span>Coupe d'Afrique · Direct 20:00</span>
        </div>
        <div class="live-dot"><div class="dot"></div> LIVE</div>
    </div>
</div>

<script>
    const CHANNELS = {
        1: "https://bolaloca.my/player/4/2",
        2: "https://bolaloca.my/player/2/2",
        3: "https://bolaloca.my/player/3/2"
    };

    function injectPlayer(id) {
        const box = document.getElementById('playerBox');
        
        // 1. Mise à jour des boutons
        document.querySelectorAll('.p-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById('b' + id).classList.add('active');

        // 2. On vide complètement la box et on reconstruit l'iframe
        // IMPORTANT : On retire le 'sandbox' qui cause le "Domain Blocked"
        // On retire aussi referrerpolicy pour laisser le navigateur gérer le flux
        box.innerHTML = `
            <iframe 
                src="${CHANNELS[id]}" 
                allowfullscreen 
                allow="autoplay; fullscreen"
                frameborder="0">
            </iframe>
        `;
    }
</script>

</body>
</html>
