<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>IMFTX+ — Live</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;background:#000;color:#fff;font-family:'Outfit',sans-serif}
    a{color:inherit;text-decoration:none}

    header{padding:14px 18px;display:flex;justify-content:space-between;align-items:center}
    .brand{font-weight:900;font-size:20px}
    .back{opacity:.7}
    .back:hover{opacity:1}

    .container{max-width:1200px;margin:0 auto;padding:0 16px 24px}

    .playerBox{
      border-radius:22px;overflow:hidden;background:#000;
      border:1px solid rgba(255,255,255,.12);
      box-shadow:0 30px 90px rgba(0,0,0,.75);
      position:relative;
    }
    .cover{
      width:100%;aspect-ratio:16/9;display:grid;place-items:center;
      background:
        radial-gradient(900px 420px at 30% 10%, rgba(255,255,255,.10), transparent 55%),
        linear-gradient(180deg, rgba(255,255,255,.06), rgba(0,0,0,.82));
    }
    .cover button{
      border:1px solid rgba(255,255,255,.18);
      background:rgba(255,255,255,.10);
      color:#fff;padding:14px 18px;border-radius:999px;
      font-weight:900;cursor:pointer;display:flex;align-items:center;gap:10px
    }
    .cover button:hover{background:rgba(255,255,255,.14)}
    iframe{width:100%;aspect-ratio:16/9;border:0;background:#000;display:block}

    .playerSelect{display:flex;gap:10px;margin:14px 0;flex-wrap:wrap}
    .playerBtn{
      padding:10px 14px;border-radius:12px;
      border:1px solid rgba(255,255,255,.18);
      background:rgba(255,255,255,.08);
      font-weight:900;cursor:pointer;
    }
    .playerBtn:hover{background:rgba(255,255,255,.12)}
    .playerBtn.active{background:#fff;border-color:#fff;color:#000}

    .infoBar{
      margin-top:14px;padding:14px 16px;border-radius:16px;
      background: linear-gradient(180deg, rgba(255,255,255,.12), rgba(255,255,255,.08));
      border:1px solid rgba(255,255,255,.10);
      display:flex;justify-content:space-between;align-items:center;gap:14px
    }
    .infoLeft{min-width:0}
    .infoLeft b{display:block;font-weight:900}
    .match{font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .sub{font-size:13px;opacity:.75}

    .rightBox{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:flex-end}
    .live{display:flex;align-items:center;gap:8px;font-weight:900}
    .dot{width:10px;height:10px;border-radius:50%;background:#22c55e}

    .viewers{
      display:flex;align-items:center;gap:8px;
      font-weight:900;padding:8px 12px;border-radius:999px;
      background:rgba(0,0,0,.30);
      border:1px solid rgba(255,255,255,.14)
    }
    .eye{width:18px;height:18px;fill:#fff;opacity:.9}

    @media(max-width:700px){
      .infoBar{flex-direction:column;align-items:flex-start}
      .rightBox{justify-content:flex-start}
    }
  </style>
</head>
<body>

<header>
  <div class="brand">IMFTX+</div>
  <a href="/" class="back">← Retour</a>
</header>

<div class="container">
  <div class="playerBox" id="playerBox">
    <div class="cover" id="cover">
      <button id="launchBtn" type="button">▶ Lancer le stream</button>
    </div>
  </div>

  <div class="playerSelect">
    <button class="playerBtn active" onclick="setPlayer(1)">Player 1</button>
    <button class="playerBtn" onclick="setPlayer(2)">Player 2</button>
    <button class="playerBtn" onclick="setPlayer(3)">Player 3</button>
  </div>

  <div class="infoBar">
    <div class="infoLeft">
      <b>Vous regardez</b>
      <div class="match" id="matchName">—</div>
      <div class="sub" id="matchTime">Aujourd’hui · —</div>
    </div>

    <div class="rightBox">
      <div class="viewers" title="En ligne">
        <svg class="eye" viewBox="0 0 24 24">
          <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"></path>
          <circle cx="12" cy="12" r="3"></circle>
        </svg>
        <span id="viewer-count">0</span>
      </div>

      <div class="live">
        <span class="dot"></span>
        <span>En cours</span>
      </div>
    </div>
  </div>
</div>

<script>
  // ====== CONFIG (tu changes ici) ======
  const MATCH = {
    id: "match-demo",
    name: "MATCH EN DIRECT",
    timeText: "Aujourd’hui · 20h45"
  };

  // ⚠️ Mets des sources AUTORISÉES (YouTube embed officiel, HLS/MP4 que tu héberges, etc.)
  const players = {
    1: "https://bolaloca.my/player/4/1", // exemple
    2: "https://bolaloca.my/player/4/1",                   // exemple
    3: "https://bolaloca.my/player/4/1"
  };

  document.getElementById("matchName").textContent = MATCH.name;
  document.getElementById("matchTime").textContent = MATCH.timeText;

  const btns = document.querySelectorAll(".playerBtn");
  let loaded = false;

  function iframeHTML(url){
    return `<iframe id="player" src="${url}" allowfullscreen allow="autoplay; fullscreen; picture-in-picture"></iframe>`;
  }
  function setActive(n){
    btns.forEach(b => b.classList.remove("active"));
    btns[n-1].classList.add("active");
  }
  function loadPlayer(n){
    document.getElementById("playerBox").innerHTML = iframeHTML(players[n]);
    loaded = true;
    setActive(n);
  }
  function setPlayer(n){
    if(!loaded) return loadPlayer(n);
    document.getElementById("player").src = players[n];
    setActive(n);
  }
  document.getElementById("launchBtn").addEventListener("click", () => loadPlayer(1));

  // ====== COMPTEUR LIVE ======
  async function ping(){
    try { await fetch(`/api/ping?match=${encodeURIComponent(MATCH.id)}`, { cache:"no-store" }); } catch(e){}
  }
  async function refreshCount(){
    try{
      const r = await fetch(`/api/online?match=${encodeURIComponent(MATCH.id)}`, { cache:"no-store" });
      const t = await r.text();
      const n = parseInt(t, 10);
      if(!Number.isNaN(n)) document.getElementById("viewer-count").textContent = String(n);
    }catch(e){}
  }
  ping();
  refreshCount();
  setInterval(ping, 8000);
  setInterval(refreshCount, 3000);
</script>

</body>
</html>
