<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IMFTX+ — Live</title>

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<style>
*{box-sizing:border-box}
html,body{margin:0;background:#000;color:#fff;font-family:'Outfit',sans-serif}

header{padding:14px 18px;display:flex;justify-content:space-between;align-items:center}
.brand{font-weight:900;font-size:20px}
.back{opacity:.7;text-decoration:none;color:#fff}

.container{max-width:1200px;margin:0 auto;padding:0 16px 24px}

/* ===== PLAYER ===== */
.playerBox{
  border-radius:22px;overflow:hidden;background:#000;
  border:1px solid rgba(255,255,255,.12);
  box-shadow:0 30px 90px rgba(0,0,0,.75);
  position:relative;
}
.cover{
  width:100%;aspect-ratio:16/9;display:grid;place-items:center;
  background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(0,0,0,.75));
}
.cover button{
  border:1px solid rgba(255,255,255,.18);
  background:rgba(255,255,255,.10);
  color:#fff;padding:14px 18px;border-radius:999px;
  font-weight:800;cursor:pointer;display:flex;align-items:center;gap:10px
}
.cover button:hover{background:rgba(255,255,255,.14)}

.playerFrame{width:100%;aspect-ratio:16/9;border:0;background:#000;display:block}

/* ===== PLAYER SELECT ===== */
.playerSelect{display:flex;gap:10px;margin:14px 0;flex-wrap:wrap}
.playerBtn{
  padding:8px 14px;border-radius:10px;
  border:1px solid rgba(255,255,255,.2);
  background:rgba(255,255,255,.08);
  font-weight:700;cursor:pointer
}
.playerBtn.active{background:#111;border-color:#ef4444;color:#fff}

/* ===== INFO BAR ===== */
.infoBar{
  margin-top:14px;padding:14px 16px;border-radius:16px;
  background:#2a2a2a;display:flex;justify-content:space-between;align-items:center;gap:14px
}
.infoLeft{display:flex;gap:12px;align-items:center}
.leagueLogo{width:36px}
.infoText b{display:block}
.infoText span{font-size:13px;opacity:.7}

.rightBox{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:flex-end}
.live{display:flex;align-items:center;gap:8px;font-weight:800}
.dot{width:10px;height:10px;border-radius:50%;background:#22c55e}

/* ✅ Compteur */
.viewers{
  display:flex;align-items:center;gap:8px;
  font-weight:900;padding:8px 12px;border-radius:999px;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.14)
}
.eye{width:18px;height:18px;fill:#fff;opacity:.9}

@media(max-width:700px){
  .infoBar{flex-direction:column;align-items:flex-start}
  .rightBox{justify-content:flex-start}
}
</style>
</head>

<body>

<header>
  <div class="brand">IMFTX+</div>
  <a href="index.html" class="back">← Retour</a>
</header>

<div class="container">

  <!-- PLAYER -->
  <div class="playerBox" id="playerBox">
    <div class="cover" id="cover">
      <button onclick="loadPlayer(1)"><span style="font-size:18px">▶</span> Lancer le stream</button>
    </div>
  </div>

  <!-- PLAYER BUTTONS -->
  <div class="playerSelect">
    <div class="playerBtn active" onclick="setPlayer(1)">Player 1</div>
    <div class="playerBtn" onclick="setPlayer(2)">Player 2</div>
    <div class="playerBtn" onclick="setPlayer(3)">Player 3</div>
  </div>

  <!-- INFO -->
  <div class="infoBar">
    <div class="infoLeft">
      <img class="leagueLogo"
           src="https://upload.wikimedia.org/wikipedia/fr/thumb/f/fa/Logo_Ligue_1%2B_%28Ic%C3%B4ne%29.svg/960px-Logo_Ligue_1%2B_%28Ic%C3%B4ne%29.svg.png?20250806015730"
           alt="Ligue 1">
      <div class="infoText">
        <b>Vous regardez</b>
        OM - AS MONACO<br>
        <span>Aujourd’hui · 20h45</span>
      </div>
    </div>

    <div class="rightBox">
      <!-- ✅ Compteur live (PHP) -->
      <div class="viewers" id="viewer-counter" title="Spectateurs en ligne">
        <svg class="eye" viewBox="0 0 24 24">
          <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"></path>
          <circle cx="12" cy="12" r="3"></circle>
        </svg>
        <span id="viewer-count">0</span>
      </div>

      <div class="live">
        <span class="dot"></span>
        En cours
      </div>
    </div>
  </div>

</div>

<script>
/* ===== PLAYER (anti popups via sandbox + click load) ===== */
const players = {
  1: "https://bolaloca.my/player/4/20",
  2: "https://bolaloca.my/player/2/20",
  3: "https://bolaloca.my/player/3/20"
};

const buttons = document.querySelectorAll(".playerBtn");
let loaded = false;

function iframeHTML(url){
  return `
    <iframe
      id="player"
      class="playerFrame"
      src="${url}"
      allowfullscreen
      allow="autoplay; fullscreen"
      referrerpolicy="no-referrer"
      loading="lazy"
      sandbox="allow-scripts allow-same-origin allow-forms"
    ></iframe>
  `;
}

function loadPlayer(n){
  document.getElementById("playerBox").innerHTML = iframeHTML(players[n]);
  loaded = true;
  setActive(n);
}

function setPlayer(n){
  if(!loaded){ loadPlayer(n); return; }
  document.getElementById("player").src = players[n];
  setActive(n);
}

function setActive(n){
  buttons.forEach(b => b.classList.remove("active"));
  buttons[n-1].classList.add("active");
}
</script>

<script>
/* ===== ✅ COMPTEUR LIVE (SANS FIREBASE) =====
   - appelé toutes les 3s
   - match_id unique par page
*/

const MATCH_ID = "L1om-ASM"; // <= change ça pour chaque page
const VIEW_URL = `counter.php?match=${encodeURIComponent(MATCH_ID)}`;

async function refreshCount(){
  try{
    const r = await fetch(VIEW_URL, { cache: "no-store" });
    const t = await r.text();
    const n = parseInt(t, 10);
    if(!Number.isNaN(n)){
      document.getElementById("viewer-count").textContent = String(n);
    }
  }catch(e){
    // si erreur, on ne reset pas à 0 (important)
  }
}

// ping régulier
refreshCount();
setInterval(refreshCount, 3000);
</script>

</body>
</html>
