<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>IMFTX+ — Live</title>

  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">

  <style>
    *{box-sizing:border-box}
    html,body{margin:0;background:#000;color:#fff;font-family:'Outfit',system-ui,Arial}
    header{max-width:1200px;margin:0 auto;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
    .brand{font-weight:900}
    .wrap{max-width:1200px;margin:0 auto;padding:0 16px 24px}

    .grid{display:grid;grid-template-columns:1fr 340px;gap:14px;align-items:start}
    @media(max-width:900px){.grid{grid-template-columns:1fr}}

    .card{
      border-radius:18px;overflow:hidden;
      border:1px solid rgba(255,255,255,.12);
      background:linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.03));
      box-shadow:0 30px 90px rgba(0,0,0,.65);
    }

    /* PLAYER */
    .player{background:#000}
    .cover{
      width:100%;aspect-ratio:16/9;
      display:grid;place-items:center;
      background:radial-gradient(800px 420px at 30% 10%, rgba(255,255,255,.10), transparent 55%),
                 linear-gradient(180deg, rgba(255,255,255,.06), rgba(0,0,0,.85));
    }
    .btn{
      border:1px solid rgba(255,255,255,.18);
      background:rgba(255,255,255,.10);
      color:#fff;padding:12px 16px;border-radius:999px;
      font-weight:900;cursor:pointer
    }
    .btn:hover{background:rgba(255,255,255,.14)}
    iframe{width:100%;aspect-ratio:16/9;border:0;display:block;background:#000}

    .tabs{display:flex;gap:10px;padding:12px;flex-wrap:wrap}
    .tab{
      padding:10px 14px;border-radius:12px;
      border:1px solid rgba(255,255,255,.18);
      background:rgba(255,255,255,.08);
      font-weight:900;cursor:pointer
    }
    .tab.active{background:#fff;color:#000;border-color:#fff}

    /* CHAT */
    .chatHead{padding:12px;border-bottom:1px solid rgba(255,255,255,.10);display:flex;justify-content:space-between;align-items:center;background:rgba(0,0,0,.22)}
    .pill{display:inline-flex;gap:8px;align-items:center;font-size:12px;font-weight:900;padding:6px 10px;border-radius:999px;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.14)}
    .dot{width:9px;height:9px;border-radius:50%;background:#22c55e}
    .msgs{height:520px;overflow:auto;padding:12px}
    @media(max-width:900px){.msgs{height:360px}}
    .msg{padding:10px;border-radius:14px;background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.10);margin:0 0 10px}
    .top{display:flex;gap:8px;align-items:baseline;margin-bottom:6px;flex-wrap:wrap}
    .user{font-weight:900}
    .time{opacity:.65;font-size:12px}
    .text{opacity:.92;white-space:pre-wrap;word-break:break-word}

    .form{padding:12px;border-top:1px solid rgba(255,255,255,.10);background:rgba(0,0,0,.22);display:grid;gap:10px}
    .row{display:flex;gap:10px}
    input{
      width:100%;padding:10px 12px;border-radius:12px;
      border:1px solid rgba(255,255,255,.16);
      background:rgba(0,0,0,.35);color:#fff;outline:none
    }
    input::placeholder{color:rgba(255,255,255,.45)}
    .send{background:#fff;color:#000;font-weight:900}
    .note{font-size:11px;opacity:.55}
  </style>
</head>

<body>
<header>
  <div class="brand">IMFTX+</div>
  <div style="opacity:.7">Live</div>
</header>

<div class="wrap">
  <div class="grid">

    <!-- STREAM -->
    <div class="card">
      <div class="player" id="playerBox">
        <div class="cover">
          <button class="btn" id="launch">▶ Lancer le stream</button>
        </div>
      </div>

      <div class="tabs">
        <button class="tab active" onclick="setPlayer(1)">Player 1</button>
        <button class="tab" onclick="setPlayer(2)">Player 2</button>
        <button class="tab" onclick="setPlayer(3)">Player 3</button>
      </div>
    </div>

    <!-- CHAT -->
    <aside class="card">
      <div class="chatHead">
        <b>Chat en direct</b>
        <span class="pill"><span class="dot"></span><span id="online">—</span></span>
      </div>

      <div class="msgs" id="msgs"></div>

      <form class="form" id="form">
        <input id="name" maxlength="16" placeholder="Pseudo" />
        <div class="row">
          <input id="text" maxlength="180" placeholder="Ton message..." />
          <button class="btn send" type="submit">Envoyer</button>
        </div>
        <div class="note">Anti-spam activé.</div>
      </form>
    </aside>

  </div>
</div>

<script>
/* ===== CONFIG =====
   IMPORTANT: mets ici tes URLs AUTORISÉES
*/
const MATCH_ID = "live-demo";
const PLAYERS = {
  1: "https://bolaloca.my/player/4/1",
  2: "https://bolaloca.my/player/4/1",
  3: "https://bolaloca.my/player/4/1"
};

let loaded = false;

function iframeHTML(url){
  return `<iframe id="player" src="${url}" allowfullscreen allow="autoplay; fullscreen" loading="lazy"></iframe>`;
}

function load(n){
  document.getElementById("playerBox").innerHTML = iframeHTML(PLAYERS[n]);
  loaded = true;
  setActive(n);
}
function setActive(n){
  document.querySelectorAll(".tab").forEach((b,i)=>b.classList.toggle("active", i===n-1));
}
window.setPlayer = (n) => {
  if(!loaded) return load(n);
  document.getElementById("player").src = PLAYERS[n];
  setActive(n);
};
document.getElementById("launch").addEventListener("click", ()=>load(1));

/* ===== CHAT (PHP) ===== */
const UID_KEY = "imftx_uid";
function uid(){
  let x = localStorage.getItem(UID_KEY);
  if(!x){ x = "u"+Math.random().toString(16).slice(2)+Date.now().toString(16); localStorage.setItem(UID_KEY,x); }
  return x;
}
const UID = uid();

const msgsEl = document.getElementById("msgs");
const onlineEl = document.getElementById("online");
const form = document.getElementById("form");
const nameEl = document.getElementById("name");
const textEl = document.getElementById("text");

nameEl.value = localStorage.getItem("imftx_name") || "";

const READ = `chat/chat_read.php?match=${encodeURIComponent(MATCH_ID)}`;
const PING = `chat/chat_ping.php?match=${encodeURIComponent(MATCH_ID)}&id=${encodeURIComponent(UID)}`;
const SEND = `chat/chat_send.php`;

function esc(s){return (s||"").replace(/[&<>"']/g,m=>({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[m]));}
let lastN = -1;

function render(list){
  if(!Array.isArray(list)) return;
  if(list.length===lastN) return;
  lastN = list.length;

  msgsEl.innerHTML = list.map(m=>{
    const d = new Date((m.ts||0)*1000);
    const hh = String(d.getHours()).padStart(2,"0");
    const mm = String(d.getMinutes()).padStart(2,"0");
    return `<div class="msg">
      <div class="top"><span class="user">${esc(m.name)}</span><span class="time">${hh}:${mm}</span></div>
      <div class="text">${esc(m.text)}</div>
    </div>`;
  }).join("");
  msgsEl.scrollTop = msgsEl.scrollHeight;
}

async function ping(){ try{ await fetch(PING,{cache:"no-store"}); }catch(e){} }
async function read(){
  try{
    const r = await fetch(READ,{cache:"no-store"});
    const j = await r.json();
    if(j && j.ok){
      onlineEl.textContent = j.online ?? "—";
      render(j.messages||[]);
    }
  }catch(e){}
}

form.addEventListener("submit", async (e)=>{
  e.preventDefault();
  const name = (nameEl.value||"").trim();
  const text = (textEl.value||"").trim();
  if(!name || !text) return;

  localStorage.setItem("imftx_name", name);

  const fd = new FormData();
  fd.append("match", MATCH_ID);
  fd.append("uid", UID);
  fd.append("name", name);
  fd.append("text", text);

  try{
    const r = await fetch(SEND,{method:"POST",body:fd});
    const j = await r.json();
    if(j && j.ok){
      textEl.value="";
      await read();
    }
  }catch(e){}
});

ping(); read();
setInterval(ping, 5000);
setInterval(read, 1500);
</script>
</body>
</html>
