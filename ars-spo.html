<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Player</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #000;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    .player-wrap {
      position: relative;
      width: 100%;
      height: 100vh;
      background: #000;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }
  </style>
</head>
<body>
  <div class="player-wrap">
    <iframe
      src="https://embedsports.top/embed/admin/ppv-lens-vs-toulouse/1"
      allowfullscreen
      allow="autoplay; fullscreen; picture-in-picture"
      referrerpolicy="no-referrer"
      loading="eager"
    ></iframe>
  </div>

  <script>
    (function () {
      'use strict';

      const blocked = [
        'mynqel69dc.com',
        'adexchangeclear.com',
        'adexchangeclear.com/script/i.php'
      ];

      function isBlocked(url) {
        try {
          const u = new URL(url, location.href);
          return blocked.some(x =>
            u.href.includes(x) ||
            u.hostname === x ||
            u.hostname.endsWith('.' + x)
          );
        } catch {
          return blocked.some(x => String(url || '').includes(x));
        }
      }

      // bloque window.open
      const realOpen = window.open;
      window.open = function (...args) {
        const url = args[0];
        if (url && isBlocked(url)) {
          console.log('[blocked popup]', url);
          return null;
        }
        return realOpen.apply(this, args);
      };

      // bloque redirections JS
      const realAssign = window.location.assign.bind(window.location);
      const realReplace = window.location.replace.bind(window.location);

      window.location.assign = function (url) {
        if (isBlocked(url)) {
          console.log('[blocked assign]', url);
          return;
        }
        return realAssign(url);
      };

      window.location.replace = function (url) {
        if (isBlocked(url)) {
          console.log('[blocked replace]', url);
          return;
        }
        return realReplace(url);
      };

      // bloque clics suspects
      document.addEventListener('click', function (e) {
        const el = e.target.closest('a, button, div');
        if (!el) return;

        const href = el.href || el.getAttribute?.('href') || '';
        const onclick = el.getAttribute?.('onclick') || '';

        if (isBlocked(href) || blocked.some(x => onclick.includes(x))) {
          e.preventDefault();
          e.stopPropagation();
          e.stopImmediatePropagation();
          console.log('[blocked click]', href || onclick);
        }
      }, true);

      // supprime scripts et iframes pub injectés
      function clean(node) {
        if (!node || node.nodeType !== 1) return;

        if (node.tagName === 'SCRIPT') {
          const src = node.src || '';
          const txt = node.textContent || '';
          if (isBlocked(src) || blocked.some(x => txt.includes(x))) {
            console.log('[removed script]', src || '[inline]');
            node.remove();
          }
        }

        if (node.tagName === 'IFRAME') {
          const src = node.src || '';

          // on ne supprime pas ton iframe principal
          if (node === document.querySelector('.player-wrap iframe')) return;

          if (isBlocked(src)) {
            console.log('[removed iframe]', src);
            node.remove();
          }
        }
      }

      new MutationObserver((mutations) => {
        for (const m of mutations) {
          for (const n of m.addedNodes) {
            clean(n);
            n.querySelectorAll?.('script, iframe').forEach(clean);
          }
        }
      }).observe(document.documentElement, {
        childList: true,
        subtree: true
      });

      document.querySelectorAll('script, iframe').forEach(clean);
    })();
  </script>
</body>
</html>
