<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Player mobile</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    .player-wrap {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #000;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #000;
    }
  </style>
</head>
<body>
  <div class="player-wrap">
    <iframe
      id="playerFrame"
      src="https://sportsembed.su/embed/4463877/lens-toulouse/hd/1"
      allowfullscreen
      allow="autoplay; fullscreen; picture-in-picture"
      referrerpolicy="no-referrer"
      loading="eager"
    ></iframe>
  </div>

  <script>
    (function () {
      'use strict';

      const isPhone =
        /Android|iPhone|iPod|Mobile|Opera Mini|IEMobile/i.test(navigator.userAgent) ||
        window.innerWidth <= 900;

      if (!isPhone) return;

      const blocked = [
        'mynqel69dc.com',
        'adexchangeclear.com',
        'adexchangeclear.com/script/i.php'
      ];

      function isBlocked(url) {
        try {
          const u = new URL(url, location.href);
          return blocked.some(x =>
            u.href.includes(x) ||
            u.hostname === x ||
            u.hostname.endsWith('.' + x)
          );
        } catch {
          return blocked.some(x => String(url || '').includes(x));
        }
      }

      // bloque les popups / tabover
      const realOpen = window.open;
      window.open = function (...args) {
        const url = args[0];
        if (!url || isBlocked(url)) {
          console.log('[mobile anti-popup] blocked window.open:', url);
          return null;
        }
        return realOpen.apply(this, args);
      };

      // bloque les redirections vers les pubs connues
      const realAssign = window.location.assign.bind(window.location);
      const realReplace = window.location.replace.bind(window.location);

      window.location.assign = function (url) {
        if (!url || isBlocked(url)) {
          console.log('[mobile anti-popup] blocked assign:', url);
          return;
        }
        return realAssign(url);
      };

      window.location.replace = function (url) {
        if (!url || isBlocked(url)) {
          console.log('[mobile anti-popup] blocked replace:', url);
          return;
        }
        return realReplace(url);
      };

      // bloque clics / touch vers pubs connues
      function guardClick(e) {
        const el = e.target.closest('a, button, div, span');
        if (!el) return;

        const href = el.href || el.getAttribute?.('href') || '';
        const onclick = el.getAttribute?.('onclick') || '';
        const dataUrl = el.getAttribute?.('data-url') || '';

        if (
          isBlocked(href) ||
          isBlocked(dataUrl) ||
          blocked.some(x => onclick.includes(x))
        ) {
          e.preventDefault();
          e.stopPropagation();
          e.stopImmediatePropagation();
          console.log('[mobile anti-popup] blocked click');
          return false;
        }
      }

      document.addEventListener('click', guardClick, true);
      document.addEventListener('touchstart', guardClick, true);
      document.addEventListener('touchend', guardClick, true);

      // enlève scripts / iframes pub injectés
      function clean(node) {
        if (!node || node.nodeType !== 1) return;

        if (node.tagName === 'SCRIPT') {
          const src = node.src || '';
          const txt = node.textContent || '';
          if (isBlocked(src) || blocked.some(x => txt.includes(x))) {
            console.log('[mobile anti-popup] removed script:', src || '[inline]');
            node.remove();
          }
        }

        if (node.tagName === 'IFRAME') {
          const src = node.src || '';
          if (node.id === 'playerFrame') return;
          if (isBlocked(src)) {
            console.log('[mobile anti-popup] removed iframe:', src);
            node.remove();
          }
        }

        // retire overlays pub plein écran
        try {
          const style = getComputedStyle(node);
          const rect = node.getBoundingClientRect();
          const z = parseInt(style.zIndex || '0', 10);

          if (
            style.position === 'fixed' &&
            z >= 999 &&
            rect.width >= window.innerWidth * 0.7 &&
            rect.height >= window.innerHeight * 0.4
          ) {
            node.remove();
            console.log('[mobile anti-popup] removed overlay');
          }
        } catch {}
      }

      new MutationObserver((mutations) => {
        for (const m of mutations) {
          for (const n of m.addedNodes) {
            clean(n);
            n.querySelectorAll?.('script, iframe, div, section, aside').forEach(clean);
          }
        }
      }).observe(document.documentElement, {
        childList: true,
        subtree: true
      });

      document.querySelectorAll('script, iframe, div, section, aside').forEach(clean);

      // petit hardening mobile
      window.addEventListener('beforeunload', function (e) {
        if (document.activeElement && document.activeElement.tagName === 'IFRAME') {
          e.preventDefault();
          e.returnValue = '';
        }
      });
    })();
  </script>
</body>
</html>
