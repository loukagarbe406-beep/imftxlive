<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Player</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    #wrap {
      position: fixed;
      inset: 0;
      background: #000;
    }
    #player {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }
  </style>
</head>
<body>
  <div id="wrap">
    <iframe
      id="player"
      src="https://sportsembed.su/embed/4463877/lens-toulouse/hd/1"
      allowfullscreen
      allow="autoplay; fullscreen; picture-in-picture"
      referrerpolicy="no-referrer"
    ></iframe>
  </div>

  <script>
    (function () {
      'use strict';

      const blockedHosts = [
        'mynqel69dc.com',
        'adexchangeclear.com'
      ];

      function isBlocked(url) {
        try {
          const u = new URL(url, location.href);
          return blockedHosts.some(h =>
            u.hostname === h ||
            u.hostname.endsWith('.' + h) ||
            u.href.includes('/script/i.php')
          );
        } catch {
          const s = String(url || '');
          return blockedHosts.some(h => s.includes(h)) || s.includes('/script/i.php');
        }
      }

      // Bloque toute nouvelle fenêtre
      const noop = () => null;
      try { window.open = noop; } catch {}
      try { parent.open = noop; } catch {}
      try { top.open = noop; } catch {}

      // Bloque remplacements connus
      const realAssign = location.assign.bind(location);
      const realReplace = location.replace.bind(location);

      location.assign = function (url) {
        if (!url || isBlocked(url)) return;
        return realAssign(url);
      };

      location.replace = function (url) {
        if (!url || isBlocked(url)) return;
        return realReplace(url);
      };

      // Bloque clics sortants sur la page parente
      function stopNav(e) {
        const el = e.target.closest('a, area, button, [onclick]');
        if (!el) return;

        const href = el.href || el.getAttribute?.('href') || '';
        const onclick = el.getAttribute?.('onclick') || '';
        const target = el.getAttribute?.('target') || '';

        if (
          target === '_blank' ||
          isBlocked(href) ||
          blockedHosts.some(h => onclick.includes(h)) ||
          onclick.includes('window.open')
        ) {
          e.preventDefault();
          e.stopPropagation();
          e.stopImmediatePropagation();
          return false;
        }
      }

      document.addEventListener('click', stopNav, true);
      document.addEventListener('mousedown', stopNav, true);
      document.addEventListener('mouseup', stopNav, true);
      document.addEventListener('touchstart', stopNav, true);
      document.addEventListener('touchend', stopNav, true);

      // Supprime pubs injectées
      function clean(node) {
        if (!node || node.nodeType !== 1) return;

        if (node.id === 'player') return;

        if (node.tagName === 'SCRIPT') {
          const src = node.src || '';
          const txt = node.textContent || '';
          if (isBlocked(src) || blockedHosts.some(h => txt.includes(h)) || txt.includes('/script/i.php')) {
            node.remove();
            return;
          }
        }

        if (node.tagName === 'IFRAME') {
          const src = node.src || '';
          if (node.id !== 'player' && isBlocked(src)) {
            node.remove();
            return;
          }
        }

        try {
          const style = getComputedStyle(node);
          const rect = node.getBoundingClientRect();
          const z = parseInt(style.zIndex || '0', 10);

          if (
            style.position === 'fixed' &&
            z >= 999 &&
            rect.width > innerWidth * 0.6 &&
            rect.height > innerHeight * 0.3
          ) {
            node.remove();
          }
        } catch {}
      }

      new MutationObserver((mutations) => {
        for (const m of mutations) {
          for (const n of m.addedNodes) {
            clean(n);
            n.querySelectorAll?.('script, iframe, div, section, aside').forEach(clean);
          }
        }
      }).observe(document.documentElement, {
        childList: true,
        subtree: true
      });

      document.querySelectorAll('script, iframe, div, section, aside').forEach(clean);

      // Reviens à la page si un tabover essaie de te sortir
      let lastUrl = location.href;
      setInterval(() => {
        if (location.href !== lastUrl && isBlocked(location.href)) {
          history.pushState(null, '', lastUrl);
        } else {
          lastUrl = location.href;
        }
      }, 300);
    })();
  </script>
</body>
</html>
