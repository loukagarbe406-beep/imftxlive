<div style="position: relative; width: 800px; height: 450px; background: #000;">

    <iframe 
        src="https://sportsembed.su/embed/401856594/cameroon-china/easy/1?player=jwplayer" 
        style="width: 100%; height: 100%; border: none;" 
        allowfullscreen>
    </iframe>

    <a href="javascript:void(0)" 
       id="blocker"
       style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2147483647; cursor: pointer; background: rgba(0,0,0,0);">
    </a>

</div>

<script>
    const blocker = document.getElementById('blocker');

    // On neutralise tous les types d'événements que les pubs utilisent
    ['click', 'mousedown', 'mouseup', 'touchstart'].forEach(evt => {
        blocker.addEventListener(evt, function(e) {
            e.preventDefault();
            e.stopPropagation();
            
            console.log("Tentative de pub bloquée sur : " + evt);

            // On retire le bloqueur une fraction de seconde pour laisser passer 
            // le clic vers le bouton PLAY, puis on le remet instantanément
            blocker.style.display = 'none';
            setTimeout(() => {
                blocker.style.display = 'block';
            }, 300); 
        }, true);
    });
</script>
