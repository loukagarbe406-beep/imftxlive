<div id="video-wrapper" style="position:relative; width:800px; height:450px;">
    
    <iframe 
        id="player-frame"
        src="https://sportsembed.su/embed/401856594/cameroon-china/easy/1?player=jwplayer" 
        style="width:100%; height:100%; border:none;" 
        allowfullscreen>
    </iframe>

    <a href="javascript:void(0)" 
       id="shield"
       onclick="neutralize(event)"
       style="position:absolute; top:0; left:0; width:100%; height:100%; z-index:999; background:transparent;">
    </a>
</div>

<script>
function neutralize(e) {
    // 1. On bloque l'action par défaut du navigateur
    e.preventDefault();
    // 2. On empêche le clic de "traverser" vers l'iframe pour le moment
    e.stopPropagation();
    
    console.log("Clic intercepté : Pop-up bloquée.");

    // 3. On désactive temporairement le bouclier pour te laisser cliquer sur PLAY
    const shield = document.getElementById('shield');
    shield.style.pointerEvents = 'none'; 

    // 4. On remet le bouclier après 2 secondes pour bloquer les pubs suivantes
    setTimeout(() => {
        shield.style.pointerEvents = 'auto';
        console.log("Bouclier réactivé.");
    }, 2000);
}
</script>
