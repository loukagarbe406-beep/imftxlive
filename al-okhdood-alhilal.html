<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>IMFTX+ — Al-Okhdood - Al Hilal</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

  <style>
    html, body { height: 100%; margin: 0; }
    body{
      font-family: 'Outfit', system-ui, -apple-system, "Segoe UI", Roboto, Arial;
      color:#fff;
      overflow-x:hidden;
      background:#0f1012;
    }

    .glass{
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.08);
      box-shadow: 0 30px 120px rgba(0,0,0,.75);
      backdrop-filter: blur(14px);
    }

    .player-box{
      border-radius:20px;
      overflow:hidden;
      position:relative;
    }
    iframe{ width:100%; height:100%; border:0; background:#000; display:block; }

    .cover{
      position:absolute;
      inset:0;
      z-index:15;
      cursor:pointer;
      background:
        linear-gradient(180deg, rgba(0,0,0,.15) 0%, rgba(0,0,0,.45) 55%, rgba(0,0,0,.75) 100%),
        url("https://empire-sport.online/upload/events/awravwrqxvfdpnammrujn6ydodfpbs.jpg") center/cover no-repeat;
    }

    .cover-top{
      position:absolute;
      top:16px;
      left:16px;
      display:flex;
      align-items:center;
      gap:10px;
      padding:10px 12px;
      border-radius:16px;
      background:rgba(0,0,0,.45);
      border:1px solid rgba(255,255,255,.12);
      backdrop-filter: blur(14px);
    }
    .team-logo{
      width:34px;height:34px;
      object-fit:contain;
      filter: drop-shadow(0 8px 18px rgba(0,0,0,.8));
    }
    .vs{ font-weight:900; font-size:14px; opacity:.9; }

    .cover-strip{
      position:absolute;
      left:16px;
      right:16px;
      bottom:16px;
      height:80px;
      border-radius:18px;
      background:rgba(0,0,0,.45);
      border:1px solid rgba(255,255,255,.12);
      backdrop-filter: blur(16px);
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:0 18px;
    }
    .strip-title{ font-size:16px; font-weight:900; line-height:1; }
    .strip-sub{ font-size:14px; opacity:.85; font-weight:600; font-style:italic; margin-top:4px; line-height:1.1; }
    .strip-play{
      width:46px;height:46px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.18);
      display:grid;
      place-items:center;
      background:rgba(255,255,255,.12);
      transition:.2s;
    }
    .strip-play:hover{ transform:scale(1.06); background:rgba(255,255,255,.16); }

    .pill{
      position:absolute;
      top:16px;
      right:16px;
      padding:7px 12px;
      border-radius:999px;
      background:rgba(0,0,0,.55);
      border:1px solid rgba(255,255,255,.12);
      font-weight:900;
      font-size:12px;
      display:flex;
      align-items:center;
      gap:8px;
      backdrop-filter: blur(14px);
    }
    .dot{
      width:7px;height:7px;border-radius:999px;background:#f59e0b;
      box-shadow:0 0 0 4px rgba(245,158,11,.12);
    }

    .source-btn{
      height:42px;
      border-radius:12px;
      font-weight:900;
      font-size:13px;
      transition:.2s;
    }
    .source-btn.active{ background:#fff; color:#000; }
    .source-btn.inactive{
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.08);
      color:#fff;
    }

    .watch-bar{
      border-radius:16px;
      padding:14px 16px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:14px;
    }
    .watch-left{ display:flex; align-items:center; gap:12px; min-width:0; }
    .watch-left img{ width:36px; height:36px; object-fit:contain; filter: drop-shadow(0 6px 12px rgba(0,0,0,.75)); }
    .watch-text{ min-width:0; line-height:1.1; }
    .watch-text .small{ opacity:.75; font-weight:700; font-size:13px; }
    .watch-text .big{ font-weight:900; font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .channel-logo{ width:92px; height:auto; object-fit:contain; filter: drop-shadow(0 6px 12px rgba(0,0,0,.75)); }

    .chat-box{
      border-radius:20px;
      overflow:hidden;
      min-height:520px;
    }
    .chat-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:12px 14px;
      border-bottom:1px solid rgba(255,255,255,.08);
    }
    .chat-head .title{ font-weight:900; }
    .chat-head .sub{ font-size:12px; opacity:.7; font-weight:700; }

    @media (max-width: 1024px){
      .chat-box{ min-height:420px; }
    }

    /* ✅ AJOUT: bouton plein écran */
    .fs-btn{
      position:absolute;
      right:14px;
      bottom:14px;
      z-index:60;
      height:44px;
      padding:0 14px;
      border-radius:16px;
      display:inline-flex;
      align-items:center;
      gap:10px;
      font-weight:900;
      font-size:13px;
      background:rgba(0,0,0,.45);
      border:1px solid rgba(255,255,255,.16);
      backdrop-filter: blur(14px);
      transition:.15s;
      user-select:none;
    }
    .fs-btn:hover{ transform:scale(1.02); }
    .fs-btn:active{ transform:scale(.98); }

    /* ✅ AJOUT: fallback “fake fullscreen” (iPhone/iPad notamment) */
    .fake-fullscreen{
      position:fixed !important;
      inset:0 !important;
      width:100vw !important;
      height:100vh !important;
      z-index:99999 !important;
      border-radius:0 !important;
      margin:0 !important;
    }
    .fake-fullscreen iframe{
      width:100% !important;
      height:100% !important;
    }
  </style>
</head>

<body>

  <nav class="sticky top-0 z-40 bg-black/30 backdrop-blur-xl border-b border-white/5">
    <div class="max-w-screen-2xl mx-auto px-6 py-3 flex items-center justify-between">
      <div class="text-2xl md:text-3xl font-extrabold tracking-tight">IMFTX+</div>
      <a href="index.html"
         class="inline-flex items-center gap-2 px-4 h-10 rounded-full bg-white/10 border border-white/10 hover:bg-white/15 font-bold text-sm active:scale-95 transition">
        <i class="fa-solid fa-arrow-left"></i> Retour
      </a>
    </div>
  </nav>

  <main class="max-w-screen-2xl mx-auto px-6 py-8">
    <section class="grid grid-cols-1 lg:grid-cols-[1fr_420px] gap-6">

      <!-- PLAYER -->
      <div>
        <div class="player-box glass w-full aspect-video" id="playerBox">
          <div id="cover" class="cover" onclick="loadVideo(1)">
            <div class="pill"><span class="dot"></span>21:00</div>

            <div class="cover-top">
              <img class="team-logo" src="https://empire-sport.online/upload/teams/jr13o69kszvagqo5ldwijwiqzutdkm.png" alt="Al-Okhdood">
              <span class="vs">VS</span>
              <img class="team-logo" src="https://empire-sport.online/upload/teams/tiktjuihr7d8begzdbo5lmnmt1hmdf.png" alt="Al Hilal">
            </div>

            <div class="cover-strip">
              <div>
                <div class="strip-title">Regarder Gratuitement</div>
                <div class="strip-sub">Al-Okhdood<br>Al Hilal</div>
              </div>
              <div class="strip-play"><i class="fa-solid fa-play"></i></div>
            </div>
          </div>

          <div id="videoTarget" class="w-full h-full"></div>

          <!-- ✅ AJOUT: BOUTON PLEIN ÉCRAN (ne touche pas au stream) -->
          <button id="fsBtn" class="fs-btn" type="button" aria-label="Plein écran">
            <i id="fsIcon" class="fa-solid fa-expand"></i>
            Plein écran
          </button>
        </div>

        <!-- SOURCES -->
        <div class="mt-4 flex flex-wrap gap-3">
          <button id="btn1" onclick="loadVideo(1)" class="source-btn active px-6">Source 1</button>
          <button id="btn2" onclick="loadVideo(2)" class="source-btn inactive px-6">Source 2</button>
          <button id="btn3" onclick="loadVideo(3)" class="source-btn inactive px-6">Source 3</button>
        </div>

        <!-- VOUS REGARDEZ -->
        <div class="mt-5 watch-bar glass">
          <div class="watch-left">
            <img src="https://empire-sport.online/upload/leagues/zt4mb7gnlrgn2drjplitpx3e7xwdsf.png" alt="Compétition">
            <div class="watch-text">
              <div class="small">Vous regardez</div>
              <div class="big">Al-Okhdood — Al Hilal</div>
              <div class="small">Match · 21:00</div>
            </div>
          </div>
          <img class="channel-logo" src="https://empire-sport.online/upload/chaines/bd5lunnknhdwfqznkxxyhtqrresyy9.png" alt="Chaîne">
        </div>
      </div>

      <!-- CHAT -->
      <aside class="chat-box glass">
        <div class="chat-head">
          <div>
            <div class="title">Chat en direct</div>
            <div class="sub">Twitch — thestreameast</div>
          </div>
          <a class="text-xs font-extrabold px-3 h-9 inline-flex items-center rounded-full bg-white/10 border border-white/10 hover:bg-white/15"
             href="https://www.twitch.tv/popout/thestreameast/chat?popout="
             target="_blank" rel="noreferrer">
            Ouvrir
          </a>
        </div>

        <div style="height: calc(100% - 54px); min-height: 520px;">
          <iframe id="chatFrame" src=""></iframe>
        </div>
      </aside>

    </section>
  </main>

  <script>
    // STREAM EMBED (HTTPS)
    const SOURCES = {
      1: "https://embedsports.top/embed/echo/premier-league-darts-newcastle-darts-1/1",
      2: "https://dovkembed.pw/channel/BeINSport1[France]",
      3: "#"
    };

    // TWITCH CHAT EMBED (parent auto)
    (function(){
      const parentDomain = window.location.hostname;
      document.getElementById("chatFrame").src =
        `https://www.twitch.tv/embed/thestreameast/chat?darkpopout&parent=${encodeURIComponent(parentDomain)}`;
    })();

    function setActive(id){
      [1,2,3].forEach(n=>{
        const b = document.getElementById("btn"+n);
        b.className = (n===id) ? "source-btn active px-6" : "source-btn inactive px-6";
      });
    }

    function loadVideo(id){
      const cover = document.getElementById("cover");
      if(cover) cover.style.display = "none";

      setActive(id);

      const target = document.getElementById("videoTarget");

      if(!SOURCES[id] || SOURCES[id] === "#"){
        target.innerHTML = `
          <div class="w-full h-full grid place-items-center text-white/70 font-extrabold">
            Source indisponible
          </div>`;
        return;
      }

      target.innerHTML = `
        <iframe
          id="streamFrame"
          src="${SOURCES[id]}"
          allowfullscreen
          scrolling="no"
          frameborder="0"
          allow="autoplay; fullscreen; picture-in-picture"
          referrerpolicy="no-referrer-when-downgrade">
        </iframe>
      `;
    }

    /* ✅ AJOUT: Plein écran (PC/Android) + fallback iOS */
    (function(){
      const box  = document.getElementById("playerBox");
      const btn  = document.getElementById("fsBtn");
      const icon = document.getElementById("fsIcon");

      if(!box || !btn || !icon) return;

      function isNativeFs(){
        return document.fullscreenElement || document.webkitFullscreenElement;
      }

      function setBtnState(on){
        icon.className = on ? "fa-solid fa-compress" : "fa-solid fa-expand";
        btn.lastChild.nodeValue = on ? " Quitter" : " Plein écran";
      }

      async function enterFs(){
        // 1) True fullscreen API
        try{
          const req = box.requestFullscreen || box.webkitRequestFullscreen;
          if(req){
            await req.call(box);
            setBtnState(true);
            return;
          }
        }catch(e){}

        // 2) Fallback iOS (fake fullscreen)
        box.classList.add("fake-fullscreen");
        setBtnState(true);
      }

      async function exitFs(){
        // Quitte vrai fullscreen si actif
        try{
          const exit = document.exitFullscreen || document.webkitExitFullscreen;
          if(exit && isNativeFs()){
            await exit.call(document);
          }
        }catch(e){}

        // Quitte fallback
        box.classList.remove("fake-fullscreen");
        setBtnState(false);
      }

      btn.addEventListener("click", (e) => {
        e.preventDefault();
        e.stopPropagation();

        const fakeOn = box.classList.contains("fake-fullscreen");
        if(isNativeFs() || fakeOn) exitFs();
        else enterFs();
      });

      document.addEventListener("fullscreenchange", () => {
        if(isNativeFs()) setBtnState(true);
        else if(!box.classList.contains("fake-fullscreen")) setBtnState(false);
      });
    })();
  </script>

</body>
</html>
