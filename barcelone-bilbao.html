<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IMFTX+ — Barcelone vs Bilbao</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

  <style>
    html,body{
      height:100%;margin:0;
      font-family:'Outfit',system-ui,-apple-system,"Segoe UI",Roboto,Arial;
      background:#070708;
      color:#fff;
    }

    .player-wrap{
      border-radius:18px;
      overflow:hidden;
      border:1px solid rgba(255,255,255,.10);
      background:#000;
      box-shadow:0 25px 90px rgba(0,0,0,.75);
    }

    iframe{width:100%;height:100%;border:0;background:#000;display:block}

    .src-btn{
      height:46px;
      border-radius:10px;
      font-weight:900;
      font-size:14px;
      transition:.15s;
      border:1px solid rgba(255,255,255,.10);
    }

    .src-btn.active{
      background:#fff;
      color:#000;
    }

    .src-btn:not(.active){
      background:rgba(255,255,255,.07);
      color:#fff;
    }

    .src-btn:not(.active):hover{
      background:rgba(255,255,255,.12);
    }

    /* ✅ "Vous regardez" bar */
    .watch-bar{
      margin-top:14px;
      border-radius:16px;
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.10);
      padding:14px 18px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:14px;
    }

    .pill-time{
      display:flex;
      align-items:center;
      gap:10px;
      padding:8px 14px;
      border-radius:999px;
      background:rgba(0,0,0,.40);
      border:1px solid rgba(255,255,255,.10);
      font-weight:900;
      font-size:14px;
    }
    .dot{
      width:10px;height:10px;border-radius:50%;
      background:#f59e0b;
      box-shadow:0 0 12px rgba(245,158,11,.8);
    }

    .canal{
      padding:6px 10px;
      border-radius:8px;
      font-weight:900;
      font-size:12px;
      background:#000;
      border:1px solid rgba(255,255,255,.12);
      display:flex;
      align-items:center;
      gap:6px;
    }
    .canal span{
      background:#22c55e;
      color:#000;
      padding:2px 6px;
      border-radius:6px;
      font-weight:900;
      font-size:10px;
      letter-spacing:.03em;
    }
  </style>
</head>

<body>

<!-- ✅ NAV -->
<nav class="sticky top-0 z-40 bg-black/20 backdrop-blur-xl border-b border-white/5">
  <div class="max-w-screen-xl mx-auto px-6 py-3 flex items-center justify-between">
    <div class="text-2xl font-extrabold tracking-tight">IMFTX+</div>

    <a href="index.html"
       class="inline-flex items-center gap-2 px-4 h-10 rounded-full bg-white/10 border border-white/10 hover:bg-white/15 font-bold text-sm">
      <i class="fa-solid fa-arrow-left"></i> Retour
    </a>
  </div>
</nav>

<main class="max-w-screen-xl mx-auto px-6 py-10">

  <!-- ✅ PLAYER -->
  <section class="player-wrap w-full aspect-video relative">

    <!-- overlay launch -->
    <div id="overlay" class="absolute inset-0 z-10 flex flex-col items-center justify-center bg-black/80">
      <button onclick="loadVideo(1)"
              class="px-10 py-4 rounded-full bg-amber-400 text-black font-extrabold text-lg hover:opacity-90">
        ▶ LANCER LE STREAM
      </button>
      <p class="mt-4 text-white/55 font-semibold text-sm">
        Si Source 1 bug → essaye Source 2 ou Source 3
      </p>
    </div>

    <div id="videoTarget" class="w-full h-full"></div>
  </section>

  <!-- ✅ SOURCES -->
  <section class="mt-4 grid grid-cols-3 gap-3">
    <button id="btn1" onclick="loadVideo(1)" class="src-btn active">Source 1</button>
    <button id="btn2" onclick="loadVideo(2)" class="src-btn">Source 2</button>
    <button id="btn3" onclick="loadVideo(3)" class="src-btn">Source 3</button>
  </section>

  <!-- ✅ "Vous regardez" bar -->
  <div class="watch-bar">
    <div class="flex items-center gap-3">
      <img class="w-8 h-8 object-contain opacity-90"
           src="https://upload.wikimedia.org/wikipedia/commons/thumb/0/0f/LaLiga_logo_2023.svg/1024px-LaLiga_logo_2023.svg.png"
           alt="LaLiga">

      <div class="leading-tight">
        <div class="text-white/70 font-semibold text-sm">Vous regardez</div>
        <div class="text-lg font-extrabold">Barcelone - Bilbao</div>
        <div class="text-white/60 text-sm font-semibold">Aujourd’hui · 20:00</div>
      </div>
    </div>

    <div class="flex items-center gap-3">
      <div class="pill-time">
        <span class="dot"></span>
        <span id="timer">0h 00m 00s</span>
      </div>

      <div class="canal">
        CANAL+ <span>FOOT</span>
      </div>
    </div>
  </div>

</main>

<!-- ✅ PLAYER SCRIPT (NE CHANGE PAS) -->
<script>
  const SOURCES = {
    1: "https://bolaloca.my/player/4/2",
    2: "https://bolaloca.my/player/2/2",
    3: "https://bolaloca.my/player/3/2"
  };

  function setActive(id){
    [1,2,3].forEach(n=>{
      const b = document.getElementById("btn"+n);
      b.classList.toggle("active", n===id);
    });
  }

  function loadVideo(id){
    document.getElementById("overlay").style.display = "none";
    setActive(id);

    const target = document.getElementById("videoTarget");
    target.innerHTML = `
      <iframe 
          src="${SOURCES[id]}" 
          allowfullscreen="true" 
          webkitallowfullscreen="true" 
          mozallowfullscreen="true" 
          scrolling="no" 
          frameborder="0" 
          allow="autoplay; fullscreen; picture-in-picture; encrypted-media"
          referrerpolicy="no-referrer"
          sandbox="allow-scripts allow-same-origin allow-forms">
      </iframe>
    `;
  }

  /* ✅ TIMER STYLE (comme ta photo) */
  let start = Date.now();
  setInterval(()=>{
    const diff = Date.now() - start;
    const s = Math.floor(diff / 1000);
    const h = Math.floor(s / 3600);
    const m = Math.floor((s % 3600) / 60);
    const sec = s % 60;
    document.getElementById("timer").textContent =
      `${h}h ${String(m).padStart(2,"0")}m ${String(sec).padStart(2,"0")}s`;
  }, 1000);
</script>

<!-- ✅ FIREBASE ONLINE (INVISIBLE, TEMPS RÉEL) -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyDPP6MQDLbDaVu2f6cFy44iUvAZ1RCJPtQ",
    authDomain: "imftxlive.firebaseapp.com",
    databaseURL: "https://imftxlive-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "imftxlive",
    storageBucket: "imftxlive.firebasestorage.app",
    messagingSenderId: "117057055374",
    appId: "1:117057055374:web:af7d7542749a6ec592b7df"
  };

  if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  const MATCH_ID = "barcelone-bilbao";
  const sessionId = Math.random().toString(36).slice(2) + Date.now();

  const sessionRef = db.ref(`streams/${MATCH_ID}/presence/${sessionId}`);
  const onlineRef  = db.ref(`streams/${MATCH_ID}/online`);
  const presenceRoot = db.ref(`streams/${MATCH_ID}/presence`);

  if (location.protocol !== "file:") {
    sessionRef.set(true);
    sessionRef.onDisconnect().remove();

    presenceRoot.on("value", snap => {
      const data = snap.val() || {};
      onlineRef.set(Object.keys(data).length);
    });
  }
</script>

</body>
</html>
