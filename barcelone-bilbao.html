<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IMFTX+ — Barcelone vs Bilbao</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

  <style>
    html,body{
      height:100%;margin:0;
      font-family:'Outfit',system-ui,-apple-system,"Segoe UI",Roboto,Arial;
      background:#070708;
      color:#fff;
    }

    .player-wrap{
      border-radius:18px;
      overflow:hidden;
      border:1px solid rgba(255,255,255,.10);
      background:#000;
      box-shadow:0 25px 90px rgba(0,0,0,.75);
    }

    iframe{width:100%;height:100%;border:0;background:#000;display:block}

    .src-btn{
      height:46px;
      border-radius:10px;
      font-weight:900;
      font-size:14px;
      transition:.15s;
      border:1px solid rgba(255,255,255,.10);
    }
    .src-btn.active{
      background:#fff;
      color:#000;
    }
    .src-btn:not(.active){
      background:rgba(255,255,255,.07);
      color:#fff;
    }
    .src-btn:not(.active):hover{
      background:rgba(255,255,255,.12);
    }

    /* ✅ "Vous regardez" bar (responsive) */
    .watch-bar{
      margin-top:14px;
      border-radius:16px;
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.10);
      padding:14px 18px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:14px;
      flex-wrap:wrap;
    }
    .watch-left{
      display:flex;
      align-items:center;
      gap:12px;
      min-width:240px;
      flex:1;
    }
    .watch-text{
      line-height:1.15;
    }
    .watch-text .small{
      font-size:13px;
      opacity:.70;
      font-weight:700;
    }
    .watch-text .title{
      font-size:18px;
      font-weight:900;
    }
    .watch-text .meta{
      font-size:13px;
      opacity:.65;
      font-weight:700;
      margin-top:2px;
    }
    .watch-right{
      display:flex;
      align-items:center;
      justify-content:flex-end;
      gap:10px;
      flex-shrink:0;
    }

    .canal-logo{
      height:32px;
      object-fit:contain;
      opacity:.95;
      filter: drop-shadow(0 0 10px rgba(0,0,0,.8));
    }
  </style>
</head>

<body>

<!-- ✅ NAV -->
<nav class="sticky top-0 z-40 bg-black/20 backdrop-blur-xl border-b border-white/5">
  <div class="max-w-screen-xl mx-auto px-6 py-3 flex items-center justify-between">
    <div class="text-2xl font-extrabold tracking-tight">IMFTX+</div>

    <a href="index.html"
       class="inline-flex items-center gap-2 px-4 h-10 rounded-full bg-white/10 border border-white/10 hover:bg-white/15 font-bold text-sm">
      <i class="fa-solid fa-arrow-left"></i> Retour
    </a>
  </div>
</nav>

<main class="max-w-screen-xl mx-auto px-6 py-10">

  <!-- ✅ PLAYER -->
  <section class="player-wrap w-full aspect-video relative">

    <!-- overlay launch -->
    <div id="overlay" class="absolute inset-0 z-10 flex flex-col items-center justify-center bg-black/80">
      <button onclick="loadVideo(1)"
              class="px-10 py-4 rounded-full bg-amber-400 text-black font-extrabold text-lg hover:opacity-90">
        ▶ LANCER LE STREAM
      </button>
      <p class="mt-4 text-white/55 font-semibold text-sm">
        Si Source 1 bug → essaye Source 2 ou Source 3
      </p>
    </div>

    <div id="videoTarget" class="w-full h-full"></div>
  </section>

  <!-- ✅ SOURCES -->
  <section class="mt-4 grid grid-cols-3 gap-3">
    <button id="btn1" onclick="loadVideo(1)" class="src-btn active">Source 1</button>
    <button id="btn2" onclick="loadVideo(2)" class="src-btn">Source 2</button>
    <button id="btn3" onclick="loadVideo(3)" class="src-btn">Source 3</button>
  </section>

  <!-- ✅ "Vous regardez" bar -->
  <div class="watch-bar">
    <div class="watch-left">
      <img class="w-9 h-9 object-contain opacity-90"
           src="https://upload.wikimedia.org/wikipedia/commons/thumb/b/bd/LaLiga_Santander.svg/512px-LaLiga_Santander.svg.png"
           alt="LaLiga">

      <div class="watch-text">
        <div class="small">Vous regardez</div>
        <div class="title">Barcelone - Bilbao</div>
        <div class="meta">Aujourd’hui · 20:00</div>
      </div>
    </div>

    <div class="watch-right">
      <!-- ✅ CANAL+ FOOT LOGO -->
      <img class="canal-logo"
           src="https://upload.wikimedia.org/wikipedia/commons/thumb/5/5b/Canal%2B_Logo.svg/512px-Canal%2B_Logo.svg.png"
           alt="CANAL+">
    </div>
  </div>

</main>

<!-- ✅ PLAYER SCRIPT (VERSION QUI MARCHE CHEZ TOI) -->
<script>
  const SOURCES = {
    1: "https://bolaloca.my/player/4/2",
    2: "https://bolaloca.my/player/2/2",
    3: "https://bolaloca.my/player/3/2"
  };

  function setActive(id){
    [1,2,3].forEach(n=>{
      const b = document.getElementById("btn"+n);
      if(n===id){
        b.className = "src-btn active";
      }else{
        b.className = "src-btn";
      }
    });
  }

  function loadVideo(id){
    document.getElementById("overlay").style.display = "none";
    setActive(id);

    const target = document.getElementById("videoTarget");

    /* ✅ iframe EXACTEMENT comme ton script qui marchait (anti embed block au max) */
    target.innerHTML = `
      <iframe 
          src="${SOURCES[id]}" 
          allowfullscreen="true"
          webkitallowfullscreen="true"
          mozallowfullscreen="true"
          scrolling="no"
          frameborder="0"
          allow="autoplay; fullscreen; picture-in-picture; encrypted-media"
          referrerpolicy="no-referrer"
          sandbox="allow-scripts allow-same-origin allow-forms">
      </iframe>
    `;
  }
</script>

<!-- ✅ FIREBASE ONLINE (INVISIBLE, TEMPS RÉEL) -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyDPP6MQDLbDaVu2f6cFy44iUvAZ1RCJPtQ",
    authDomain: "imftxlive.firebaseapp.com",
    databaseURL: "https://imftxlive-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "imftxlive",
    storageBucket: "imftxlive.firebasestorage.app",
    messagingSenderId: "117057055374",
    appId: "1:117057055374:web:af7d7542749a6ec592b7df"
  };

  if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  const MATCH_ID = "barcelone-bilbao";
  const sessionId = Math.random().toString(36).slice(2) + Date.now();

  const sessionRef = db.ref(`streams/${MATCH_ID}/presence/${sessionId}`);
  const onlineRef  = db.ref(`streams/${MATCH_ID}/online`);
  const presenceRoot = db.ref(`streams/${MATCH_ID}/presence`);

  if (location.protocol !== "file:") {
    sessionRef.set(true);
    sessionRef.onDisconnect().remove();

    presenceRoot.on("value", snap => {
      const data = snap.val() || {};
      onlineRef.set(Object.keys(data).length);
    });
  }
</script>

</body>
</html>
