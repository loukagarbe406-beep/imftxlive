<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IMFTX+ — Barcelone vs Bilbao</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

  <style>
    html,body{
      height:100%;margin:0;
      font-family:'Outfit',system-ui,-apple-system,"Segoe UI",Roboto,Arial;
      background:
        radial-gradient(1200px 700px at 50% 0%, rgba(255,255,255,.08), transparent 60%),
        linear-gradient(180deg,#070708 0%,#0f0f10 100%);
      color:#fff;
    }

    .player-box{
      border-radius:22px;
      overflow:hidden;
      border:1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.03);
      box-shadow: 0 25px 90px rgba(0,0,0,.72);
    }

    iframe{width:100%;height:100%;border:0;background:#000;display:block}

    /* ✅ Bannière cover cliquable */
    .cover{
      position:absolute;
      inset:0;
      z-index:15;
      cursor:pointer;
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      padding:22px;
      background:
        linear-gradient(180deg, rgba(0,0,0,.05) 0%, rgba(0,0,0,.65) 100%),
        url("https://empire-sport.shop/upload/teambanks/kmuysams1cj3ddqzeqlp1k5nwfqxaf.png") center/cover no-repeat;
    }

    .cover-badge{
      padding:10px 14px;
      border-radius:16px;
      background:rgba(0,0,0,.45);
      border:1px solid rgba(255,255,255,.12);
      backdrop-filter: blur(12px);
      max-width:70%;
    }

    .cover-badge .t1{font-size:16px;font-weight:900}
    .cover-badge .t2{font-size:13px;opacity:.75;font-weight:700;margin-top:2px}

    .play-btn{
      width:54px;height:54px;
      border-radius:999px;
      display:grid;place-items:center;
      background:rgba(255,255,255,.10);
      border:1px solid rgba(255,255,255,.14);
      backdrop-filter: blur(12px);
      box-shadow: 0 18px 40px rgba(0,0,0,.5);
      transition:.2s;
    }
    .play-btn:hover{transform:scale(1.06)}
    .play-btn i{font-size:22px}

    /* ✅ Barre "Vous regardez" style capture */
    .watch-bar{
      margin-top:14px;
      border-radius:18px;
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.10);
      padding:14px 18px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:14px;
      flex-wrap:wrap;
    }
    .watch-left{
      display:flex;
      align-items:center;
      gap:12px;
      flex:1;
      min-width:260px;
    }
    .watch-text{
      line-height:1.15;
    }
    .watch-text .small{
      font-size:13px;
      opacity:.70;
      font-weight:700;
    }
    .watch-text .title{
      font-size:18px;
      font-weight:900;
    }
    .watch-text .meta{
      font-size:13px;
      opacity:.65;
      font-weight:700;
      margin-top:2px;
    }
    .watch-right{
      display:flex;
      align-items:center;
      justify-content:flex-end;
      gap:10px;
      flex-shrink:0;
    }
    .canal-logo{
      height:26px;
      object-fit:contain;
      opacity:.95;
      filter: drop-shadow(0 0 10px rgba(0,0,0,.8));
    }
  </style>
</head>

<body>

<!-- NAV -->
<nav class="sticky top-0 z-40 bg-black/20 backdrop-blur-xl border-b border-white/5">
  <div class="max-w-screen-2xl mx-auto px-6 py-3 flex items-center justify-between">
    <div class="text-3xl font-extrabold tracking-tight">IMFTX+</div>

    <a href="index.html"
       class="inline-flex items-center gap-2 px-4 h-10 rounded-full bg-white/10 border border-white/10 hover:bg-white/15 font-bold text-sm">
      <i class="fa-solid fa-arrow-left"></i> Retour
    </a>
  </div>
</nav>

<main class="max-w-screen-2xl mx-auto px-6 py-10">

  <!-- HEADER -->
  <header class="text-center mb-8">
    <h1 class="text-3xl md:text-4xl font-extrabold tracking-tight uppercase">
      Barcelone - Athletic Bilbao
    </h1>
    <p class="mt-2 text-white/55 font-semibold">
      Supercoupe · 20h00
    </p>
  </header>

  <!-- PLAYER -->
  <section class="player-box relative w-full aspect-video">

    <!-- ✅ Cover cliquable -->
    <div id="cover" class="cover" onclick="loadVideo(1)">
      <div class="cover-badge">
        <div class="t1">Regarder Gratuitement</div>
        <div class="t2">Barcelona · Athletic Bilbao</div>
      </div>

      <div class="play-btn">
        <i class="fa-solid fa-play"></i>
      </div>
    </div>

    <div id="videoTarget" class="w-full h-full"></div>
  </section>

  <!-- PLAYERS -->
  <section class="mt-5 grid grid-cols-3 gap-3">
    <button id="btn1" onclick="loadVideo(1)"
            class="h-12 rounded-xl bg-white text-black font-extrabold hover:opacity-95 text-xs md:text-base">
      Source 1
    </button>
    <button id="btn2" onclick="loadVideo(2)"
            class="h-12 rounded-xl bg-white/10 border border-white/10 font-extrabold hover:bg-white/15 text-xs md:text-base">
      Source 2
    </button>
    <button id="btn3" onclick="loadVideo(3)"
            class="h-12 rounded-xl bg-white/10 border border-white/10 font-extrabold hover:bg-white/15 text-xs md:text-base">
      Source 3
    </button>
  </section>

  <!-- DIRECT LINK (fallback) -->
  <div id="externalLink" class="hidden mt-4 text-center">
    <a id="directLink" href="#" target="_blank"
       class="text-amber-400 underline font-extrabold text-sm">
      Le lecteur ne s’affiche pas ? Ouvrir le lien direct
    </a>
  </div>

  <!-- ✅ "VOUS REGARDEZ" -->
  <div class="watch-bar">
    <div class="watch-left">
      <img class="w-9 h-9 object-contain opacity-90"
           src="https://upload.wikimedia.org/wikipedia/commons/thumb/1/1b/Supercopa_de_Espa%C3%B1a_logo.svg/512px-Supercopa_de_Espa%C3%B1a_logo.svg.png"
           alt="Supercoupe">

      <div class="watch-text">
        <div class="small">Vous regardez</div>
        <div class="title">Barcelona - Athletic Bilbao</div>
        <div class="meta">Aujourd’hui · 20:00</div>
      </div>
    </div>

    <div class="watch-right">
      <img class="canal-logo"
           src="https://upload.wikimedia.org/wikipedia/commons/thumb/5/5b/Canal%2B_Logo.svg/512px-Canal%2B_Logo.svg.png"
           alt="CANAL+">
    </div>
  </div>

</main>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

<script>
  /* ✅ ONLINE TRACKING */
  const firebaseConfig = {
    apiKey: "AIzaSyDPP6MQDLbDaVu2f6cFy44iUvAZ1RCJPtQ",
    authDomain: "imftxlive.firebaseapp.com",
    databaseURL: "https://imftxlive-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "imftxlive",
    storageBucket: "imftxlive.firebasestorage.app",
    messagingSenderId: "117057055374",
    appId: "1:117057055374:web:af7d7542749a6ec592b7df"
  };

  if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  const MATCH_ID = "barcelone-bilbao";
  const sessionId = Math.random().toString(36).slice(2) + Date.now();

  const sessionRef = db.ref(`streams/${MATCH_ID}/presence/${sessionId}`);
  const onlineRef  = db.ref(`streams/${MATCH_ID}/online`);
  const presenceRoot = db.ref(`streams/${MATCH_ID}/presence`);

  if (location.protocol !== "file:") {
    sessionRef.set(true);
    sessionRef.onDisconnect().remove();

    presenceRoot.on("value", snap => {
      const data = snap.val() || {};
      onlineRef.set(Object.keys(data).length);
    });
  }

  /* ✅ PLAYER (script stable + fallback embed blocked) */
  const SOURCES = {
    1: "https://bolaloca.my/player/4/2",
    2: "https://bolaloca.my/player/2/2",
    3: "https://bolaloca.my/player/3/2"
  };

  function setActive(id){
    [1,2,3].forEach(n=>{
      const b = document.getElementById("btn"+n);
      b.className = (n===id)
        ? "h-12 rounded-xl bg-white text-black font-extrabold hover:opacity-95 text-xs md:text-base"
        : "h-12 rounded-xl bg-white/10 border border-white/10 font-extrabold hover:bg-white/15 text-xs md:text-base";
    });
  }

  function loadVideo(id){
    document.getElementById("cover").style.display = "none";
    setActive(id);

    const ext = document.getElementById("externalLink");
    const link = document.getElementById("directLink");
    link.href = SOURCES[id];
    ext.classList.add("hidden");

    const target = document.getElementById("videoTarget");
    target.innerHTML = `
      <iframe
        id="streamFrame"
        src="${SOURCES[id]}"
        allowfullscreen
        scrolling="no"
        frameborder="0"
        allow="autoplay; fullscreen; picture-in-picture; encrypted-media"
        referrerpolicy="origin"
        sandbox="allow-scripts allow-same-origin allow-forms allow-presentation">
      </iframe>
    `;

    setTimeout(() => {
      const iframe = document.getElementById("streamFrame");
      if(!iframe) return;
      try { iframe.contentWindow.location.href; }
      catch(e){ ext.classList.remove("hidden"); }
    }, 2000);
  }
</script>

</body>
</html>
