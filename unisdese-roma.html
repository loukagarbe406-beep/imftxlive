<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>IMFTX+ — Udinese - Roma</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

  <style>
    html, body { height:100%; margin:0; }
    body{
      font-family:'Outfit',system-ui,-apple-system,"Segoe UI",Roboto,Arial;
      color:#fff;
      overflow-x:hidden;
    }

    /* fond gris pro */
    .soft-bg{
      background:
        radial-gradient(1400px 620px at 50% -10%, rgba(255,255,255,.10), transparent 60%),
        radial-gradient(1000px 520px at 50% 30%, rgba(255,255,255,.08), transparent 62%),
        linear-gradient(135deg,#16181c 0%,#111317 45%,#0c0e12 100%);
    }

    .player-box{
      position:relative;
      border-radius:22px;
      overflow:hidden;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(255,255,255,.04);
      box-shadow:0 30px 120px rgba(0,0,0,.85);
    }

    iframe{
      width:100%;
      height:100%;
      border:0;
      background:#000;
      display:block;
    }

    .cover{
      position:absolute;
      inset:0;
      z-index:10;
      cursor:pointer;
      background:
        linear-gradient(180deg,rgba(0,0,0,.15),rgba(0,0,0,.6)),
        url("https://images.unsplash.com/photo-1521412644187-c49fa049e84d?q=80&w=1600&auto=format&fit=crop")
        center/cover no-repeat;
    }

    .cover-top{
      position:absolute;
      top:18px; left:18px;
      display:flex; align-items:center; gap:10px;
      padding:10px 14px;
      border-radius:18px;
      background:rgba(0,0,0,.35);
      border:1px solid rgba(255,255,255,.14);
      backdrop-filter:blur(14px);
    }

    .team-logo{
      width:34px; height:34px;
      object-fit:contain;
    }

    .vs{ font-weight:900; }

    .cover-strip{
      position:absolute;
      left:22px; right:22px; bottom:22px;
      height:86px;
      border-radius:20px;
      background:rgba(255,255,255,.14);
      border:1px solid rgba(255,255,255,.16);
      backdrop-filter:blur(16px);
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:0 22px;
    }

    .strip-title{ font-size:18px; font-weight:900; }
    .strip-sub{ font-size:15px; opacity:.85; font-weight:600; font-style:italic; }

    .strip-play{
      width:50px;height:50px;
      border-radius:999px;
      border:2px solid rgba(255,255,255,.35);
      display:grid; place-items:center;
      background:rgba(0,0,0,.25);
    }

    .source-btn{
      height:44px;
      border-radius:14px;
      font-weight:900;
      font-size:13px;
      transition:.2s;
    }
    .source-btn.active{ background:#fff; color:#000; }
    .source-btn.inactive{
      background:rgba(255,255,255,.08);
      border:1px solid rgba(255,255,255,.12);
      color:#fff;
    }

    .notice{
      margin-top:14px;
      border-radius:16px;
      background:rgba(255,255,255,.10);
      border:1px solid rgba(255,255,255,.12);
      padding:14px 16px;
      display:none;
    }
  </style>
</head>

<body class="soft-bg">

<nav class="sticky top-0 z-40 bg-black/30 backdrop-blur-xl border-b border-white/5">
  <div class="max-w-screen-2xl mx-auto px-6 py-3 flex items-center justify-between">
    <div class="text-3xl font-extrabold">IMFTX+</div>
    <a href="index.html"
       class="px-4 h-10 flex items-center gap-2 rounded-full bg-white/10 border border-white/10 font-bold text-sm">
      <i class="fa-solid fa-arrow-left"></i> Retour
    </a>
  </div>
</nav>

<main class="max-w-screen-2xl mx-auto px-6 py-10">

<section class="player-box w-full aspect-video">

  <div id="cover" class="cover" onclick="loadVideo(1)">
    <div class="cover-top">
      <img class="team-logo"
           src="https://upload.wikimedia.org/wikipedia/en/c/ce/Udinese_Calcio_logo.svg"
           alt="Udinese">
      <span class="vs">VS</span>
      <img class="team-logo"
           src="https://upload.wikimedia.org/wikipedia/en/f/f7/AS_Roma_logo_%282017%29.svg"
           alt="Roma">
    </div>

    <div class="cover-strip">
      <div>
        <div class="strip-title">Regarder</div>
        <div class="strip-sub">Udinese<br>Roma</div>
      </div>
      <div class="strip-play"><i class="fa-solid fa-play"></i></div>
    </div>
  </div>

  <div id="videoTarget" class="w-full h-full"></div>
</section>

<section class="mt-5 flex gap-3">
  <button id="btn1" onclick="loadVideo(1)" class="source-btn active px-6">Source 1</button>
  <button id="btn2" onclick="loadVideo(2)" class="source-btn inactive px-6">Source 2</button>
  <button id="btn3" onclick="loadVideo(3)" class="source-btn inactive px-6">Source 3</button>
</section>

<div id="notice" class="notice">
  <b>Le lecteur ne s’affiche pas ?</b>
  <p class="text-sm opacity-80 mt-1">
    Le site peut bloquer l’intégration iframe.
  </p>
  <a id="directLink" href="#" target="_blank"
     class="inline-flex mt-3 items-center gap-2 font-bold text-amber-400">
    Ouvrir le lien direct
  </a>
</div>

</main>

<script>
  // 👉 mets ICI tes liens HTTPS (page web, pas m3u8)
  const SOURCES = {
    1: "https://cdn-live.tv/api/v1/channels/player/?name=eleven+sports+1&code=pl&user=cdnlivetv&plan=free",
    2: "https://cdn-live.tv/api/v1/channels/player/?name=eleven+sports+1&code=pl&user=cdnlivetv&plan=free",
    3: "#"
  };

  function setActive(id){
    [1,2,3].forEach(n=>{
      document.getElementById("btn"+n).className =
        (n===id) ? "source-btn active px-6" : "source-btn inactive px-6";
    });
  }

  function loadVideo(id){
    const url = SOURCES[id];
    document.getElementById("cover").style.display = "none";
    setActive(id);

    const target = document.getElementById("videoTarget");
    const notice = document.getElementById("notice");
    notice.style.display = "none";

    if(!url || url === "#"){
      notice.style.display = "block";
      return;
    }

    document.getElementById("directLink").href = url;

    target.innerHTML = `
      <iframe src="${url}"
        allowfullscreen
        frameborder="0"
        allow="autoplay; fullscreen; picture-in-picture"
        referrerpolicy="no-referrer">
      </iframe>
    `;

    setTimeout(()=>{ notice.style.display = "block"; }, 2500);
  }
</script>

</body>
</html>
