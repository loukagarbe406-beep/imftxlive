<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IMFTX+ — Bayeux - Marseille</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

  <style>
    html,body{
      height:100%;margin:0;
      font-family:'Outfit',system-ui,-apple-system,"Segoe UI",Roboto,Arial;
      background:#070708;
      color:#fff;
      overflow-x:hidden;
    }

    .player-box{
      border-radius:22px;
      overflow:hidden;
      border:1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.04);
      box-shadow: 0 30px 120px rgba(0,0,0,.85);
      position:relative;
    }

    iframe{width:100%;height:100%;border:0;background:#000;display:block;}

    /* COVER */
    .cover{
      position:absolute; inset:0; z-index:15;
      cursor:pointer;
      background:
        linear-gradient(180deg, rgba(0,0,0,.08) 0%, rgba(0,0,0,.28) 55%, rgba(0,0,0,.55) 100%),
        url("https://empire-sport.shop/upload/events/pmx0untdayz8fk5cjki6ba0uqtlm30.jpg") center/cover no-repeat;
    }

    .cover-top{
      position:absolute; top:18px; left:18px;
      display:flex; align-items:center; gap:10px;
      padding:10px 12px; border-radius:18px;
      background:rgba(0,0,0,.35);
      border:1px solid rgba(255,255,255,.14);
      backdrop-filter: blur(14px);
    }

    .team-logo{
      width:34px;height:34px;
      object-fit:contain;
      filter: drop-shadow(0 8px 20px rgba(0,0,0,.75));
    }
    .vs{font-weight:900;font-size:14px;opacity:.9;}

    .cover-strip{
      position:absolute; left:22px; right:22px; bottom:22px;
      height:86px;border-radius:20px;
      background:rgba(255,255,255,.14);
      border:1px solid rgba(255,255,255,.16);
      backdrop-filter: blur(16px);
      display:flex; align-items:center; justify-content:space-between;
      padding:0 22px;
    }

    .strip-title{font-size:18px;font-weight:900;line-height:1;}
    .strip-sub{font-size:15px;opacity:.85;font-weight:600;line-height:1.1;font-style:italic;margin-top:3px;}

    .strip-play{
      width:50px;height:50px;border-radius:999px;
      border:2px solid rgba(255,255,255,.38);
      display:grid;place-items:center;
      transition:.2s;background:rgba(0,0,0,.22);
    }
    .strip-play i{font-size:19px}
    .strip-play:hover{transform:scale(1.08);background:rgba(0,0,0,.35)}

    .source-btn{
      height:44px;border-radius:14px;font-weight:900;font-size:13px;transition:.2s;
    }
    .source-btn.active{background:#fff;color:#000;}
    .source-btn.inactive{
      background:rgba(255,255,255,.08);
      border:1px solid rgba(255,255,255,.10);
      color:#fff;
    }
    .source-btn:hover{opacity:.95}

    .watch-bar{
      border-radius:18px;
      background:rgba(255,255,255,.10);
      border:1px solid rgba(255,255,255,.12);
      backdrop-filter: blur(16px);
      padding:16px 18px;
      display:flex; align-items:center; justify-content:space-between; gap:16px;
    }
    .watch-left{display:flex;align-items:center;gap:14px;min-width:0;}
    .watch-left img{
      width:38px;height:38px;object-fit:contain;
      filter: drop-shadow(0 6px 14px rgba(0,0,0,.7));
      flex-shrink:0;
    }
    .watch-text{min-width:0;line-height:1.1;}
    .watch-text .small{opacity:.8;font-weight:700;font-size:13px;}
    .watch-text .big{
      font-weight:900;font-size:16px;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    }
    .channel-logo{width:86px;height:auto;object-fit:contain;filter:drop-shadow(0 6px 14px rgba(0,0,0,.7));}

    /* ✅ lien jaune (HQ) sous les players */
    .hq-wrap{
      margin-top:12px;
      border-radius:14px;
      background:rgba(245,158,11,.16);
      border:1px solid rgba(245,158,11,.30);
      padding:12px 14px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
    }
    .hq-left{display:flex;align-items:center;gap:10px;min-width:0;}
    .hq-pill{
      width:34px;height:34px;border-radius:999px;
      background:#fbbf24;color:#111;
      display:grid;place-items:center;
      font-weight:900;
      box-shadow:0 10px 30px rgba(245,158,11,.25);
      flex-shrink:0;
    }
    .hq-text{min-width:0;}
    .hq-text .t1{font-weight:900;color:#ffd27a;font-size:13px;line-height:1.1;}
    .hq-text .t2{
      color:#ffe9b5;opacity:.9;font-weight:800;font-size:12px;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    }
    .hq-open{
      flex-shrink:0;
      height:38px;
      padding:0 14px;
      border-radius:999px;
      background:#fbbf24;
      color:#111;
      font-weight:900;
      font-size:12px;
      display:inline-flex;
      align-items:center;
      gap:8px;
      transition:.15s;
    }
    .hq-open:hover{opacity:.95;transform:scale(1.02);}
  </style>
</head>

<body>

<!-- NAV -->
<nav class="sticky top-0 z-40 bg-black/20 backdrop-blur-xl border-b border-white/5">
  <div class="max-w-screen-2xl mx-auto px-6 py-3 flex items-center justify-between">
    <div class="text-3xl font-extrabold tracking-tight">IMFTX+</div>

    <a href="index.html"
       class="inline-flex items-center gap-2 px-4 h-10 rounded-full bg-white/10 border border-white/10 hover:bg-white/15 font-bold text-sm">
      <i class="fa-solid fa-arrow-left"></i> Retour
    </a>
  </div>
</nav>

<main class="max-w-screen-2xl mx-auto px-6 py-10">

  <!-- PLAYER -->
  <section class="player-box relative w-full aspect-video">

    <!-- COVER click -->
    <div id="cover" class="cover" onclick="loadVideo(1)">
      <div class="cover-top">
        <!-- logos équipes : (tu peux remplacer si tu veux les vrais logos de Bayeux/OM) -->
        <img class="team-logo"
             src="https://upload.wikimedia.org/wikipedia/fr/thumb/4/43/Logo_Olympique_de_Marseille.svg/512px-Logo_Olympique_de_Marseille.svg.png"
             alt="OM">
        <span class="vs">VS</span>
        <img class="team-logo"
             src="https://iconape.com/wp-content/files/wx/307647/svg/307647.svg"
             alt="Bayeux">
      </div>

      <div class="cover-strip">
        <div>
          <div class="strip-title">Regarder Gratuitement</div>
          <div class="strip-sub">Bayeux<br>Marseille</div>
        </div>

        <div class="strip-play">
          <i class="fa-solid fa-play"></i>
        </div>
      </div>
    </div>

    <div id="videoTarget" class="w-full h-full"></div>
  </section>

  <!-- SOURCES -->
  <section class="mt-5 flex gap-3">
    <button id="btn1" onclick="loadVideo(1)" class="source-btn active px-6">Source 1</button>
    <button id="btn2" onclick="loadVideo(2)" class="source-btn inactive px-6">Source 2</button>
    <button id="btn3" onclick="loadVideo(3)" class="source-btn inactive px-6">Source 3</button>
  </section>

  <!-- ✅ LIEN JAUNE HQ (toujours visible) -->
  <section class="hq-wrap">
    <div class="hq-left">
      <div class="hq-pill">4K</div>
      <div class="hq-text">
        <div class="t1">Live meilleure qualité — cliquer ici</div>
        <div class="t2">1440p · 60 FPS</div>
      </div>
    </div>

    <a class="hq-open"
       href="http://81340-movie.ott-di.com/live/7c91697cda/addf2b013f50/553684.m3u8"
       target="_blank" rel="noopener">
      Ouvrir <i class="fa-solid fa-arrow-up-right-from-square"></i>
    </a>
  </section>

  <!-- WATCH BAR -->
  <section class="mt-6 watch-bar">
    <div class="watch-left">
      <img src="https://empire-sport.shop/upload/leagues/nsnmlketyltkftezcw1n3ckysgceyu.png" alt="Coupe de France">
      <div class="watch-text">
        <div class="small">Vous regardez</div>
        <div class="big">Bayeux - Marseille</div>
        <div class="small">Aujourd’hui · 21:00</div>
      </div>
    </div>

    <div class="watch-right">
      <img class="channel-logo"
           src="https://upload.wikimedia.org/wikipedia/commons/d/d7/Bein_sport_ana_logo.png"
           alt="beIN SPORTS 1">
    </div>
  </section>

</main>

<script>
  // ✅ Player numéro = 1 (tes players classiques)
  const SOURCES = {
    1: "https://bolaloca.my/player/4/1",
    2: "https://bolaloca.my/player/2/1",
    3: "https://bolaloca.my/player/3/1"
  };

  function setActive(id){
    [1,2,3].forEach(n=>{
      const b = document.getElementById("btn"+n);
      b.className = (n===id) ? "source-btn active px-6" : "source-btn inactive px-6";
    });
  }

  function loadVideo(id){
    document.getElementById("cover").style.display = "none";
    setActive(id);

    const target = document.getElementById("videoTarget");
    target.innerHTML = `
      <iframe
        id="streamFrame"
        src="${SOURCES[id]}"
        allowfullscreen
        scrolling="no"
        frameborder="0"
        allow="autoplay; fullscreen; picture-in-picture; encrypted-media"
        referrerpolicy="origin"
        sandbox="allow-scripts allow-same-origin allow-forms allow-presentation">
      </iframe>
    `;
  }
</script>

</body>
</html>
