<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CanalSport</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>
    <iframe id="stream" 
            src="https://viewembed.ru/channel/CanalSport1%5BFrance%5D" 
            allow="fullscreen; autoplay; encrypted-media"
            allowfullscreen>
    </iframe>
 
    <script>
        // Bloquer JUSTE les popups window.open
        const originalOpen = window.open;
        window.open = function() { 
            console.log('Popup bloquée');
            return null; 
        };
 
        // Bloquer les redirects forcés
        let redirectBlocked = false;
        window.addEventListener('beforeunload', (e) => {
            if (redirectBlocked) {
                e.preventDefault();
                e.returnValue = '';
            }
        });
    </script>
</body>
</html>
