<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CanalSport</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <iframe src="https://viewembed.ru/channel/CanalSport1%5BFrance%5D" 
            allow="fullscreen; autoplay; encrypted-media"
            allowfullscreen>
    </iframe>
 
    <script>
        // Bloquer popups
        window.open = function() { return null; };
        
        // Bloquer redirects
        Object.defineProperty(window, 'location', {
            writable: true,
            value: window.location
        });
        
        // Bloquer fullscreen non-autorisé
        if (Element.prototype.requestFullscreen) {
            Element.prototype.requestFullscreen = function() {
                return Promise.resolve();
            };
        }
    </script>
</body>
</html>
