<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CanalSport</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }
        .container {
            position: relative;
            width: 100%;
            height: 100%;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
        .blocker-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: auto;
            z-index: 999999;
            background: transparent;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="container">
        <iframe id="stream" 
                src="https://viewembed.ru/channel/CanalSport1%5BFrance%5D" 
                allow="fullscreen; autoplay; encrypted-media"
                allowfullscreen>
        </iframe>
        <div class="blocker-overlay" id="blocker"></div>
    </div>
 
    <script>
        // Overlay qui bloque les clics
        const blocker = document.getElementById('blocker');
        
        blocker.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
            return false;
        });
 
        blocker.addEventListener('mousedown', (e) => {
            e.preventDefault();
            e.stopPropagation();
        });
 
        blocker.addEventListener('mouseup', (e) => {
            e.preventDefault();
            e.stopPropagation();
        });
 
        blocker.addEventListener('dblclick', (e) => {
            e.preventDefault();
            e.stopPropagation();
        });
 
        // Bloquer window.open
        window.open = function() { return null; };
    </script>
</body>
</html>
