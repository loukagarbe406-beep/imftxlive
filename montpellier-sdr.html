<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>CanalSport Player</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
  <style>
    html,body{height:100%;margin:0}
    body{font-family:'Outfit',sans-serif;color:#fff;overflow-x:hidden;background:linear-gradient(135deg,rgba(10,10,12,.92) 0%,rgba(10,10,12,.88) 40%,rgba(10,10,12,.92) 100%)}
    .glass{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.10);box-shadow:0 30px 120px rgba(0,0,0,.75);backdrop-filter:blur(14px)}
    .player-box{border-radius:20px;overflow:hidden;position:relative}
    iframe{width:100%;height:100%;border:0;background:#000;display:block}
    .cover{position:absolute;inset:0;z-index:15;cursor:pointer;background:linear-gradient(180deg,rgba(0,0,0,.15) 0%,rgba(0,0,0,.45) 55%,rgba(0,0,0,.80) 100%)}
    .cover-strip{position:absolute;left:16px;right:16px;bottom:16px;height:80px;border-radius:18px;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(16px);display:flex;align-items:center;justify-content:space-between;padding:0 18px}
    .strip-title{font-size:16px;font-weight:900;line-height:1}
    .strip-sub{font-size:14px;opacity:.85;font-weight:600;font-style:italic;margin-top:4px;line-height:1.1}
    .strip-play{width:46px;height:46px;border-radius:999px;border:1px solid rgba(255,255,255,.18);display:grid;place-items:center;background:rgba(255,255,255,.12);transition:.2s}
    .strip-play:hover{transform:scale(1.06);background:rgba(255,255,255,.16)}
    .pill{position:absolute;top:16px;right:16px;padding:7px 12px;border-radius:999px;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.12);font-weight:900;font-size:12px;display:flex;align-items:center;gap:8px;backdrop-filter:blur(14px)}
    .dot{width:7px;height:7px;border-radius:999px;background:#f59e0b}
    .source-btn{height:42px;border-radius:12px;font-weight:900;font-size:13px;transition:.2s}
    .source-btn.active{background:#fff;color:#000}
    .source-btn.inactive{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);color:#fff}
    .watch-bar{border-radius:16px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:14px}
  </style>
</head>
<body>
  <nav class="sticky top-0 z-40 bg-black/30 backdrop-blur-xl border-b border-white/10">
    <div class="max-w-screen-2xl mx-auto px-6 py-3 flex items-center justify-between">
      <div class="text-2xl md:text-3xl font-extrabold tracking-tight">IMFTX+</div>
    </div>
  </nav>
  <main class="max-w-screen-2xl mx-auto px-6 py-8">
    <section class="grid grid-cols-1 gap-6">
      <div>
        <div class="player-box glass w-full aspect-video">
          <div id="cover" class="cover" onclick="loadVideo(1)">
            <div class="pill"><span class="dot"></span>EN DIRECT</div>
            <div class="cover-strip"><div><div class="strip-title">Regarder Gratuitement</div><div class="strip-sub">CanalSport</div></div><div class="strip-play"><i class="fa-solid fa-play"></i></div></div>
          </div>
          <div id="videoTarget" class="w-full h-full"></div>
        </div>
        <div class="mt-4 flex flex-wrap gap-3">
          <button id="btn1" onclick="loadVideo(1)" class="source-btn active px-6">Source 1</button>
          <button id="btn2" onclick="loadVideo(2)" class="source-btn inactive px-6">Source 2</button>
          <button id="btn3" onclick="loadVideo(3)" class="source-btn inactive px-6">Source 3</button>
        </div>
      </div>
    </section>
  </main>
 
  <script>
    // === BLOCAGE AGRESSIF DES POPUPS ===
    
    // 1. Bloquer window.open PARTOUT
    window.open = function() { 
      console.log('❌ window.open bloquée');
      return null; 
    };
 
    // 2. Bloquer dans les iframes aussi
    var blockIframeOpen = setInterval(function() {
      document.querySelectorAll('iframe').forEach(function(iframe) {
        try {
          if(iframe.contentWindow) {
            iframe.contentWindow.open = function() { 
              console.log('❌ window.open dans iframe bloquée');
              return null; 
            };
          }
        } catch(e) {}
      });
    }, 500);
 
    // 3. Bloquer les attributs target="_blank"
    setInterval(function() {
      document.querySelectorAll('a[target="_blank"]').forEach(function(link) {
        link.removeAttribute('target');
        link.setAttribute('target', '_self');
      });
    }, 500);
 
    // 4. Bloquer XHR et Fetch pour pubs
    const originalFetch = window.fetch;
    window.fetch = function(url, ...args) {
      const urlStr = url?.toString().toLowerCase() || '';
      if (isSuspiciousURL(urlStr)) {
        console.log('❌ Fetch bloquée:', url);
        return Promise.resolve(new Response(''));
      }
      return originalFetch.apply(this, [url, ...args]);
    };
 
    const originalXHROpen = XMLHttpRequest.prototype.open;
    XMLHttpRequest.prototype.open = function(method, url, ...args) {
      const urlStr = url?.toString().toLowerCase() || '';
      if (isSuspiciousURL(urlStr)) {
        console.log('❌ XHR bloquée:', url);
        return;
      }
      return originalXHROpen.apply(this, [method, url, ...args]);
    };
 
    // 5. Masquer les pubs avec CSS
    const style = document.createElement('style');
    style.textContent = `
      [class*="ad"], [id*="ad"], [class*="popup"], [id*="popup"],
      [class*="modal"], [id*="modal"], [class*="banner"], [id*="banner"],
      [class*="overlay"], [id*="overlay"], .advertisement, #advertisement {
        display: none !important;
        visibility: hidden !important;
      }
    `;
    document.head.appendChild(style);
 
    // 6. MutationObserver pour supprimer les pubs dynamiques
    const observer = new MutationObserver((mutations) => {
      mutations.forEach(mutation => {
        mutation.addedNodes.forEach(node => {
          if (node.nodeType === 1) {
            const className = node.className?.toString().toLowerCase() || '';
            const id = node.id?.toString().toLowerCase() || '';
            
            if (className.includes('ad') || className.includes('popup') || 
                className.includes('modal') || id.includes('ad') || 
                id.includes('popup') || id.includes('modal')) {
              try {
                node.remove();
                console.log('❌ Pub DOM supprimée');
              } catch (e) {}
            }
          }
        });
      });
    });
 
    observer.observe(document.documentElement, {
      childList: true,
      subtree: true
    });
 
    // 7. Fonction pour détecter les URLs suspectes
    function isSuspiciousURL(url) {
      const suspicious = [
        'doubleclick', 'googlesyndication', 'google-analytics', 
        'facebook.com/tr', 'analytics', 'adserver', 'ads.', 'ad.', 
        'popup', 'redirect', 'utm_', 'banner', 'clickserve', 'pagead'
      ];
      return suspicious.some(s => url.includes(s));
    }
 
    // 8. Bloquer showModalDialog et alert
    window.showModalDialog = function() { return null; };
    window.alert = function() { return null; };
    window.confirm = function() { return true; };
    window.prompt = function() { return null; };;
 
    var SOURCES={
      1:"https://viewembed.ru/channel/CanalSport1%5BFrance%5D",
      2:"https://viewembed.ru/channel/CanalSport1%5BFrance%5D",
      3:"https://viewembed.ru/channel/CanalSport1%5BFrance%5D"
    };
 
    function setActive(id){
      [1,2,3].forEach(function(n){
        var b=document.getElementById("btn"+n);
        if(b) b.className=(n===id)?"source-btn active px-6":"source-btn inactive px-6";
      });
    }
 
    function loadVideo(id){
      var c=document.getElementById("cover"); 
      if(c) c.style.display="none";
      setActive(id);
      var target=document.getElementById("videoTarget");
      var url=SOURCES[id];
      
      if(!url||url==="#"){
        target.innerHTML='<div style="width:100%;height:100%;display:grid;place-items:center;color:rgba(255,255,255,.7);font-weight:900">Chargement en cours...</div>';
        return;
      }
      
      target.innerHTML='<iframe src="'+url+'" allow="autoplay;fullscreen;picture-in-picture" referrerpolicy="no-referrer-when-downgrade" sandbox="allow-forms allow-scripts allow-same-origin allow-presentation allow-popups" style="width:100%;height:100%;border:0"></iframe>';
    }
 
    // Auto-play au chargement
    window.addEventListener('load', function(){
      setTimeout(function(){
        loadVideo(1);
      }, 500);
    });
  </script>
</body>
</html>
