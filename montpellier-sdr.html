<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lecteur Sport - Anti Pop-up</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: sans-serif;
        }

        .video-wrapper {
            position: relative;
            width: 90%;
            max-width: 1000px;
            aspect-ratio: 16 / 9;
            background: #111;
            border: 2px solid #333;
            overflow: hidden;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Le bouclier qui intercepte le premier clic */
        #shield {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5); /* Semi-transparent au début */
            z-index: 999;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background 0.3s;
        }

        #shield:hover {
            background: rgba(0, 0, 0, 0.2);
        }

        .play-hint {
            color: white;
            padding: 15px 25px;
            background: #e50914;
            border-radius: 50px;
            font-weight: bold;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            pointer-events: none; /* Le clic passe à travers le texte vers le shield */
        }
    </style>
</head>
<body>

<div class="video-wrapper">
    <iframe 
        id="stream-iframe"
        src="https://viewembed.ru/channel/CanalSport1%5BFrance%5D" 
        allowfullscreen 
        scrolling="no">
    </iframe>

    <div id="shield" onclick="unlockPlayer()">
        <div class="play-hint">Cliquez ici pour charger la vidéo</div>
    </div>
</div>

<script>
    function unlockPlayer() {
        const shield = document.getElementById('shield');
        
        // On cache le bouclier au premier clic
        shield.style.display = 'none';
        
        console.log("Premier clic intercepté. Le lecteur est débloqué.");
        
        // Optionnel : On peut forcer un refresh de l'iframe si besoin au premier clic
        // document.getElementById('stream-iframe').src = document.getElementById('stream-iframe').src;
    }
</script>

</body>
</html>
