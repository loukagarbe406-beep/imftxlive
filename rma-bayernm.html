<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>IMFTX+ — Real Madrid - Bayern Munich</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
  <script src="https://cdn.jwplayer.com/libraries/IDzF9Zmk.js"></script>

  <style>
    html,body{height:100%;margin:0}
    body{
      font-family:'Outfit',sans-serif;
      color:#fff;
      overflow-x:hidden;
      background:
        linear-gradient(135deg,rgba(10,10,12,.95) 0%,rgba(10,10,12,.34) 40%,rgba(10,10,12,.34) 100%),
        url("https://thumb.canalplus.pro/bran/unsafe/2560x668/filters:quality(80)/image/695f89b989950/uploads/media/myCANAL_Cover_web_2760x720_47.jpg") center/cover no-repeat fixed;
    }

    .glass{
      background:rgba(255,255,255,.08);
      border:1px solid rgba(255,255,255,.10);
      box-shadow:0 30px 120px rgba(0,0,0,.75);
      backdrop-filter:blur(14px)
    }

    .player-box{
      border-radius:20px;
      overflow:hidden;
      position:relative
    }

    iframe{
      width:100%;
      height:100%;
      border:0;
      background:#000;
      display:block
    }

    #jwplayer-container{
      width:100%;
      height:100%;
      background:#000;
    }

    #jwplayer-container .jwplayer{
      width:100% !important;
      height:100% !important;
    }

    .source-btn{
      height:42px;
      border-radius:12px;
      font-weight:900;
      font-size:13px;
      transition:.2s
    }

    .source-btn.active{
      background:#fff;
      color:#000
    }

    .source-btn.inactive{
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.08);
      color:#fff
    }

    .watch-bar{
      border-radius:16px;
      padding:14px 16px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:14px
    }

    .watch-left{
      display:flex;
      align-items:center;
      gap:12px;
      min-width:0
    }

    .watch-left img{
      width:36px;
      height:36px;
      object-fit:contain;
      filter:drop-shadow(0 6px 12px rgba(0,0,0,.75))
    }

    .watch-text{
      min-width:0;
      line-height:1.1
    }

    .watch-text .small{
      opacity:.75;
      font-weight:700;
      font-size:13px
    }

    .watch-text .big{
      font-weight:900;
      font-size:15px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis
    }

    .channel-logo{
      width:92px;
      height:auto;
      object-fit:contain;
      filter:drop-shadow(0 6px 12px rgba(0,0,0,.75))
    }

    .chat-box{
      border-radius:20px;
      overflow:hidden;
      min-height:520px
    }

    .chat-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:12px 14px;
      border-bottom:1px solid rgba(255,255,255,.10)
    }

    .chat-head .title{
      font-weight:900
    }

    .chat-head .sub{
      font-size:12px;
      opacity:.7;
      font-weight:700
    }

    .countdown-screen{
      position:absolute;
      inset:0;
      z-index:20;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      background:
        radial-gradient(circle at center, rgba(20,20,20,.20) 0%, rgba(4,8,8,.78) 60%, rgba(3,6,6,.94) 100%),
        linear-gradient(180deg, rgba(0,0,0,.50) 0%, rgba(0,0,0,.72) 100%);
      padding:30px;
    }

    .countdown-inner{
      max-width:900px;
      width:100%;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
    }

    .countdown-kicker{
      font-size:13px;
      letter-spacing:.18em;
      text-transform:uppercase;
      color:rgba(255,255,255,.58);
      font-weight:700;
      margin-bottom:18px;
    }

    .countdown-logos{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:28px;
      margin-bottom:26px;
    }

    .countdown-logo{
      width:72px;
      height:72px;
      object-fit:contain;
      filter:drop-shadow(0 10px 22px rgba(0,0,0,.85));
    }

    .countdown-vs{
      font-size:18px;
      font-weight:900;
      opacity:.9;
      letter-spacing:.12em;
    }

    .countdown-timer{
      font-size:96px;
      line-height:1;
      font-weight:900;
      letter-spacing:.04em;
      color:#f4f4f4;
      margin:8px 0 12px;
      text-shadow:0 8px 40px rgba(0,0,0,.5);
      font-variant-numeric:tabular-nums;
    }

    .countdown-sub{
      font-size:15px;
      color:rgba(255,255,255,.62);
      font-weight:500;
    }

    @media(max-width:1024px){
      .chat-box{min-height:420px}
      .countdown-logo{width:56px;height:56px}
      .countdown-timer{font-size:68px}
    }

    @media(max-width:640px){
      .countdown-screen{padding:16px}
      .countdown-logo{width:42px;height:42px}
      .countdown-vs{font-size:13px}
      .countdown-timer{font-size:42px}
      .countdown-sub{font-size:12px}
      .countdown-logos{gap:14px}
    }
  </style>
</head>
<body>
  <nav class="sticky top-0 z-40 bg-black/30 backdrop-blur-xl border-b border-white/10">
    <div class="max-w-screen-2xl mx-auto px-6 py-3 flex items-center justify-between">
      <div class="text-2xl md:text-3xl font-extrabold tracking-tight">IMFTX+</div>
      <a href="index.html" class="inline-flex items-center gap-2 px-4 h-10 rounded-full bg-white/10 border border-white/10 hover:bg-white/15 font-bold text-sm active:scale-95 transition">
        <i class="fa-solid fa-arrow-left"></i> Retour
      </a>
    </div>
  </nav>

  <main class="max-w-screen-2xl mx-auto px-6 py-8">
    <section class="grid grid-cols-1 lg:grid-cols-[1fr_420px] gap-6">
      <div>
        <div class="player-box glass w-full aspect-video">
          <div id="countdownScreen" class="countdown-screen">
            <div class="countdown-inner">
              <div class="countdown-kicker">Diffusion à venir</div>

              <div class="countdown-logos">
                <img class="countdown-logo" src="https://empire-sport.art/upload/teams/6ahvcpskwfxjbcdpvw7bwkqs2vjyw8.png" alt="Real Madrid">
                <div class="countdown-vs">VS</div>
                <img class="countdown-logo" src="https://empire-sport.art/upload/teams/y9c9dznfiqh0tjnacubyxyigmdjdud.png" alt="Bayern Munich">
              </div>

              <div id="countdownTimer" class="countdown-timer">00:00:00</div>
              <div id="countdownSub" class="countdown-sub">Le lecteur s’affichera automatiquement à 20h00.</div>
            </div>
          </div>

          <div id="jwplayer-container" class="w-full h-full"></div>
        </div>

        <div class="mt-4 flex flex-wrap gap-3">
          <button id="btn1" onclick="loadVideo(1)" class="source-btn active px-6">Source 1</button>
          <button id="btn2" onclick="loadVideo(2)" class="source-btn inactive px-6">Source 2 (HD)</button>
          <button id="btn3" onclick="loadVideo(3)" class="source-btn inactive px-6">Source 3</button>

          <div style="display:flex;align-items:center;gap:8px;margin-left:auto">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="red" viewBox="0 0 16 16">
              <path d="M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6m2-3a2 2 0 1 1-4 0 2 2 0 0 1 4 0m4 8c0 1-1 1-1 1H3s-1 0-1-1 1-4 6-4 6 3 6 4m-1-.004c-.001-.246-.154-.986-.832-1.664C11.516 10.68 10.289 10 8 10s-3.516.68-4.168 1.332c-.678.678-.83 1.418-.832 1.664z"/>
            </svg>
            <span data-viewer-counter="rma-bayernm" id="counterMatch1" style="color:#F54927;font-family:Arial,sans-serif;font-weight:bold"></span>
          </div>
        </div>

        <div class="mt-5 watch-bar glass">
          <div class="watch-left">
            <img src="https://empire-sport.art/upload/leagues/lnjvd4afeukdyr5agooauznrzjyeoh.png" alt="Compétition">
            <div class="watch-text">
              <div class="small">Vous regardez</div>
              <div class="big">Real Madrid - Bayern Munich</div>
              <div class="small">Ligue Des Champions · 21:00</div>
            </div>
          </div>
          <img class="channel-logo" src="https://empire-sport.art/upload/chaines/kanfbbzfcksnfvc5sbw5nnzv1zliki.png" alt="Chaîne">
        </div>
      </div>

      <aside class="chat-box glass">
        <div class="chat-head">
          <div>
            <div class="title">Chat en direct</div>
            <div class="sub">Parler avec tout le respect !</div>
          </div>
          <a class="text-xs font-extrabold px-3 h-9 inline-flex items-center rounded-full bg-white/10 border border-white/10 hover:bg-white/15"
             href="https://www.twitch.tv/popout/drem0h/chat?popout="
             target="_blank"
             rel="noreferrer">
             Ouvrir
          </a>
        </div>
        <div style="height:calc(100% - 54px);min-height:520px">
          <iframe id="chatFrame" src=""></iframe>
        </div>
      </aside>
    </section>
  </main>

  <script>
    var playerInstance;
    var hasStarted = false;

    var SOURCES = {
      1: "https://cluone.dad/live/388FAA8743C4E2980F7B4089B7E81087/7.m3u8",
      2: "https://cluone.dad/live/388FAA8743C4E2980F7B4089B7E81087/7.m3u8",
      3: "https://cluone.dad/live/388FAA8743C4E2980F7B4089B7E81087/7.m3u8"
    };

    // Date du match
    var MATCH_YEAR = 2026;
    var MATCH_MONTH = 5; // mai
    var MATCH_DAY = 7;

    // Ouverture à 20h00 heure française
    var OPEN_HOUR_FR = 20;
    var OPEN_MINUTE_FR = 0;
    var OPEN_SECOND_FR = 0;

    (function () {
      var d = window.location.hostname;
      document.getElementById("chatFrame").src =
        "https://www.twitch.tv/embed/drem0h/chat?darkpopout&parent=" + encodeURIComponent(d);
    })();

    function setActive(id) {
      [1,2,3].forEach(function (n) {
        var b = document.getElementById("btn" + n);
        if (b) {
          b.className = (n === id)
            ? "source-btn active px-6"
            : "source-btn inactive px-6";
        }
      });
    }

    function initPlayer(source) {
      if (window.playerInstance && typeof window.playerInstance.remove === "function") {
        try { window.playerInstance.remove(); } catch (e) {}
      }

      var container = document.getElementById("jwplayer-container");
      if (container) container.innerHTML = "";

      playerInstance = jwplayer("jwplayer-container").setup({
        file: source,
        type: "hls",
        width: "100%",
        height: "100%",
        aspectratio: "16:9",
        autostart: true,
        primary: "html5",
        hlshtml: true,
        stretching: "uniform",
        preload: "metadata",
        controls: true,
        displaytitle: false,
        displaydescription: false
      });
    }

    function pad(n) {
      return String(n).padStart(2, "0");
    }

    function getParisNowParts() {
      var parts = new Intl.DateTimeFormat("fr-FR", {
        timeZone: "Europe/Paris",
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hourCycle: "h23"
      }).formatToParts(new Date());

      var out = {};
      parts.forEach(function(p){
        if (p.type !== "literal") out[p.type] = p.value;
      });

      return {
        year: Number(out.year),
        month: Number(out.month),
        day: Number(out.day),
        hour: Number(out.hour),
        minute: Number(out.minute),
        second: Number(out.second)
      };
    }

    function getParisNowAsMs() {
      var p = getParisNowParts();
      return Date.UTC(p.year, p.month - 1, p.day, p.hour, p.minute, p.second);
    }

    function getOpenParisMs() {
      return Date.UTC(
        MATCH_YEAR,
        MATCH_MONTH - 1,
        MATCH_DAY,
        OPEN_HOUR_FR,
        OPEN_MINUTE_FR,
        OPEN_SECOND_FR
      );
    }

    function formatCountdown(ms) {
      if (ms <= 0) return "00:00:00";

      var totalSeconds = Math.floor(ms / 1000);
      var hours = Math.floor(totalSeconds / 3600);
      var minutes = Math.floor((totalSeconds % 3600) / 60);
      var seconds = totalSeconds % 60;

      return pad(hours) + ":" + pad(minutes) + ":" + pad(seconds);
    }

    function startStreamAutomatically() {
      if (hasStarted) return;
      hasStarted = true;

      var screen = document.getElementById("countdownScreen");
      if (screen) screen.style.display = "none";

      setActive(1);
      initPlayer(SOURCES[1]);
    }

    function updateCountdown() {
      var nowMs = getParisNowAsMs();
      var openMs = getOpenParisMs();

      var timer = document.getElementById("countdownTimer");
      var sub = document.getElementById("countdownSub");

      if (nowMs >= openMs) {
        if (timer) timer.textContent = "00:00:00";
        if (sub) sub.textContent = "Le direct est disponible.";
        startStreamAutomatically();
        return;
      }

      var diff = openMs - nowMs;
      if (timer) timer.textContent = formatCountdown(diff);
      if (sub) sub.textContent = "Le lecteur s’affichera automatiquement à 20h00 (heure française).";
    }

    function loadVideo(id) {
      if (getParisNowAsMs() < getOpenParisMs()) return;

      var screen = document.getElementById("countdownScreen");
      if (screen) screen.style.display = "none";

      setActive(id);
      initPlayer(SOURCES[id]);
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);
  </script>

  <script type="module" src="./js/viewerCounter.js"></script>
</body>
</html>
