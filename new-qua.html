<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <style>
        .video-container {
            position: relative;
            width: 100%;
            max-width: 800px; /* Ajuste à ta guise */
            margin: auto;
            background: #000;
        }
        
        /* L'iframe du match */
        iframe {
            width: 100%;
            aspect-ratio: 16 / 9;
            border: none;
        }

        /* LE BOUCLIER : Il est au-dessus de l'iframe au début */
        #shield {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 999;
            background: rgba(0,0,0,0); /* Invisible */
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="video-container">
    <div id="shield"></div>
    <iframe 
        id="player"
        src="https://pooembed.eu/embed/ligue1/2026-03-21/nice-psg#autoplay" 
        allow="autoplay; fullscreen" 
        allowfullscreen>
    </iframe>
</div>

<script>
    const shield = document.getElementById('shield');
    const player = document.getElementById('player');

    // 1. Bloquer window.open au cas où la pub arrive à sortir
    window.open = function() { return null; };

    // 2. Gérer le clic sur le bouclier
    shield.addEventListener('click', function() {
        console.log("Clic de pub intercepté !");
        
        // On rend le bouclier "cliquable à travers" (fantôme)
        // Cela permet au DEUXIÈME clic de toucher le vrai bouton Play
        shield.style.pointerEvents = 'none';

        // On remet le bouclier après 10 secondes au cas où l'utilisateur 
        // veut mettre en pause plus tard (souvent une 2ème pub attend)
        setTimeout(() => {
            shield.style.pointerEvents = 'auto';
            console.log("Bouclier réactivé pour la suite.");
        }, 10000);
    });

    // 3. Empêcher l'iframe de rediriger TA page (Frame-Busting)
    window.onbeforeunload = function() {
        return "Tentative de pub bloquée !";
    };
</script>

</body>
</html>
