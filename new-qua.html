<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lecteur Stream Clean</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; background: #000; overflow: hidden; }
        .video-wrapper { position: relative; width: 100%; height: 100%; }
        iframe { width: 100%; height: 100%; border: none; }
        .overlay-blocker { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            z-index: 10; pointer-events: none; 
        }
    </style>
</head>
<body>

<div class="video-wrapper">
    <iframe 
        id="stream-player"
        src="https://goodstream.site/embed.php?token=9e33c92be6" 
        allowfullscreen>
    </iframe>
</div>

<script>
    // 1. On neutralise la fonction window.open
    const originalOpen = window.open;
    window.open = function() {
        console.log("Tentative de pop-up bloquée !");
        return null; // On ne retourne rien, donc la fenêtre ne s'ouvre pas
    };

    // 2. Protection contre le "Focus Stealing" (quand le site essaie de forcer l'ouverture)
    window.onblur = function() {
        setTimeout(function() {
            window.focus();
        }, 100);
    };

    // 3. Empêcher les clics fantômes sur la page parente
    document.addEventListener('click', function(e) {
        // Si le clic n'est pas sur le lecteur, on l'annule
        if (e.target.tagName !== 'IFRAME') {
            // Optionnel : on peut loguer ici
        }
    }, true);
</script>

</body>
</html>
