<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>IMFTX+ Live</title>

<style>
body{
margin:0;
background:black;
}

#player{
position:relative;
width:100%;
height:100vh;
}

iframe{
width:100%;
height:100%;
border:none;
}

/* couche transparente anti clic pub */
#antiClick{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
z-index:10;
}
</style>
</head>

<body>

<div id="player">

<iframe src="https://viewembed.ru/channel/CanalSport1%5BFrance%5D"></iframe>

<div id="antiClick"></div>

</div>

<script>

// bloque les popups
window.open=function(){return null}

// enlève la protection si l'utilisateur veut cliquer play
document.getElementById("antiClick").addEventListener("click",function(){
this.style.display="none"
})

</script>

</body>
</html>
