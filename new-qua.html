<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <style>
        .stream-wrapper {
            position: relative;
            width: 100%;
            max-width: 900px;
            margin: 20px auto;
            background: #000;
        }

        /* L'iframe reste en dessous */
        iframe {
            width: 100%;
            aspect-ratio: 16 / 9;
            border: none;
            z-index: 1;
        }

        /* TA COUCHE DE LIEN PAR-DESSUS */
        .click-killer {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 10; /* Toujours au-dessus */
            display: block;
            text-decoration: none;
            background: rgba(0,0,0,0); /* Invisible mais cliquable */
        }
        
        .click-killer.disabled {
            display: none; /* Disparaît pour laisser jouer le match */
        }
    </style>
</head>
<body>

<div class="stream-wrapper">
    <a href="javascript:void(0)" class="click-killer" id="ad-shield"></a>

    <iframe 
        id="player"
        src="https://pooembed.eu/embed/ligue1/2026-03-21/nice-psg#autoplay" 
        allowfullscreen>
    </iframe>
</div>

<script>
    const shield = document.getElementById('ad-shield');

    // On tue window.open au niveau de la page hôte
    window.open = function() { return null; };

    shield.addEventListener('click', function(e) {
        // On empêche le clic de faire quoi que ce soit d'autre
        e.preventDefault();
        e.stopPropagation();

        console.log("Premier clic (pub potentielle) absorbé par le lien fantôme.");

        // On enlève le bouclier pour que l'utilisateur puisse cliquer sur PLAY
        shield.classList.add('disabled');

        // PROTECTION : On remet le bouclier après 8 secondes 
        // pour bloquer la pub qui apparaît quand on veut mettre PAUSE
        setTimeout(() => {
            shield.classList.remove('disabled');
            console.log("Lien fantôme réactivé.");
        }, 8000);
    });

    // Empêche la page de se rafraîchir vers une pub (Frame Busting)
    window.onbeforeunload = function() {
        return "Rester sur le match ?";
    };
</script>

</body>
</html>
