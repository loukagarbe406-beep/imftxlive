<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Lecteur Anti-Pop-up</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #000; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <iframe 
        id="player"
        src="https://viewembed.ru/channel/CanalSport2%5BFrance%5D" 
        allowfullscreen>
    </iframe>

    <script>
        // Neutralise la fonction d'ouverture de fenêtre au niveau du parent
        window.open = function() {
            console.log("Pop-up bloquée avec succès !");
            return null;
        };

        // Tentative de bloquer les pop-ups qui passeraient par des liens ciblés
        document.addEventListener('click', function(e) {
            if (e.target.tagName === 'A' && e.target.target === '_blank') {
                e.preventDefault();
            }
        }, true);
    </script>

</body>
</html>
