<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>LIVE : Nice vs PSG - Flux Protégé</title>
    <style>
        body { margin: 0; padding: 0; background-color: #0b0e14; color: white; font-family: sans-serif; overflow: hidden; }
        
        .main-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100vw;
        }

        /* Conteneur Vidéo */
        .player-wrapper {
            position: relative;
            width: 90%;
            max-width: 1000px;
            aspect-ratio: 16 / 9;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
            background: #000;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* LE BOUCLIER ANTI-CLIC */
        #anti-pop-shield {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 9999;
            background: rgba(0,0,0,0); /* Invisible */
            cursor: pointer;
        }

        /* Petit message d'info */
        .info-bar {
            background: #e63946;
            padding: 10px 20px;
            border-radius: 5px;
            margin-bottom: 15px;
            font-size: 14px;
            font-weight: bold;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.7; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

<div class="main-container">
    
    <div class="info-bar" id="status-msg">
        🛡️ PROTECTION ACTIVE : CLIQUEZ 2 FOIS POUR LANCER LE MATCH SANS PUB
    </div>

    <div class="player-wrapper">
        <div id="anti-pop-shield"></div>

        <iframe 
            id="video-player"
            src="https://goodstream.site/embed.php?token=707d3ad5d0" 
            allow="autoplay; fullscreen" 
            allowfullscreen>
        </iframe>
    </div>

</div>

<script>
    /**
     * 1. PROTECTION GLOBALE DU SITE
     */
    (function() {
        const killPop = () => {
            window.open = function() { 
                console.log("Pop-up bloqué !"); 
                return { focus: () => {}, close: () => {} }; 
            };
        };
        killPop();

        // On réinitialise le blocage à chaque clic sur le document
        document.addEventListener('click', killPop, true);

        // Anti-redirection (Tab-jacking)
        window.onbeforeunload = function() {
            return "Une pub tente de vous rediriger. Rester sur le match ?";
        };
    })();

    /**
     * 2. GESTION DU BOUCLIER SUR L'IFRAME
     */
    const shield = document.getElementById('anti-pop-shield');
    const msg = document.getElementById('status-msg');

    shield.addEventListener('click', function() {
        // Le 1er clic "mange" la pub
        console.log("Bouclier : Première tentative de pub absorbée.");
        
        // On désactive le bouclier pour laisser passer le 2ème clic vers le bouton Play
        shield.style.pointerEvents = 'none';
        
        // On change le message
        msg.style.background = "#2a9d8f";
        msg.innerText = "✅ SÉCURISÉ : CLIQUEZ MAINTENANT SUR LE BOUTON PLAY";

        // On remet la protection après 10 secondes (si l'utilisateur veut mettre pause/volume)
        setTimeout(() => {
            shield.style.pointerEvents = 'auto';
            msg.style.background = "#e63946";
            msg.innerText = "🛡️ PROTECTION RÉACTIVÉE (ANTIP-POP)";
        }, 10000);
    });
</script>

</body>
</html>
