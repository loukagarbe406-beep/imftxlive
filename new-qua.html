<script>
// Bloque window.open (popups)
window.open = function () {
    console.log("Popup bloquée");
    return null;
};

// Bloque les redirections forcées
Object.defineProperty(window, 'location', {
    value: window.location,
    writable: false
});

// Empêche les clics qui ouvrent des pubs
document.addEventListener("click", function(e) {
    if (e.target.tagName === "A") {
        e.preventDefault();
    }
}, true);

// Bloque les scripts qui essayent d'ouvrir une nouvelle page
window.addEventListener("beforeunload", function(e) {
    e.preventDefault();
    e.returnValue = '';
});
</script>
