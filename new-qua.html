<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Nice-PSG Autoplay</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <iframe 
        id="player"
        src="https://pooembed.eu/embed/ligue1/2026-03-21/nice-psg#autoplay" 
        allow="autoplay; fullscreen; encrypted-media" 
        allowfullscreen>
    </iframe>

<script>
    /* ANTI-POP UP SANS SANDBOX */
    
    // On remplace window.open par une fonction qui ne fait rien
    window.open = function() { return null; };

    // On surveille si l'iframe tente de rediriger la page principale (Frame Busting)
    var prevent_bust = 0;
    window.onbeforeunload = function() { prevent_bust++; };
    
    setInterval(function() {
        if (prevent_bust > 0) {
            prevent_bust -= 2;
            window.top.location = 'about:blank'; // Bloque la redirection si elle est tentée
        }
    }, 1);

    // Note : Pour que l'autoplay marche à 100% sur Chrome/Edge, 
    // il faudra peut-être cliquer une seule fois n'importe où sur la page 
    // pour "activer" le son, car les navigateurs l'exigent.
</script>

</body>
</html>
