<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Stream Ultra-Protect</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; }
        .container { width: 100vw; height: 100vh; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

<div class="container">
    <iframe 
        id="match-frame"
        src="https://goodstream.site/embed.php?token=707d3ad5d0" 
        allow="autoplay; fullscreen" 
        allowfullscreen>
    </iframe>
</div>

<script>
    // 1. NEUTRALISATION RADICALE
    // On bloque window.open et on vide les fonctions de redirection
    const kill = () => {
        window.open = function() { return { focus: function(){}, close: function(){} }; };
    };
    
    // On exécute le blocage en boucle infinie (toutes les 100ms) 
    // pour contrer les scripts de l'iframe qui tenteraient de le réinitialiser.
    setInterval(kill, 100);

    // 2. ANTI-TAB-JACKING (Le plus important)
    // Empêche l'onglet actuel de devenir une pub.
    window.onbeforeunload = function() {
        return "NON"; // Affiche une popup de confirmation si une pub tente de partir
    };

    // 3. CAPTURE DE FOCUS
    // Si une pub s'ouvre dans un nouvel onglet malgré tout, 
    // on force le focus à revenir sur le match immédiatement.
    window.addEventListener('blur', function() {
        setTimeout(() => {
            window.focus();
            console.log("Focus récupéré !");
        }, 50);
    });

    // 4. SUPPRESSION DES CLICS SUR LA PAGE PARENTE
    document.addEventListener('click', function(e) {
        kill();
    }, true);
</script>

</body>
</html>
