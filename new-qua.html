<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>IMFTX+ Live</title>

<style>
body{
margin:0;
background:black;
}

#player{
position:relative;
width:100%;
height:100vh;
}

iframe{
width:100%;
height:100%;
border:none;
}

#blocker{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
z-index:10;
cursor:pointer;
}
</style>
</head>

<body>

<div id="player">

<iframe src="https://viewembed.ru/channel/CanalSport1%5BFrance%5D"></iframe>

<div id="blocker"></div>

</div>

<script>

let clicks = 0;

document.getElementById("blocker").addEventListener("click", function(e){

clicks++;

// bloque les 2 premières pubs
if(clicks <= 2){
e.preventDefault();
console.log("Pub bloquée");
}

// après 2 clics on enlève le blocage
if(clicks > 2){
this.style.display = "none";
}

});

// bloque les popups
window.open = function(){
return null;
};

</script>

</body>
</html>
