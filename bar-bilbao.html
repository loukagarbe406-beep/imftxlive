<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Player</title>
  <meta name="referrer" content="origin">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; }
    .player-wrapper {
      width: 100%;
      max-width: 960px;
      aspect-ratio: 16/9;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>

  <script>
    // Bloque AVANT le chargement de la page
    window.open = function() { return null; };
    window.alert = function() {};
    window.confirm = function() { return false; };
  </script>
</head>
<body>

  <div class="player-wrapper">
    <iframe
      id="player"
      src="https://viewembed.ru/channel/CanalSport%5BFrance%5D"
      referrerpolicy="origin"
      allowfullscreen
    ></iframe>
  </div>

  <script>
    // Re-bloque après chargement
    window.open = function() { return null; };

    const iframe = document.getElementById('player');

    iframe.addEventListener('load', () => {
      try {
        iframe.contentWindow.open = function() { return null; };
      } catch(e) {}
    });

    // Bloque les clics qui tentent d'ouvrir un nouvel onglet
    document.addEventListener('click', (e) => {
      const t = e.target.closest('a');
      if (t && t.target === '_blank') {
        e.preventDefault();
        e.stopPropagation();
      }
    }, true);

    // Bloque les redirections
    const blocked = window.location.href;
    setInterval(() => {
      if (window.location.href !== blocked) {
        window.location.href = blocked;
      }
    }, 100);
  </script>

</body>
</html>
