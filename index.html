<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>IMFTX+ — Live</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

  <style>
    html,body{
      height:100%;margin:0;
      font-family:'Outfit',system-ui,-apple-system,"Segoe UI",Roboto,Arial;
      background:#0e0f12;
      color:#fff;
    }

    .match-row{
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:20px 16px;
      border-radius:18px;
      background:rgba(255,255,255,.03);
      border:1px solid rgba(255,255,255,.06);
      box-shadow:0 18px 60px rgba(0,0,0,.55);
    }

    .match-left{
      display:flex;
      align-items:center;
      gap:20px;
    }

    .match-time{
      font-weight:900;
      font-size:26px;
      color:#ff2e2e;
      min-width:78px;
      text-align:left;
    }

    .beins{
      width:58px;
      height:28px;
      object-fit:contain;
      border-radius:6px;
      background:#fff;
      padding:2px;
    }

    .match-title{
      font-weight:900;
      font-size:24px;
      letter-spacing:.02em;
      text-transform:uppercase;
    }

    .match-sub{
      font-weight:700;
      color:rgba(255,255,255,.55);
      font-size:14px;
      margin-top:2px;
    }

    .btn-arrow{
      font-size:28px;
      font-weight:900;
      opacity:.8;
      transition:.15s;
    }
    .btn-arrow:hover{
      opacity:1;
      transform:translateX(4px);
    }

    @media(max-width:768px){
      .match-time{font-size:20px;min-width:60px}
      .match-title{font-size:18px}
      .beins{width:48px;height:24px}
    }
  </style>
</head>

<body>

<!-- NAVBAR -->
<nav class="sticky top-0 z-40 bg-black/20 backdrop-blur-xl border-b border-white/5">
  <div class="max-w-screen-2xl mx-auto px-6 py-3 flex items-center justify-between">
    <div class="text-3xl font-extrabold tracking-tight">IMFTX+</div>

    <!-- RÉSEAUX -->
    <div class="flex items-center gap-4 text-lg font-bold">
      <a href="https://t.me/+jdy9nGJ3rFFiOWI0" target="_blank" class="opacity-70 hover:opacity-100">
        <i class="fa-brands fa-telegram"></i>
      </a>
      <a href="https://discord.gg/4ZFv9sa8" target="_blank" class="opacity-70 hover:opacity-100">
        <i class="fa-brands fa-discord"></i>
      </a>
      <a href="https://discord.gg/FmWwePH5ET" target="_blank"
         class="opacity-80 hover:opacity-100 text-sm px-3 py-1 rounded-full bg-white/10 border border-white/10">
        IPTV
      </a>
    </div>
  </div>
</nav>

<main class="max-w-screen-2xl mx-auto px-6 py-10">

  <header class="text-center mb-10">
    <h1 class="text-4xl md:text-5xl font-extrabold">IMFTX+ LIVE</h1>
    <p class="mt-2 text-zinc-400 max-w-xl mx-auto font-semibold">
      N°1 des meilleurs diffuseurs
    </p>
  </header>

  <div class="flex flex-col gap-5">

    <!-- ✅ MATCH 1 -->
    <div class="match-row cursor-pointer" onclick="openCustomStream('nigeria-mozambique')">
      <div class="match-left">
        <div class="match-time">20:00</div>
        <img class="beins" src="https://upload.wikimedia.org/wikipedia/commons/9/92/BeIN_Sports_logo.svg" alt="beIN">
        <div>
          <div class="match-title">Nigéria · Mozambique</div>
          <div class="match-sub">Match International</div>
        </div>
      </div>
      <div class="btn-arrow">›</div>
    </div>

    <!-- ✅ MATCH 2 -->
    <div class="match-row cursor-pointer" onclick="openCustomStream('montpellier-dunkerque')">
      <div class="match-left">
        <div class="match-time">20:45</div>
        <img class="beins" src="https://upload.wikimedia.org/wikipedia/commons/9/92/BeIN_Sports_logo.svg" alt="beIN">
        <div>
          <div class="match-title">Montpellier · Dunkerque</div>
          <div class="match-sub">Ligue 2</div>
        </div>
      </div>
      <div class="btn-arrow">›</div>
    </div>

    <!-- ✅ MATCH 3 -->
    <div class="match-row cursor-pointer" onclick="openCustomStream('leicester-westbrom')">
      <div class="match-left">
        <div class="match-time">21:00</div>
        <img class="beins" src="https://upload.wikimedia.org/wikipedia/commons/9/92/BeIN_Sports_logo.svg" alt="beIN">
        <div>
          <div class="match-title">Leicester · West Brom</div>
          <div class="match-sub">Championship</div>
        </div>
      </div>
      <div class="btn-arrow">›</div>
    </div>

  </div>

  <footer class="w-full mt-20 text-center text-sm opacity-70 pb-6">
    <p class="font-semibold">IMFTX+ — Plateforme de streaming</p>
  </footer>

</main>

<script>
  function openCustomStream(matchId) {
    window.location.href = matchId + ".html";
  }
</script>

</body>
</html>
