<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Test Index</title>
  <style>
    body{font-family:Arial,sans-serif;background:#111;color:#fff;padding:30px}
    .card{background:#1c1c1c;border:1px solid #333;border-radius:12px;padding:20px;max-width:420px}
    a{color:#fff;text-decoration:none}
    .viewer{color:#F54927;font-weight:bold}
  </style>
</head>
<body>
  <h1>Index test</h1>

  <div class="card">
    <h2>Real Madrid - Bayern Munich</h2>
    <p>Compteur : <span data-viewer-counter="rma-bayernm" class="viewer">0</span></p>
    <p><a href="stream-test.html">Ouvrir la page stream</a></p>
  </div>

  <script>
    function getViewerSessionId() {
      let sessionId = localStorage.getItem("live_session_id");
      if (!sessionId) {
        sessionId = "sess_" + Math.random().toString(36).slice(2) + Date.now();
        localStorage.setItem("live_session_id", sessionId);
      }
      return sessionId;
    }

    async function updateViewerCounter(el) {
      const pageSlug = el.getAttribute("data-viewer-counter");
      if (!pageSlug) return;

      const formData = new FormData();
      formData.append("page_slug", pageSlug);
      formData.append("session_id", getViewerSessionId() + "_" + pageSlug);
      formData.append("action", "ping");

      try {
        const res = await fetch("/viewer_ping.php", {
          method: "POST",
          body: formData
        });
        const data = await res.json();
        if (typeof data.viewers !== "undefined") {
          el.textContent = data.viewers;
        }
      } catch (e) {
        console.error(e);
      }
    }

    function updateAllViewerCounters() {
      document.querySelectorAll("[data-viewer-counter]").forEach(updateViewerCounter);
    }

    updateAllViewerCounters();
    setInterval(updateAllViewerCounters, 15000);
  </script>
</body>
</html>
