<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stream</title>

<style>
    body {
        margin: 0;
        background: black;
        color: white;
        font-family: Arial, sans-serif;
        display: flex;
        flex-direction: column;
        height: 100vh;
    }

    #player {
        flex: 1;
        width: 100%;
        border: none;
    }

    .buttons {
        display: flex;
        background: #111;
    }

    button {
        flex: 1;
        padding: 15px;
        background: #222;
        color: white;
        border: none;
        cursor: pointer;
        font-size: 16px;
    }

    button:hover {
        background: #444;
    }
</style>
</head>

<body>

<!-- PLAYER -->
<iframe
    id="player"
    src="https://bolaloca.my/player/4/40"
    allowfullscreen
    allow="autoplay">
</iframe>

<!-- BOUTONS -->
<div class="buttons">
    <button onclick="changePlayer(1)">Player 1</button>
    <button onclick="changePlayer(2)">Player 2</button>
    <button onclick="changePlayer(3)">Player 3</button>
</div>

<script>
    function changePlayer(n) {
        const player = document.getElementById("player");

        if (n === 1) player.src = "https://bolaloca.my/player/4/40";
        if (n === 2) player.src = "https://bolaloca.my/player/3/40";
        if (n === 3) player.src = "https://bolaloca.my/player/2/40";
    }
</script>

</body>
</html>
