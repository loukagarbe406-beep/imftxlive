<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="referrer" content="no-referrer-when-downgrade"/>

  <!-- (optionnel) -->
  <script disable-devtool-auto src="https://cdn.jsdelivr.net/npm/disable-devtool@latest" url="https://google.com"></script>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    window.tailwind = window.tailwind || {};
    tailwind.config = { darkMode: 'class' };
  </script>

  <script>
    const saved = localStorage.getItem('theme');
    if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    }
  </script>

  <script src="https://cdn.jsdelivr.net/npm/nprogress/nprogress.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/nprogress/nprogress.css" rel="stylesheet">

  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    #nprogress .bar { top: 64px !important; }
    #nprogress .spinner { top: 75px !important; }

    html, body { font-family: 'Outfit', sans-serif; }

    .dark body{
      background-image: url('https://cdn.jsdelivr.net/gh/Nyx0xFF/turbo-palm-tree/noise.png');
      background-repeat: repeat;
      background-size: 96px 96px;
    }

    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb {
      background-color: rgba(100, 100, 100, 0.4);
      border-radius: 10px;
      border: 2px solid transparent;
      background-clip: content-box;
    }
    ::-webkit-scrollbar-thumb:hover { background-color: rgba(100, 100, 100, 0.6); }
    * { scrollbar-width: thin; scrollbar-color: rgba(100, 100, 100, 0.4) transparent; }

    ::selection { background-color: #444; color: white; }

    body { display:flex; flex-direction:column; }
    button * { pointer-events:none; }

    /* --------- Match Cards (clean + uniform logos) --------- */
    .match-card{
      position:relative;
      overflow:hidden;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.04);
      box-shadow: 0 18px 70px rgba(0,0,0,.45);
      aspect-ratio: 16 / 9;
    }
    .match-bg{
      position:absolute; inset:0;
      background-size:cover;
      background-position:center;
      transform:scale(1.02);
      opacity:.96;
    }
    .match-overlay{
      position:absolute; inset:0;
      background:
        radial-gradient(700px 320px at 28% 55%, rgba(0,0,0,.35), transparent 60%),
        linear-gradient(90deg, rgba(0,0,0,.70) 0%, rgba(0,0,0,.45) 45%, rgba(0,0,0,.10) 100%);
    }

    .timer-pill{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:6px 10px;
      border-radius:999px;
      background: rgba(18,18,18,.62);
      border:1px solid rgba(255,255,255,.10);
      backdrop-filter: blur(8px);
      font-weight:800;
      font-size:12px;
      line-height:1;
      color: rgba(255,255,255,.92);
    }
    .timer-dot{
      width:8px;height:8px;border-radius:999px;background:#f59e0b;
      box-shadow:0 0 0 3px rgba(245,158,11,.12);
    }
    .timer-dot.live{
      background:#22c55e;
      box-shadow:0 0 0 3px rgba(34,197,94,.14);
    }
    .timer-text{ font-variant-numeric: tabular-nums; }

    .team-logo{
      width:30px;height:30px;
      display:flex;align-items:center;justify-content:center;
      flex:0 0 auto;
    }
    .team-logo img{
      width:100%;
      height:100%;
      object-fit:contain;
      display:block;
      filter: drop-shadow(0 1px 0 rgba(0,0,0,.35));
    }
    .vs{
      font-weight:800;
      font-size:12px;
      color: rgba(255,255,255,.68);
      letter-spacing:.02em;
    }
    .comp-wrap{
      width:26px;height:26px;
      display:flex;align-items:center;justify-content:center;
      flex:0 0 auto;
    }
    .comp-wrap img{
      width:100%;height:100%;
      object-fit:contain;
      filter: drop-shadow(0 1px 0 rgba(0,0,0,.35));
    }

    .match-title{
      font-size:15px;
      font-weight:500;
      line-height:1.15;
      color: rgba(255,255,255,.92);
    }
    .match-sub{
      font-size:12px;
      font-weight:600;
      color: rgba(255,255,255,.70);
      line-height:1.25;
    }

    .watch-pill{
      border-radius:999px;
      border:1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.10);
      backdrop-filter: blur(10px);
      color:#fff;
      font-weight:800;
      font-size:13px;
      padding:.60rem .90rem;
      display:inline-flex;
      align-items:center;
      gap:.55rem;
      transition: transform .15s ease, background .15s ease;
      white-space: nowrap;
    }
    .watch-pill:hover{ background: rgba(255,255,255,.14); }
    .watch-pill:active{ transform: scale(.98); }
    .play{
      width:32px;height:32px;border-radius:999px;
      border:1px solid rgba(255,255,255,.16);
      display:grid; place-items:center;
      background: rgba(0,0,0,.20);
    }

    @media (max-width: 640px){
      .team-logo{ width:28px; height:28px; }
      .match-title{ font-size:14px; }
      .watch-pill{ font-size:12px; padding:.55rem .80rem; }
    }
  </style>
</head>

<script>
  // -------- Sidebar toggle --------
  const burgerBtn = document.getElementById('burgerBtn');
  const sidebar = document.getElementById('sidebar');
  function openSidebar(){ sidebar.classList.remove('-translate-x-full'); }
  function closeSidebar(){ sidebar.classList.add('-translate-x-full'); }
  burgerBtn?.addEventListener('click', () => {
    const isClosed = sidebar.classList.contains('-translate-x-full');
    isClosed ? openSidebar() : closeSidebar();
  });

  // -------- Theme toggle --------
  const toggle = document.getElementById('theme-toggle');
  function setTheme(mode){
    if(mode === 'dark'){
      document.documentElement.classList.add('dark');
      localStorage.setItem('theme','dark');
    } else {
      document.documentElement.classList.remove('dark');
      localStorage.setItem('theme','light');
    }
  }
  toggle?.addEventListener('click', () => {
    const isDark = document.documentElement.classList.contains('dark');
    setTheme(isDark ? 'light' : 'dark');
  });

  // ✅ Timer: compte à rebours vers 21:00
  // - Quand c'est fini -> "EN COURS" (vert)
  // - Après 2h30 de live -> on repart sur le prochain 21:00 (donc le timer "recommence à zéro")
  const LIVE_WINDOW_MS = 2.5 * 60 * 60 * 1000; // 2h30

  function getStart21(baseDate){
    const d = new Date(baseDate);
    d.setHours(21,0,0,0);
    return d;
  }

  function getState(now){
    // start = aujourd'hui 21:00
    let start = getStart21(now);

    // si on est après (start + 2h30), on vise demain 21:00 (reset)
    if (now.getTime() >= start.getTime() + LIVE_WINDOW_MS) {
      start.setDate(start.getDate() + 1);
      start.setHours(21,0,0,0);
    }

    // si on est avant le start: countdown
    if (now.getTime() < start.getTime()) {
      return { mode: "countdown", start };
    }

    // sinon on est dans la fenêtre live (start -> start+2h30)
    return { mode: "live", start };
  }

  function formatRemaining(ms){
    if(ms <= 0) return "00h 00m 00s";
    const total = Math.floor(ms / 1000);
    const h = Math.floor(total / 3600);
    const m = Math.floor((total % 3600) / 60);
    const s = total % 60;
    const pad = (n) => String(n).padStart(2,"0");
    return `${pad(h)}h ${pad(m)}m ${pad(s)}s`;
  }

  // -------- Matches (juste 2) --------
  const MATCHES = [
    {
      title: "Lens - Le Havre",
      banner: "https://empire-sport.world/upload/banners/lens-vs-lorient.png",
      aLogo: "https://empire-sport.world/upload/teams/qgwro2iyxo1vba0bcib2q1yddk3fxr.png",
      bLogo: "https://empire-sport.world/upload/teams/poyamdm2uaxrxrbgqmfpm1dr1meyon.png",
      compLogo: "https://upload.wikimedia.org/wikipedia/fr/thumb/archive/d/d9/20240912231715%21Logo_Ligue_1_2024.svg/120px-Logo_Ligue_1_2024.svg.png",
      href: "lens-lehavre.html"
    },
    {
      title: "Multiplex Ligue 2",
      banner: "https://empire-sport.world/upload/cards/multiplex_59.png",
      // ✅ pas de logos équipe ici
      compLogo: "https://upload.wikimedia.org/wikipedia/fr/thumb/3/38/Logo_Ligue_2_BKT_2024.svg/500px-Logo_Ligue_2_BKT_2024.svg.png?20240530043909",
      href: "multiplex-L2.html"
    }
  ];

  function cardHTML(m){
    const hasTeams = !!(m.aLogo && m.bLogo);

    return `
      <a href="${m.href}" class="block">
        <article class="match-card">
          <div class="match-bg" style="background-image:url('${m.banner}')"></div>
          <div class="match-overlay"></div>

          <div class="absolute left-3 top-3">
            <span class="timer-pill" data-pill>
              <span class="timer-dot" data-dot></span>
              <span class="timer-text" data-timer>--</span>
            </span>
          </div>

          <div class="absolute inset-x-0 bottom-0 p-4">
            <div class="flex items-end justify-between gap-4">
              <div class="min-w-0 max-w-[72%]">
                ${
                  hasTeams
                    ? `
                      <div class="flex items-center gap-2">
                        <div class="team-logo"><img src="${m.aLogo}" alt=""></div>
                        <span class="vs">VS</span>
                        <div class="team-logo"><img src="${m.bLogo}" alt=""></div>
                      </div>
                    `
                    : ``
                }

                <div class="mt-2 flex items-center gap-2">
                  <div class="comp-wrap"><img src="${m.compLogo}" alt=""></div>
                  <div class="min-w-0">
                    <div class="match-title truncate">${m.title}</div>
                    <div class="match-sub">Aujourd’hui · 21:00</div>
                  </div>
                </div>
              </div>

              <span class="watch-pill">
                <span class="play">
                  <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none">
                    <path d="M10 8l8 4-8 4V8Z" fill="currentColor"/>
                  </svg>
                </span>
                REGARDER
              </span>
            </div>
          </div>
        </article>
      </a>
    `;
  }

  function render(){
    const el = document.getElementById('stream-list-principal');
    if(!el) return;
    el.innerHTML = MATCHES.map(cardHTML).join('');
  }

  function tick(){
    const now = new Date();
    const state = getState(now);

    if(state.mode === "countdown"){
      const diff = state.start.getTime() - now.getTime();
      const txt = formatRemaining(diff);
      document.querySelectorAll('[data-timer]').forEach(n => n.textContent = txt);
      document.querySelectorAll('[data-dot]').forEach(d => d.classList.remove('live'));
    } else {
      // LIVE
      document.querySelectorAll('[data-timer]').forEach(n => n.textContent = "EN COURS");
      document.querySelectorAll('[data-dot]').forEach(d => d.classList.add('live'));
    }
  }

  // refresh button
  document.getElementById('refreshBtn')?.addEventListener('click', () => {
    NProgress.start();
    render();
    setTimeout(() => NProgress.done(), 350);
  });

  render();
  tick();
  setInterval(tick, 1000);
</script>

</body>
</html>
