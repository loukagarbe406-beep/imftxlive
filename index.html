<!doctype html>
<html>
<body>
<h3>CHAT PROOF</h3>

<div id="log"></div>

<input id="m">
<button onclick="send()">SEND</button>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const supabase = createClient(
  "https://nipfaqeshezvoxravdqx.supabase.co",
  "nipfaqeshezvoxravdqx"
);

const log = document.getElementById("log");

const { error: testErr } = await supabase
  .from("chat_messages")
  .select("id")
  .limit(1);

log.innerHTML += testErr ? "SELECT ERROR ❌<br>" + testErr.message : "SELECT OK ✅<br>";

async function send(){
  const v = document.getElementById("m").value;

  const { error } = await supabase
    .from("chat_messages")
    .insert([{ room:"proof", username:"test", message:v }]);

  log.innerHTML += error ? "INSERT ERROR ❌<br>" + error.message : "INSERT OK ✅<br>";
}
</script>
</body>
</html>
