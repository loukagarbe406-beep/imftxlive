<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Chat Test</title>
</head>
<body style="background:#111;color:#fff;font-family:sans-serif">

<h2>Chat Supabase (test)</h2>

<div id="chat" style="height:300px;overflow:auto;border:1px solid #444;padding:10px"></div>

<input id="msg" placeholder="Message" style="width:70%">
<button id="send">Envoyer</button>

<script type="module">
  import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

  const supabase = createClient(
    "https://nipfaqeshezvoxravdqx.supabase.co",
    "nipfaqeshezvoxravdqx"
  );

  const room = "test";
  const chat = document.getElementById("chat");
  const input = document.getElementById("msg");

  function add(m){
    const d = document.createElement("div");
    d.textContent = m.username + ": " + m.message;
    chat.appendChild(d);
    chat.scrollTop = chat.scrollHeight;
  }

  // charger historique
  const { data } = await supabase
    .from("chat_messages")
    .select("*")
    .eq("room", room)
    .order("created_at", { ascending: true });

  data.forEach(add);

  // realtime
  supabase
    .channel("room-test")
    .on(
      "postgres_changes",
      { event: "INSERT", schema: "public", table: "chat_messages" },
      payload => add(payload.new)
    )
    .subscribe();

  // envoyer
  document.getElementById("send").onclick = async () => {
    const v = input.value.trim();
    if (!v) return;
    input.value = "";

    const { error } = await supabase
      .from("chat_messages")
      .insert([{ room, username: "User", message: v }]);

    if (error) alert(error.message);
  };
</script>

</body>
</html>
