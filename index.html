  <script>
    const saved = localStorage.getItem('theme');
    if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    }
  </script>

  <style>

    .dark body{
      background-image: url('https://cdn.jsdelivr.net/gh/Nyx0xFF/turbo-palm-tree/noise.png');
      background-repeat: repeat;
      background-size: 96px 96px;
    }

    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb {
      background-color: rgba(100, 100, 100, 0.4);
      border-radius: 10px;
      border: 2px solid transparent;
      background-clip: content-box;
    }
    ::-webkit-scrollbar-thumb:hover { background-color: rgba(100, 100, 100, 0.6); }

    body { display:flex; flex-direction:column; }

    /* --------- Match Cards --------- */
    .match-card{
      position:relative;
      overflow:hidden;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.04);
      box-shadow: 0 18px 70px rgba(0,0,0,.45);
      aspect-ratio: 16 / 9;

    .match-bg{
      position:absolute; inset:0;
      background-size:cover;
      background-position:center;
      transform:scale(1.02);
      opacity:.96;
    }
    .match-overlay{
      position:absolute; inset:0;
      background:

<script>
  // -------- Sidebar toggle --------
  const burgerBtn = document.getElementById('burgerBtn');
  const sidebar = document.getElementById('sidebar');
  function openSidebar(){ sidebar.classList.remove('-translate-x-full'); }
  function closeSidebar(){ sidebar.classList.add('-translate-x-full'); }
  burgerBtn?.addEventListener('click', () => {
    const isClosed = sidebar.classList.contains('-translate-x-full');
    isClosed ? openSidebar() : closeSidebar();
  });

  // -------- Theme toggle --------
  const toggle = document.getElementById('theme-toggle');
  function setTheme(mode){
    if(mode === 'dark'){
      document.documentElement.classList.add('dark');
      localStorage.setItem('theme','dark');
    } else {
      document.documentElement.classList.remove('dark');
      localStorage.setItem('theme','light');
    }
  }
  toggle?.addEventListener('click', () => {
    const isDark = document.documentElement.classList.contains('dark');
    setTheme(isDark ? 'light' : 'dark');
  });

  // -------- Popup X gate --------
  const TW_URL = "https://x.com/imftxvw/status/2018021008729375186";
  const gateBackdrop = document.getElementById('gateBackdrop');
  const gateJoin = document.getElementById('gateJoin');
  const gateSkip = document.getElementById('gateSkip');

  function shouldShowGate(){
    return localStorage.getItem('imftx_gate_done') !== '1';
  }
  function showGate(){ gateBackdrop.style.display = 'flex'; }
  function hideGate(){ gateBackdrop.style.display = 'none'; }

  if(shouldShowGate()) showGate();

  gateJoin?.addEventListener('click', () => {
    try { window.open(TW_URL, "_blank", "noopener,noreferrer"); }
    catch(e){ window.location.href = TW_URL; }
    localStorage.setItem('imftx_gate_done','1');
    hideGate();
  });

  gateSkip?.addEventListener('click', () => {
    localStorage.setItem('imftx_gate_done','1');
    hideGate();
  });

  gateBackdrop?.addEventListener('click', (e) => {
    if(e.target === gateBackdrop) hideGate();
  });

  // -------- Helpers time --------
  function pad(n){ return String(n).padStart(2,"0"); }
  function parseHHMM(str){
    const s = String(str).trim().toLowerCase().replace("h", ":");
    let [hh, mm] = s.split(":");
    hh = parseInt(hh || "0", 10);
    mm = parseInt((mm ?? "0").replace(/\D/g,'' ) || "0", 10);
    return { hh, mm };
  }
  function fmtCountdown(ms){
    if(ms <= 0) return "00h 00m 00s";
    const total = Math.floor(ms / 1000);
    const h = Math.floor(total / 3600);
    const m = Math.floor((total % 3600) / 60);
    const s = total % 60;
    return `${pad(h)}h ${pad(m)}m ${pad(s)}s`;
  }
  function buildStartDate(timeStr){
    const now = new Date();
    const {hh, mm} = parseHHMM(timeStr);
    const d = new Date(now);
    d.setHours(hh, mm, 0, 0);
    return d;
  }
  function getStatusFor(timeStr){
    const now = new Date();
    let start = buildStartDate(timeStr);

    const end = new Date(start.getTime() + 150 * 60 * 1000); // 2h30
    if(now.getTime() > end.getTime()){
      start = new Date(start.getTime() + 24 * 60 * 60 * 1000);
    }

    const end2 = new Date(start.getTime() + 150 * 60 * 1000);
    if(now.getTime() < start.getTime()){
      return { state: "countdown", ms: start.getTime() - now.getTime() };
    }
    if(now.getTime() >= start.getTime() && now.getTime() <= end2.getTime()){
      return { state: "live", ms: 0 };
    }
    return { state: "countdown", ms: 0 };
  }

      aLogo: "https://empire-sport.online/upload/teams/9spcq5dpm1bwlgrsjczadm4vezajnv.png",
      bLogo: "https://empire-sport.online/upload/teams/8cjgq2dnsdbrdb1bfdfor9qrqp3o1f.png",
      compLogo: "https://empire-sport.online/upload/leagues/xdyjxerqlfl6fdgghbaev5cxxmnp2r.png",
      href: "ol-losc.html"

  function cardHTML(m, idx){
    return `
      <a href="${m.href}" class="block">
        <article class="match-card">
          <div class="match-bg" style="background-image:url('${m.banner}')"></div>
          <div class="match-overlay"></div>

          <div class="absolute left-3 top-3">
            <span class="timer-pill">
              <span class="timer-dot" data-dot="${idx}"></span>
              <span class="timer-text" data-timer="${idx}">--</span>
            </span>
          </div>

          <div class="absolute inset-x-0 bottom-0 p-4">
            <div class="flex items-end justify-between gap-4">
              <div class="min-w-0 max-w-[72%]">
                <div class="flex items-center gap-2">
                  <div class="team-logo"><img src="${m.aLogo}" alt=""></div>
                  <span class="vs">VS</span>
                  <div class="team-logo"><img src="${m.bLogo}" alt=""></div>
                </div>

                <div class="mt-2 flex items-center gap-2">
                  <div class="comp-wrap"><img src="${m.compLogo}" alt=""></div>
                  <div class="min-w-0">
                    <div class="match-title truncate">${m.title}</div>
                    <div class="match-sub">Aujourd’hui · ${m.time}</div>
                  </div>
                </div>
              </div>

              <span class="watch-pill">
                <span class="play">
                  <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none">
                    <path d="M10 8l8 4-8 4V8Z" fill="currentColor"/>
                  </svg>
                </span>
                REGARDER
              </span>
            </div>
          </div>
        </article>
      </a>
    `;
  }

  function render(){
    const el = document.getElementById('stream-list-principal');
    if(!el) return;
    el.innerHTML = MATCHES.map(cardHTML).join('');
  }

  function tickAll(){
    MATCHES.forEach((m, idx) => {
      const st = getStatusFor(m.time);
      const timerEl = document.querySelector(`[data-timer="${idx}"]`);
      const dotEl = document.querySelector(`[data-dot="${idx}"]`);
      if(!timerEl || !dotEl) return;

      if(st.state === "live"){
        timerEl.textContent = "EN COURS";
        dotEl.classList.add('live');
      } else {
        timerEl.textContent = fmtCountdown(st.ms);
        dotEl.classList.remove('live');
      }
    });
  }

  document.getElementById('refreshBtn')?.addEventListener('click', () => {
    NProgress.start();
    render();
    tickAll();
    setTimeout(() => NProgress.done(), 350);
  });

  render();
  tickAll();
  setInterval(tickAll, 1000);
</script>
