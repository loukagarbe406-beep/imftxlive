<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IMFTX+ — SK Slavia Prague vs Barcelone</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

  <style>
    html,body{
      height:100%;margin:0;
      font-family:'Outfit',system-ui,-apple-system,"Segoe UI",Roboto,Arial;
      background:#070708;
      color:#fff;
      overflow-x:hidden;
    }

    /* player box */
    .player-box{
      border-radius:22px;
      overflow:hidden;
      border:1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.04);
      box-shadow: 0 30px 120px rgba(0,0,0,.85);
      position:relative;
    }

    iframe{width:100%;height:100%;border:0;background:#000;display:block}

    /* ✅ COVER (banniere) */
    .cover{
      position:absolute;
      inset:0;
      z-index:15;
      cursor:pointer;
      background:
        linear-gradient(180deg, rgba(0,0,0,.08) 0%, rgba(0,0,0,.28) 55%, rgba(0,0,0,.55) 100%),
        url("https://empire-sport.work/upload/banners/celta-vigo-vs-barcelona.png") center/cover no-repeat;
    }

    /* ✅ LOGOS TOP */
    .cover-top{
      position:absolute;
      top:18px;
      left:18px;
      display:flex;
      align-items:center;
      gap:10px;
      padding:10px 12px;
      border-radius:18px;
      background:rgba(0,0,0,.35);
      border:1px solid rgba(255,255,255,.14);
      backdrop-filter: blur(14px);
    }

    .team-logo{
      width:34px;height:34px;
      object-fit:contain;
      filter: drop-shadow(0 8px 20px rgba(0,0,0,.75));
    }

    .vs{
      font-weight:900;
      font-size:14px;
      opacity:.9;
    }

    /* ✅ STRIP BOTTOM */
    .cover-strip{
      position:absolute;
      left:22px;
      right:22px;
      bottom:22px;
      height:86px;
      border-radius:20px;
      background:rgba(255,255,255,.14);
      border:1px solid rgba(255,255,255,.16);
      backdrop-filter: blur(16px);
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:0 22px;
    }

    .strip-title{
      font-size:18px;
      font-weight:900;
      line-height:1;
    }
    .strip-sub{
      font-size:15px;
      opacity:.85;
      font-weight:600;
      line-height:1.1;
      font-style:italic;
      margin-top:3px;
    }

    .strip-play{
      width:50px;height:50px;
      border-radius:999px;
      border:2px solid rgba(255,255,255,.38);
      display:grid;
      place-items:center;
      transition:.2s;
      background:rgba(0,0,0,.22);
    }
    .strip-play i{font-size:19px}
    .strip-play:hover{transform:scale(1.08);background:rgba(0,0,0,.35)}

    /* ✅ sources buttons */
    .source-btn{
      height:44px;
      border-radius:14px;
      font-weight:900;
      font-size:13px;
      transition:.2s;
    }
    .source-btn.active{
      background:#fff;color:#000;
    }
    .source-btn.inactive{
      background:rgba(255,255,255,.08);
      border:1px solid rgba(255,255,255,.10);
      color:#fff;
    }
    .source-btn:hover{opacity:.95}

    /* ✅ bottom bar (Vous regardez) */
    .watch-bar{
      border-radius:18px;
      background:rgba(255,255,255,.10);
      border:1px solid rgba(255,255,255,.12);
      backdrop-filter: blur(16px);
      padding:16px 18px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:16px;
    }

    .watch-left{
      display:flex;
      align-items:center;
      gap:14px;
      min-width:0;
    }

    .watch-left img{
      width:38px;height:38px;
      object-fit:contain;
      filter: drop-shadow(0 6px 14px rgba(0,0,0,.7));
      flex-shrink:0;
    }

    .watch-text{
      min-width:0;
      line-height:1.1;
    }

    .watch-text .small{
      opacity:.8;font-weight:700;font-size:13px;
    }

    .watch-text .big{
      font-weight:900;font-size:16px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .watch-right{
      display:flex;
      align-items:center;
      gap:10px;
      flex-shrink:0;
    }

    .channel-logo{
      width:74px;height:auto;
      object-fit:contain;
      filter: drop-shadow(0 6px 14px rgba(0,0,0,.7));
    }

    /* fallback */
    .ext-wrap{display:none;margin-top:12px;text-align:center;}
    .ext-wrap a{color:#fbbf24;font-weight:900;text-decoration:underline;font-size:13px;}
  </style>
</head>

<body>

<!-- NAV -->
<nav class="sticky top-0 z-40 bg-black/20 backdrop-blur-xl border-b border-white/5">
  <div class="max-w-screen-2xl mx-auto px-6 py-3 flex items-center justify-between">
    <div class="text-3xl font-extrabold tracking-tight">IMFTX+</div>

    <a href="index.html"
       class="inline-flex items-center gap-2 px-4 h-10 rounded-full bg-white/10 border border-white/10 hover:bg-white/15 font-bold text-sm">
      <i class="fa-solid fa-arrow-left"></i> Retour
    </a>
  </div>
</nav>

<main class="max-w-screen-2xl mx-auto px-6 py-10">

  <!-- PLAYER -->
  <section class="player-box relative w-full aspect-video">

    <!-- ✅ COVER CLICK = LAUNCH STREAM -->
    <div id="cover" class="cover" onclick="loadVideo(1)">
      <div class="cover-top">
        <!-- ✅ logos équipes (tu peux changer si tu veux) -->
        <img class="team-logo"
             src="https://upload.wikimedia.org/wikipedia/fr/thumb/0/00/Logo_Slavia_2024.svg/langfr-250px-Logo_Slavia_2024.svg.png"
             alt="Barça">
        <span class="vs">VS</span>
        <img class="team-logo"
             src="https://upload.wikimedia.org/wikipedia/fr/thumb/1/1d/Logo_FC_Barcelone.svg/langfr-250px-Logo_FC_Barcelone.svg.png"
             alt="Santander">
      </div>

      <div class="cover-strip">
        <div>
          <div class="strip-title">Regarder Gratuitement</div>
          <div class="strip-sub">SK Slavia Prague<br>Barcelona</div>
        </div>

        <div class="strip-play">
          <i class="fa-solid fa-play"></i>
        </div>
      </div>
    </div>

    <div id="videoTarget" class="w-full h-full"></div>
  </section>

  <!-- SOURCES -->
  <section class="mt-5 flex gap-3">
    <button id="btn1" onclick="loadVideo(1)" class="source-btn active px-6">Source 1</button>
    <button id="btn2" onclick="loadVideo(2)" class="source-btn inactive px-6">Source 2</button>
    <button id="btn3" onclick="loadVideo(3)" class="source-btn inactive px-6">Source 3</button>
  </section>

  <!-- fallback embed blocked -->
  <div id="externalLink" class="ext-wrap">
    <a id="directLink" href="#" target="_blank">Embed bloqué ? Ouvrir le lien direct</a>
  </div>

  <!-- ✅ WATCH BAR -->
  <section class="mt-6 watch-bar">

    <div class="watch-left">
      <!-- ⚽ logo compétition (Coupe du Roi) -->
      <img src="https://assets.stickpng.com/thumbs/5842fe0ea6515b1e0ad75b3c.png" alt="Coupe du Roi">

      <div class="watch-text">
        <div class="small">Vous regardez</div>
        <div class="big">SK Slavia Prague - Barcelone</div>
        <div class="small">Aujourd’hui · 21:15</div>
      </div>
    </div>

    <!-- ✅ si tu veux pas de logo chaîne, laisse vide / supprime ce bloc -->
    <div class="watch-right">
      <!-- (placeholder) -->
      <img class="channel-logo" src="https://upload.wikimedia.org/wikipedia/commons/5/5d/Logo_Canal%2B_1995.svg" alt="Chaîne">
    </div>

  </section>

</main>

<!-- ✅ PLAYER SCRIPT (avec fallback + referrerpolicy origin + allow-presentation) -->
<script>
  // ✅ Mets tes liens ici si tu veux (là j'ai mis un setup "comme avant")
  const SOURCES = {
    1: "https://bolaloca.my/player/4/12",
    2: "https://bolaloca.my/player/2/12",
    3: "https://bolaloca.my/player/3/12"
  };

  function setActive(id){
    [1,2,3].forEach(n=>{
      const b = document.getElementById("btn"+n);
      b.className = (n===id) ? "source-btn active px-6" : "source-btn inactive px-6";
    });
  }

  function loadVideo(id){
    document.getElementById("cover").style.display = "none";
    setActive(id);

    const ext = document.getElementById("externalLink");
    const link = document.getElementById("directLink");
    link.href = SOURCES[id];
    ext.style.display = "none";

    const target = document.getElementById("videoTarget");
    target.innerHTML = `
      <iframe
        id="streamFrame"
        src="${SOURCES[id]}"
        allowfullscreen
        scrolling="no"
        frameborder="0"
        allow="autoplay; fullscreen; picture-in-picture; encrypted-media"
        referrerpolicy="origin"
        sandbox="allow-scripts allow-same-origin allow-forms allow-presentation">
      </iframe>
    `;

    // ✅ fallback embed bloqué
    setTimeout(() => {
      const iframe = document.getElementById("streamFrame");
      if(!iframe) return;
      try { iframe.contentWindow.location.href; }
      catch(e){ ext.style.display = "block"; }
    }, 2000);
  }
</script>

<script>

    databaseURL: "https://imftxlive-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "imftxlive",
    storageBucket: "imftxlive.firebasestorage.app",
    messagingSenderId: "117057055374",
    appId: "1:117057055374:web:af7d7542749a6ec592b7df"
  };

  if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  const MATCH_ID = "NO-barcelonDDDDDDDDe"; // ✅ garde cet id
  const sessionId = Math.random().toString(36).slice(2) + Date.now();

  const sessionRef = db.ref(`streams/${MATCH_ID}/presence/${sessionId}`);
  const onlineRef  = db.ref(`streams/${MATCH_ID}/online`);
  const presenceRoot = db.ref(`streams/${MATCH_ID}/presence`);

  if (location.protocol !== "file:") {
    sessionRef.set(true);
    sessionRef.onDisconnect().remove();

    presenceRoot.on("value", snap => {
      const data = snap.val() || {};
      onlineRef.set(Object.keys(data).length);
    });
  }
</script>

</body>
</html>
