<html lang="fr">
<head>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

  <style>
    :root{
      --max: 1400px;
      --gap: 22px;
      --cardW: 980px;
      --cardH: 520px;
      --r: 26px;

      --bg:#000;
      --shadow: 0 28px 110px rgba(0,0,0,.78);
      --ok:#22c55e;
      --warn:#fb923c;

      --g1:#070a12;
      --g2:#091a2e;
      --g3:#22124f;
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;background:var(--bg);color:#fff;font-family:'Outfit',system-ui,-apple-system,"Segoe UI",Roboto,Arial}
    a{color:inherit;text-decoration:none}
    button{font-family:inherit}

    header{position:fixed;top:0;left:0;right:0;z-index:50}
    .topbar{max-width:var(--max);margin:0 auto;padding:14px 18px;display:flex;align-items:center;justify-content:space-between}
    .brand{display:flex;align-items:center;gap:10px;font-weight:900;letter-spacing:.3px;font-size:20px;opacity:.95}
    .brandDot{width:10px;height:10px;border-radius:50%;background:linear-gradient(180deg, rgba(255,255,255,.95), rgba(255,255,255,.25));box-shadow:0 0 0 6px rgba(255,255,255,.06)}
    .icons{display:flex;gap:12px;font-size:18px;align-items:center}
    .icons a{opacity:.75}
    .icons a:hover{opacity:1}
    .joinBtnTop{display:inline-flex;align-items:center;gap:10px;padding:10px 14px;border-radius:999px;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.16);font-weight:900;font-size:13px;transition:.15s}
    .joinBtnTop:hover{background:rgba(255,255,255,.14)}
    .joinBtnTop i{font-size:16px}

    .hero{position:relative;padding-top:78px;padding-bottom:10px;overflow:hidden}
    .bg{position:absolute;inset:0;background-size:cover;background-position:center;transform:scale(1.10);filter: blur(16px) saturate(1.15) brightness(.62);opacity:.96}
    .hero::after{
      content:"";position:absolute;inset:0;
      background:
        radial-gradient(1200px 700px at 50% 30%, rgba(255,255,255,.09), transparent 60%),
        linear-gradient(180deg, rgba(0,0,0,.10) 0%, rgba(0,0,0,.86) 70%, rgba(0,0,0,.98) 100%),
        linear-gradient(90deg, rgba(0,0,0,.92), rgba(0,0,0,.14), rgba(0,0,0,.92));
      pointer-events:none;
    }
    .wrap{position:relative;z-index:2;max-width:var(--max);margin:0 auto;padding:0 18px}
    .centerHeader{text-align:center;padding:12px 0 10px}
    .centerHeader h1{margin:0;font-size:36px;font-weight:900;line-height:1.05;text-shadow:0 18px 40px rgba(0,0,0,.65)}
    .centerHeader .l1{margin-top:10px;opacity:.82;font-weight:700}
    .centerHeader .l2{margin-top:6px;opacity:.65;font-style:italic}

    .sliderArea{position:relative;padding-top:6px;padding-bottom:2px}
    .viewport{overflow:hidden}
    .track{display:flex;gap:var(--gap);transition:transform .55s ease;will-change:transform}
    .card{flex:0 0 var(--cardW);height:var(--cardH);border-radius:var(--r);overflow:hidden;position:relative;border:1px solid rgba(255,255,255,.16);box-shadow:var(--shadow);background:rgba(255,255,255,.06)}
    .poster{position:absolute;inset:0;background-size:cover;background-position:center;transform:scale(1.01)}
    .card::after{
      content:"";position:absolute;inset:0;
      background:
        linear-gradient(180deg, rgba(0,0,0,.04) 0%, rgba(0,0,0,.55) 70%, rgba(0,0,0,.92) 100%),
        linear-gradient(90deg, rgba(0,0,0,.62), rgba(0,0,0,.10), rgba(0,0,0,.62));
      pointer-events:none;
    }
    .badge{position:absolute;top:14px;left:14px;z-index:6;display:inline-flex;align-items:center;gap:8px;padding:7px 11px;border-radius:999px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-weight:900;font-size:12px}
    .dotOrange{width:9px;height:9px;border-radius:50%;background:var(--warn)}
    .dotGreen{width:9px;height:9px;border-radius:50%;background:var(--ok)}

    .cardArrow{position:absolute;top:50%;transform:translateY(-50%);width:54px;height:54px;border-radius:50%;background:rgba(0,0,0,.32);border:1px solid rgba(255,255,255,.16);display:grid;place-items:center;z-index:7;cursor:pointer;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);user-select:none}
    .cardArrow:hover{background:rgba(0,0,0,.45)}
    .cardArrow span{font-size:34px;line-height:1}
    .cardArrow.left{left:14px}
    .cardArrow.right{right:14px}

    .bottom{position:absolute;left:18px;right:18px;bottom:16px;z-index:7;display:flex;align-items:flex-end;justify-content:space-between;gap:16px}
    .leftInfo{min-width:0}
    .logosLine{display:flex;align-items:center;gap:12px;margin-bottom:10px;flex-wrap:wrap}
    .teamLogo{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.16);padding:6px;object-fit:contain}
    .vsPill{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:12px;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.14)}
    .cardTitle{font-size:24px;font-weight:900;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .cardSub{margin-top:6px;opacity:.74;font-style:italic;font-size:13px}

    .watch{display:inline-flex;align-items:center;height:64px;padding:10px 14px;border-radius:999px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.16);overflow:hidden;white-space:nowrap;transition:.15s}
    .watch:hover{background:rgba(255,255,255,.16)}
    .play{width:54px;height:54px;border-radius:50%;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.12);display:grid;place-items:center;margin-right:14px;font-size:16px}
    .watchTxt{font-weight:900;letter-spacing:.2px;padding-right:10px}

    .dots{display:flex;justify-content:center;gap:8px;margin:8px 0 0}
    .d{width:10px;height:10px;border-radius:999px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.10);cursor:pointer;transition:.2s}
    .d.active{width:38px;background:rgba(255,255,255,.82)}

    .section{max-width:var(--max);margin:0 auto;padding: 6px 18px 26px;margin-top:-8px;position:relative;z-index:5}
    .sectionHead{display:flex;align-items:baseline;justify-content:space-between;margin:0 0 12px}
    .sectionHead h2{margin:0;font-size:22px;font-weight:900}
    .sectionHead span{opacity:.55;font-size:12px}

    .rail{display:flex;gap:14px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
    .rail::-webkit-scrollbar{display:none}
    .mini{flex:0 0 auto;width:300px;border-radius:18px;overflow:hidden;border:1px solid rgba(255,255,255,.10);background:rgba(255,255,255,.05);box-shadow:0 18px 55px rgba(0,0,0,.55);transition:.15s}
    .mini:hover{transform:translateY(-2px)}
    .miniImg{height:170px;background-size:cover;background-position:center;position:relative}
    .miniImg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg, rgba(0,0,0,.05), rgba(0,0,0,.86))}
    .miniTop{position:absolute;top:10px;left:10px;right:10px;z-index:2;display:flex;justify-content:space-between;gap:10px}
    .pill{display:inline-flex;align-items:center;gap:8px;padding:6px 10px;border-radius:999px;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-size:12px;font-weight:900}
    .miniBody{padding:12px 12px 14px}
    .miniTitle{font-size:16px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .miniSub{margin-top:4px;font-size:12px;opacity:.65}

    .eventsWrap{max-width:var(--max);margin:0 auto;padding: 6px 18px 36px}
    .filters{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0 16px}
    .chip{border:1px solid rgba(255,255,255,.22);background:transparent;color:#fff;padding:8px 14px;border-radius:999px;font-weight:800;font-size:13px;cursor:pointer;opacity:.9;transition:.15s}
    .chip:hover{opacity:1}
    .chip.active{background:#fff;color:#000;border-color:#fff}

    .eventRow{display:grid;grid-template-columns: 320px 1fr 220px;gap:14px;padding:14px 16px;border-radius:14px;background: linear-gradient(180deg, rgba(255,255,255,.14), rgba(255,255,255,.10));box-shadow: 0 18px 60px rgba(0,0,0,.45);margin-bottom:10px;align-items:center;border:1px solid rgba(255,255,255,.10);transition:.12s}
    .eventRow:hover{transform:translateY(-1px);border-color:rgba(255,255,255,.16)}
    .eventLeft{display:flex;gap:12px;align-items:center;min-width:0}
    .compLogo{width:44px;height:44px;object-fit:contain;flex:0 0 auto;filter: drop-shadow(0 10px 18px rgba(0,0,0,.45))}
    .eventTxt{min-width:0}
    .eventTitle{font-weight:900;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .eventMeta{opacity:.75;font-size:13px;font-style:italic}

    .eventMid{display:flex;align-items:center;justify-content:center;gap:18px}
    .midTeam{display:flex;align-items:center;gap:10px;min-width:0}
    .midTeam b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
    .midLogo{width:34px;height:34px;object-fit:contain;filter: drop-shadow(0 8px 14px rgba(0,0,0,.45))}
    .midVS{opacity:.7;font-weight:900}

    .eventRight{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
    .rightPill{display:inline-flex;align-items:center;gap:8px;padding:6px 10px;border-radius:999px;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.14);font-weight:900;font-size:12px;backdrop-filter: blur(10px);-webkit-backdrop-filter: blur(10px)}
    .sportTag{opacity:.85;font-size:12px;font-weight:800}

    footer{border-top:1px solid rgba(255,255,255,.08);padding:18px 0;text-align:center;opacity:.55;font-size:12px}

    .gate{position:fixed; inset:0; z-index:9999;display:none; place-items:center;background:rgba(0,0,0,.78);backdrop-filter: blur(12px);-webkit-backdrop-filter: blur(12px);padding:18px}
    .gate.show{display:grid;}
    .gateRect{width:min(920px, 100%);border-radius:28px;overflow:hidden;border:1px solid rgba(255,255,255,.16);box-shadow: 0 50px 170px rgba(0,0,0,.86);position:relative;background:radial-gradient(1200px 420px at 20% 10%, rgba(255,255,255,.10), transparent 60%),linear-gradient(135deg, var(--g1) 0%, var(--g2) 45%, var(--g3) 100%)}
    .gateRect::after{content:"";position:absolute; inset:0;background:radial-gradient(700px 240px at 85% 70%, rgba(255,255,255,.08), transparent 60%),linear-gradient(180deg, rgba(0,0,0,.00), rgba(0,0,0,.20));pointer-events:none}
    .gateInner{position:relative; z-index:2;padding:24px 24px 22px;display:grid;grid-template-columns: 1.15fr .85fr;gap:20px;align-items:center}
    .gateLeft{display:flex;gap:14px;align-items:flex-start}
    .gateAvatar{width:74px;height:74px;border-radius:20px;border:1px solid rgba(255,255,255,.16);background:rgba(0,0,0,.25);overflow:hidden;flex:0 0 auto;box-shadow:0 18px 60px rgba(0,0,0,.55)}
    .gateAvatar img{width:100%;height:100%;object-fit:cover;display:block}
    .gateText{min-width:0}
    .gateH1{margin:0;font-size:26px;font-weight:1000;letter-spacing:.2px;line-height:1.1;text-transform:uppercase}
    .gateH2{margin:12px 0 0;font-size:18px;font-weight:900;line-height:1.25;opacity:.95}
    .gateRight{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
    .gateBtn{display:inline-flex;align-items:center;gap:10px;padding:12px 16px;border-radius:14px;border:1px solid rgba(255,255,255,.16);background:#fff;color:#000;font-weight:1000;cursor:pointer;transition:.15s;white-space:nowrap}
    .gateBtn:hover{opacity:.92}
    .gateMini{font-size:12px;color:rgba(255,255,255,.70);text-align:right;max-width:360px}

    @media (min-width: 1400px){ :root{ --cardW: 1100px; --cardH: 560px; } }
    @media (max-width: 980px){
      :root{--max: 1200px;--cardW: calc(100vw - 36px);--cardH: 340px;--gap: 14px;--r: 20px;}
      .cardArrow{display:none}
      .centerHeader h1{font-size:30px}
      .bottom{left:14px;right:14px;bottom:12px;gap:12px}
      .watch{height:52px;padding:8px 12px}
      .play{width:42px;height:42px;margin-right:10px}
      .watchTxt{font-size:14px}
      .mini{width:280px}
      .miniImg{height:160px}
      .eventRow{grid-template-columns: 1fr;gap:10px;align-items:start}
      .eventMid{justify-content:flex-start}
      .eventRight{align-items:flex-start}
      .midTeam b{max-width:160px}
      .gateInner{grid-template-columns:1fr;gap:14px}
      .gateRight{align-items:flex-start}
      .gateMini{text-align:left;max-width:none}
      .gateH1{font-size:22px}
      .gateH2{font-size:16px}
      .gateAvatar{width:64px;height:64px;border-radius:18px}
      .gateBtn{width:100%;justify-content:center}
    }
  </style>
</head>

    function svgBadge(text){
      const t = (text || "?").trim().slice(0,3).toUpperCase();
      const svg =
        `<svg xmlns="http://www.w3.org/2000/svg" width="140" height="140" viewBox="0 0 140 140">
          <defs>
            <radialGradient id="g" cx="30%" cy="20%" r="90%">
              <stop offset="0" stop-color="rgba(255,255,255,.22)"/>
              <stop offset="1" stop-color="rgba(255,255,255,.06)"/>
            </radialGradient>
          </defs>
          <rect x="0" y="0" width="140" height="140" rx="70" fill="url(#g)"/>
          <circle cx="70" cy="70" r="68" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="3"/>

                font-family="Outfit, Arial" font-size="44" font-weight="900"
                fill="rgba(255,255,255,.92)">${t}</text>
        </svg>`;
      return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);

    function showGate(){ gate.classList.add("show"); document.body.style.overflow = "hidden"; }
    function hideGate(){ gate.classList.remove("show"); document.body.style.overflow = ""; }

        a:"Guingamp", b:"Laval", aLogo:"", bLogo:ASSETS.lavalLogo, sport:"Football", banner:ASSETS.multiplexBanner },

      { id:"perigny-lemans", time:"20:45", comp:"Coupe de France", match:"Périgny - Le Mans",
        a:"Périgny", b:"Le Mans", aLogo:ASSETS.leMansPerignyLogo, bLogo:ASSETS.leMansPerignyLogo, sport:"Football", banner:ASSETS.multiplexBanner },

      { id:"les-herbiers-angers", time:"20:45", comp:"Coupe de France", match:"Les Herbiers - Angers",
        a:"Les Herbiers", b:"Angers", aLogo:"", bLogo:ASSETS.angersLogo, sport:"Football", banner:ASSETS.multiplexBanner },

      { id:"ic-croix-reims", time:"20:45", comp:"Coupe de France", match:"IC Croix - Reims",
        a:"IC Croix", b:"Reims", aLogo:"", bLogo:ASSETS.reimsLogo, sport:"Football", banner:ASSETS.multiplexBanner },

      { id:"lens-feignies", time:"21:00", comp:"Coupe de France", match:"Lens - Feignies",
        a:"Lens", b:"Feignies", aLogo:ASSETS.lensLogo, bLogo:"", sport:"Football", banner:ASSETS.multiplexBanner }
    ].map(m => ({
      ...m,
      status:"",
      aLogo: safeLogo(m.aLogo, m.a),
      bLogo: safeLogo(m.bLogo, m.b),
      banner: safeBanner(m.banner)
    }));

    /* =========================
       STATUS AUTO
       ========================= */
    const MATCH_DURATION_MIN = 135;
    function timeToMinutes(hhmm){
      const [h,m] = hhmm.split(":").map(Number);
      return (h*60)+(m||0);
    }
    function computeStatus(hhmm){
      const now = new Date();
      const nowMin = now.getHours()*60 + now.getMinutes();
      const start = timeToMinutes(hhmm);
      const end = start + MATCH_DURATION_MIN;
      if(nowMin < start) return "À venir";
      if(nowMin >= start && nowMin < end) return "En cours";
      return "Terminé";
    }
    todayMatches.forEach(m => m.status = computeStatus(m.time));

    /* =========================
       FEATURED (slider) + NO DOUBLONS
       ========================= */
    const FEATURED_IDS = ["multiplex-cdf","bologne-inter","dortmund-gladbach"];
    const featuredSet = new Set(FEATURED_IDS);

    const featuredMatches = FEATURED_IDS
      .map(id => todayMatches.find(x => x.id === id))
      .filter(Boolean);

    const sliderSource = featuredMatches.length ? featuredMatches : todayMatches;

    const matches = sliderSource.map(m => ({
      ...m,
      league: m.comp,
      timeText: `Aujourd’hui · ${m.time}`
    }));

    // ✅ “À venir” = programme sans les featured (plus de mélange)
    const upcomingMatches = todayMatches
      .filter(x => x.status === "À venir" && !featuredSet.has(x.id))
      .sort((a,b)=> timeToMinutes(a.time) - timeToMinutes(b.time));

    /* =========================
       RENDER HERO + SLIDER
       ========================= */
    const bg = document.getElementById("bg");
    const heroTitle = document.getElementById("heroTitle");
    const heroLeague = document.getElementById("heroLeague");
    const heroTime = document.getElementById("heroTime");
    const track = document.getElementById("track");
    const dots = document.getElementById("dots");
    const viewport = document.getElementById("viewport");
    const upcoming = document.getElementById("upcoming");

    let idx = 0;

    function setHero(m){
      bg.style.backgroundImage = `url('${m.banner}')`;

      // ✅ multiplex: pas de "vs"
      if(m.id === "multiplex-cdf"){
        heroTitle.textContent = m.match;
      } else {
        heroTitle.textContent = `${m.a} vs ${m.b}`;
      }

      heroLeague.textContent = m.comp;
      heroTime.textContent = `Aujourd’hui · ${m.time}`;
    }

    function badgeHTML(m){
      if(m.status === "En cours") return `<div class="badge"><span class="dotGreen"></span>En cours</div>`;
      if(m.status === "Terminé") return `<div class="badge" style="opacity:.78"><span class="dotOrange"></span>Terminé</div>`;
      return `<div class="badge"><span class="dotOrange"></span>À venir</div>`;
    }

    function logosBlock(m){
      // multiplex: on montre juste le logo CDF + "VS" discret
      return `
        <div class="logosLine">
          <img class="teamLogo" src="${m.aLogo}" alt="${m.a}">
          <div class="vsPill">VS</div>
          <img class="teamLogo" src="${m.bLogo}" alt="${m.b}">
        </div>
      `;
    }

    function cardHTML(m){
      const url = playerUrl(m.id);
      return `
        <div class="card">
          <div class="poster" style="background-image:url('${m.banner}')"></div>
          ${badgeHTML(m)}
          <div class="cardArrow left" data-act="prev"><span>‹</span></div>
          <div class="cardArrow right" data-act="next"><span>›</span></div>

          <div class="bottom">
            <div class="leftInfo">
              ${logosBlock(m)}
              <div class="cardTitle">${m.match}</div>
              <div class="cardSub">${m.comp} • Aujourd’hui · ${m.time}</div>
            </div>

            <a class="watch" href="${url}" target="_blank" rel="noopener">
              <div class="play">▶</div>
              <div class="watchTxt">REGARDER</div>
            </a>
          </div>
        </div>
      `;
    }

    function dotHTML(i){
      return `<div class="d ${i===0?'active':''}" data-dot="${i}"></div>`;
    }

    function miniHTML(m){
      const url = playerUrl(m.id);
      const dot = m.status === "En cours" ? "dotGreen" : "dotOrange";
      return `
        <a class="mini" href="${url}" target="_blank" rel="noopener">
          <div class="miniImg" style="background-image:url('${m.banner}')">
            <div class="miniTop">
              <span class="pill"><span class="${dot}"></span>${m.status}</span>
              <span class="pill">${m.sport}</span>
            </div>
          </div>
          <div class="miniBody">
            <div class="miniTitle">${m.match}</div>
            <div class="miniSub">${m.comp} • Aujourd’hui · ${m.time}</div>
          </div>
        </a>
      `;
    }

    function updateDots(){
      [...dots.querySelectorAll(".d")].forEach((el,i)=> el.classList.toggle("active", i===idx));
    }

    // ✅ Ajustement slider : centre propre (moins “mélangé”)
    function update(){
      const first=document.querySelector(".card");
      if(!first) return;

      const cardW = first.getBoundingClientRect().width;
      const gap = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--gap')) || 18;
      const vw = viewport.getBoundingClientRect().width;
      const centerOffset = Math.max(16, (vw - cardW) / 2);

      // pas de "peekBias" agressif => rendu plus clean
      const x = -(idx * (cardW + gap)) + centerOffset;

      track.style.transform = `translateX(${x}px)`;
      setHero(matches[idx]);
      updateDots();
    }

    function nextSlide(){ idx = (idx + 1) % matches.length; update(); }
    function prevSlide(){ idx = (idx - 1 + matches.length) % matches.length; update(); }
    function goTo(i){ idx = i; update(); }

    track.innerHTML = matches.map(cardHTML).join("");
    dots.innerHTML = matches.map((_,i)=>dotHTML(i)).join("");
    upcoming.innerHTML = upcomingMatches.map(miniHTML).join("");

    track.addEventListener("click", (e) => {
      const btn = e.target.closest("[data-act]");
      if(!btn) return;
      e.preventDefault();
      btn.dataset.act === "next" ? nextSlide() : prevSlide();
    });

    dots.addEventListener("click", (e) => {
      const d = e.target.closest("[data-dot]");
      if(!d) return;
      e.preventDefault();
      goTo(parseInt(d.dataset.dot, 10));
    });

    let startX=0;
    track.addEventListener("touchstart", e => { startX = e.touches[0].clientX; }, {passive:true});
    track.addEventListener("touchend", e => {
      const endX = e.changedTouches[0].clientX;
      const dx = endX - startX;
      if(Math.abs(dx) > 40) dx < 0 ? nextSlide() : prevSlide();
    }, {passive:true});

    update();
    window.addEventListener("resize", update);

    /* =========================
       EVENTS LIST
       ========================= */
    const eventsList = document.getElementById("eventsList");
    const filtersEl = document.getElementById("filters");

    const FILTERS = ["Tous Les Événements", "Football", "Coupe de France"];
    let activeFilter = "Tous Les Événements";

    const COMP_LOGOS = { "Coupe de France": ASSETS.coupeLogo };

    function renderFilters(){
      filtersEl.innerHTML = FILTERS.map(f => `
        <button class="chip ${f===activeFilter?'active':''}" data-filter="${f}">${f}</button>
      `).join("");
    }

    filtersEl.addEventListener("click", (e) => {
      const btn = e.target.closest("[data-filter]");
      if(!btn) return;
      activeFilter = btn.dataset.filter;
      renderFilters();
      renderEvents();
    });

    function statusPill(status){
      if(status === "En cours") return `<span class="rightPill"><span class="dotGreen"></span>En cours</span>`;
      if(status === "Terminé") return `<span class="rightPill" style="opacity:.75"><span class="dotOrange"></span>Terminé</span>`;
      return `<span class="rightPill" style="background:rgba(251,146,60,.12);border-color:rgba(251,146,60,.25)"><span class="dotOrange"></span>À venir</span>`;
    }

    function rowHTML(m){
      const url = playerUrl(m.id);
      const compLogo = COMP_LOGOS[m.comp] || "";
      return `
        <a class="eventRow" href="${url}" target="_blank" rel="noopener">
          <div class="eventLeft">
            ${compLogo ? `<img class="compLogo" src="${compLogo}" alt="${m.comp}">` : ``}
            <div class="eventTxt">
              <div class="eventTitle">${m.match}</div>
              <div class="eventMeta">${m.comp} • Aujourd’hui · ${m.time}</div>
            </div>
          </div>

          <div class="eventMid">
            <div class="midTeam">
              <img class="midLogo" src="${m.aLogo}" alt="${m.a}">
              <b>${m.a}</b>
            </div>
            <div class="midVS">vs</div>
            <div class="midTeam">
              <b>${m.b}</b>
              <img class="midLogo" src="${m.bLogo}" alt="${m.b}">
            </div>
          </div>

          <div class="eventRight">
            ${statusPill(m.status)}
            <div class="sportTag">${m.sport}</div>
          </div>
        </a>
      `;
    }

    function renderEvents(){
      const list = todayMatches.filter(m => {
        if(activeFilter === "Tous Les Événements") return true;
        if(activeFilter === "Football") return m.sport === "Football";
        if(activeFilter === "Coupe de France") return m.comp === "Coupe de France";
        return true;
      });
      eventsList.innerHTML = list.map(rowHTML).join("");
    }

    renderFilters();
    renderEvents();
  </script>
</body>
</html>
