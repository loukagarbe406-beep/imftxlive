<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>IMFTX+ — Live</title>

  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

  <style>
    :root{
      --max: 1320px;
      --gap: 20px;
      --radius: 22px;
      --line: rgba(255,255,255,.10);
      --card: rgba(255,255,255,.06);
      --shadow: 0 28px 80px rgba(0,0,0,.75);
    }

    *{box-sizing:border-box}
    html,body{height:100%;margin:0;background:#000;color:#fff;font-family:'Outfit',system-ui,-apple-system,"Segoe UI",Roboto,Arial}
    a{text-decoration:none;color:inherit}

    /* Topbar */
    header{
      position:fixed;top:0;left:0;right:0;z-index:50;
      background:linear-gradient(180deg, rgba(0,0,0,.65), rgba(0,0,0,0));
      backdrop-filter: blur(8px);
    }
    .topbar{
      max-width:var(--max);
      margin:0 auto;
      padding:14px 18px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
    }
    .brand{
      font-weight:900;font-size:18px;letter-spacing:.4px;
      display:flex;align-items:center;gap:10px;
    }
    .rightIcons{display:flex;align-items:center;gap:10px}
    .pill{
      height:38px;border-radius:999px;
      padding:0 14px;
      display:flex;align-items:center;gap:10px;
      background:rgba(255,255,255,.08);
      border:1px solid rgba(255,255,255,.10);
      font-weight:800;font-size:12px;
      cursor:pointer;
    }
    .pill:hover{background:rgba(255,255,255,.12)}
    .iconBtn{
      width:38px;height:38px;border-radius:999px;
      display:grid;place-items:center;
      background:rgba(255,255,255,.08);
      border:1px solid rgba(255,255,255,.10);
      opacity:.9;
    }
    .iconBtn:hover{opacity:1;background:rgba(255,255,255,.12)}

    /* Background blur */
    .hero{
      min-height:100vh;
      padding-top:72px;
      position:relative;
      overflow:hidden;
    }
    .bg{
      position:absolute; inset:-40px;
      background-size:cover;
      background-position:center;
      filter: blur(18px) saturate(1.15) brightness(.55);
      transform: scale(1.12);
      opacity:.95;
    }
    .hero:after{
      content:""; position:absolute; inset:0;
      background:
        radial-gradient(1200px 700px at 50% 30%, rgba(255,255,255,.08), transparent 60%),
        linear-gradient(180deg, rgba(0,0,0,.15), rgba(0,0,0,.88) 65%, rgba(0,0,0,.98));
      pointer-events:none;
    }

    .wrap{
      position:relative;
      z-index:2;
      max-width:var(--max);
      margin:0 auto;
      padding:0 18px 40px;
    }

    /* Title area */
    .pageTitle{
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap:16px;
      padding:10px 0 14px;
    }
    .pageTitle h1{
      margin:0;
      font-size:42px;
      font-weight:900;
      letter-spacing:.2px;
      text-transform:uppercase;
    }
    .pageTitle .sub{
      margin-top:10px;
      opacity:.72;
      font-weight:700;
      font-size:13px;
      font-style:italic;
    }

    /* Layout hero (main slider + right card) */
    .heroGrid{
      display:grid;
      grid-template-columns: 1.7fr .9fr;
      gap: 18px;
      align-items:start;
      margin-top:10px;
    }

    @media(max-width:1050px){
      .heroGrid{grid-template-columns:1fr;gap:16px}
    }

    /* Slider */
    .sliderBox{
      border-radius:var(--radius);
      overflow:hidden;
      border:1px solid var(--line);
      background:rgba(255,255,255,.04);
      box-shadow: var(--shadow);
      position:relative;
      height:440px;
    }
    .track{
      height:100%;
      display:flex;
      transition:transform .55s ease;
      will-change:transform;
    }
    .slide{
      min-width:100%;
      height:100%;
      position:relative;
      background:#000;
    }
    .slide .poster{
      position:absolute; inset:0;
      background-size:cover;
      background-position:center;
      transform:scale(1.02);
    }
    .slide:after{
      content:""; position:absolute; inset:0;
      background:
        linear-gradient(180deg, rgba(0,0,0,.04), rgba(0,0,0,.68) 72%, rgba(0,0,0,.94)),
        linear-gradient(90deg, rgba(0,0,0,.78), rgba(0,0,0,.10), rgba(0,0,0,.78));
      pointer-events:none;
    }

    /* Slider arrows */
    .arrow{
      position:absolute;top:50%;transform:translateY(-50%);
      width:46px;height:46px;border-radius:999px;
      background:rgba(0,0,0,.28);
      border:1px solid rgba(255,255,255,.15);
      display:grid;place-items:center;
      cursor:pointer; z-index:5;
      backdrop-filter: blur(10px);
      opacity:.9;
    }
    .arrow:hover{opacity:1;background:rgba(0,0,0,.42)}
    .arrow.left{left:14px}
    .arrow.right{right:14px}
    .arrow span{font-size:30px;line-height:1}

    /* Slide badges */
    .badge{
      position:absolute;top:14px;left:14px;z-index:6;
      display:flex;align-items:center;gap:8px;
      padding:6px 10px;border-radius:999px;
      background:rgba(0,0,0,.42);
      border:1px solid rgba(255,255,255,.12);
      font-weight:900;font-size:12px;
      backdrop-filter: blur(10px);
    }
    .dot{width:8px;height:8px;border-radius:50%}
    .dot.green{background:#22c55e}
    .dot.orange{background:#f59e0b}

    /* Bottom content in slide */
    .slideInfo{
      position:absolute;left:18px;right:18px;bottom:18px;
      z-index:6;
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap:16px;
    }
    .leftMeta{
      min-width:0;
    }
    .miniLogos{
      display:flex;align-items:center;gap:10px;margin-bottom:10px;
      opacity:.96;
    }
    .miniLogo{
      width:32px;height:32px;border-radius:10px;
      background:rgba(255,255,255,.10);
      border:1px solid rgba(255,255,255,.12);
      padding:5px;object-fit:contain;
    }
    .vs{
      width:30px;height:30px;border-radius:999px;
      display:grid;place-items:center;
      background:rgba(255,255,255,.10);
      border:1px solid rgba(255,255,255,.14);
      font-weight:900;font-size:11px;
      opacity:.9;
    }
    .slideTitle{
      font-size:26px;font-weight:900;letter-spacing:.2px;
      text-transform:uppercase;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    }
    .slideSub{
      margin-top:6px;
      opacity:.74;
      font-style:italic;
      font-size:13px;
      font-weight:700;
    }
    .watchBtn{
      height:58px;
      padding:8px 14px;
      border-radius:999px;
      background:rgba(255,255,255,.15);
      border:1px solid rgba(255,255,255,.18);
      display:flex;align-items:center;gap:12px;
      font-weight:900;
      letter-spacing:.2px;
      flex:0 0 auto;
      backdrop-filter: blur(10px);
    }
    .watchBtn:hover{background:rgba(255,255,255,.22)}
    .play{
      width:46px;height:46px;border-radius:999px;
      background:rgba(0,0,0,.35);
      border:1px solid rgba(255,255,255,.14);
      display:grid;place-items:center;
      font-size:14px;
    }

    /* Slider dots */
    .dots{
      display:flex;
      justify-content:center;
      gap:8px;
      margin-top:10px;
    }
    .d{
      width:10px;height:10px;border-radius:999px;
      background:rgba(255,255,255,.22);
      border:1px solid rgba(255,255,255,.12);
      cursor:pointer;
      transition:.25s;
    }
    .d.active{
      width:38px;
      background:rgba(255,255,255,.85);
    }

    /* Right featured card */
    .sideCard{
      border-radius:var(--radius);
      overflow:hidden;
      border:1px solid var(--line);
      background:rgba(255,255,255,.04);
      box-shadow: var(--shadow);
      height:440px;
      position:relative;
    }
    .sidePoster{
      position:absolute; inset:0;
      background-size:cover;
      background-position:center;
      transform:scale(1.02);
    }
    .sideCard:after{
      content:""; position:absolute; inset:0;
      background:
        linear-gradient(180deg, rgba(0,0,0,.08), rgba(0,0,0,.70) 70%, rgba(0,0,0,.92)),
        linear-gradient(90deg, rgba(0,0,0,.75), rgba(0,0,0,.14), rgba(0,0,0,.75));
      pointer-events:none;
    }
    .sideInfo{
      position:absolute;left:16px;right:16px;bottom:16px;
      z-index:3;
    }
    .sideTitle{
      font-size:18px;
      font-weight:900;
      text-transform:uppercase;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    }
    .sideSub{margin-top:6px;opacity:.7;font-style:italic;font-weight:700;font-size:12px}
    .sideTopBadge{
      position:absolute;top:14px;left:14px;z-index:3;
      padding:6px 10px;border-radius:999px;
      background:rgba(0,0,0,.40);
      border:1px solid rgba(255,255,255,.12);
      font-weight:900;font-size:12px;
      display:flex;gap:8px;align-items:center;
      backdrop-filter: blur(10px);
    }

    /* Section titles */
    .sectionTitle{
      margin-top:20px;
      display:flex;
      align-items:baseline;
      justify-content:space-between;
      gap:12px;
    }
    .sectionTitle h2{
      margin:0;
      font-size:18px;
      font-weight:900;
    }
    .sectionTitle span{
      opacity:.55;
      font-size:12px;
      font-weight:700;
    }

    /* Upcoming rail */
    .rail{
      margin-top:12px;
      display:flex;gap:14px;
      overflow-x:auto;
      padding-bottom:10px;
      scrollbar-width:none;
    }
    .rail::-webkit-scrollbar{display:none}
    .miniCard{
      flex:0 0 auto;
      width:230px;
      border-radius:18px;
      overflow:hidden;
      border:1px solid rgba(255,255,255,.10);
      background:rgba(255,255,255,.04);
      box-shadow:0 18px 55px rgba(0,0,0,.55);
      transition:.18s;
    }
    .miniCard:hover{transform:translateY(-2px)}
    .miniImg{
      height:120px;
      background-size:cover;
      background-position:center;
      position:relative;
    }
    .miniImg:after{
      content:"";position:absolute;inset:0;
      background:linear-gradient(180deg, rgba(0,0,0,.05), rgba(0,0,0,.84));
    }
    .miniTop{
      position:absolute;top:10px;left:10px;right:10px;z-index:2;
      display:flex;justify-content:space-between;gap:8px;
    }
    .tag{
      padding:6px 10px;border-radius:999px;
      background:rgba(0,0,0,.35);
      border:1px solid rgba(255,255,255,.12);
      font-weight:900;font-size:11px;
      backdrop-filter: blur(10px);
    }
    .miniBody{padding:12px}
    .miniTitle{
      font-size:14px;font-weight:900;
      text-transform:uppercase;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    }
    .miniSub{margin-top:5px;font-size:12px;opacity:.65;font-style:italic;font-weight:700}

    /* Event rows */
    .events{margin-top:14px;display:flex;flex-direction:column;gap:10px}
    .row{
      display:flex;align-items:center;justify-content:space-between;
      gap:14px;
      padding:14px 16px;
      border-radius:16px;
      border:1px solid rgba(255,255,255,.08);
      background:linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,.06));
      box-shadow: 0 18px 55px rgba(0,0,0,.45);
      transition:.12s;
    }
    .row:hover{transform:translateY(-1px)}
    .rowLeft{display:flex;align-items:center;gap:12px;min-width:0}
    .smallIcon{
      width:34px;height:34px;border-radius:12px;
      background:rgba(0,0,0,.35);
      border:1px solid rgba(255,255,255,.12);
      display:grid;place-items:center;
      overflow:hidden;
      flex:0 0 auto;
      padding:6px;
    }
    .smallIcon img{width:100%;height:100%;object-fit:contain}
    .rowTxt{min-width:0}
    .rowTitle{font-weight:900;text-transform:uppercase;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .rowMeta{margin-top:4px;opacity:.7;font-style:italic;font-weight:700;font-size:12px}

    .rowMid{
      display:flex;align-items:center;justify-content:center;
      gap:12px;flex:1;min-width:0;
    }
    .team{
      display:flex;align-items:center;gap:10px;min-width:0;
    }
    .team img{
      width:34px;height:34px;border-radius:999px;
      background:rgba(255,255,255,.10);
      border:1px solid rgba(255,255,255,.12);
      padding:6px;
      object-fit:contain;
    }
    .team b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:170px}
    .midVS{
      padding:6px 12px;border-radius:999px;
      background:rgba(0,0,0,.30);
      border:1px solid rgba(255,255,255,.12);
      font-weight:900;font-size:12px;opacity:.8;
    }

    .rowRight{display:flex;align-items:center;gap:12px}
    .timePill{
      padding:8px 12px;border-radius:999px;
      background:rgba(0,0,0,.35);
      border:1px solid rgba(255,255,255,.14);
      font-weight:900;font-size:12px;
      display:flex;align-items:center;gap:8px;
      white-space:nowrap;
    }

    footer{
      margin-top:26px;
      text-align:center;
      opacity:.55;
      font-weight:700;
      font-size:12px;
      border-top:1px solid rgba(255,255,255,.08);
      padding:18px 0;
    }

    /* Mobile tweaks */
    @media(max-width:760px){
      .pageTitle h1{font-size:30px}
      .sliderBox,.sideCard{height:340px}
      .slideTitle{font-size:20px}
      .watchBtn{height:52px}
      .play{width:40px;height:40px}
      .heroGrid{grid-template-columns:1fr}
      .row{flex-direction:column;align-items:stretch}
      .rowMid{justify-content:flex-start}
      .rowRight{justify-content:space-between}
    }
  </style>
</head>

<body>

<header>
  <div class="topbar">
    <div class="brand">IMFTX+</div>

    <div class="rightIcons">
      <a class="iconBtn" href="https://t.me/+jdy9nGJ3rFFiOWI0" target="_blank" aria-label="Telegram">
        <i class="fa-brands fa-telegram"></i>
      </a>
      <a class="iconBtn" href="https://discord.gg/4ZFv9sa8" target="_blank" aria-label="Discord">
        <i class="fa-brands fa-discord"></i>
      </a>
      <a class="pill" href="https://discord.gg/FmWwePH5ET" target="_blank">
        <i class="fa-solid fa-tv"></i> IPTV
      </a>
    </div>
  </div>
</header>

<section class="hero">
  <div class="bg" id="bg"></div>

  <div class="wrap">

    <!-- Page title -->
    <div class="pageTitle">
      <div>
        <h1 id="bigTitle">À LA UNE</h1>
        <div class="sub">Sélection du jour</div>
      </div>
      <div class="pill" id="localTime">Heure locale : --:--</div>
    </div>

    <!-- Main hero layout -->
    <div class="heroGrid">
      <!-- Slider -->
      <div>
        <div class="sliderBox" id="slider">
          <div class="arrow left" onclick="prevSlide()"><span>‹</span></div>
          <div class="arrow right" onclick="nextSlide()"><span>›</span></div>
          <div class="track" id="track"></div>
        </div>

        <div class="dots" id="dots"></div>
      </div>

      <!-- Right card -->
      <a class="sideCard" id="sideCard" href="#" rel="noopener">
        <div class="sidePoster" id="sidePoster"></div>
        <div class="sideTopBadge" id="sideBadge"><span class="dot orange"></span>À venir</div>
        <div class="sideInfo">
          <div class="sideTitle" id="sideTitle">—</div>
          <div class="sideSub" id="sideSub">—</div>
        </div>
      </a>
    </div>

    <!-- Upcoming -->
    <div class="sectionTitle">
      <h2>À venir</h2>
      <span>Programme</span>
    </div>
    <div class="rail" id="upcoming"></div>

    <!-- Events -->
    <div class="sectionTitle" style="margin-top:20px;">
      <h2>Événements</h2>
      <span>Matchs du jour</span>
    </div>
    <div class="events" id="eventsList"></div>

    <footer>IMFTX+ — N°1 de la diffusion FR</footer>
  </div>
</section>

<script>
  // ✅ EDIT ICI: tes matchs
  const matches = [
    {
      id: "liverpool-leeds",
      title: "Liverpool - Leeds",
      comp: "Premier League",
      time: "18:30",
      a: "Liverpool",
      b: "Leeds",
      aLogo: "https://fr.wikipedia.org/wiki/Special:FilePath/Logo%20Liverpool%20FC.svg",
      bLogo: "https://fr.wikipedia.org/wiki/Special:FilePath/Leeds_United_F.C._logo.svg",
      banner: "https://empire-sport.site/upload/banners/burnley-vs-arsenal_01.png",
      sport: "Football"
    },
    {
      id: "sunderland-man-city",
      title: "Sunderland - Man City",
      comp: "Premier League",
      time: "21:00",
      a: "Sunderland",
      b: "Man City",
      aLogo: "https://fr.wikipedia.org/wiki/Special:FilePath/Sunderland_A.F.C._logo.svg",
      bLogo: "https://fr.wikipedia.org/wiki/Special:FilePath/Manchester_City_FC_badge.svg",
      banner: "https://empire-sport.site/upload/events/erilvwbktz7ugfcei9tr90bnnvlauf.jpg",
      sport: "Football"
    }
  ];

  const MATCH_DURATION_MIN = 135;

  function watchUrl(m){ return `pages/${m.id}.html`; }

  function timeToMinutes(hhmm){
    const [h,m]=hhmm.split(":").map(Number);
    return h*60+(m||0);
  }
  function computeStatus(hhmm){
    const now=new Date();
    const nowMin=now.getHours()*60+now.getMinutes();
    const start=timeToMinutes(hhmm);
    const end=start+MATCH_DURATION_MIN;
    if(nowMin<start) return "À venir";
    if(nowMin>=start && nowMin<end) return "En cours";
    return "Terminé";
  }
  function countdownTo(hhmm){
    const now=new Date();
    const target=new Date(now);
    const [h,m]=hhmm.split(":").map(Number);
    target.setHours(h,m,0,0);
    const diff=target-now;
    if(diff<=0) return "";
    const t=Math.floor(diff/1000);
    const hh=Math.floor(t/3600);
    const mm=Math.floor((t%3600)/60);
    const ss=t%60;
    return `${hh}h ${String(mm).padStart(2,"0")}m ${String(ss).padStart(2,"0")}s`;
  }

  function formatToday(hhmm){ return `Aujourd’hui • ${hhmm}`; }

  const bg = document.getElementById("bg");
  const track = document.getElementById("track");
  const dots = document.getElementById("dots");
  const upcoming = document.getElementById("upcoming");
  const eventsList = document.getElementById("eventsList");

  const sideCard = document.getElementById("sideCard");
  const sidePoster = document.getElementById("sidePoster");
  const sideTitle = document.getElementById("sideTitle");
  const sideSub = document.getElementById("sideSub");
  const sideBadge = document.getElementById("sideBadge");

  let idx = 0;
  let vm = [];
  let sliderVM = [];

  function buildVM(){
    return matches.map(m => ({
      ...m,
      status: computeStatus(m.time),
      timeLabel: formatToday(m.time),
      countdown: countdownTo(m.time)
    }));
  }

  function pickSlider(all){
    const sorted = all.slice().sort((a,b)=> timeToMinutes(a.time)-timeToMinutes(b.time));
    const notFinished = sorted.filter(x => x.status !== "Terminé");
    const base = notFinished.length ? notFinished : sorted;
    return base.slice(0,3);
  }

  function badgeHTML(m){
    if(m.status==="En cours") return `<div class="badge"><span class="dot green"></span>En cours</div>`;
    if(m.status==="Terminé") return `<div class="badge"><span class="dot orange"></span>Terminé</div>`;
    const cd = countdownTo(m.time);
    return `<div class="badge"><span class="dot orange"></span>${cd ? cd : "À venir"}</div>`;
  }

  function slideHTML(m){
    return `
      <div class="slide">
        <div class="poster" style="background-image:url('${m.banner}')"></div>
        ${badgeHTML(m)}
        <div class="slideInfo">
          <div class="leftMeta">
            <div class="miniLogos">
              <img class="miniLogo" src="${m.aLogo}" alt="">
              <div class="vs">VS</div>
              <img class="miniLogo" src="${m.bLogo}" alt="">
            </div>
            <div class="slideTitle">${m.title}</div>
            <div class="slideSub">${m.comp} • ${m.timeLabel}</div>
          </div>

          <a class="watchBtn" href="${watchUrl(m)}">
            <div class="play">▶</div>
            REGARDER
          </a>
        </div>
      </div>
    `;
  }

  function dotHTML(i){
    return `<div class="d ${i===0?'active':''}" onclick="goTo(${i})"></div>`;
  }

  function miniCardHTML(m){
    return `
      <a class="miniCard" href="${watchUrl(m)}">
        <div class="miniImg" style="background-image:url('${m.banner}')">
          <div class="miniTop">
            <span class="tag">${m.status}</span>
            <span class="tag">${m.sport}</span>
          </div>
        </div>
        <div class="miniBody">
          <div class="miniTitle">${m.title}</div>
          <div class="miniSub">${m.comp} • ${m.timeLabel}</div>
        </div>
      </a>
    `;
  }

  function rowHTML(m){
    return `
      <a class="row" href="${watchUrl(m)}">
        <div class="rowLeft">
          <span class="smallIcon"><img src="${m.aLogo}" alt=""></span>
          <div class="rowTxt">
            <div class="rowTitle">${m.title}</div>
            <div class="rowMeta">${m.comp} • ${m.timeLabel}</div>
          </div>
        </div>

        <div class="rowMid">
          <div class="team">
            <img src="${m.aLogo}" alt="">
            <b>${m.a}</b>
          </div>
          <div class="midVS">vs</div>
          <div class="team">
            <b>${m.b}</b>
            <img src="${m.bLogo}" alt="">
          </div>
        </div>

        <div class="rowRight">
          <div class="timePill">
            <span class="dot ${m.status==='En cours'?'green':'orange'}"></span>
            ${m.status==="À venir" ? (m.countdown || "À venir") : m.status}
          </div>
          <div style="font-weight:900;opacity:.8;font-size:12px">${m.sport}</div>
        </div>
      </a>
    `;
  }

  function updateHero(){
    if(!sliderVM.length) return;
    const m = sliderVM[idx];

    bg.style.backgroundImage = `url('${m.banner}')`;

    // slider translate
    track.style.transform = `translateX(${-idx*100}%)`;

    // dots
    [...dots.children].forEach((el,i)=> el.classList.toggle("active", i===idx));

    // side card = prochain match après celui affiché
    const next = sliderVM[(idx+1) % sliderVM.length] || sliderVM[0];
    sidePoster.style.backgroundImage = `url('${next.banner}')`;
    sideTitle.textContent = next.title.toUpperCase();
    sideSub.textContent = `${next.comp} • ${next.timeLabel}`;
    sideCard.href = watchUrl(next);

    sideBadge.innerHTML = next.status==="En cours"
      ? `<span class="dot green"></span>En cours`
      : `<span class="dot orange"></span>${next.status==="À venir" ? (countdownTo(next.time) || "À venir") : "Terminé"}`;
  }

  function rebuild(){
    vm = buildVM();
    sliderVM = pickSlider(vm);
    idx = Math.min(idx, sliderVM.length-1);

    track.innerHTML = sliderVM.map(slideHTML).join("");
    dots.innerHTML = sliderVM.map((_,i)=>dotHTML(i)).join("");

    // upcoming = seulement "À venir"
    const up = vm.filter(x=>x.status==="À venir").sort((a,b)=> timeToMinutes(a.time)-timeToMinutes(b.time));
    upcoming.innerHTML = up.map(miniCardHTML).join("");

    // events = tous
    const sorted = vm.slice().sort((a,b)=> timeToMinutes(a.time)-timeToMinutes(b.time));
    eventsList.innerHTML = sorted.map(rowHTML).join("");

    updateHero();
  }

  // Slider controls (no loop bug)
  function nextSlide(){ idx = Math.min(idx+1, sliderVM.length-1); updateHero(); }
  function prevSlide(){ idx = Math.max(idx-1, 0); updateHero(); }
  function goTo(i){ idx = Math.max(0, Math.min(i, sliderVM.length-1)); updateHero(); }

  window.nextSlide = nextSlide;
  window.prevSlide = prevSlide;
  window.goTo = goTo;

  // local time
  function updateTime(){
    const now=new Date();
    const hh=String(now.getHours()).padStart(2,"0");
    const mm=String(now.getMinutes()).padStart(2,"0");
    document.getElementById("localTime").textContent = `Heure locale : ${hh}:${mm}`;
  }

  (function init(){
    rebuild();
    updateTime();
    setInterval(()=>{ rebuild(); updateTime(); }, 1000);
  })();
</script>

</body>
</html>
