<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>HIBOUX-like Layout</title>
  <style>
    :root{
      --bg:#0b0f14;
      --panel:#0f1620;
      --panel2:#0c121a;
      --text:#e8eef7;
      --muted:#9fb0c3;
      --line:rgba(255,255,255,.08);
      --accent:#3aa1ff;
      --danger:#ff4d4d;
      --radius:14px;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      background:var(--bg);
      color:var(--text);
    }

    /* Top bar */
    .topbar{
      height:56px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:0 16px;
      border-bottom:1px solid var(--line);
      background:rgba(10,14,19,.9);
      position:sticky; top:0; z-index:10;
      backdrop-filter: blur(10px);
    }
    .brand{display:flex; gap:14px; align-items:center}
    .logo{font-weight:800; letter-spacing:.5px}
    .nav a{
      color:var(--muted);
      text-decoration:none;
      margin-right:12px;
      font-weight:600;
    }
    .nav a:hover{color:var(--text)}
    .actions{display:flex; gap:10px; align-items:center; color:var(--muted)}
    .pill{
      display:inline-flex; align-items:center; gap:8px;
      padding:8px 10px; border:1px solid var(--line);
      border-radius:999px; background:rgba(255,255,255,.03);
      font-weight:700;
    }
    .dot{width:10px;height:10px;border-radius:50%; background:var(--danger); display:inline-block}

    /* Main layout */
    .app{
      height:calc(100% - 56px);
      display:grid;
      grid-template-columns: 290px 1fr 360px;
      gap:12px;
      padding:12px;
    }
    .panel{
      background:linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.02));
      border:1px solid var(--line);
      border-radius:var(--radius);
      overflow:hidden;
      min-height:0; /* important for scroll areas */
    }

    /* Left sidebar */
    .sidebar header{
      padding:12px 12px 10px;
      border-bottom:1px solid var(--line);
      display:flex;
      align-items:center;
      justify-content:space-between;
    }
    .sidebar header h3{margin:0; font-size:14px; color:var(--muted); font-weight:800}
    .channels{
      overflow:auto;
      height:100%;
      padding:8px;
    }
    .channel{
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:10px 10px;
      border-radius:12px;
      cursor:pointer;
      border:1px solid transparent;
    }
    .channel:hover{background:rgba(255,255,255,.04)}
    .channel.active{
      background:rgba(58,161,255,.12);
      border-color:rgba(58,161,255,.25);
    }
    .ch-left{display:flex; gap:10px; align-items:center}
    .badge{
      width:28px; height:28px; border-radius:8px;
      display:grid; place-items:center;
      background:rgba(255,255,255,.06);
      border:1px solid var(--line);
      font-weight:800;
    }
    .meta{display:flex; flex-direction:column; line-height:1.1}
    .meta .title{font-weight:800; font-size:13px}
    .meta .sub{font-size:12px; color:var(--muted)}
    .viewers{
      color:var(--muted);
      font-weight:800;
      display:flex;
      gap:6px;
      align-items:center;
    }
    .tinyDot{width:8px;height:8px;border-radius:50%; background:var(--danger); display:inline-block}

    /* Center player */
    .player{
      display:flex;
      flex-direction:column;
      min-height:0;
    }
    .videoWrap{
      position:relative;
      flex:1;
      min-height:0;
      background:#000;
      overflow:hidden;
    }
    video{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
      background:#000;
    }
    .overlayTop{
      position:absolute;
      top:12px; left:12px; right:12px;
      display:flex; justify-content:space-between; align-items:center;
      pointer-events:none;
    }
    .score{
      pointer-events:none;
      padding:8px 10px;
      border-radius:12px;
      background:rgba(0,0,0,.45);
      border:1px solid rgba(255,255,255,.12);
      font-weight:900;
      letter-spacing:.3px;
    }
    .watermark{
      pointer-events:none;
      font-size:28px;
      font-weight:1000;
      opacity:.85;
      letter-spacing:1px;
      text-shadow:0 10px 30px rgba(0,0,0,.5);
    }
    .playerFooter{
      padding:12px;
      border-top:1px solid var(--line);
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      background:rgba(255,255,255,.02);
    }
    .now{
      display:flex; flex-direction:column;
      gap:2px;
    }
    .now .big{font-weight:900}
    .now .small{color:var(--muted); font-size:12px}
    .btnRow{display:flex; gap:10px; flex-wrap:wrap}
    .btn{
      border:1px solid var(--line);
      background:rgba(255,255,255,.03);
      color:var(--text);
      padding:10px 12px;
      border-radius:12px;
      font-weight:900;
      cursor:pointer;
    }
    .btn:hover{border-color:rgba(255,255,255,.18)}
    .btn.primary{border-color:rgba(58,161,255,.35); background:rgba(58,161,255,.15)}
    .btn.green{border-color:rgba(64, 214, 140,.35); background:rgba(64, 214, 140,.12)}

    /* Right chat */
    .chat{
      display:flex;
      flex-direction:column;
      min-height:0;
      background:linear-gradient(180deg, rgba(255,255,255,.03), rgba(255,255,255,.015));
    }
    .chat header{
      padding:12px;
      border-bottom:1px solid var(--line);
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
    }
    .chat header h3{margin:0; font-size:14px; font-weight:900}
    .chat header .muted{color:var(--muted); font-weight:800; font-size:12px}
    .messages{
      padding:10px;
      overflow:auto;
      flex:1;
      display:flex;
      flex-direction:column;
      gap:10px;
    }
    .msg{
      padding:10px 10px;
      border:1px solid var(--line);
      border-radius:12px;
      background:rgba(0,0,0,.18);
    }
    .msg .name{font-weight:1000; font-size:12px; color:var(--accent)}
    .msg .text{margin-top:6px; color:var(--text); font-size:13px}
    .chatFooter{
      border-top:1px solid var(--line);
      padding:10px;
      display:flex;
      gap:10px;
      background:rgba(255,255,255,.02);
    }
    .chatFooter input{
      flex:1;
      padding:12px 12px;
      border-radius:12px;
      border:1px solid var(--line);
      background:rgba(255,255,255,.03);
      color:var(--text);
      outline:none;
    }
    .chatFooter input:focus{border-color:rgba(58,161,255,.4)}
    .send{
      padding:12px 14px;
      border-radius:12px;
      border:1px solid rgba(58,161,255,.35);
      background:rgba(58,161,255,.18);
      color:var(--text);
      font-weight:1000;
      cursor:pointer;
    }

    /* Responsive */
    @media (max-width: 1100px){
      .app{grid-template-columns: 260px 1fr}
      .chat{display:none}
    }
    @media (max-width: 820px){
      .app{grid-template-columns: 1fr}
      .sidebar{display:none}
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="brand">
      <div class="logo">HIBOUX</div>
      <div class="nav">
        <a href="#">Accueil</a>
        <a href="#">Live</a>
        <a href="#">Calendrier</a>
      </div>
    </div>
    <div class="actions">
      <span class="pill"><span class="dot"></span> 5151</span>
    </div>
  </div>

  <main class="app">
    <!-- LEFT: channels -->
    <section class="panel sidebar">
      <header>
        <h3>Chaînes live</h3>
        <span class="pill" style="padding:6px 10px"><span class="tinyDot"></span> 3</span>
      </header>
      <div class="channels" id="channels"></div>
    </section>

    <!-- CENTER: player -->
    <section class="panel player">
      <div class="videoWrap">
        <!-- Remplace src par une vidéo à toi / flux que tu as le droit d’utiliser -->
        <video id="video" controls autoplay muted playsinline
          src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4"></video>

        <div class="overlayTop">
          <div class="score" id="score">RAC 0–0 FCB · 15:56</div>
          <div class="watermark">HIBOUX+</div>
        </div>
      </div>

      <div class="playerFooter">
        <div class="now">
          <div class="big" id="nowTitle">R. Racing Club - Barcelone</div>
          <div class="small" id="nowMeta">1080p · 4 545 spectateurs</div>
        </div>
        <div class="btnRow">
          <button class="btn">Discord</button>
          <button class="btn">Telegram</button>
          <button class="btn green">IPTV</button>
          <button class="btn primary" id="toggleMute">Mute</button>
        </div>
      </div>
    </section>

    <!-- RIGHT: chat -->
    <section class="panel chat">
      <header>
        <div>
          <h3>Chat du stream</h3>
          <div class="muted">Reste cool 😄</div>
        </div>
        <div class="pill" style="padding:6px 10px">✎</div>
      </header>

      <div class="messages" id="messages">
        <div class="msg">
          <div class="name">Ankazz</div>
          <div class="text">Si vous avez un bug avec le live, actualisez</div>
        </div>
      </div>

      <div class="chatFooter">
        <input id="chatInput" placeholder="Envoyer un message" />
        <button class="send" id="sendBtn">Chat</button>
      </div>
    </section>
  </main>

  <script>
    // Data fake pour la sidebar
    const channels = [
      { id: 1, title: "Como - Milan", sub: "Serie A", viewers: 154 },
      { id: 2, title: "Burgos - Valence", sub: "Copa del Rey", viewers: 9 },
      { id: 3, title: "Augsburg - Union", sub: "Bundesliga", viewers: 5 },
    ];

    const channelsEl = document.getElementById("channels");
    const nowTitle = document.getElementById("nowTitle");

    function renderChannels(activeId = 1){
      channelsEl.innerHTML = "";
      channels.forEach(c => {
        const row = document.createElement("div");
        row.className = "channel" + (c.id === activeId ? " active" : "");
        row.innerHTML = `
          <div class="ch-left">
            <div class="badge">${c.title.split(" ")[0][0] ?? "C"}</div>
            <div class="meta">
              <div class="title">${c.title}</div>
              <div class="sub">${c.sub}</div>
            </div>
          </div>
          <div class="viewers"><span class="tinyDot"></span>${c.viewers}</div>
        `;
        row.addEventListener("click", () => {
          renderChannels(c.id);
          nowTitle.textContent = c.title;
          // Ici tu pourrais changer la source vidéo (légale) associée à la chaîne
          // video.src = "mon_flux_autorise.m3u8" ou "video.mp4"
        });
        channelsEl.appendChild(row);
      });
    }
    renderChannels();

    // Chat fake (front only)
    const messagesEl = document.getElementById("messages");
    const input = document.getElementById("chatInput");
    document.getElementById("sendBtn").addEventListener("click", send);
    input.addEventListener("keydown", (e) => { if(e.key === "Enter") send(); });

    function send(){
      const v = input.value.trim();
      if(!v) return;
      const node = document.createElement("div");
      node.className = "msg";
      node.innerHTML = `<div class="name">Toi</div><div class="text"></div>`;
      node.querySelector(".text").textContent = v;
      messagesEl.appendChild(node);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      input.value = "";
    }

    // Mute toggle
    const video = document.getElementById("video");
    const btn = document.getElementById("toggleMute");
    btn.addEventListener("click", () => {
      video.muted = !video.muted;
      btn.textContent = video.muted ? "Unmute" : "Mute";
    });
  </script>
</body>
</html>
