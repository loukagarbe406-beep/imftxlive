<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IMFTX+</title>

<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config = { darkMode:'class' };</script>
<script>document.documentElement.classList.add('dark');</script>

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
html,body{height:100%}
body{
  margin:0;
  background:#000;
  color:#fff;
  font-family:'Outfit',sans-serif;
}

/* ===== NAV ===== */
nav{
  position:sticky;top:0;z-index:20;
  height:64px;
  background:#000;
  border-bottom:1px solid rgba(255,255,255,.1);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 24px;
}
.brand{
  font-size:30px;
  font-weight:900;
  letter-spacing:-.02em;
}
.nav-icons{
  display:flex;
  gap:10px;
  align-items:center;
}
.btn-iptv{
  background:#fff;
  color:#000;
  padding:8px 14px;
  border-radius:999px;
  font-weight:900;
  font-size:13px;
}
.icon{
  width:42px;height:42px;
  display:grid;place-items:center;
  border:1px solid rgba(255,255,255,.12);
  border-radius:12px;
  transition:.15s;
}
.icon:hover{background:rgba(255,255,255,.06)}

/* ===== HEADER ===== */
header{
  text-align:center;
  padding:64px 24px 26px;
}
header h1{
  font-size:72px;
  font-weight:900;
  letter-spacing:-.03em;
  margin:0;
}
header p{
  margin:10px 0 0;
  font-size:14px;
  font-weight:500;
  color:rgba(255,255,255,.55);
}

/* ===== LIVE BADGE (EN DIRECT) ===== */
.live-wrap{
  width:100%;
  padding:0 24px;
  margin-top:10px;
}
.live-pill{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:7px 14px;
  border-radius:999px;
  background:rgba(22,163,74,.14);
  border:1px solid rgba(22,163,74,.35);
  color:#22c55e;
  font-size:13px;
  font-weight:900;
  width:fit-content;
}
.live-dot{
  width:8px;height:8px;border-radius:50%;
  background:#22c55e;
  box-shadow:0 0 10px rgba(34,197,94,.85);
}

/* ===== GRID ===== */
main{padding:18px 24px 28px}
.grid{
  display:grid;
  grid-template-columns:1fr;
  gap:16px;
}
@media(min-width:900px){
  .grid{grid-template-columns:1fr 1fr}
}

/* ===== MATCH CARD ===== */
.match-card{
  position:relative;
  aspect-ratio:16/9;
  overflow:hidden;
  border-radius:20px;
  border:1px solid rgba(255,255,255,.12);
}
.match-bg{
  position:absolute;inset:0;
  background-size:cover;
  background-position:center;
}
.match-overlay{
  position:absolute;inset:0;
  background:
    linear-gradient(90deg,
      rgba(0,0,0,.75) 0%,
      rgba(0,0,0,.45) 45%,
      rgba(0,0,0,.15) 100%);
}

/* timer */
.timer{
  position:absolute;
  top:12px;left:12px;
  padding:6px 12px;
  border-radius:999px;
  background:rgba(0,0,0,.7);
  border:1px solid rgba(255,255,255,.15);
  font-size:13px;
  font-weight:800;
  display:flex;align-items:center;gap:8px;
}
.dot{
  width:8px;height:8px;
  border-radius:50%;
  background:#f59e0b;
}

/* match tag (compact) */
.match-tag{
  position:absolute;
  left:16px;bottom:16px;
  max-width:44%;
  display:flex;
  flex-direction:column;
  gap:6px;
}
.teams{
  display:flex;
  align-items:center;
  gap:10px;
}
.team-logo{width:34px;height:34px}
.team-logo img{
  width:100%;height:100%;
  object-fit:contain;
}
.vs{
  font-size:12px;
  font-weight:900;
  opacity:.7;
}
.info{
  display:flex;
  gap:10px;
  align-items:flex-end;
}
.ligue{width:26px;height:44px;object-fit:contain}
.title{font-size:14px;font-weight:900;line-height:1.1}
.sub{font-size:11px;color:rgba(255,255,255,.75)}

/* watch */
.watch{
  position:absolute;
  right:16px;bottom:16px;
  padding:10px 16px;
  border-radius:999px;
  background:rgba(255,255,255,.12);
  border:1px solid rgba(255,255,255,.18);
  font-weight:900;
  display:flex;
  align-items:center;
  gap:8px;
  color:#fff;
  text-decoration:none;
}
.play{
  width:30px;height:30px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:rgba(0,0,0,.4);
}

@media(max-width:640px){
  .match-tag{max-width:70%}
}
</style>
</head>

<body>

<nav>
  <div class="brand">IMFTX+</div>

  <div class="nav-icons">
    <a href="#" class="btn-iptv">⚡ ACHÈTE TON IPTV</a>

    <!-- X -->
    <a href="#" target="_blank" class="icon" aria-label="X">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none">

      </svg>
    </a>

    <!-- Telegram -->
    <a href="#" target="_blank" class="icon" aria-label="Telegram">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
        <path d="M21.8 3.2L2.9 10.6c-1 .4-1 1.8 0 2.2l4.7 1.6 1.8 5.4c.3 1 1.6 1.2 2.2.4l2.8-3.5 5.2 3.8c.9.7 2.2.2 2.4-.9L23 4.5c.2-1-.5-1.6-1.2-1.3Z" stroke="white" stroke-width="1.6"/>
        <path d="M7.6 14.2l12.3-8.2" stroke="white" stroke-width="1.6"/>

        <path d="M9.3 12.7h.01M14.7 12.7h.01" stroke="white" stroke-width="2.4" stroke-linecap="round"/>
      </svg>
    </a>
  </div>
</nav>

<header>
  <h1>IMFTX+</h1>
  <p>N°1 DES MEILLEURS DIFFUSEURS FR</p>
</header>

<!-- ✅ EN DIRECT AU-DESSUS DES MATCHS -->
<div class="live-wrap">
  <span class="live-pill"><span class="live-dot"></span>En direct</span>
</div>

<main>
  <div class="grid">

    <article class="match-card">
      <div class="match-bg" style="background-image:url('https://empire-sport.world/upload/banners/paris-fc-vs-auxerre.png')"></div>
      <div class="match-overlay"></div>

      <div class="timer"><span class="dot"></span>2h 54m 46s</div>

      <div class="match-tag">
        <div class="teams">
          <div class="team-logo">
            <img alt="Paris FC" src="https://empire-sport.world/upload/teams/qcyokwrlo5qyk6e66qgmv3ffqhpbzr.png">

            <img alt="Angers" src="https://empire-sport.world/upload/teams/bhdsn0frfe5qlieltcjjhwb8h3rzab.png">

        <div class="info">
          <img alt="Ligue 1" class="ligue" src="https://upload.wikimedia.org/wikipedia/fr/thumb/archive/d/d9/20240912231715%21Logo_Ligue_1_2024.svg/120px-Logo_Ligue_1_2024.svg.png">

      <a href="/angers-parisfc.html" target="_blank" class="watch">

</body>
</html>
