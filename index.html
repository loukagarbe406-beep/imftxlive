<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>IMFTX+ — Live</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

  <style>
    html,body{
      height:100%;margin:0;
      font-family:'Outfit',system-ui,-apple-system,"Segoe UI",Roboto,Arial;
      background:linear-gradient(180deg,#070708 0%,#0f0f10 100%);
      color:#fff;
    }
    .match-card{
      background:linear-gradient(135deg,rgba(255,255,255,0.02),rgba(255,255,255,0.01));
      border:1px solid rgba(255,255,255,0.03);
      border-radius:14px;
      overflow:hidden;
      display:flex;
      flex-direction:column;
      height:220px;
      padding:0;
      transition: transform .18s ease, background .18s ease;
    }
    .match-card:hover{
      transform: translateY(-3px);
      background:linear-gradient(135deg,rgba(255,255,255,0.035),rgba(255,255,255,0.015));
    }
    .match-thumb{
      flex:1;
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:800;
      letter-spacing:.2px;
      color:rgba(255,255,255,0.95);
      font-size:22px;
    }
    .team-logo{
      width:38px;height:38px;object-fit:contain;
      filter: drop-shadow(0 8px 16px rgba(0,0,0,.35));
    }
    @media(max-width:768px){
      .match-card{height:170px}
      .match-thumb{font-size:18px}
      .team-logo{width:32px;height:32px}
    }
  </style>
</head>

<body>

<!-- NAVBAR -->
<nav class="sticky top-0 z-40 bg-transparent backdrop-blur-sm border-b border-zinc-800/40">
  <div class="max-w-screen-2xl mx-auto px-6 py-3 flex items-center justify-between">
    <div class="text-3xl font-extrabold">IMFTX+</div>

    <!-- ✅ Réseaux en haut à droite -->
    <div class="flex items-center gap-3">
      <a href="https://discord.gg/FmWwePH5ET" target="_blank"
         class="hidden md:inline-flex items-center gap-2 px-4 h-10 rounded-full bg-white text-black font-bold text-sm hover:opacity-90">
        <i class="fa-solid fa-bolt"></i> IPTV
      </a>

      <a href="https://t.me/+jdy9nGJ3rFFiOWI0" target="_blank"
         class="w-10 h-10 grid place-items-center rounded-xl bg-white/5 border border-white/10 hover:bg-white/10">
        <i class="fa-brands fa-telegram text-lg"></i>
      </a>

      <a href="https://discord.gg/4ZFv9sa8" target="_blank"
         class="w-10 h-10 grid place-items-center rounded-xl bg-white/5 border border-white/10 hover:bg-white/10">
        <i class="fa-brands fa-discord text-lg"></i>
      </a>
    </div>
  </div>
</nav>

<main class="max-w-screen-2xl mx-auto px-6 py-10">

  <header class="text-center mb-10">
    <h1 class="text-4xl md:text-5xl font-extrabold">IMFTX+ LIVE</h1>
    <p class="mt-2 text-zinc-400 max-w-xl mx-auto">N°1 de la diffusion française</p>
  </header>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

    <!-- ✅ 1 LIVERPOOL - LEEDS -->
    <div class="match-card">
      <div class="match-thumb bg-gradient-to-tr from-red-700 to-zinc-950">
        (18h30) LIVERPOOL - LEEDS
      </div>

      <div class="match-meta flex justify-between items-center p-3">
        <div class="flex items-center gap-3 min-w-0">
          <img class="team-logo" src="https://fr.wikipedia.org/wiki/Special:FilePath/Logo%20FC%20Liverpool.svg" alt="Liverpool">
          <span class="font-semibold truncate">Liverpool</span>
          <span class="text-zinc-500 font-bold">vs</span>
          <img class="team-logo" src="https://fr.wikipedia.org/wiki/Special:FilePath/Logo%20Leeds%20United%20FC.svg" alt="Leeds">
          <span class="font-semibold truncate">Leeds</span>
        </div>

        <button onclick="openCustomStream('liverpool-leeds')"
          class="px-4 py-2 bg-amber-400 text-black font-extrabold rounded-lg hover:opacity-90">
          Regarder
        </button>
      </div>
    </div>

    <!-- ✅ 2 SUNDERLAND - MAN CITY -->
    <div class="match-card">
      <div class="match-thumb bg-gradient-to-tr from-red-700 to-sky-600">
        (21h00) SUNDERLAND - MAN CITY
      </div>

      <div class="match-meta flex justify-between items-center p-3">
        <div class="flex items-center gap-3 min-w-0">
          <img class="team-logo" src="https://fr.wikipedia.org/wiki/Special:FilePath/Logo%20Sunderland%20AFC%201997.svg" alt="Sunderland">
          <span class="font-semibold truncate">Sunderland</span>
          <span class="text-zinc-500 font-bold">vs</span>
          <img class="team-logo" src="https://fr.wikipedia.org/wiki/Special:FilePath/Logo%20Manchester%20City%202016.svg" alt="Man City">
          <span class="font-semibold truncate">Man City</span>
        </div>

        <button onclick="openCustomStream('sunderland-man-city')"
          class="px-4 py-2 bg-amber-400 text-black font-extrabold rounded-lg hover:opacity-90">
          Regarder
        </button>
      </div>
    </div>

  </div>

  <script>
    function openCustomStream(matchId) {
      const pages = {
        "liverpool-leeds": "pages/liverpool-leeds.html",
        "sunderland-man-city": "pages/sunderland-man-city.html"
      };

      if (!pages[matchId]) return alert("Match introuvable");
      // ✅ Redirection propre (pas de nouvel onglet)
      window.location.href = pages[matchId];
    }
  </script>

  <footer class="w-full mt-20 text-center text-sm opacity-70 pb-6">
    <h2 class="text-lg font-bold mb-2">À propos</h2>
    <p>IMFTX+ — Plateforme de streaming. Mise à jour automatique.</p>
  </footer>

</main>
</body>
</html>
