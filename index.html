<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>IMFTX+</title>

  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

  <style>
    :root{
      --max: 1280px;
      --bg: #000;
      --card: rgba(255,255,255,.06);
      --line: rgba(255,255,255,.14);
      --shadow: 0 22px 90px rgba(0,0,0,.75);
      --r: 22px;
      --gap: 16px;
      --good: #22c55e;
      --warn: #fb923c;
      --muted: rgba(255,255,255,.70);
      --muted2: rgba(255,255,255,.55);
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{margin:0;background:var(--bg);color:#fff;font-family:'Outfit',system-ui,-apple-system,"Segoe UI",Roboto,Arial}
    a{color:inherit;text-decoration:none}
    button{font-family:inherit}
    img{display:block}

    header{position:fixed;inset:0 0 auto 0;z-index:50;background:linear-gradient(180deg, rgba(0,0,0,.88), rgba(0,0,0,.12));backdrop-filter: blur(10px)}
    .topbar{max-width:var(--max);margin:0 auto;padding:14px 16px;display:flex;align-items:center;justify-content:space-between}
    .brand{font-weight:900;letter-spacing:.2px;font-size:20px;opacity:.98}
    .icons{display:flex;gap:14px;font-size:18px;align-items:center}
    .icons a{opacity:.70}
    .icons a:hover{opacity:1}

    .hero{position:relative;padding-top:76px;padding-bottom:14px;overflow:hidden}
    .bg{
      position:absolute; inset:0;
      background-size:cover;background-position:center;
      transform:scale(1.12);
      filter: blur(16px) saturate(1.15) brightness(.62);
      opacity:.98;
    }
    .hero::after{
      content:"";position:absolute;inset:0;
      background:
        radial-gradient(1000px 600px at 50% 25%, rgba(255,255,255,.10), transparent 60%),
        linear-gradient(180deg, rgba(0,0,0,.08) 0%, rgba(0,0,0,.84) 70%, rgba(0,0,0,.98) 100%),
        linear-gradient(90deg, rgba(0,0,0,.92), rgba(0,0,0,.12), rgba(0,0,0,.92));
      pointer-events:none;
    }
    .wrap{position:relative;z-index:2;max-width:var(--max);margin:0 auto;padding:0 16px}
    .centerHeader{text-align:center;padding:8px 0 10px}
    .centerHeader h1{margin:0;font-size:34px;font-weight:900;line-height:1.05;text-shadow:0 16px 40px rgba(0,0,0,.65)}
    .centerHeader .l1{margin-top:10px;opacity:.86;font-weight:800}
    .centerHeader .l2{margin-top:6px;opacity:.66;font-style:italic}

    /* Slider */
    .sliderArea{position:relative;padding-top:6px}
    .viewport{overflow:hidden}
    .track{display:flex;gap:var(--gap);transition:transform .55s ease;will-change:transform;padding-bottom:2px}
    .card{
      flex:0 0 980px;height:520px;border-radius:var(--r);overflow:hidden;position:relative;
      border:1px solid var(--line);box-shadow:var(--shadow);background: var(--card);
    }
    .poster{position:absolute;inset:0;background-size:cover;background-position:center;transform:scale(1.01)}
    .card::after{
      content:"";position:absolute;inset:0;
      background:
        linear-gradient(180deg, rgba(0,0,0,.04) 0%, rgba(0,0,0,.56) 70%, rgba(0,0,0,.92) 100%),
        linear-gradient(90deg, rgba(0,0,0,.62), rgba(0,0,0,.08), rgba(0,0,0,.62));
      pointer-events:none;
    }
    .badge{
      position:absolute;top:14px;left:14px;z-index:6;
      display:inline-flex;align-items:center;gap:8px;
      padding:7px 11px;border-radius:999px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.14);
      backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-weight:900;font-size:12px;
    }
    .dot{width:9px;height:9px;border-radius:50%;display:inline-block}
    .dot.warn{background:var(--warn)}
    .dot.good{background:var(--good)}

    .cardArrow{
      position:absolute;top:50%;transform:translateY(-50%);
      width:54px;height:54px;border-radius:50%;
      background:rgba(0,0,0,.30);
      border:1px solid rgba(255,255,255,.16);
      display:grid;place-items:center;
      z-index:7;cursor:pointer;
      backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
      user-select:none;
    }
    .cardArrow:hover{background:rgba(0,0,0,.45)}
    .cardArrow span{font-size:34px;line-height:1}
    .cardArrow.left{left:14px}
    .cardArrow.right{right:14px}

    .bottom{
      position:absolute;left:16px;right:16px;bottom:16px;z-index:7;
      display:flex;align-items:flex-end;justify-content:space-between;gap:14px
    }
    .leftInfo{min-width:0}
    .logosLine{display:flex;align-items:center;gap:12px;margin-bottom:10px;flex-wrap:wrap}
    .teamLogo{
      width:44px;height:44px;border-radius:50%;
      background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.16);
      padding:6px;object-fit:contain;
    }
    .vsPill{
      width:34px;height:34px;border-radius:50%;
      display:grid;place-items:center;
      font-weight:900;font-size:12px;
      background:rgba(255,255,255,.10);
      border:1px solid rgba(255,255,255,.14);
    }
    .cardTitle{font-size:24px;font-weight:900;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .cardSub{margin-top:6px;opacity:.74;font-style:italic;font-size:13px}

    .watch{
      display:inline-flex;align-items:center;
      height:62px;padding:10px 14px;border-radius:999px;
      background:rgba(255,255,255,.14);
      border:1px solid rgba(255,255,255,.16);
      overflow:hidden;white-space:nowrap;
    }
    .watch:hover{background:rgba(255,255,255,.18)}
    .play{
      width:52px;height:52px;border-radius:50%;
      background:rgba(0,0,0,.35);
      border:1px solid rgba(255,255,255,.12);
      display:grid;place-items:center;
      margin-right:12px;font-size:16px;
    }
    .watchTxt{font-weight:900;letter-spacing:.2px;padding-right:8px}

    .dots{display:flex;justify-content:center;gap:8px;margin:8px 0 0}
    .d{width:10px;height:10px;border-radius:999px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.10);cursor:pointer;transition:.2s}
    .d.active{width:38px;background:rgba(255,255,255,.86)}

    /* Events list */
    .eventsWrap{max-width:var(--max);margin:0 auto;padding: 10px 16px 30px;position:relative;z-index:5}
    .sectionHead{display:flex;align-items:baseline;justify-content:space-between;margin:0 0 12px}
    .sectionHead h2{margin:0;font-size:22px;font-weight:900}
    .sectionHead span{opacity:.55;font-size:12px}

    .eventRow{
      display:flex; align-items:center; justify-content:space-between;
      gap:14px;
      padding:14px 16px;
      border-radius:16px;
      background: linear-gradient(180deg, rgba(255,255,255,.14), rgba(255,255,255,.07));
      border:1px solid rgba(255,255,255,.10);
      box-shadow: 0 18px 60px rgba(0,0,0,.45);
      margin-bottom:10px;
    }
    .eventLeft{display:flex;align-items:center;gap:12px;min-width:0}
    .leagueIcon{
      width:30px;height:30px;border-radius:10px;
      background:rgba(0,0,0,.35);
      border:1px solid rgba(255,255,255,.14);
      display:grid;place-items:center;
      overflow:hidden;flex:0 0 auto;
    }
    .leagueIcon img{width:20px;height:20px;object-fit:contain;opacity:.95}
    .eventTxt{min-width:0}
    .eventTitle{font-weight:900;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .eventMeta{opacity:.75;font-size:12px;font-style:italic}

    .eventMid{display:flex;align-items:center;gap:16px;min-width:0;flex:1;justify-content:center}
    .midTeam{display:flex;align-items:center;gap:10px;min-width:0}
    .midTeam b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:230px;font-size:14px}
    .midLogo{
      width:36px;height:36px;border-radius:999px;
      background:rgba(255,255,255,.10);
      border:1px solid rgba(255,255,255,.14);
      padding:6px;object-fit:contain;flex:0 0 auto;
    }
    .midVS{
      font-weight:900;font-size:12px;opacity:.78;
      padding:6px 12px;border-radius:999px;
      background:rgba(0,0,0,.30);
      border:1px solid rgba(255,255,255,.14);
    }
    .eventRight{display:flex;align-items:center;gap:10px;flex:0 0 auto}
    .timePill{
      display:inline-flex;align-items:center;gap:8px;
      padding:8px 12px;border-radius:999px;
      background:rgba(0,0,0,.35);
      border:1px solid rgba(255,255,255,.14);
      font-weight:900;font-size:12px;
      backdrop-filter: blur(10px);-webkit-backdrop-filter: blur(10px);
      white-space:nowrap;
    }
    .sportTag{opacity:.88;font-size:12px;font-weight:900}

    footer{border-top:1px solid rgba(255,255,255,.08);padding:18px 0;text-align:center;opacity:.55;font-size:12px}

    @media (min-width: 1400px){ .card{flex-basis: 1080px;height:560px} }
    @media (max-width: 980px){
      .card{flex-basis: calc(100vw - 32px);height:340px}
      .cardArrow{display:none}
      .centerHeader h1{font-size:30px}
      .bottom{left:14px;right:14px;bottom:12px;gap:12px}
      .watch{height:52px;padding:8px 12px}
      .play{width:42px;height:42px;margin-right:10px}
      .watchTxt{font-size:14px}
      .eventRow{flex-direction:column;align-items:stretch}
      .eventMid{justify-content:flex-start}
      .eventRight{justify-content:space-between}
      .midTeam b{max-width:160px}
    }
  </style>
</head>

<body>
  <header>
    <div class="topbar">
      <div class="brand">IMFTX+</div>
      <div class="icons">
        <a href="#" aria-label="Telegram"><i class="fa-brands fa-telegram"></i></a>
        <a href="#" aria-label="Discord"><i class="fa-brands fa-discord"></i></a>
        <a href="#" aria-label="X"><i class="fa-brands fa-x-twitter"></i></a>
      </div>
    </div>
  </header>

  <section class="hero">
    <div class="bg" id="bg"></div>

    <div class="wrap">
      <div class="centerHeader">
        <h1 id="heroTitle"></h1>
        <div class="l1" id="heroLeague"></div>
        <div class="l2" id="heroTime"></div>
      </div>

      <div class="sliderArea">
        <div class="viewport" id="viewport">
          <div class="track" id="track"></div>
        </div>
        <div class="dots" id="dots"></div>
      </div>
    </div>
  </section>

  <section class="eventsWrap">
    <div class="sectionHead">
      <h2>Événements</h2>
      <span>Matchs du jour</span>
    </div>
    <div id="eventsList"></div>
  </section>

  <footer>IMFTX+ — N°1 de la diffusion FR</footer>

  <script>
    // 1 match = 1 page : /pages/{id}.html
    function watchUrl(m){ return `pages/${m.id}.html`; }

    // Logos ligues (CAN pour pays)
    const LEAGUES = {
      "CAN": "https://upload.wikimedia.org/wikipedia/fr/f/f7/CAN_-_Fr_-_Full_Colour.png",
      "Premier League": "https://upload.wikimedia.org/wikipedia/fr/thumb/f/f2/Premier_League_Logo.svg/250px-Premier_League_Logo.svg.png"
    };

    const MATCH_DURATION_MIN = 135;

    function timeToMinutes(hhmm){
      const [h,m] = hhmm.split(":").map(Number);
      return (h*60)+(m||0);
    }
    function computeStatus(hhmm){
      const now = new Date();
      const nowMin = now.getHours()*60 + now.getMinutes();
      const start = timeToMinutes(hhmm);
      const end = start + MATCH_DURATION_MIN;
      if(nowMin < start) return "À venir";
      if(nowMin >= start && nowMin < end) return "En cours";
      return "Terminé";
    }
    function countdownTo(hhmm){
      const now = new Date();
      const target = new Date(now);
      const [h,m] = hhmm.split(":").map(Number);
      target.setHours(h, m, 0, 0);
      const diff = target.getTime() - now.getTime();
      if(diff <= 0) return "";
      const totalSec = Math.floor(diff/1000);
      const hh = Math.floor(totalSec/3600);
      const mm = Math.floor((totalSec%3600)/60);
      const ss = totalSec%60;
      return `${hh}h ${String(mm).padStart(2,"0")}m ${String(ss).padStart(2,"0")}s`;
    }
    function formatToday(hhmm){ return `Aujourd’hui · ${hhmm}`; }

    const PLACEHOLDER = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(`
      <svg xmlns="http://www.w3.org/2000/svg" width="120" height="120">
        <defs>
          <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
            <stop stop-color="#111827"/>
            <stop offset="1" stop-color="#000"/>
          </linearGradient>
        </defs>
        <rect width="120" height="120" rx="60" fill="url(#g)"/>
      </svg>
    `);
    function imgOnError(el){ el.src = PLACEHOLDER; }
    window.imgOnError = imgOnError;

    // ✅ MATCHS (clean)
    const todayMatches = [
      {
        id: "nigeria-tanzania",
        time: "18:30",
        comp: "CAN",
        sport: "Football",
        match: "NIGERIA - TANZANIE",
        a: "Nigeria",
        b: "Tanzanie",
        // drapeaux (simple & clean)
        aLogo: "https://upload.wikimedia.org/wikipedia/commons/thumb/7/79/Flag_of_Nigeria.svg/256px-Flag_of_Nigeria.svg.png",
        bLogo: "https://upload.wikimedia.org/wikipedia/commons/thumb/3/38/Flag_of_Tanzania.svg/256px-Flag_of_Tanzania.svg.png",
        banner: "https://empire-sport.site/upload/events/erilvwbktz7ugfcei9tr90bnnvlauf.jpg"
      },
      {
        id: "tunisia-uganda",
        time: "21:00",
        comp: "CAN",
        sport: "Football",
        match: "TUNISIE - OUGANDA",
        a: "Tunisie",
        b: "Ouganda",
        aLogo: "https://upload.wikimedia.org/wikipedia/commons/thumb/c/ce/Flag_of_Tunisia.svg/256px-Flag_of_Tunisia.svg.png",
        bLogo: "https://upload.wikimedia.org/wikipedia/commons/thumb/4/4e/Flag_of_Uganda.svg/256px-Flag_of_Uganda.svg.png",
        banner: "https://empire-sport.site/upload/events/dwofkbauc8qedspz43c0qbylnx9kll.jpg"
      },
      {
        id: "arsenal-crystal-palace",
        time: "21:00",
        comp: "Premier League",
        sport: "Football",
        match: "ARSENAL - CRYSTAL PALACE",
        a: "Arsenal",
        b: "Crystal Palace",
        aLogo: "https://upload.wikimedia.org/wikipedia/en/thumb/5/53/Arsenal_FC.svg/256px-Arsenal_FC.svg.png",
        bLogo: "https://upload.wikimedia.org/wikipedia/en/thumb/0/0c/Crystal_Palace_FC_logo.svg/256px-Crystal_Palace_FC_logo.svg.png",
        banner: "https://empire-sport.site/upload/banners/burnley-vs-arsenal_01.png"
      }
    ];

    // ---- VM helpers
    function buildVM(){
      return todayMatches
        .map(m => ({
          ...m,
          status: computeStatus(m.time),
          timeLabel: formatToday(m.time),
          leagueIcon: LEAGUES[m.comp] || ""
        }))
        .sort((a,b)=> timeToMinutes(a.time) - timeToMinutes(b.time));
    }

    // Slider: prochain match (ou en cours), sinon le 1er
    function pickHero(vm){
      const now = new Date();
      const nowMin = now.getHours()*60 + now.getMinutes();
      const notFinished = vm.filter(x => x.status !== "Terminé");
      const base = notFinished.length ? notFinished : vm;
      const next = base.filter(x => x.status === "En cours" || timeToMinutes(x.time) >= nowMin);
      return (next.length ? next : base)[0];
    }

    // ---- UI
    const bg = document.getElementById("bg");
    const heroTitle = document.getElementById("heroTitle");
    const heroLeague = document.getElementById("heroLeague");
    const heroTime = document.getElementById("heroTime");
    const track = document.getElementById("track");
    const dots = document.getElementById("dots");
    const viewport = document.getElementById("viewport");

    let vm = [];
    let slider = [];
    let idx = 0;

    function badgeHTML(m){
      if(m.status === "En cours") return `<div class="badge"><span class="dot good"></span>En cours</div>`;
      if(m.status === "Terminé") return `<div class="badge" style="opacity:.78"><span class="dot warn"></span>Terminé</div>`;
      return `<div class="badge"><span class="dot warn"></span>À venir</div>`;
    }

    function logosBlock(m){
      return `
        <div class="logosLine">
          <img class="teamLogo" src="${m.aLogo || PLACEHOLDER}" onerror="imgOnError(this)" alt="${m.a}">
          <div class="vsPill">VS</div>
          <img class="teamLogo" src="${m.bLogo || PLACEHOLDER}" onerror="imgOnError(this)" alt="${m.b}">
        </div>
      `;
    }

    function cardHTML(m){
      return `
        <div class="card">
          <div class="poster" style="background-image:url('${m.banner}')"></div>
          ${badgeHTML(m)}

          <div class="cardArrow left" onclick="prevSlide()"><span>‹</span></div>
          <div class="cardArrow right" onclick="nextSlide()"><span>›</span></div>

          <div class="bottom">
            <div class="leftInfo">
              ${logosBlock(m)}
              <div class="cardTitle">${m.match}</div>
              <div class="cardSub">${m.comp} • ${m.timeLabel}</div>
            </div>

            <a class="watch" href="${watchUrl(m)}" rel="noopener">
              <div class="play">▶</div>
              <div class="watchTxt">REGARDER</div>
            </a>
          </div>
        </div>
      `;
    }

    function dotHTML(i){
      return `<div class="d ${i===0?'active':''}" id="d${i}" onclick="goTo(${i})"></div>`;
    }

    function setHero(m){
      bg.style.backgroundImage = `url('${m.banner}')`;
      heroTitle.textContent = `${m.a} vs ${m.b}`;
      heroLeague.textContent = m.comp === "CAN" ? "CAN" : m.comp;
      heroTime.textContent = m.timeLabel;
    }

    function updateDots(){
      for(let i=0;i<slider.length;i++){
        const el = document.getElementById("d"+i);
        if(el) el.classList.toggle("active", i===idx);
      }
    }

    function update(){
      const first = document.querySelector(".card");
      if(!first || !slider.length) return;

      const cardW = first.getBoundingClientRect().width;
      const gap = 16;
      const vw = viewport.getBoundingClientRect().width;
      const centerOffset = Math.max(16, (vw - cardW) / 2);
      const peekBias = Math.min(120, vw * 0.10);
      const x = -(idx * (cardW + gap)) + centerOffset - peekBias;

      track.style.transform = `translateX(${x}px)`;
      setHero(slider[idx]);
      updateDots();
    }

    function nextSlide(){ idx = Math.min(idx + 1, slider.length - 1); update(); }
    function prevSlide(){ idx = Math.max(idx - 1, 0); update(); }
    function goTo(i){ idx = Math.max(0, Math.min(i, slider.length - 1)); update(); }
    window.nextSlide = nextSlide;
    window.prevSlide = prevSlide;
    window.goTo = goTo;

    // Events list row
    function pillText(m){
      if(m.status === "En cours") return `En cours`;
      if(m.status === "Terminé") return `Terminé`;
      const cd = countdownTo(m.time);
      return cd ? cd : "À venir";
    }
    function pillDotClass(m){ return (m.status === "En cours") ? "good" : "warn"; }

    function rowHTML(m){
      const leagueIcon = m.leagueIcon
        ? `<span class="leagueIcon"><img src="${m.leagueIcon}" alt=""></span>`
        : `<span class="leagueIcon"><span style="opacity:.75;font-weight:900;font-size:12px;">🏟️</span></span>`;

      return `
        <a class="eventRow" href="${watchUrl(m)}" rel="noopener">
          <div class="eventLeft">
            ${leagueIcon}
            <div class="eventTxt">
              <div class="eventTitle">${m.match}</div>
              <div class="eventMeta">${m.comp} • ${m.timeLabel}</div>
            </div>
          </div>

          <div class="eventMid">
            <div class="midTeam">
              <img class="midLogo" src="${m.aLogo || PLACEHOLDER}" onerror="imgOnError(this)" alt="${m.a}">
              <b>${m.a}</b>
            </div>
            <div class="midVS">vs</div>
            <div class="midTeam">
              <b>${m.b}</b>
              <img class="midLogo" src="${m.bLogo || PLACEHOLDER}" onerror="imgOnError(this)" alt="${m.b}">
            </div>
          </div>

          <div class="eventRight">
            <span class="timePill">
              <span class="dot ${pillDotClass(m)}"></span>
              ${pillText(m)}
            </span>
            <span class="sportTag">${m.sport}</span>
          </div>
        </a>
      `;
    }

    function renderEvents(){
      document.getElementById("eventsList").innerHTML = vm.map(rowHTML).join("");
    }

    function rebuild(){
      vm = buildVM();
      // slider = les 3 premiers (triés par heure)
      slider = vm.slice(0,3);
      // hero = prochain/en cours -> mets idx sur cet élément si présent dans slider
      const hero = pickHero(vm);
      const found = slider.findIndex(x => x.id === hero.id);
      idx = found >= 0 ? found : 0;

      track.innerHTML = slider.map(cardHTML).join("");
      dots.innerHTML = slider.map((_,i)=>dotHTML(i)).join("");

      renderEvents();
      update();
    }

    // Swipe mobile (sans boucle)
    let startX = 0;
    track.addEventListener("touchstart", e => { startX = e.touches[0].clientX; }, {passive:true});
    track.addEventListener("touchend", e => {
      const endX = e.changedTouches[0].clientX;
      const dx = endX - startX;
      if(Math.abs(dx) > 40){ if(dx < 0) nextSlide(); else prevSlide(); }
    }, {passive:true});

    (function init(){
      rebuild();
      window.addEventListener("resize", update);
      setInterval(rebuild, 1000);
    })();
  </script>
</body>
</html>
