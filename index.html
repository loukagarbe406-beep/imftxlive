<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>IMFTX+</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
  <style>
    :root{
      --max: 1400px;
      --gap: 22px;
      --cardW: 980px;
      --cardH: 520px;
      --r: 26px;
      --glass: rgba(255,255,255,.09);
      --line: rgba(255,255,255,.14);
      --shadow: 0 28px 100px rgba(0,0,0,.78);
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;background:#000;color:#fff;font-family:'Outfit',system-ui,-apple-system,"Segoe UI",Roboto,Arial}
    a{color:inherit;text-decoration:none}
    button{font-family:inherit}
    header{position:fixed;top:0;left:0;right:0;z-index:50}
    .topbar{max-width:var(--max);margin:0 auto;padding:16px 18px;display:flex;align-items:center;justify-content:space-between}
    .brand{font-weight:900;letter-spacing:.3px;font-size:20px;opacity:.95}
    .icons{display:flex;gap:14px;font-size:18px;align-items:center}
    .icons a{opacity:.75}
    .icons a:hover{opacity:1}

    .hero{position:relative;padding-top:74px;padding-bottom:10px;overflow:hidden}
    .bg{position:absolute;inset:0;background-size:cover;background-position:center;transform:scale(1.12);filter: blur(16px) saturate(1.15) brightness(.62);opacity:.96}
    .hero::after{
      content:"";position:absolute;inset:0;
      background:
        radial-gradient(1200px 700px at 50% 30%, rgba(255,255,255,.08), transparent 60%),
        linear-gradient(180deg, rgba(0,0,0,.10) 0%, rgba(0,0,0,.85) 70%, rgba(0,0,0,.98) 100%),
        linear-gradient(90deg, rgba(0,0,0,.92), rgba(0,0,0,.14), rgba(0,0,0,.92));
      pointer-events:none;
    }
    .wrap{position:relative;z-index:2;max-width:var(--max);margin:0 auto;padding:0 18px}
    .centerHeader{text-align:center;padding:10px 0 10px}
    .centerHeader h1{margin:0;font-size:36px;font-weight:900;line-height:1.05;text-shadow:0 18px 40px rgba(0,0,0,.65)}
    .centerHeader .l1{margin-top:10px;opacity:.80;font-weight:700}
    .centerHeader .l2{margin-top:6px;opacity:.65;font-style:italic}

    .sliderArea{position:relative;padding-top:6px;padding-bottom:2px}
    .viewport{overflow:hidden}
    .track{display:flex;gap:var(--gap);transition:transform .55s ease;will-change:transform;padding-bottom:2px}
    .card{
      flex:0 0 var(--cardW);height:var(--cardH);border-radius:var(--r);overflow:hidden;position:relative;
      border:1px solid var(--line);box-shadow:var(--shadow);background: rgba(255,255,255,.05);
    }
    .poster{position:absolute;inset:0;background-size:cover;background-position:center;transform:scale(1.01)}
    .card::after{
      content:"";position:absolute;inset:0;
      background:
        linear-gradient(180deg, rgba(0,0,0,.04) 0%, rgba(0,0,0,.55) 70%, rgba(0,0,0,.92) 100%),
        linear-gradient(90deg, rgba(0,0,0,.62), rgba(0,0,0,.10), rgba(0,0,0,.62));
      pointer-events:none;
    }
    .badge{
      position:absolute;top:14px;left:14px;z-index:6;display:inline-flex;align-items:center;gap:8px;
      padding:7px 11px;border-radius:999px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.14);
      backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-weight:900;font-size:12px;
    }
    .dotOrange,.dotGreen{width:9px;height:9px;border-radius:50%;display:inline-block}
    .dotOrange{background:#fb923c}
    .dotGreen{background:#22c55e}

    .cardArrow{
      position:absolute;top:50%;transform:translateY(-50%);width:54px;height:54px;border-radius:50%;
      background:rgba(0,0,0,.30);border:1px solid rgba(255,255,255,.16);display:grid;place-items:center;
      z-index:7;cursor:pointer;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    }
    .cardArrow:hover{background:rgba(0,0,0,.45)}
    .cardArrow span{font-size:34px;line-height:1}
    .cardArrow.left{left:14px}
    .cardArrow.right{right:14px}

    .bottom{position:absolute;left:18px;right:18px;bottom:16px;z-index:7;display:flex;align-items:flex-end;justify-content:space-between;gap:16px}
    .leftInfo{min-width:0}
    .logosLine{display:flex;align-items:center;gap:12px;margin-bottom:10px;flex-wrap:wrap}
    .teamLogo{
      width:44px;height:44px;border-radius:50%;
      background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.16);
      padding:6px;object-fit:contain;
    }
    .compMiniLogo{
      width:28px;height:28px;border-radius:10px;background:rgba(255,255,255,.10);
      border:1px solid rgba(255,255,255,.14);padding:5px;object-fit:contain;
      filter: drop-shadow(0 10px 18px rgba(0,0,0,.35));
    }
    .vsPill{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:12px;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.14)}
    .cardTitle{font-size:24px;font-weight:900;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .cardSub{margin-top:6px;opacity:.72;font-style:italic;font-size:13px}

    .watch{
      display:inline-flex;align-items:center;height:64px;padding:10px 14px;border-radius:999px;
      background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.16);
      overflow:hidden;white-space:nowrap;
    }
    .watch:hover{background:rgba(255,255,255,.18)}
    .play{
      width:54px;height:54px;border-radius:50%;background:rgba(0,0,0,.35);
      border:1px solid rgba(255,255,255,.12);display:grid;place-items:center;margin-right:14px;font-size:16px;
    }
    .watchTxt{font-weight:900;letter-spacing:.2px;padding-right:10px}

    .dots{display:flex;justify-content:center;gap:8px;margin:6px 0 0}
    .d{width:10px;height:10px;border-radius:999px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.10);cursor:pointer;transition:.2s}
    .d.active{width:38px;background:rgba(255,255,255,.82)}

    .section{max-width:var(--max);margin:0 auto;padding: 6px 18px 26px;margin-top:-8px;position:relative;z-index:5}
    .sectionHead{display:flex;align-items:baseline;justify-content:space-between;margin:0 0 12px}
    .sectionHead h2{margin:0;font-size:22px;font-weight:900}
    .sectionHead span{opacity:.55;font-size:12px}

    .rail{display:flex;gap:14px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
    .rail::-webkit-scrollbar{display:none}
    .mini{
      flex:0 0 auto;width:300px;border-radius:18px;overflow:hidden;border:1px solid rgba(255,255,255,.10);
      background:rgba(255,255,255,.05);box-shadow:0 18px 55px rgba(0,0,0,.55);transition:.15s;
    }
    .mini:hover{transform:translateY(-2px)}
    .miniImg{height:170px;background-size:cover;background-position:center;position:relative}
    .miniImg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg, rgba(0,0,0,.05), rgba(0,0,0,.86))}
    .miniTop{position:absolute;top:10px;left:10px;right:10px;z-index:2;display:flex;justify-content:space-between;gap:10px}
    .pill{
      display:inline-flex;align-items:center;gap:8px;padding:6px 10px;border-radius:999px;background:rgba(0,0,0,.35);
      border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
      font-size:12px;font-weight:900;
    }
    .miniBody{padding:12px 12px 14px}
    .miniTitle{font-size:16px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .miniSub{margin-top:4px;font-size:12px;opacity:.65}

    .eventsWrap{max-width:var(--max);margin:0 auto;padding: 6px 18px 36px}
    .filters{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0 16px}
    .chip{border:1px solid rgba(255,255,255,.22);background:transparent;color:#fff;padding:8px 14px;border-radius:999px;font-weight:800;font-size:13px;cursor:pointer;opacity:.9}
    .chip.active{background:#fff;color:#000;border-color:#fff}

    .eventRow{
      display:grid;grid-template-columns: 320px 1fr 220px;gap:14px;padding:14px 16px;border-radius:14px;
      background: linear-gradient(180deg, rgba(255,255,255,.16), rgba(255,255,255,.10));
      box-shadow: 0 18px 60px rgba(0,0,0,.45);
      margin-bottom:10px;align-items:center;border: 1px solid rgba(255,255,255,.10);
    }
    .eventLeft{display:flex;gap:12px;align-items:center;min-width:0}
    .compLogo{
      width:44px;height:44px;object-fit:contain;flex:0 0 auto;filter: drop-shadow(0 10px 18px rgba(0,0,0,.45));
      border-radius:14px;background: rgba(255,255,255,.08);border: 1px solid rgba(255,255,255,.12);padding:8px;
    }
    .eventTxt{min-width:0}
    .eventTitle{font-weight:900;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .eventMeta{opacity:.75;font-size:13px;font-style:italic}

    .eventMid{display:flex;align-items:center;justify-content:center;gap:18px}
    .midTeam{display:flex;align-items:center;gap:10px;min-width:0}
    .midTeam b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
    .midLogo{width:34px;height:34px;object-fit:contain;filter: drop-shadow(0 8px 14px rgba(0,0,0,.45))}
    .midVS{opacity:.7;font-weight:900}

    .eventRight{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
    .rightPill{
      display:inline-flex;align-items:center;gap:8px;padding:6px 10px;border-radius:999px;background:rgba(0,0,0,.35);
      border:1px solid rgba(255,255,255,.14);font-weight:900;font-size:12px;backdrop-filter: blur(10px);-webkit-backdrop-filter: blur(10px);
    }
    .sportTag{opacity:.85;font-size:12px;font-weight:800}
    footer{border-top:1px solid rgba(255,255,255,.08);padding:18px 0;text-align:center;opacity:.55;font-size:12px}

    /* ========== GATE TELEGRAM ========== */
    .gate{position:fixed;inset:0;z-index:9999;display:none;align-items:center;justify-content:center;padding:22px;background: rgba(0,0,0,.72);backdrop-filter: blur(10px);-webkit-backdrop-filter: blur(10px)}
    .gate.show{display:flex}
    .gateCard{width:min(620px, 100%);border-radius:24px;border:1px solid rgba(255,255,255,.14);background: linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,.06));box-shadow: 0 30px 120px rgba(0,0,0,.75);overflow:hidden;position:relative}
    .gateBanner{height:150px;background-size:cover;background-position:center;position:relative}
    .gateBanner::after{content:"";position:absolute;inset:0;background:radial-gradient(900px 260px at 20% 10%, rgba(255,255,255,.18), transparent 60%),linear-gradient(180deg, rgba(0,0,0,.10), rgba(0,0,0,.72))}
    .gateBody{padding:16px 18px 18px}
    .gateTop{display:flex;align-items:center;gap:14px;margin-top:-34px}
    .gateAvatar{width:74px;height:74px;border-radius:22px;border:1px solid rgba(255,255,255,.16);background: rgba(255,255,255,.08);overflow:hidden;box-shadow: 0 18px 40px rgba(0,0,0,.45);flex: 0 0 auto}
    .gateAvatar img{width:100%;height:100%;object-fit:cover}
    .gateTitleWrap{min-width:0}
    .gateTitle{margin:0;font-size:18px;font-weight:900;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .gateSub{margin-top:4px;opacity:.75;font-size:13px;font-weight:700}
    .gateText{margin:12px 0 14px;font-size:14px;line-height:1.35;opacity:.86}
    .gateActions{display:flex;gap:10px;flex-wrap:wrap}
    .btn{appearance:none;border:0;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:12px 14px;border-radius:14px;font-weight:900;letter-spacing:.2px;transition:.15s;user-select:none}
    .btnPrimary{background:#fff;color:#000}
    .btnPrimary:hover{transform:translateY(-1px)}
    .btnGhost{background:rgba(255,255,255,.10);color:#fff;border:1px solid rgba(255,255,255,.14)}
    .btnGhost:hover{background:rgba(255,255,255,.14)}
    .gateNote{margin-top:10px;font-size:12px;opacity:.55}

    @media (min-width: 1400px){ :root{ --cardW: 1100px; --cardH: 560px; } }
    @media (max-width: 980px){
      :root{ --max: 1200px; --cardW: calc(100vw - 36px); --cardH: 340px; --gap: 14px; --r: 20px; }
      .cardArrow{display:none}
      .centerHeader h1{font-size:30px}
      .bottom{left:14px;right:14px;bottom:12px;gap:12px}
      .watch{height:52px;padding:8px 12px}
      .play{width:42px;height:42px;margin-right:10px}
      .watchTxt{font-size:14px}
      .mini{width:280px}
      .miniImg{height:160px}
      .eventRow{grid-template-columns: 1fr;gap:10px;align-items:start}
      .eventMid{justify-content:flex-start}
      .eventRight{align-items:flex-start}
      .midTeam b{max-width:160px}
      .gateBanner{height:130px}
    }
  </style>
</head>

<body>
  <header>
    <div class="topbar">
      <div class="brand">IMFTX+</div>
      <div class="icons">
        <a id="tgTop" href="#" aria-label="Telegram"><i class="fa-brands fa-telegram"></i></a>
        <a href="#" aria-label="Discord"><i class="fa-brands fa-discord"></i></a>
        <a href="#" aria-label="X"><i class="fa-brands fa-x-twitter"></i></a>
      </div>
    </div>
  </header>

  <section class="hero">
    <div class="bg" id="bg"></div>

    <div class="wrap">
      <div class="centerHeader">
        <h1 id="heroTitle"></h1>
        <div class="l1" id="heroLeague"></div>
        <div class="l2" id="heroTime"></div>
      </div>

      <div class="sliderArea">
        <div class="viewport" id="viewport">
          <div class="track" id="track"></div>
        </div>
        <div class="dots" id="dots"></div>
      </div>
    </div>
  </section>

  <section class="section">
    <div class="sectionHead">
      <h2>À venir</h2>
      <span>Programme</span>
    </div>
    <div class="rail" id="upcoming"></div>
  </section>

  <section class="eventsWrap">
    <div class="sectionHead">
      <h2>Événements</h2>
      <span>Matchs du jour</span>
    </div>
    <div class="filters" id="filters"></div>
    <div id="eventsList"></div>
  </section>

  <footer>IMFTX+ — N°1 de la diffusion FR</footer>

  <!-- GATE TELEGRAM -->
  <div class="gate" id="gate">
    <div class="gateCard">
      <div class="gateBanner" id="gateBanner"></div>
      <div class="gateBody">
        <div class="gateTop">
          <div class="gateAvatar">
            <img id="gateAvatar" alt="Photo du canal">
          </div>
          <div class="gateTitleWrap">
            <h3 class="gateTitle">Rejoins le canal Telegram (accès)</h3>
            <div class="gateSub">IMFTX+ • Canal secours</div>
          </div>
        </div>

        <div class="gateText">
          ⚠️ Le site peut sauter à tout moment. Rejoins vite le canal pour rester informé.
        </div>

        <div class="gateActions">
          <button class="btn btnPrimary" id="joinBtn">
            <i class="fa-brands fa-telegram"></i>
            Rejoindre
          </button>
          <button class="btn btnGhost" id="copyBtn">
            <i class="fa-regular fa-copy"></i>
            Copier le lien
          </button>
        </div>

        <div class="gateNote">Après “Rejoindre”, l’accès se débloque automatiquement.</div>
      </div>
    </div>
  </div>

  <script>
    /* =========================
      CONFIG TELEGRAM
    ========================= */
    const TELEGRAM_LINK = "https://t.me/+llOGaNG7HeUzNmE0";
    const TELEGRAM_PDP  = "https://media.discordapp.net/attachments/1447687098751782993/1451634234707153027/image.png?ex=6946e33b&is=694591bb&hm=f29ad949bfddcce871cc32b769788f5965fcf4e28d7183fbb6bade0a4f691d59&=&format=webp&quality=lossless";
    const TELEGRAM_BANNER = TELEGRAM_PDP;
    const ACCESS_KEY = "imftx_access_v1";

    const gate = document.getElementById("gate");
    const joinBtn = document.getElementById("joinBtn");
    const copyBtn = document.getElementById("copyBtn");
    const gateAvatar = document.getElementById("gateAvatar");
    const gateBanner = document.getElementById("gateBanner");
    const tgTop = document.getElementById("tgTop");

    tgTop.href = TELEGRAM_LINK;
    gateAvatar.src = TELEGRAM_PDP;
    gateBanner.style.backgroundImage = `url('${TELEGRAM_BANNER}')`;

    function hasAccess(){ return localStorage.getItem(ACCESS_KEY) === "1"; }
    function grantAccess(){ localStorage.setItem(ACCESS_KEY, "1"); }

    if(!hasAccess()){
      gate.classList.add("show");
      document.body.style.overflow = "hidden";
    }

    joinBtn.addEventListener("click", () => {
      grantAccess();
      window.open(TELEGRAM_LINK, "_blank", "noopener");
      gate.classList.remove("show");
      document.body.style.overflow = "";
    });

    copyBtn.addEventListener("click", async () => {
      try{
        await navigator.clipboard.writeText(TELEGRAM_LINK);
        copyBtn.innerHTML = '<i class="fa-solid fa-check"></i> Copié';
        setTimeout(() => copyBtn.innerHTML = '<i class="fa-regular fa-copy"></i> Copier le lien', 1200);
      }catch(e){
        alert("Copie impossible sur cet appareil. Lien: " + TELEGRAM_LINK);
      }
    });

    /* =========================
      HELPERS (LOGOS)
      -> liens directs "Special:FilePath" (pas de raccourcis bizarres)
    ========================= */
    const WP = (filename) => `https://fr.wikipedia.org/wiki/Special:FilePath/${encodeURIComponent(filename)}`;

    // Logos clubs (Wikipédia) + 2 clubs “petits” via tes liens teambanks
    const TEAMS = {
      newcastle: { name:"Newcastle", logo: WP("Logo Newcastle United FC.svg") },
      chelsea:   { name:"Chelsea",   logo: WP("Logo Chelsea.svg") },

      maur:      { name:"Maur Lusita", logo: "https://empire-sport.space/upload/teambanks/xuehysbxpq8cg1iabmeemelbwxme8g.png" },
      lille:     { name:"Lille",     logo: WP("Logo LOSC Lille.svg") },

      mancity:   { name:"Man City",  logo: WP("Logo Manchester City 2016.svg") },
      westham:   { name:"West Ham",  logo: WP("Logo West Ham United.svg") },

      leipzig:   { name:"RB Leipzig", logo: WP("Logo RB Leipzig 2020.svg") },
      lever:     { name:"Leverkusen", logo: WP("Bayer 04 Leverkusen (logo).svg") },

      spurs:     { name:"Tottenham", logo: WP("Logo Tottenham Hotspur.svg") },
      liverpool: { name:"Liverpool", logo: WP("Logo FC Liverpool.svg") },

      juve:      { name:"Juventus",  logo: WP("Logo Juventus.svg") },
      roma:      { name:"Roma",      logo: WP("Logo AS Roma 2017.svg") },

      psg:       { name:"Paris SG",  logo: WP("Logo Paris Saint-Germain 2024.svg") },
      vff:       { name:"Vendée Fontenay", logo: "https://empire-sport.space/upload/teambanks/tdx3zlgni4ow0d5sv42pkkjysjxjud.png" },

      real:      { name:"Real Madrid", logo: WP("Logo Real Madrid.svg") },
      sevilla:   { name:"Sevilla",     logo: WP("Logo Séville FC.svg") }
    };

    // Bannières fournies (multiplex)
    const BANNERS = {
      multiplexCDF: "https://empire-sport.space/upload/cards/multiplex_32.png",
      multiplexPL:  "https://empire-sport.space/upload/cards/multiplex_33.png",
    };

    /* =========================
      MATCHS DU JOUR (le lendemain)
      -> logos affichés partout (slider + événements)
      -> bannières: multiplex = vraies bannières, le reste = auto (canvas) pour que ça rende propre
    ========================= */
    const todayMatches = [
      {
        id:"newcastle-chelsea",
        time:"13:30",
        comp:"Premier League",
        sport:"Football",
        match:"Newcastle - Chelsea",
        a:TEAMS.newcastle.name, b:TEAMS.chelsea.name,
        aLogo:TEAMS.newcastle.logo, bLogo:TEAMS.chelsea.logo,
        banner:""
      },
      {
        id:"maur-lusita-lille",
        time:"15:30",
        comp:"Coupe",
        sport:"Football",
        match:"Maur Lusita - Lille",
        a:TEAMS.maur.name, b:TEAMS.lille.name,
        aLogo:TEAMS.maur.logo, bLogo:TEAMS.lille.logo,
        banner:""
      },
      {
        id:"multiplex-cdf-1530",
        time:"15:30",
        comp:"Coupe de France",
        sport:"Football",
        match:"Multiplex Coupe de France",
        a:"Multiplex", b:"Coupe de France",
        aLogo:"", bLogo:"",
        banner:BANNERS.multiplexCDF
      },
      {

        time:"16:00",
        comp:"Premier League",
        sport:"Football",
        match:"Man City - West Ham",
        a:TEAMS.mancity.name, b:TEAMS.westham.name,
        aLogo:TEAMS.mancity.logo, bLogo:TEAMS.westham.logo,
        banner:""
      },
      {
        id:"multiplex-pl",
        time:"16:00",
        comp:"Premier League",
        sport:"Football",
        match:"Multiplex Premier League",
        a:"Multiplex", b:"Premier League",
        aLogo:"", bLogo:"",
        banner:BANNERS.multiplexPL
      },
      {
        id:"leipzig-leverkusen",
        time:"18:30",
        comp:"Bundesliga",
        sport:"Football",
        match:"RB Leipzig - Bayer Leverkusen",
        a:TEAMS.leipzig.name, b:TEAMS.lever.name,
        aLogo:TEAMS.leipzig.logo, bLogo:TEAMS.lever.logo,
        banner:""
      },
      {
        id:"tottenham-liverpool",
        time:"18:30",
        comp:"Premier League",
        sport:"Football",
        match:"Tottenham - Liverpool",
        a:TEAMS.spurs.name, b:TEAMS.liverpool.name,
        aLogo:TEAMS.spurs.logo, bLogo:TEAMS.liverpool.logo,
        banner:""
      },
      {
        id:"juventus-roma",
        time:"20:45",
        comp:"Serie A",
        sport:"Football",
        match:"Juventus - Roma",
        a:TEAMS.juve.name, b:TEAMS.roma.name,
        aLogo:TEAMS.juve.logo, bLogo:TEAMS.roma.logo,
        banner:""
      },
      {
        id:"psg-vendee-fontenay",
        time:"21:00",
        comp:"Coupe de France",
        sport:"Football",
        match:"Paris SG - Vendée Fontenay Foot",
        a:TEAMS.psg.name, b:TEAMS.vff.name,
        aLogo:TEAMS.psg.logo, bLogo:TEAMS.vff.logo,
        banner:""
      },
      {
        id:"real-sevilla",
        time:"21:00",
        comp:"La Liga",
        sport:"Football",
        match:"Real Madrid - Sevilla",
        a:TEAMS.real.name, b:TEAMS.sevilla.name,
        aLogo:TEAMS.real.logo, bLogo:TEAMS.sevilla.logo,
        banner:""
      }
    ];

    /* =========================
      STATUS AUTO
    ========================= */
    const MATCH_DURATION_MIN = 135;
    function timeToMinutes(hhmm){
      const [h,m] = hhmm.split(":").map(Number);
      return (h*60)+(m||0);
    }
    function computeStatus(hhmm){
      const now = new Date();
      const nowMin = now.getHours()*60 + now.getMinutes();
      const start = timeToMinutes(hhmm);
      const end = start + MATCH_DURATION_MIN;
      if(nowMin < start) return "À venir";
      if(nowMin >= start && nowMin < end) return "En cours";
      return "Terminé";
    }
    todayMatches.forEach(m => m.status = computeStatus(m.time));

    /* =========================
      BANNIÈRES AUTO (CANVAS)
      -> pour éviter “que du multiplex” quand il manque des bannières
    ========================= */
    const bannerCache = new Map();

    function loadImg(src){
      return new Promise((resolve)=>{
        if(!src){ resolve(null); return; }
        const img = new Image();
        img.crossOrigin = "anonymous";
        img.onload = () => resolve(img);
        img.onerror = () => resolve(null);
        img.src = src;
      });
    }

    function roundRect(ctx, x, y, w, h, r){
      ctx.beginPath();
      ctx.moveTo(x+r, y);
      ctx.arcTo(x+w, y, x+w, y+h, r);
      ctx.arcTo(x+w, y+h, x, y+h, r);
      ctx.arcTo(x, y+h, x, y, r);
      ctx.arcTo(x, y, x+w, y, r);
      ctx.closePath();
    }

    async function makeAutoBanner({aLogo,bLogo,title}){
      const key = JSON.stringify({aLogo,bLogo,title});
      if(bannerCache.has(key)) return bannerCache.get(key);

      const w = 1600, h = 900;
      const c = document.createElement("canvas");
      c.width = w; c.height = h;
      const ctx = c.getContext("2d");

      // fond gradient dark
      const g = ctx.createLinearGradient(0,0,w,h);
      g.addColorStop(0, "#0b1220");
      g.addColorStop(0.55, "#050a14");
      g.addColorStop(1, "#000000");
      ctx.fillStyle = g;
      ctx.fillRect(0,0,w,h);

      // halos
      ctx.globalAlpha = 0.55;
      ctx.fillStyle = "#0ea5e9";
      ctx.beginPath(); ctx.arc(w*0.18,h*0.35,220,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = "#a855f7";
      ctx.beginPath(); ctx.arc(w*0.82,h*0.68,260,0,Math.PI*2); ctx.fill();
      ctx.globalAlpha = 1;

      // noise léger
      for(let i=0;i<7000;i++){
        const x = Math.random()*w, y=Math.random()*h;
        ctx.fillStyle = `rgba(255,255,255,${Math.random()*0.025})`;
        ctx.fillRect(x,y,1,1);
      }

      const [A,B] = await Promise.all([loadImg(aLogo), loadImg(bLogo)]);

      // logos flous en fond
      function drawBlurLogo(img, x, y, size, alpha){
        if(!img) return;
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.filter = "blur(10px)";
        ctx.drawImage(img, x-size/2, y-size/2, size, size);
        ctx.restore();
      }
      drawBlurLogo(A, w*0.28, h*0.55, 520, 0.22);
      drawBlurLogo(B, w*0.72, h*0.52, 520, 0.22);

      // cartes logo net
      function drawCardLogo(img, cx, cy){
        if(!img) return;
        const size = 240, r = 38;
        const x = cx - size/2, y = cy - size/2;

        ctx.save();
        ctx.fillStyle = "rgba(255,255,255,.08)";
        ctx.strokeStyle = "rgba(255,255,255,.14)";
        ctx.lineWidth = 3;
        roundRect(ctx, x, y, size, size, r);
        ctx.fill(); ctx.stroke();

        ctx.shadowColor = "rgba(0,0,0,.55)";
        ctx.shadowBlur = 24;
        ctx.drawImage(img, x+38, y+38, size-76, size-76);
        ctx.restore();
      }

      drawCardLogo(A, w*0.30, h*0.56);
      drawCardLogo(B, w*0.70, h*0.56);

      // VS
      ctx.save();
      ctx.globalAlpha = 0.95;
      ctx.fillStyle = "rgba(255,255,255,.10)";
      ctx.strokeStyle = "rgba(255,255,255,.18)";
      ctx.lineWidth = 2;
      const vsW = 150, vsH = 70;
      roundRect(ctx, w/2 - vsW/2, h*0.56 - vsH/2, vsW, vsH, 26);
      ctx.fill(); ctx.stroke();
      ctx.fillStyle = "rgba(255,255,255,.92)";
      ctx.font = "900 34px Outfit, system-ui, Arial";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("VS", w/2, h*0.56);
      ctx.restore();

      // titre bas
      ctx.save();
      const gg = ctx.createLinearGradient(0,h*0.72,0,h);
      gg.addColorStop(0,"rgba(0,0,0,0)");
      gg.addColorStop(1,"rgba(0,0,0,.78)");
      ctx.fillStyle = gg;
      ctx.fillRect(0,h*0.68,w,h*0.32);

      ctx.globalAlpha = 0.92;
      ctx.fillStyle = "rgba(255,255,255,.92)";
      ctx.font = "900 60px Outfit, system-ui, Arial";
      ctx.textAlign = "left";
      ctx.textBaseline = "bottom";
      const t = (title || "").toUpperCase();
      ctx.fillText(t.slice(0, 34), w*0.06, h*0.94);
      ctx.restore();

      const data = c.toDataURL("image/jpeg", 0.86);
      bannerCache.set(key, data);
      return data;
    }

    /* =========================
      VIEW MODELS
    ========================= */
    function formatToday(hhmm){ return `Aujourd’hui · ${hhmm}`; }

    const matchesVM = todayMatches.map(m => ({
      id: m.id,
      status: m.status,
      league: m.comp,
      time: formatToday(m.time),
      aName: m.a,
      bName: m.b,
      title: m.match,
      aLogo: m.aLogo,
      bLogo: m.bLogo,
      banner: m.banner || "",
      sport: m.sport
    }));

    /* =========================
      RENDER
    ========================= */
    const bg = document.getElementById("bg");
    const heroTitle = document.getElementById("heroTitle");
    const heroLeague = document.getElementById("heroLeague");
    const heroTime = document.getElementById("heroTime");
    const track = document.getElementById("track");
    const dots = document.getElementById("dots");
    const viewport = document.getElementById("viewport");
    const upcoming = document.getElementById("upcoming");

    let idx = 0;

    function setHero(m){
      bg.style.backgroundImage = `url('${m.banner}')`;
      heroTitle.textContent = `${m.aName} vs ${m.bName}`;
      heroLeague.textContent = m.league;
      heroTime.textContent = m.time;
    }

    function badgeHTML(m){
      if(m.status === "En cours") return `<div class="badge"><span class="dotGreen"></span>En cours</div>`;
      if(m.status === "Terminé") return `<div class="badge" style="opacity:.78"><span class="dotOrange"></span>Terminé</div>`;
      return `<div class="badge"><span class="dotOrange"></span>À venir</div>`;
    }

    function logosBlock(m){
      return `
        <div class="logosLine">
          <img class="teamLogo" src="${m.aLogo || ''}" alt="${m.aName}">
          <div class="vsPill">VS</div>
          <img class="teamLogo" src="${m.bLogo || ''}" alt="${m.bName}">
        </div>
      `;
    }

    function watchUrl(m){
      return `pages/${m.id}.html`;
    }

    function cardHTML(m){
      return `
        <div class="card" data-id="${m.id}">
          <div class="poster" style="background-image:url('${m.banner}')"></div>
          ${badgeHTML(m)}
          <div class="cardArrow left" onclick="prevSlide()"><span>‹</span></div>
          <div class="cardArrow right" onclick="nextSlide()"><span>›</span></div>

          <div class="bottom">
            <div class="leftInfo">
              ${logosBlock(m)}
              <div class="cardTitle">${m.title}</div>
              <div class="cardSub">${m.league} • ${m.time}</div>
            </div>

            <a class="watch" href="${watchUrl(m)}" target="_blank" rel="noopener">
              <div class="play">▶</div>
              <div class="watchTxt">REGARDER</div>
            </a>
          </div>
        </div>
      `;
    }

    function dotHTML(i){
      return `<div class="d ${i===0?'active':''}" id="d${i}" onclick="goTo(${i})"></div>`;
    }

    function miniHTML(m){
      const dot = m.status === "En cours" ? "dotGreen" : "dotOrange";
      return `
        <a class="mini" href="${watchUrl(m)}" target="_blank" rel="noopener">
          <div class="miniImg" style="background-image:url('${m.banner}')">
            <div class="miniTop">
              <span class="pill"><span class="${dot}"></span>${m.status}</span>
              <span class="pill">${m.sport}</span>
            </div>
          </div>
          <div class="miniBody">
            <div class="miniTitle">${m.title}</div>
            <div class="miniSub">${m.league} • ${m.time}</div>
          </div>
        </a>
      `;
    }

    function updateDots(){
      for(let i=0;i<matchesVM.length;i++){
        const el = document.getElementById("d"+i);
        if(el) el.classList.toggle("active", i===idx);
      }
    }

    function update(){
      const first = document.querySelector(".card");
      if(!first) return;
      const cardW = first.getBoundingClientRect().width;
      const gap = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--gap')) || 18;
      const vw = viewport.getBoundingClientRect().width;
      const centerOffset = Math.max(16, (vw - cardW) / 2);
      const peekBias = Math.min(120, vw * 0.10);
      const x = -(idx * (cardW + gap)) + centerOffset - peekBias;
      track.style.transform = `translateX(${x}px)`;

      setHero(matchesVM[idx]);
      updateDots();
    }

    function nextSlide(){ idx = (idx + 1) % matchesVM.length; update(); }
    function prevSlide(){ idx = (idx - 1 + matchesVM.length) % matchesVM.length; update(); }
    function goTo(i){ idx = i; update(); }

    window.nextSlide = nextSlide;
    window.prevSlide = prevSlide;
    window.goTo = goTo;

    // swipe mobile
    let startX = 0;
    track.addEventListener("touchstart", e => { startX = e.touches[0].clientX; }, {passive:true});
    track.addEventListener("touchend", e => {
      const endX = e.changedTouches[0].clientX;
      const dx = endX - startX;
      if(Math.abs(dx) > 40){
        if(dx < 0) nextSlide(); else prevSlide();
      }
    }, {passive:true});

    async function ensureBanners(){
      for(const m of matchesVM){
        if(!m.banner){
          // si multiplex -> déjà ok, sinon auto
          m.banner = await makeAutoBanner({ aLogo: m.aLogo, bLogo: m.bLogo, title: m.title });
        }
      }
    }

    function buildUpcoming(){
      const up = matchesVM
        .filter(x => x.status === "À venir")
        .sort((a,b)=> timeToMinutes(a.time.split("·")[1].trim()) - timeToMinutes(b.time.split("·")[1].trim()));
      upcoming.innerHTML = up.map(miniHTML).join("");
    }

    /* =========================
      ÉVÉNEMENTS (LISTE + FILTRES)
    ========================= */
    const eventsList = document.getElementById("eventsList");
    const filtersEl = document.getElementById("filters");

    const FILTERS = ["Tous Les Événements", "Premier League", "Coupe de France", "Serie A", "La Liga", "Bundesliga"];
    let activeFilter = "Tous Les Événements";

    function renderFilters(){
      filtersEl.innerHTML = FILTERS.map(f =>
        `<button class="chip ${f===activeFilter?'active':''}" onclick="setFilter('${f.replace(/'/g,"\\'")}')">${f}</button>`
      ).join("");
    }

    window.setFilter = (f) => {
      activeFilter = f;
      renderFilters();
      renderEvents();
    };

    function statusPill(status){
      if(status === "En cours") return `<span class="rightPill"><span class="dotGreen"></span>En cours</span>`;
      if(status === "Terminé") return `<span class="rightPill" style="opacity:.75"><span class="dotOrange"></span>Terminé</span>`;
      return `<span class="rightPill" style="background:rgba(251,146,60,.12);border-color:rgba(251,146,60,.25)"><span class="dotOrange"></span>À venir</span>`;
    }

    function rowHTML(m){
      // compLogo “simple” (optionnel) : si tu veux je te mets les logos ligues après
      const compLogo = "";
      return `
        <a class="eventRow" href="${watchUrl(m)}" target="_blank" rel="noopener">
          <div class="eventLeft">
            ${compLogo ? `<img class="compLogo" src="${compLogo}" alt="${m.league}">` : ``}
            <div class="eventTxt">
              <div class="eventTitle">${m.title}</div>
              <div class="eventMeta">${m.league} • ${m.time}</div>
            </div>
          </div>

          <div class="eventMid">
            <div class="midTeam">
              <img class="midLogo" src="${m.aLogo || ''}" alt="${m.aName}">
              <b>${m.aName}</b>
            </div>
            <div class="midVS">vs</div>
            <div class="midTeam">
              <b>${m.bName}</b>
              <img class="midLogo" src="${m.bLogo || ''}" alt="${m.bName}">
            </div>
          </div>

          <div class="eventRight">
            ${statusPill(m.status)}
            <div class="sportTag">${m.sport}</div>
          </div>
        </a>
      `;
    }

    function renderEvents(){
      const list = matchesVM
        .filter(m => activeFilter === "Tous Les Événements" ? true : (m.league === activeFilter))
        .sort((a,b)=> timeToMinutes(a.time.split("·")[1].trim()) - timeToMinutes(b.time.split("·")[1].trim()));
      eventsList.innerHTML = list.map(rowHTML).join("");
    }

    /* =========================
      INIT
    ========================= */
    (async function init(){
      await ensureBanners();

      track.innerHTML = matchesVM.map(cardHTML).join("");
      dots.innerHTML = matchesVM.map((_,i)=>dotHTML(i)).join("");

      buildUpcoming();
      renderFilters();
      renderEvents();

      update();
      window.addEventListener("resize", update);
    })();
  </script>
</body>
</html>
