<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>IMFTX+</title>

  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

  <style>
    :root{
      --max: 1280px;
      --bg: #000;
      --card: rgba(255,255,255,.06);
      --line: rgba(255,255,255,.14);
      --shadow: 0 22px 90px rgba(0,0,0,.75);
      --r: 22px;
      --gap: 16px;
      --good: #22c55e;
      --warn: #fb923c;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{margin:0;background:var(--bg);color:#fff;font-family:'Outfit',system-ui,-apple-system,"Segoe UI",Roboto,Arial}
    a{color:inherit;text-decoration:none}
    button{font-family:inherit}
    img{display:block}

    header{position:fixed;inset:0 0 auto 0;z-index:50;background:linear-gradient(180deg, rgba(0,0,0,.88), rgba(0,0,0,.12));backdrop-filter: blur(10px)}
    .topbar{max-width:var(--max);margin:0 auto;padding:14px 16px;display:flex;align-items:center;justify-content:space-between}
    .brand{font-weight:900;letter-spacing:.2px;font-size:20px;opacity:.98}
    .icons{display:flex;gap:14px;font-size:18px;align-items:center}
    .icons a{opacity:.70}
    .icons a:hover{opacity:1}

    .hero{position:relative;padding-top:76px;padding-bottom:14px;overflow:hidden}
    .bg{
      position:absolute; inset:0;
      background-size:cover;background-position:center;
      transform:scale(1.12);
      filter: blur(16px) saturate(1.15) brightness(.62);
      opacity:.98;
    }
    .hero::after{
      content:"";position:absolute;inset:0;
      background:
        radial-gradient(1000px 600px at 50% 25%, rgba(255,255,255,.10), transparent 60%),
        linear-gradient(180deg, rgba(0,0,0,.08) 0%, rgba(0,0,0,.84) 70%, rgba(0,0,0,.98) 100%),
        linear-gradient(90deg, rgba(0,0,0,.92), rgba(0,0,0,.12), rgba(0,0,0,.92));
      pointer-events:none;
    }

    .wrap{position:relative;z-index:2;max-width:var(--max);margin:0 auto;padding:0 16px}
    .centerHeader{text-align:center;padding:8px 0 10px}
    .centerHeader h1{margin:0;font-size:34px;font-weight:900;line-height:1.05;text-shadow:0 16px 40px rgba(0,0,0,.65)}
    .centerHeader .l1{margin-top:10px;opacity:.86;font-weight:800}
    .centerHeader .l2{margin-top:6px;opacity:.66;font-style:italic}

    /* Slider */
    .sliderArea{position:relative;padding-top:6px}
    .viewport{overflow:hidden}
    .track{
      display:flex;gap:var(--gap);
      transition:transform .55s ease;
      will-change:transform;
      padding-bottom:2px;
    }
    .card{
      flex:0 0 980px;height:520px;
      border-radius:var(--r);overflow:hidden;position:relative;
      border:1px solid var(--line);box-shadow:var(--shadow);
      background: var(--card);
    }
    .poster{position:absolute;inset:0;background-size:cover;background-position:center;transform:scale(1.01)}
    .card::after{
      content:"";position:absolute;inset:0;
      background:
        linear-gradient(180deg, rgba(0,0,0,.04) 0%, rgba(0,0,0,.56) 70%, rgba(0,0,0,.92) 100%),
        linear-gradient(90deg, rgba(0,0,0,.62), rgba(0,0,0,.08), rgba(0,0,0,.62));
      pointer-events:none;
    }
    .badge{
      position:absolute;top:14px;left:14px;z-index:6;
      display:inline-flex;align-items:center;gap:8px;
      padding:7px 11px;border-radius:999px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.14);
      backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-weight:900;font-size:12px;
    }
    .dot{width:9px;height:9px;border-radius:50%;display:inline-block}
    .dot.warn{background:var(--warn)}
    .dot.good{background:var(--good)}

    .bottom{
      position:absolute;left:16px;right:16px;bottom:16px;z-index:7;
      display:flex;align-items:flex-end;justify-content:space-between;gap:14px
    }
    .leftInfo{min-width:0}
    .logosLine{display:flex;align-items:center;gap:12px;margin-bottom:10px;flex-wrap:wrap}
    .teamLogo{
      width:44px;height:44px;border-radius:50%;
      background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.16);
      padding:6px;object-fit:contain;
    }
    .vsPill{
      width:34px;height:34px;border-radius:50%;
      display:grid;place-items:center;
      font-weight:900;font-size:12px;
      background:rgba(255,255,255,.10);
      border:1px solid rgba(255,255,255,.14);
    }
    .cardTitle{font-size:24px;font-weight:900;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .cardSub{margin-top:6px;opacity:.74;font-style:italic;font-size:13px}

    .watch{
      display:inline-flex;align-items:center;
      height:62px;padding:10px 14px;border-radius:999px;
      background:rgba(255,255,255,.14);
      border:1px solid rgba(255,255,255,.16);
      overflow:hidden;white-space:nowrap;
    }
    .watch:hover{background:rgba(255,255,255,.18)}
    .play{
      width:52px;height:52px;border-radius:50%;
      background:rgba(0,0,0,.35);
      border:1px solid rgba(255,255,255,.12);
      display:grid;place-items:center;
      margin-right:12px;font-size:16px;
    }
    .watchTxt{font-weight:900;letter-spacing:.2px;padding-right:8px}

    /* Sections */
    .eventsWrap{
      max-width:var(--max);margin:0 auto;padding: 10px 16px 30px;position:relative;z-index:5
    }
    .sectionHead{display:flex;align-items:baseline;justify-content:space-between;margin:0 0 12px}
    .sectionHead h2{margin:0;font-size:22px;font-weight:900}
    .sectionHead span{opacity:.55;font-size:12px}

    .eventRow{
      display:flex; align-items:center; justify-content:space-between;
      gap:14px;
      padding:14px 16px;
      border-radius:16px;
      background: linear-gradient(180deg, rgba(255,255,255,.14), rgba(255,255,255,.07));
      border:1px solid rgba(255,255,255,.10);
      box-shadow: 0 18px 60px rgba(0,0,0,.45);
    }
    .eventLeft{display:flex;align-items:center;gap:12px;min-width:0}
    .leagueIcon{
      width:30px;height:30px;border-radius:10px;
      background:rgba(0,0,0,.35);
      border:1px solid rgba(255,255,255,.14);
      display:grid;place-items:center;
      overflow:hidden;flex:0 0 auto;
    }
    .leagueIcon img{width:20px;height:20px;object-fit:contain;opacity:.95}
    .eventTxt{min-width:0}
    .eventTitle{font-weight:900;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .eventMeta{opacity:.75;font-size:12px;font-style:italic}

    .eventMid{display:flex;align-items:center;gap:16px;min-width:0;flex:1;justify-content:center}
    .midTeam{display:flex;align-items:center;gap:10px;min-width:0}
    .midTeam b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:230px;font-size:14px}
    .midLogo{
      width:36px;height:36px;border-radius:999px;
      background:rgba(255,255,255,.10);
      border:1px solid rgba(255,255,255,.14);
      padding:6px;object-fit:contain;flex:0 0 auto;
    }
    .midVS{
      font-weight:900;font-size:12px;opacity:.78;
      padding:6px 12px;border-radius:999px;
      background:rgba(0,0,0,.30);
      border:1px solid rgba(255,255,255,.14);
    }
    .eventRight{display:flex;align-items:center;gap:10px;flex:0 0 auto}
    .timePill{
      display:inline-flex;align-items:center;gap:8px;
      padding:8px 12px;border-radius:999px;
      background:rgba(0,0,0,.35);
      border:1px solid rgba(255,255,255,.14);
      font-weight:900;font-size:12px;
      backdrop-filter: blur(10px);-webkit-backdrop-filter: blur(10px);
      white-space:nowrap;
    }

    footer{border-top:1px solid rgba(255,255,255,.08);padding:18px 0;text-align:center;opacity:.55;font-size:12px}

    @media (min-width: 1400px){
      .card{flex-basis: 1080px;height:560px}
    }
    @media (max-width: 980px){
      .card{flex-basis: calc(100vw - 32px);height:340px}
      .centerHeader h1{font-size:30px}
      .bottom{left:14px;right:14px;bottom:12px;gap:12px}
      .watch{height:52px;padding:8px 12px}
      .play{width:42px;height:42px;margin-right:10px}
      .watchTxt{font-size:14px}
      .eventRow{flex-direction:column;align-items:stretch}
      .eventMid{justify-content:flex-start}
      .eventRight{justify-content:space-between}
      .midTeam b{max-width:160px}
    }
  </style>
</head>

<body>
  <header>
    <div class="topbar">
      <div class="brand">IMFTX+</div>
      <div class="icons">
        <a href="#" aria-label="Telegram"><i class="fa-brands fa-telegram"></i></a>
        <a href="#" aria-label="Discord"><i class="fa-brands fa-discord"></i></a>
        <a href="#" aria-label="X"><i class="fa-brands fa-x-twitter"></i></a>
      </div>
    </div>
  </header>

  <section class="hero">
    <div class="bg" id="bg"></div>

    <div class="wrap">
      <div class="centerHeader">
        <h1 id="heroTitle">Egypt vs Zimbabwe</h1>
        <div class="l1" id="heroLeague">International</div>
        <div class="l2" id="heroTime">Aujourd’hui · 20:00</div>
      </div>

      <div class="sliderArea">
        <div class="viewport" id="viewport">
          <div class="track" id="track"></div>
        </div>
      </div>
    </div>
  </section>

  <section class="eventsWrap">
    <div class="sectionHead">
      <h2>Événements</h2>
      <span>Match du jour</span>
    </div>
    <div id="eventsList"></div>
  </section>

  <footer>IMFTX+ — N°1 de la diffusion FR</footer>

  <script>
    // 1 match = 1 page : /pages/{id}.html
    function watchUrl(m){ return `pages/${m.id}.html`; }

    const MATCH = {
      id: "egypt-zimbabwe",
      time: "20:00",
      comp: "International",
      sport: "Football",
      match: "Egypt - Zimbabwe",
      a: "Egypt",
      b: "Zimbabwe",
      // Tu peux remplacer par logos officiels si tu veux
      aLogo: "https://upload.wikimedia.org/wikipedia/commons/thumb/f/fe/Flag_of_Egypt.svg/256px-Flag_of_Egypt.svg.png",
      bLogo: "https://upload.wikimedia.org/wikipedia/commons/thumb/6/6a/Flag_of_Zimbabwe.svg/256px-Flag_of_Zimbabwe.svg.png",
      banner: "https://empire-sport.site/upload/banners/egypt-vs-zimbabwe.png"
    };

    const MATCH_DURATION_MIN = 135;

    function timeToMinutes(hhmm){
      const [h,m] = hhmm.split(":").map(Number);
      return (h*60)+(m||0);
    }

    function computeStatus(hhmm){
      const now = new Date();
      const nowMin = now.getHours()*60 + now.getMinutes();
      const start = timeToMinutes(hhmm);
      const end = start + MATCH_DURATION_MIN;
      if(nowMin < start) return "À venir";
      if(nowMin >= start && nowMin < end) return "En cours";
      return "Terminé";
    }

    function countdownTo(hhmm){
      const now = new Date();
      const target = new Date(now);
      const [h,m] = hhmm.split(":").map(Number);
      target.setHours(h, m, 0, 0);

      const diff = target.getTime() - now.getTime();
      if(diff <= 0) return "";
      const totalSec = Math.floor(diff/1000);
      const hh = Math.floor(totalSec/3600);
      const mm = Math.floor((totalSec%3600)/60);
      const ss = totalSec%60;
      return `${hh}h ${String(mm).padStart(2,"0")}m ${String(ss).padStart(2,"0")}s`;
    }

    function formatToday(hhmm){ return `Aujourd’hui · ${hhmm}`; }

    // HERO BG + CARD
    document.getElementById("bg").style.backgroundImage = `url('${MATCH.banner}')`;

    function badgeHTML(status){
      if(status === "En cours") return `<div class="badge"><span class="dot good"></span>En cours</div>`;
      if(status === "Terminé") return `<div class="badge" style="opacity:.78"><span class="dot warn"></span>Terminé</div>`;
      return `<div class="badge"><span class="dot warn"></span>À venir</div>`;
    }

    function cardHTML(m){
      const status = computeStatus(m.time);
      const timeLabel = formatToday(m.time);
      return `
        <div class="card">
          <div class="poster" style="background-image:url('${m.banner}')"></div>
          ${badgeHTML(status)}

          <div class="bottom">
            <div class="leftInfo">
              <div class="logosLine">
                <img class="teamLogo" src="${m.aLogo}" alt="${m.a}">
                <div class="vsPill">VS</div>
                <img class="teamLogo" src="${m.bLogo}" alt="${m.b}">
              </div>
              <div class="cardTitle">${m.match}</div>
              <div class="cardSub">${m.comp} • ${timeLabel}</div>
            </div>

            <a class="watch" href="${watchUrl(m)}" rel="noopener">
              <div class="play">▶</div>
              <div class="watchTxt">REGARDER</div>
            </a>
          </div>
        </div>
      `;
    }

    function rowHTML(m){
      const status = computeStatus(m.time);
      const pill =
        status === "En cours" ? "En cours" :
        status === "Terminé" ? "Terminé" :
        (countdownTo(m.time) || "À venir");

      const dotClass = status === "En cours" ? "good" : "warn";

      return `
        <a class="eventRow" href="${watchUrl(m)}" rel="noopener">
          <div class="eventLeft">
            <span class="leagueIcon"><span style="opacity:.85;font-weight:900;font-size:12px;">🌍</span></span>
            <div class="eventTxt">
              <div class="eventTitle">${m.match}</div>
              <div class="eventMeta">${m.comp} • ${formatToday(m.time)}</div>
            </div>
          </div>

          <div class="eventMid">
            <div class="midTeam">
              <img class="midLogo" src="${m.aLogo}" alt="${m.a}">
              <b>${m.a}</b>
            </div>
            <div class="midVS">vs</div>
            <div class="midTeam">
              <b>${m.b}</b>
              <img class="midLogo" src="${m.bLogo}" alt="${m.b}">
            </div>
          </div>

          <div class="eventRight">
            <span class="timePill">
              <span class="dot ${dotClass}"></span>
              ${pill}
            </span>
            <span style="opacity:.88;font-size:12px;font-weight:900">${m.sport}</span>
          </div>
        </a>
      `;
    }

    function render(){
      // header text
      document.getElementById("heroTitle").textContent = `${MATCH.a} vs ${MATCH.b}`;
      document.getElementById("heroLeague").textContent = MATCH.comp;
      document.getElementById("heroTime").textContent = formatToday(MATCH.time);

      // slider (1 seule carte)
      document.getElementById("track").innerHTML = cardHTML(MATCH);

      // events list (1 seule ligne)
      document.getElementById("eventsList").innerHTML = rowHTML(MATCH);
    }

    render();
    setInterval(render, 1000);
  </script>
</body>
</html>
