<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>IMFTX+ — Live</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

  <style>
    html,body{
      height:100%;
      margin:0;
      font-family:'Outfit',system-ui,-apple-system,"Segoe UI",Roboto,Arial;
      background:#070708;
      color:#fff;
    }

    /* badge en direct */
    .live-badge{
      display:inline-flex;
      align-items:center;
      gap:10px;
      padding:10px 18px;
      border-radius:999px;
      background:rgba(0,0,0,.35);
      border:1px solid rgba(255,255,255,.08);
      backdrop-filter: blur(12px);
      font-weight:800;
      font-size:14px;
      color:#eaffea;
    }
    .live-dot{
      width:10px;
      height:10px;
      background:#22c55e;
      border-radius:999px;
      box-shadow:0 0 18px rgba(34,197,94,.9);
    }

    /* card */
    .match-card{
      position:relative;
      height:320px;
      border-radius:22px;
      overflow:hidden;
      border:1px solid rgba(255,255,255,.10);
      box-shadow:0 30px 120px rgba(0,0,0,.80);
      background:#111;
    }

    .match-bg{
      position:absolute;
      inset:0;
      background-size:cover;
      background-position:center;
      transform:scale(1.02);
    }

    .match-overlay{
      position:absolute;
      inset:0;
      background: linear-gradient(180deg, rgba(0,0,0,.12) 0%, rgba(0,0,0,.45) 55%, rgba(0,0,0,.78) 100%);
    }

    .time-pill{
      position:absolute;
      top:14px;
      left:14px;
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:7px 11px;
      border-radius:999px;
      background:rgba(0,0,0,.55);
      border:1px solid rgba(255,255,255,.10);
      font-weight:900;
      font-size:13px;
    }
    .time-dot{
      width:9px;
      height:9px;
      background:#f59e0b;
      border-radius:999px;
      box-shadow:0 0 12px rgba(245,158,11,.75);
    }

    /* ✅ ZONE BAS GAUCHE */
    .match-info{
      position:absolute;
      left:18px;
      right:18px;
      bottom:18px;
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap:14px;
    }

    /* ✅ LOGO VS LOGO */
    .logos-vs{
      display:flex;
      align-items:center;
      gap:10px;
      margin-bottom:10px;
    }
    .logos-vs img{
      width:42px;
      height:42px;
      object-fit:contain;
      filter: drop-shadow(0 6px 18px rgba(0,0,0,.75));
    }
    .logos-vs span{
      font-weight:900;
      opacity:.9;
      font-size:14px;
    }

    /* ✅ COMPETITION + HEURE */
    .meta-row{
      display:flex;
      align-items:center;
      gap:10px;
      font-size:13px;
      font-weight:800;
      color:rgba(255,255,255,.75);
    }
    .meta-row img{
      width:26px;
      height:26px;
      object-fit:contain;
      filter: drop-shadow(0 6px 14px rgba(0,0,0,.75));
    }
    .meta-row em{
      font-style:italic;
      font-weight:800;
      opacity:.95;
    }

    /* bouton regarder */
    .watch-btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      padding:11px 18px;
      border-radius:999px;
      background:rgba(255,255,255,.12);
      border:1px solid rgba(255,255,255,.14);
      color:#fff;
      font-weight:900;
      backdrop-filter: blur(14px);
      transition:.15s;
      min-width:120px;
      font-size:13px;
      flex-shrink:0;
    }
    .watch-btn:hover{
      background:rgba(255,255,255,.18);
      transform:scale(1.02);
    }

    /* responsive */
    @media(max-width:1024px){
      .match-card{height:280px;}
      .logos-vs img{width:38px;height:38px;}
    }
    @media(max-width:640px){
      .match-card{height:250px;}
      .logos-vs img{width:36px;height:36px;}
      .watch-btn{padding:10px 14px; min-width:110px; font-size:12px;}
      .meta-row{font-size:12px;}
    }
  </style>
</head>

</main>
