<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>IMFTX+ — Live</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

  <style>
    html,body{
      height:100%;
      margin:0;
      font-family:'Outfit',system-ui,-apple-system,"Segoe UI",Roboto,Arial;
      background:#070708;
      color:#fff;
    }

    .live-badge{
      display:inline-flex;
      align-items:center;
      gap:10px;
      padding:10px 18px;
      border-radius:999px;
      background:rgba(0,0,0,.35);
      border:1px solid rgba(255,255,255,.08);
      backdrop-filter: blur(12px);
      font-weight:800;
      font-size:14px;
      color:#eaffea;
    }
    .live-dot{
      width:10px;height:10px;
      background:#22c55e;
      border-radius:999px;
      box-shadow:0 0 18px rgba(34,197,94,.9);
    }

    /* ✅ Match card style (comme la ref) */
    .match-card{
      position:relative;
      height:240px;
      border-radius:18px;
      overflow:hidden;
      border:1px solid rgba(255,255,255,.10);
      box-shadow:0 24px 80px rgba(0,0,0,.72);
      background:#111;
    }

    .match-bg{
      position:absolute;
      inset:0;
      background-size:cover;
      background-position:center;
      transform:scale(1.02);
    }

    .overlay{
      position:absolute;
      inset:0;
      background:linear-gradient(90deg, rgba(0,0,0,.78) 0%, rgba(0,0,0,.45) 55%, rgba(0,0,0,.10) 100%);
    }

    /* ✅ Logos teams top */
    .top-logos{
      position:absolute;
      top:16px;
      left:16px;
      display:flex;
      align-items:center;
      gap:10px;
      z-index:5;
    }

    .team-logo{
      width:42px;height:42px;
      object-fit:contain;
      filter:drop-shadow(0 8px 18px rgba(0,0,0,.8));
    }

    .vs{
      font-weight:900;
      opacity:.9;
      font-size:14px;
    }

    /* ✅ Competition bottom left */
    .comp-box{
      position:absolute;
      bottom:16px;
      left:16px;
      display:flex;
      align-items:center;
      gap:10px;
      z-index:6;
    }

    .comp-logo{
      width:38px;
      height:38px;
      object-fit:contain;
      filter:drop-shadow(0 6px 16px rgba(0,0,0,.75));
    }

    /* ✅ Text bottom */
    .match-info{
      position:absolute;
      bottom:16px;
      left:72px;
      right:16px;
      z-index:6;
    }

    .teams{
      font-size:22px;
      font-weight:900;
      line-height:1.05;
      text-shadow:0 10px 30px rgba(0,0,0,.9);
    }

    .meta{
      margin-top:4px;
      font-size:14px;
      font-weight:700;
      opacity:.85;
    }

    /* ✅ Watch btn */
    .watch-btn{
      position:absolute;
      right:16px;
      bottom:16px;
      z-index:7;
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:10px 16px;
      border-radius:999px;
      background:rgba(255,255,255,.12);
      border:1px solid rgba(255,255,255,.16);
      font-weight:900;
      font-size:13px;
      backdrop-filter: blur(14px);
      transition:.15s;
    }
    .watch-btn:hover{
      background:rgba(255,255,255,.18);
      transform:scale(1.02);
    }

    /* responsive */
    @media(max-width:640px){
      .match-card{height:210px;}
      .teams{font-size:18px;}
      .team-logo{width:38px;height:38px;}
      .watch-btn{padding:9px 14px;}
    }
  </style>
</head>

<body>

  <!-- ✅ grille -->
  <section class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-7">

    <!-- ✅ Francfort - Dortmund -->

      <div class="overlay"></div>

      <div class="top-logos">
        <img class="team-logo" src="https://upload.wikimedia.org/wikipedia/fr/thumb/c/cb/Logo_Eintracht_Francfort.svg/langfr-250px-Logo_Eintracht_Francfort.svg.png">
        <span class="vs">VS</span>
        <img class="team-logo" src="https://upload.wikimedia.org/wikipedia/commons/thumb/6/67/Borussia_Dortmund_logo.svg/langfr-250px-Borussia_Dortmund_logo.svg.png">
      </div>

      <div class="comp-box">
        <img class="comp-logo" src="https://upload.wikimedia.org/wikipedia/fr/thumb/0/0a/Bundesliga-logo.svg/1200px-Bundesliga-logo.svg.png">
      </div>

      <div class="match-info">
        <div class="teams">Francfort - Dortmund</div>

      </div>

      <button class="watch-btn" onclick="goMatch('francfort-dortmund')">
        ▶ REGARDER
      </button>
    </article>

  </section>
</main>

<script>
  function goMatch(id){
    window.location.href = id + ".html";
  }
</script>

</body>
