  <style>
    :root{
      --bg:#000;
      --fg:rgba(255,255,255,.92);
      --muted:rgba(255,255,255,.70);
      --card:rgba(255,255,255,.04);
      --border:rgba(255,255,255,.10);
    }
    html,body{height:100%;}
    body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--fg);}

    /* fond soft */
    .soft-bg{
      background:
        radial-gradient(1400px 620px at 50% -10%, rgba(255,255,255,.05), transparent 60%),
        radial-gradient(1000px 520px at 50% 30%, rgba(255,255,255,.035), transparent 62%),
        #000;
    }

    /* ---------- Animations PRO ---------- */
    @media (prefers-reduced-motion: no-preference){
      .reveal{
        opacity:0;
        transform: translateY(14px) scale(.985);
        animation: reveal .55s cubic-bezier(.22,1,.36,1) forwards;
      }
      @keyframes reveal{
        to{ opacity:1; transform: translateY(0) scale(1); }
      }
      .hover-lift{
        transition: transform .25s ease, box-shadow .25s ease, border-color .25s ease;
      }
      .hover-lift:hover{
        transform: translateY(-4px);
        box-shadow: 0 26px 90px rgba(0,0,0,.62);
        border-color: rgba(255,255,255,.16);
      }
      .shine::after{
        content:"";
        position:absolute;
        inset:-40%;
        background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,.08) 45%, transparent 60%);
        transform: translateX(-60%) rotate(10deg);
        pointer-events:none;
        opacity:0;
      }
      .hover-lift:hover.shine::after{
        opacity:1;
        animation: shineMove .9s ease;
      }
      @keyframes shineMove{
        from{ transform: translateX(-65%) rotate(10deg); }
        to{ transform: translateX(65%) rotate(10deg); }
      }
    }

    /* CARD */
    .match-card{
      position:relative;
      overflow:hidden;
      border-radius:18px;
      border:1px solid var(--border);
      background: var(--card);
      box-shadow:0 18px 70px rgba(0,0,0,.55);
      aspect-ratio:16/9;
    }
    .match-bg{
      position:absolute; inset:0;
      background-size:cover;
      background-position:center;
      transform:scale(1.02);
      opacity:.98;
    }
    .match-overlay{
      position:absolute; inset:0;
      background:
        radial-gradient(700px 320px at 28% 55%, rgba(0,0,0,.35), transparent 60%),
        linear-gradient(90deg, rgba(0,0,0,.70) 0%, rgba(0,0,0,.45) 45%, rgba(0,0,0,.10) 100%);
    }

    /* ✅ TIMER uniquement (on enlève le badge 21:00) */
    .timer-pill{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:6px 10px;
      border-radius:999px;
      background: rgba(18,18,18,.62);
      border:1px solid rgba(255,255,255,.10);
      backdrop-filter: blur(8px);
      font-weight:800;
      font-size:12px;
      line-height:1;
      color: rgba(255,255,255,.92);
    }
    .timer-dot{
      width:8px;height:8px;border-radius:999px;background:#f59e0b;
      box-shadow:0 0 0 3px rgba(245,158,11,.12);
    }
    .timer-text{ font-variant-numeric: tabular-nums; }

    /* logos fix */
    .team-logo{width:30px;height:30px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
    .team-logo img{width:100%;height:100%;object-fit:contain;image-rendering:auto;filter: drop-shadow(0 1px 0 rgba(0,0,0,.35));}
    .vs{font-weight:800;font-size:12px;color: rgba(255,255,255,.68);letter-spacing:.02em;}

    .comp-wrap{width:34px;height:34px;display:flex;align-items:flex-end;justify-content:center;flex:0 0 auto;}
    .comp-wrap img{width:100%;height:100%;object-fit:contain;filter: drop-shadow(0 1px 0 rgba(0,0,0,.35));}

    .match-tag{max-width:72%;display:flex;flex-direction:column;gap:8px;}
    .match-title{font-size:15px;font-weight:500;line-height:1.15;color: rgba(255,255,255,.92);}
    .match-sub{font-size:12px;font-weight:600;color: rgba(255,255,255,.70);line-height:1.25;}

    /* bouton regarder */
    .watch-pill{
      border-radius:999px;
      border:1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.10);
      backdrop-filter: blur(10px);
      color:#fff;
      font-weight:800;
      font-size:13px;
      padding:.60rem .90rem;
      display:inline-flex;
      align-items:center;
      gap:.55rem;
      transition: transform .15s ease, background .15s ease;
      white-space: nowrap;
    }
    .watch-pill:hover{ background: rgba(255,255,255,.14); }
    .watch-pill:active{ transform: scale(.98); }
    .play{
      width:32px;height:32px;border-radius:999px;
      border:1px solid rgba(255,255,255,.16);
      display:grid; place-items:center;
      background: rgba(0,0,0,.20);
    }

    /* ✅ FULL WIDTH comme ta 1ère image (pas “zoomé”) */
    .page-pad{ padding-left:28px; padding-right:28px; }
    @media (max-width: 640px){
      .page-pad{ padding-left:16px; padding-right:16px; }
      .match-tag{ max-width:78%; }
      .match-title{ font-size:14px; }
      .team-logo{ width:28px; height:28px; }
      .comp-wrap{ width:32px; height:32px; }
      .watch-pill{ font-size:12px; padding:.55rem .80rem; }
    }

    /* ✅ on garde le hero “compact” pour que la grille remonte (comme ton screen) */
    .hero-wrap{ padding-top:18px; padding-bottom:6px; }
    @media (min-width: 768px){
      .hero-wrap{ padding-top:20px; padding-bottom:6px; }
    }

    /* ✅ thème light */
    .light body{
      --bg:#fff;
      --fg:rgba(0,0,0,.92);
      --muted:rgba(0,0,0,.62);
      --card:rgba(0,0,0,.04);
      --border:rgba(0,0,0,.12);
      background: var(--bg);
      color: var(--fg);
    }
    .light .soft-bg{
      background:
        radial-gradient(1400px 620px at 50% -10%, rgba(0,0,0,.05), transparent 60%),
        radial-gradient(1000px 520px at 50% 30%, rgba(0,0,0,.035), transparent 62%),
        #fff;
    }
  </style>

                  <div class="team-logo"><img alt="B" src="${m.bLogo}"></div>
                </div>

                <div class="flex items-end gap-3">
                  <div class="comp-wrap"><img alt="Comp" src="${m.compLogo}"></div>
                  <div class="min-w-0">
                    <div class="match-title truncate">${m.title}</div>
                    <div class="match-sub">Ligue des Champions</div>
                  </div>
                </div>
              </div>

              <a href="${m.href}" class="watch-pill" target="_blank" rel="noopener">
                <span class="play">
                  <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none">
                    <path d="M10 8l8 4-8 4V8Z" fill="currentColor"/>
                  </svg>
                </span>
                REGARDER
              </a>
            </div>
          </div>
        </article>
      `;
    }

    grid.innerHTML = matches.map(cardHTML).join("");

    // ---------- TIMER REAL ----------
    function formatRemaining(ms){
      if(ms <= 0) return "00h 00m 00s";
      const total = Math.floor(ms / 1000);
      const h = Math.floor(total / 3600);
      const m = Math.floor((total % 3600) / 60);
      const s = total % 60;
      const pad = (n) => String(n).padStart(2,"0");
      return `${pad(h)}h ${pad(m)}m ${pad(s)}s`;
    }

    const timerEls = Array.from(document.querySelectorAll("[data-timer] .timer-text"));
    function tick(){
      const target = getTarget();
      const now = new Date();
      const diff = target.getTime() - now.getTime();
      const txt = formatRemaining(diff);
      timerEls.forEach(el => el.textContent = txt);
    }
    tick();
    setInterval(tick, 1000);

    // ---------- Theme toggle ----------
    const btn = document.getElementById("themeToggle");
    const sun = document.getElementById("iconSun");
    const moon = document.getElementById("iconMoon");

    function setTheme(mode){
      if(mode === "light"){
        document.documentElement.classList.remove("dark");
        document.documentElement.classList.add("light");
        sun.classList.add("hidden");
        moon.classList.remove("hidden");
        localStorage.setItem("theme","light");
      } else {
        document.documentElement.classList.remove("light");
        document.documentElement.classList.add("dark");
        moon.classList.add("hidden");
        sun.classList.remove("hidden");
        localStorage.setItem("theme","dark");
      }
    }
    const saved = localStorage.getItem("theme") || "dark";
    setTheme(saved);
    btn.addEventListener("click", ()=>{
      const isDark = document.documentElement.classList.contains("dark");
      setTheme(isDark ? "light" : "dark");
    });
  </script>
</body>
</html>
