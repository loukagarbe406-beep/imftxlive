    +'<div class="min-w-0 max-w-[72%]">'
    +'<div class="flex items-center gap-2">'
    +'<div class="team-logo"><img src="'+m.aLogo+'" alt="" loading="lazy" referrerpolicy="no-referrer-when-downgrade" onerror="this.style.display=\'none\'"></div>'
    +'<span class="vs">VS</span>'
    +'<div class="team-logo"><img src="'+m.bLogo+'" alt="" loading="lazy" referrerpolicy="no-referrer-when-downgrade" onerror="this.style.display=\'none\'"></div>'
    +'</div>'
    +'<div class="mt-2 flex items-center gap-2">'
    +'<div class="comp-wrap"><img src="'+m.compLogo+'" alt="" loading="lazy" referrerpolicy="no-referrer-when-downgrade" onerror="this.style.display=\'none\'"></div>'
    +'<div class="min-w-0">'
    +'<div class="match-title truncate">'+m.title+'</div>'
    +'<div class="match-sub">'+day+' · '+m.time+'</div>'
    +'</div></div></div>'
    +'<span class="watch-pill"><span class="play"><svg class="w-4 h-4" viewBox="0 0 24 24" fill="none"><path d="M10 8l8 4-8 4V8Z" fill="currentColor"/></svg></span>REGARDER</span>'
    +'</div></div>'
    +'</article></a>';
}

// ── RENDER ──────────────────────────────────────
function render() {
  var el  = document.getElementById('stream-list-principal');
  var tom = document.getElementById('stream-list-bk');
  var tb  = document.getElementById('tomorrow-block');
  if (el) {
    el.innerHTML = MATCHES_TODAY.length
      ? MATCHES_TODAY.map(function(m,i){return card(m,i,"Aujourd'hui");}).join('')
      : '<div style="grid-column:1/-1;text-align:center;padding:48px 20px;color:rgba(255,255,255,.35);font-size:14px;font-weight:600;">Aucun match configuré — ajoutez-en dans le panel admin.</div>';
  }
  if (tom && tb) {
    if (MATCHES_TOMORROW.length) {
      tb.style.display = '';
      tom.innerHTML = MATCHES_TOMORROW.map(function(m,i){return card(m,i+100,'Demain');}).join('');
    } else {
      tb.style.display = 'none';
    }
  }
}

// ── TICK ────────────────────────────────────────
function tick() {
  if (!MATCHES_TODAY.length) return;
  var now = Date.now();
  MATCHES_TODAY.forEach(function(m, idx) {
    if (!m.time) return;
    var ko  = nextKO(m.time).getTime();
    if (isNaN(ko)) return;
    var end = ko + LIVE_MS;
    var tEl = document.querySelector('[data-timer="'+idx+'"]');
    var pEl = document.querySelector('[data-pill="'+idx+'"]');
    var dEl = document.querySelector('[data-dot="'+idx+'"]');
    if (!tEl||!pEl||!dEl) return;
    if (now < ko) {
      tEl.textContent = fmtTime(ko-now);
      pEl.classList.remove('timer-live'); tEl.classList.remove('timer-live'); dEl.classList.remove('timer-dot-live');
    } else if (now <= end) {
      tEl.textContent = 'En Cours';
      pEl.classList.add('timer-live'); tEl.classList.add('timer-live'); dEl.classList.add('timer-dot-live');
    } else {
      tEl.textContent = fmtTime(nextKO(m.time).getTime()-now);
      pEl.classList.remove('timer-live'); tEl.classList.remove('timer-live'); dEl.classList.remove('timer-dot-live');
    }
  });
}

// ── LOAD FROM DB ────────────────────────────────
function loadFromDB() {
  fetch(DB_URL+'/latest', {headers:{'X-Master-Key':DB_API_KEY,'X-Bin-Meta':'false'}})
  .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
  .then(function(data){
    var rec = (data && data.record) ? data.record : data;
    var all = (rec && Array.isArray(rec.matches)) ? rec.matches : [];
    // Normalise time "21h00" → "21:00"
    // Proxy les images CDN qui bloquent les requêtes sans referrer valide
    var PROXY = 'https://wsrv.nl/?url=';
    var BLOCKED = ['empire-sport.art','empire-sport.live','empire-sport.fit','empire-sport.tv','only-us.win'];
    function proxyImg(url) {
      if (!url) return url;
      return BLOCKED.some(function(b){ return url.indexOf(b) >= 0; })
        ? PROXY + encodeURIComponent(url) : url;
    }
    all.forEach(function(m){
      if(m.time) m.time = String(m.time).replace(/h/i,':');
      m.banner   = proxyImg(m.banner);
      m.aLogo    = proxyImg(m.aLogo);
      m.bLogo    = proxyImg(m.bLogo);
      m.compLogo = proxyImg(m.compLogo);
      m.cover    = proxyImg(m.cover);
    });
    MATCHES_TODAY    = all.filter(function(m){ return m.day !== 'tomorrow'; });
    MATCHES_TOMORROW = all.filter(function(m){ return m.day === 'tomorrow'; });
    render(); tick();
  })
  .catch(function(e){
    if (window.location.protocol !== 'file:') console.warn('[IMFTX] DB:', e.message);
    render();
  });
}

// ── REFRESH BTN ─────────────────────────────────
document.getElementById('refreshBtn').addEventListener('click', function(){
  if(typeof NProgress!=='undefined') NProgress.start();
  loadFromDB();
  setTimeout(function(){if(typeof NProgress!=='undefined') NProgress.done();}, 700);
});

// Fix referrerpolicy sur toutes les images
(function(){

    document.querySelectorAll('img:not([referrerpolicy])').forEach(function(img){

    });
  }
  fix();
  new MutationObserver(fix).observe(document.body||document.documentElement, {childList:true, subtree:true});
})();
