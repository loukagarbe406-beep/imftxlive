<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>IMFTX+ — Live</title>

  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

  <style>
    :root{
      --max: 1400px;
      --gap: 20px;

      --heroCardW: 980px;
      --heroCardH: 430px;

      --r: 22px;
      --line: rgba(255,255,255,.12);
      --shadow: 0 25px 80px rgba(0,0,0,.75);
    }

    *{box-sizing:border-box}
    html,body{
      height:100%;
      margin:0;
      background:#000;
      color:#fff;
      font-family:'Outfit',system-ui,-apple-system,"Segoe UI",Roboto,Arial;
    }
    a{color:inherit;text-decoration:none}
    img{display:block}

    /* ==========================================================
       HEADER (comme l’autre site)
       ========================================================== */
    header{
      position:fixed;
      top:0;left:0;right:0;
      z-index:99;
      background:linear-gradient(180deg, rgba(0,0,0,.72), rgba(0,0,0,0));
      pointer-events:none;
    }
    .topbar{
      max-width:var(--max);
      margin:0 auto;
      padding:16px 22px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      pointer-events:auto;
    }
    .brand{
      font-weight:900;
      letter-spacing:.3px;
      font-size:18px;
      opacity:.95;
    }
    .icons{
      display:flex;
      align-items:center;
      gap:10px;
    }
    .icons a{
      width:40px;height:40px;
      display:grid;place-items:center;
      border-radius:12px;
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.10);
      backdrop-filter: blur(12px);
      opacity:.9;
    }
    .icons a:hover{opacity:1;background:rgba(255,255,255,.10)}
    .clockPill{
      margin-left:10px;
      padding:10px 14px;
      border-radius:999px;
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.10);
      font-size:12px;
      font-weight:800;
      opacity:.9;
      backdrop-filter: blur(12px);
      white-space:nowrap;
    }

    /* ==========================================================
       HERO (même ambiance)
       ========================================================== */
    .hero{
      position:relative;
      min-height:680px;
      padding-top:78px;
      overflow:hidden;
    }
    .bg{
      position:absolute; inset:0;
      background-size:cover;
      background-position:center;
      transform:scale(1.12);
      filter: blur(18px) saturate(1.1) brightness(.55);
      opacity:.95;
    }
    .hero::after{
      content:"";
      position:absolute; inset:0;
      background:
        radial-gradient(1200px 700px at 50% 0%, rgba(255,255,255,.10), transparent 58%),
        linear-gradient(180deg, rgba(0,0,0,.15) 0%, rgba(0,0,0,.84) 70%, rgba(0,0,0,.98) 100%),
        linear-gradient(90deg, rgba(0,0,0,.88), rgba(0,0,0,.10), rgba(0,0,0,.88));
      pointer-events:none;
    }

    .wrap{
      position:relative;
      z-index:2;
      max-width:var(--max);
      margin:0 auto;
      padding:0 22px;
    }

    /* Header titre comme screen */
    .heroHeader{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:18px;
      margin-top:8px;
    }
    .heroLeft h1{
      margin:0;
      font-size:34px;
      font-weight:900;
      line-height:1.05;
      text-transform:uppercase;
      text-shadow:0 18px 40px rgba(0,0,0,.75);
    }
    .heroLeft .l1{
      margin-top:8px;
      font-weight:800;
      opacity:.75;
      font-size:14px;
    }
    .heroLeft .l2{
      margin-top:4px;
      opacity:.60;
      font-style:italic;
      font-size:13px;
    }

    /* ==========================================================
       SLIDER (identique au look)
       ========================================================== */
    .sliderArea{margin-top:18px}
    .viewport{overflow:hidden}
    .track{
      display:flex;
      gap:var(--gap);
      transition:transform .55s ease;
      will-change:transform;
    }

    .card{
      flex:0 0 var(--heroCardW);
      height:var(--heroCardH);
      border-radius:var(--r);
      overflow:hidden;
      position:relative;
      border:1px solid rgba(255,255,255,.12);
      box-shadow:var(--shadow);
      background:rgba(255,255,255,.04);
    }
    .poster{position:absolute;inset:0;background-size:cover;background-position:center}
    .card::after{
      content:"";
      position:absolute; inset:0;
      background:
        linear-gradient(180deg, rgba(0,0,0,.06) 0%, rgba(0,0,0,.45) 62%, rgba(0,0,0,.92) 100%),
        linear-gradient(90deg, rgba(0,0,0,.62), rgba(0,0,0,.10), rgba(0,0,0,.62));
      pointer-events:none;
    }

    /* Timer pill top left */
    .timerPill{
      position:absolute;
      top:14px;left:14px;
      z-index:7;
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:6px 12px;
      border-radius:999px;
      background:rgba(0,0,0,.38);
      border:1px solid rgba(255,255,255,.14);
      backdrop-filter: blur(12px);
      font-weight:900;
      font-size:12px;
    }
    .dotOrange{
      width:9px;height:9px;border-radius:50%;
      background:#fb923c;
      display:inline-block;
    }
    .dotGreen{
      width:9px;height:9px;border-radius:50%;
      background:#22c55e;
      display:inline-block;
    }

    /* arrows */
    .cardArrow{
      position:absolute;
      top:50%;
      transform:translateY(-50%);
      width:46px;height:46px;
      border-radius:50%;
      background:rgba(0,0,0,.36);
      border:1px solid rgba(255,255,255,.12);
      display:grid;
      place-items:center;
      z-index:8;
      cursor:pointer;
      opacity:.85;
    }
    .cardArrow:hover{opacity:1}
    .cardArrow.left{left:18px}
    .cardArrow.right{right:18px}
    .cardArrow span{font-size:34px;line-height:1}

    /* bottom card info */
    .bottom{
      position:absolute;
      left:18px;right:18px;
      bottom:16px;
      z-index:7;
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap:14px;
    }

    .miniLogos{display:flex;align-items:center;gap:8px;margin-bottom:10px}
    .teamIcon{
      width:32px;height:32px;
      border-radius:10px;
      background:rgba(255,255,255,.12);
      border:1px solid rgba(255,255,255,.14);
      padding:6px;
    }
    .teamIcon img{width:100%;height:100%;object-fit:contain}
    .vsPill{
      width:30px;height:30px;border-radius:999px;
      display:grid;place-items:center;
      font-weight:900;
      background:rgba(255,255,255,.10);
      border:1px solid rgba(255,255,255,.12);
      font-size:11px;
    }

    .cardTitle{
      font-size:18px;
      font-weight:900;
      text-transform:uppercase;
    }
    .cardSub{
      margin-top:6px;
      font-size:12px;
      opacity:.65;
      font-style:italic;
    }

    .watch{
      height:54px;
      display:flex;
      align-items:center;
      border-radius:999px;
      padding:8px 14px;
      background:rgba(255,255,255,.12);
      border:1px solid rgba(255,255,255,.14);
      backdrop-filter: blur(12px);
      font-weight:900;
      gap:12px;
    }
    .watch:hover{background:rgba(255,255,255,.18)}
    .play{
      width:42px;height:42px;border-radius:50%;
      display:grid;place-items:center;
      background:rgba(0,0,0,.35);
      border:1px solid rgba(255,255,255,.12);
    }
    .watch span{letter-spacing:.2px}

    .dots{
      display:flex;
      justify-content:center;
      gap:8px;
      margin-top:12px;
    }
    .d{
      width:8px;height:8px;border-radius:999px;
      background:rgba(255,255,255,.22);
      border:1px solid rgba(255,255,255,.12);
      cursor:pointer;
      transition:.2s;
    }
    .d.active{width:34px;background:rgba(255,255,255,.85)}

    /* ==========================================================
       SECTION "À VENIR"
       ========================================================== */
    .section{
      max-width:var(--max);
      margin:0 auto;
      padding: 4px 22px 20px;
      margin-top:-10px;
      position:relative;
      z-index:10;
    }
    .sectionHead{
      display:flex;
      justify-content:space-between;
      align-items:baseline;
      margin: 12px 0;
    }
    .sectionHead h2{
      margin:0;
      font-size:16px;
      font-weight:900;
      opacity:.9;
    }
    .sectionHead span{
      font-size:12px;
      opacity:.5;
      font-weight:800;
    }

    .rail{
      display:flex;
      gap:14px;
      overflow-x:auto;
      scrollbar-width:none;
      padding-bottom:6px;
    }
    .rail::-webkit-scrollbar{display:none}

    .mini{
      flex:0 0 auto;
      width:240px;
      border-radius:16px;
      overflow:hidden;
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.10);
    }
    .miniImg{
      height:120px;
      background-size:cover;
      background-position:center;
      position:relative;
    }
    .miniImg::after{
      content:"";
      position:absolute;inset:0;
      background:linear-gradient(180deg, rgba(0,0,0,.05), rgba(0,0,0,.85));
    }
    .miniTop{
      position:absolute;
      top:10px;left:10px;right:10px;
      z-index:2;
      display:flex;
      justify-content:space-between;
      gap:10px;
    }
    .pill{
      display:inline-flex;
      align-items:center;
      gap:7px;
      padding:5px 10px;
      border-radius:999px;
      background:rgba(0,0,0,.38);
      border:1px solid rgba(255,255,255,.12);
      backdrop-filter: blur(10px);
      font-size:12px;
      font-weight:900;
    }
    .miniBody{padding:10px}
    .miniTitle{font-weight:900;font-size:13px;text-transform:uppercase}
    .miniSub{margin-top:4px;font-size:11px;opacity:.65;font-style:italic}

    /* ==========================================================
       EVENTS LIST
       ========================================================== */
    .eventsWrap{
      max-width:var(--max);
      margin:0 auto;
      padding: 0 22px 60px;
    }
    .eventRow{
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:14px 16px;
      border-radius:16px;
      background:rgba(255,255,255,.08);
      border:1px solid rgba(255,255,255,.10);
      margin-bottom:10px;
      box-shadow:0 18px 55px rgba(0,0,0,.55);
    }

    .eventLeft{display:flex;align-items:center;gap:12px}
    .eventTitle{font-weight:900;text-transform:uppercase}
    .eventMeta{opacity:.65;font-size:12px;font-style:italic}

    .eventMid{
      display:flex;align-items:center;gap:14px;
      flex:1;justify-content:center;
    }
    .midTeam{display:flex;align-items:center;gap:10px}
    .midTeam b{text-transform:uppercase;font-size:13px}
    .midLogo{
      width:34px;height:34px;border-radius:999px;
      border:1px solid rgba(255,255,255,.14);
      background:rgba(255,255,255,.10);
      padding:6px;
      object-fit:contain;
    }
    .midVS{
      padding:6px 12px;
      border-radius:999px;
      background:rgba(0,0,0,.30);
      border:1px solid rgba(255,255,255,.12);
      font-weight:900;font-size:12px;
      opacity:.8;
      text-transform:uppercase;
    }
    .eventRight{
      display:flex;align-items:center;gap:10px;
    }
    .timePill{
      display:inline-flex;align-items:center;gap:8px;
      padding:8px 12px;border-radius:999px;
      background:rgba(0,0,0,.38);
      border:1px solid rgba(255,255,255,.12);
      font-weight:900;font-size:12px;
    }
    .sportTag{opacity:.75;font-size:12px;font-weight:900;text-transform:uppercase}

    footer{
      padding:20px 0;
      text-align:center;
      opacity:.55;
      border-top:1px solid rgba(255,255,255,.06);
      font-size:12px;
    }

    /* ==========================================================
       RESPONSIVE
       ========================================================== */
    @media(max-width:980px){
      :root{--heroCardW: calc(100vw - 44px); --heroCardH: 340px; --gap:14px;}
      .cardArrow{display:none}
      .heroHeader{flex-direction:column;text-align:center;align-items:center}
      .eventRow{flex-direction:column;align-items:stretch}
      .eventMid{justify-content:flex-start}
      .eventRight{justify-content:space-between}
    }
  </style>
</head>

<body>

<header>
  <div class="topbar">
    <div class="brand">IMFTX+</div>
    <div style="display:flex;align-items:center;gap:10px;">
      <div class="icons">
        <a href="https://t.me/+jdy9nGJ3rFFiOWI0" target="_blank"><i class="fa-brands fa-telegram"></i></a>
        <a href="https://discord.gg/4ZFv9sa8" target="_blank"><i class="fa-brands fa-discord"></i></a>
        <a href="https://discord.gg/FmWwePH5ET" target="_blank"><i class="fa-solid fa-tv"></i></a>
      </div>
      <div class="clockPill">Heure locale : <span id="clock">--:--</span></div>
    </div>
  </div>
</header>

<section class="hero">
  <div class="bg" id="bg"></div>

  <div class="wrap">
    <div class="heroHeader">
      <div class="heroLeft">
        <h1 id="heroTitle"></h1>
        <div class="l1" id="heroLeague"></div>
        <div class="l2" id="heroTime"></div>
      </div>
    </div>

    <div class="sliderArea">
      <div class="viewport" id="viewport">
        <div class="track" id="track"></div>
      </div>
      <div class="dots" id="dots"></div>
    </div>
  </div>
</section>

<section class="section">
  <div class="sectionHead">
    <h2>À venir</h2>
    <span>Programme</span>
  </div>
  <div class="rail" id="upcoming"></div>
</section>

<section class="eventsWrap">
  <div class="sectionHead">
    <h2>Événements</h2>
    <span>Matchs du jour</span>
  </div>
  <div id="eventsList"></div>
</section>

<footer>IMFTX+ — N°1 de la diffusion FR</footer>

<script>
  /* ==========================================================
     ✅ MATCHES (tu ajoutes ici)
     ========================================================== */
  const MATCHES = [
    {
      id: "liverpool-leeds",
      time: "18:30",
      comp: "Premier League",
      sport: "Football",
      title: "Liverpool - Leeds",
      a: "Liverpool",
      b: "Leeds",
      aLogo: "https://fr.wikipedia.org/wiki/Special:FilePath/Logo%20FC%20Liverpool.svg",
      bLogo: "https://fr.wikipedia.org/wiki/Special:FilePath/Logo%20Leeds%20United%20FC.svg",
      banner: "https://empire-sport.site/upload/banners/burnley-vs-arsenal_01.png"
    },
    {
      id: "sunderland-man-city",
      time: "21:00",
      comp: "Premier League",
      sport: "Football",
      title: "Sunderland - Man City",
      a: "Sunderland",
      b: "Man City",
      aLogo: "https://fr.wikipedia.org/wiki/Special:FilePath/Sunderland_A.F.C._logo.svg",
      bLogo: "https://fr.wikipedia.org/wiki/Special:FilePath/Manchester_City_FC_badge.svg",
      banner: "https://empire-sport.site/upload/events/erilvwbktz7ugfcei9tr90bnnvlauf.jpg"
    }
  ];

  function watchUrl(m){ return `pages/${m.id}.html`; }
  const MATCH_DURATION_MIN = 135;

  function timeToMinutes(hhmm){
    const [h,m] = hhmm.split(":").map(Number);
    return h*60 + (m||0);
  }

  function computeStatus(hhmm){
    const now = new Date();
    const nowMin = now.getHours()*60 + now.getMinutes();
    const start = timeToMinutes(hhmm);
    const end = start + MATCH_DURATION_MIN;
    if(nowMin < start) return "À venir";
    if(nowMin >= start && nowMin < end) return "En cours";
    return "Terminé";
  }

  function countdownTo(hhmm){
    const now = new Date();
    const target = new Date(now);
    const [h,m] = hhmm.split(":").map(Number);
    target.setHours(h, m, 0, 0);
    const diff = target.getTime() - now.getTime();
    if(diff <= 0) return "";
    const totalSec = Math.floor(diff/1000);
    const hh = Math.floor(totalSec/3600);
    const mm = Math.floor((totalSec%3600)/60);
    const ss = totalSec%60;
    return `${hh}h ${String(mm).padStart(2,"0")}m ${String(ss).padStart(2,"0")}s`;
  }

  function formatToday(hhmm){ return `Aujourd’hui · ${hhmm}`; }

  const bg = document.getElementById("bg");
  const heroTitle = document.getElementById("heroTitle");
  const heroLeague = document.getElementById("heroLeague");
  const heroTime = document.getElementById("heroTime");

  const track = document.getElementById("track");
  const dots = document.getElementById("dots");
  const viewport = document.getElementById("viewport");
  const upcoming = document.getElementById("upcoming");
  const eventsList = document.getElementById("eventsList");

  let idx = 0;
  let vm = [];
  let slider = [];

  function buildVM(){
    return MATCHES.map(m => ({
      ...m,
      status: computeStatus(m.time),
      timeLabel: formatToday(m.time),
      timeRaw: m.time
    }));
  }

  function pickForSlider(all){
    const now = new Date();
    const nowMin = now.getHours()*60 + now.getMinutes();
    const sorted = all.slice().sort((a,b)=> timeToMinutes(a.timeRaw) - timeToMinutes(b.timeRaw));
    const notFinished = sorted.filter(m => m.status !== "Terminé");
    const base = notFinished.length ? notFinished : sorted;
    const next = base.filter(m => m.status === "En cours" || timeToMinutes(m.timeRaw) >= nowMin);
    return (next.length ? next : base).slice(0,3);
  }

  function setHero(m){
    bg.style.backgroundImage = `url('${m.banner}')`;
    heroTitle.textContent = m.title.toUpperCase();
    heroLeague.textContent = m.comp;
    heroTime.textContent = m.timeLabel;
  }

  function badgeHTML(m){
    if(m.status === "En cours"){
      return `<div class="timerPill"><span class="dotGreen"></span>EN COURS</div>`;
    }
    if(m.status === "Terminé"){
      return `<div class="timerPill" style="opacity:.75"><span class="dotOrange"></span>TERMINÉ</div>`;
    }
    const cd = countdownTo(m.timeRaw);
    return `<div class="timerPill"><span class="dotOrange"></span>${cd || "À VENIR"}</div>`;
  }

  function logosBlock(m){
    return `
      <div class="miniLogos">
        <span class="teamIcon"><img src="${m.aLogo}" alt=""></span>
        <div class="vsPill">VS</div>
        <span class="teamIcon"><img src="${m.bLogo}" alt=""></span>
      </div>
    `;
  }

  function cardHTML(m){
    return `
      <div class="card">
        <div class="poster" style="background-image:url('${m.banner}')"></div>
        ${badgeHTML(m)}

        <div class="cardArrow left" onclick="prevSlide()"><span>‹</span></div>
        <div class="cardArrow right" onclick="nextSlide()"><span>›</span></div>

        <div class="bottom">
          <div class="leftInfo">
            ${logosBlock(m)}
            <div class="cardTitle">${m.title.toUpperCase()}</div>
            <div class="cardSub">${m.comp} · ${m.timeLabel}</div>
          </div>

          <a class="watch" href="${watchUrl(m)}">
            <div class="play">▶</div>
            <span>REGARDER</span>
          </a>
        </div>
      </div>
    `;
  }

  function dotHTML(i){
    return `<div class="d ${i===0?'active':''}" id="d${i}" onclick="goTo(${i})"></div>`;
  }

  function miniHTML(m){
    const dot = m.status === "En cours" ? "dotGreen" : "dotOrange";
    const label = m.status === "À venir" ? (countdownTo(m.timeRaw) || "À venir") : m.status;
    return `
      <a class="mini" href="${watchUrl(m)}">
        <div class="miniImg" style="background-image:url('${m.banner}')">
          <div class="miniTop">
            <span class="pill"><span class="${dot}"></span>${label}</span>
            <span class="pill">${m.sport}</span>
          </div>
        </div>
        <div class="miniBody">
          <div class="miniTitle">${m.title.toUpperCase()}</div>
          <div class="miniSub">${m.comp} · ${m.timeLabel}</div>
        </div>
      </a>
    `;
  }

  function rowHTML(m){
    const dot = m.status === "En cours" ? "dotGreen" : "dotOrange";
    const label = m.status === "À venir" ? (countdownTo(m.timeRaw) || "À venir") : m.status;
    return `
      <a class="eventRow" href="${watchUrl(m)}">
        <div class="eventLeft">
          <img class="midLogo" src="${m.aLogo}" alt="">
          <div>
            <div class="eventTitle">${m.title.toUpperCase()}</div>
            <div class="eventMeta">${m.comp} · ${m.timeLabel}</div>
          </div>
        </div>

        <div class="eventMid">
          <div class="midTeam">
            <b>${m.a}</b>
          </div>
          <div class="midVS">VS</div>
          <div class="midTeam">
            <b>${m.b}</b>
          </div>
        </div>

        <div class="eventRight">
          <span class="timePill"><span class="${dot}"></span>${label}</span>
          <span class="sportTag">${m.sport}</span>
        </div>
      </a>
    `;
  }

  function updateDots(){
    for(let i=0;i<slider.length;i++){
      const el = document.getElementById("d"+i);
      if(el) el.classList.toggle("active", i===idx);
    }
  }

  function update(){
    const first = document.querySelector(".card");
    if(!first || !slider.length) return;

    const cardW = first.getBoundingClientRect().width;
    const gap = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--gap')) || 18;
    const vw = viewport.getBoundingClientRect().width;

    const centerOffset = Math.max(18, (vw - cardW) / 2);
    const peekBias = Math.min(110, vw * 0.09);
    const x = -(idx * (cardW + gap)) + centerOffset - peekBias;

    track.style.transform = `translateX(${x}px)`;
    setHero(slider[idx]);
    updateDots();
  }

  function nextSlide(){ idx = Math.min(idx + 1, slider.length - 1); update(); }
  function prevSlide(){ idx = Math.max(idx - 1, 0); update(); }
  function goTo(i){ idx = Math.max(0, Math.min(i, slider.length - 1)); update(); }
  window.nextSlide = nextSlide;
  window.prevSlide = prevSlide;
  window.goTo = goTo;

  function rebuild(){
    vm = buildVM();
    slider = pickForSlider(vm);

    track.innerHTML = slider.map(cardHTML).join("");
    dots.innerHTML = slider.map((_,i)=>dotHTML(i)).join("");

    upcoming.innerHTML = vm.filter(x => x.status === "À venir").map(miniHTML).join("");
    eventsList.innerHTML = vm.map(rowHTML).join("");

    idx = Math.min(idx, slider.length - 1);
    update();
  }

  function updateClock(){
    const d = new Date();
    document.getElementById("clock").textContent =
      String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
  }

  rebuild();
  updateClock();
  window.addEventListener("resize", update);

  setInterval(() => {
    rebuild();
    updateClock();
  }, 1000);
</script>

</body>
</html>
