      aLogo: "https://empire-sport.fit/upload/teams/e9ibu14ynhyggw7cjydjpwfial6xha.png",
      bLogo: "https://empire-sport.fit/upload/teams/cupad3ibvyxa48a0zh9hqdt06svt0t.png",
      compLogo: "https://empire-sport.fit/upload/leagues/xposittvw2zwq2l7fzg70wslefd5au.png",
      href: "napoli-como.html"
    },
    {
      title: "West Ham - Manchester United",
      time: "21:15",
      banner: "https://empire-sport.fit/upload/teambanks/o6hv8yxkvwbm7knkj0mwxedp3fcttu.png",
      aLogo: "https://empire-sport.fit/upload/teams/tnjduh0wsc3gwkrqgbyxtsglkwiwj9.png",
      bLogo: "https://empire-sport.fit/upload/teams/mosfyquovho2tfyvalgqtbzjnhmcv5.png",
      compLogo: "https://empire-sport.fit/upload/leagues/mydp5gdzdvbxcvkc9laqmu0zyvlimg.png",
      href: "westam-manu.html"
    }
  ];

  const LIVE_WINDOW_MS = Math.floor(2.5 * 60 * 60 * 1000);

  function parseHHMM(hhmm){
    const [h,m] = hhmm.split(':').map(Number);
    return {h, m};
  }

  function getNextKickoff(timeHHMM){
    const now = new Date();
    const {h,m} = parseHHMM(timeHHMM);
    const t = new Date(now);
    t.setHours(h, m, 0, 0);

    if (now.getTime() > (t.getTime() + LIVE_WINDOW_MS)) {
      t.setDate(t.getDate() + 1);
      t.setHours(h, m, 0, 0);
    }
    return t;
  }

  function formatRemaining(ms){
    if(ms <= 0) return "00h 00m 00s";
    const total = Math.floor(ms / 1000);
    const hh = Math.floor(total / 3600);
    const mm = Math.floor((total % 3600) / 60);
    const ss = total % 60;
    const pad = (n) => String(n).padStart(2,"0");
    return `${pad(hh)}h ${pad(mm)}m ${pad(ss)}s`;
  }

  function cardHTML(m, idx){
    const teamsRow = m.noTeams ? `
      <div class="flex items-center gap-2">
        <span class="vs">MULTIPLEX</span>
      </div>
    ` : `
      <div class="flex items-center gap-2">
        <div class="team-logo"><img src="${m.aLogo}" alt=""></div>
        <span class="vs">VS</span>
        <div class="team-logo"><img src="${m.bLogo}" alt=""></div>
      </div>
    `;

    return `
      <a href="${m.href}" class="block">
        <article class="match-card">
          <div class="match-bg" style="background-image:url('${m.banner}')"></div>
          <div class="match-overlay"></div>

          <div class="absolute left-3 top-3">
            <span class="timer-pill" data-pill="${idx}">
              <span class="timer-dot" data-dot="${idx}"></span>
              <span class="timer-text" data-timer="${idx}">--</span>
            </span>
          </div>

          <div class="absolute inset-x-0 bottom-0 p-4">
            <div class="flex items-end justify-between gap-4">
              <div class="min-w-0 max-w-[72%]">
                ${teamsRow}

                <div class="mt-2 flex items-center gap-2">
                  <div class="comp-wrap"><img src="${m.compLogo}" alt=""></div>
                  <div class="min-w-0">
                    <div class="match-title truncate">${m.title}</div>
                    <div class="match-sub">Aujourd’hui · ${m.time}</div>
                  </div>
                </div>
              </div>

              <span class="watch-pill">
                <span class="play">
                  <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none">
                    <path d="M10 8l8 4-8 4V8Z" fill="currentColor"/>
                  </svg>
                </span>
                REGARDER
              </span>
            </div>
          </div>
        </article>
      </a>
    `;
  }

  function render(){
    const el = document.getElementById('stream-list-principal');
    if(!el) return;
    el.innerHTML = MATCHES.map((m,i) => cardHTML(m,i)).join('');
  }

  function tick(){
    const now = Date.now();

    MATCHES.forEach((m, idx) => {
      const kickoff = getNextKickoff(m.time).getTime();
      const endLive = kickoff + LIVE_WINDOW_MS;

      const timerEl = document.querySelector(`[data-timer="${idx}"]`);
      const pillEl  = document.querySelector(`[data-pill="${idx}"]`);
      const dotEl   = document.querySelector(`[data-dot="${idx}"]`);

      if(!timerEl || !pillEl || !dotEl) return;

      if (now < kickoff) {
        const diff = kickoff - now;
        timerEl.textContent = formatRemaining(diff);
        pillEl.classList.remove('timer-live');
        timerEl.classList.remove('timer-live');
        dotEl.classList.remove('timer-dot-live');
      } else if (now >= kickoff && now <= endLive) {
        timerEl.textContent = "En Cours";
        pillEl.classList.add('timer-live');
        timerEl.classList.add('timer-live');
        dotEl.classList.add('timer-dot-live');
      } else {
        const next = getNextKickoff(m.time).getTime();
        const diff = next - now;
        timerEl.textContent = formatRemaining(diff);
        pillEl.classList.remove('timer-live');
        timerEl.classList.remove('timer-live');
        dotEl.classList.remove('timer-dot-live');
      }
    });
  }

  document.getElementById('refreshBtn')?.addEventListener('click', () => {
    NProgress.start();
    render();
    tick();
    setTimeout(() => NProgress.done(), 350);
  });

  render();
  tick();
  setInterval(tick, 1000);
</script>

</body>
</html>
