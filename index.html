    .gate-card {
      width: min(980px, 100%); border-radius: 18px;
      border: 1px solid rgba(255,0,0,.55);

    }
    .gate-btn:hover { filter: brightness(1.07); }
    .gate-skip { margin-top: 4px; font-size: 12px; color: rgba(255,255,255,.50); text-decoration: underline; cursor: pointer; user-select: none; }

    .nav-icon {

      color: rgba(255,255,255,.78);
      transition: background .18s, color .18s, transform .12s;

    .nav-icon:active { transform: scale(.95); }

    .desktop-only { display: none; }

    /* ── SHELL ── */

.matches-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); 
  gap: 20px;
}
    .match-empty {
      grid-column: 1/-1; display: flex; align-items: center; justify-content: center;
      padding: 48px 20px; border-radius: 14px;
      border: 1px dashed rgba(255,255,255,.10);
      color: rgba(255,255,255,.40); font-size: 14px;

.match-card {
  position: relative;
  overflow: hidden;
  border-radius: 20px;
  border: 1px solid rgba(255,255,255,.09);
  background: rgba(255,255,255,.03);
  flex: 0 0 600px;
  height: 250px;
  aspect-ratio: auto;

  transition: transform .2s, box-shadow .2s;
}
.match-card:hover { transform: translateY(-6px); box-shadow: 0 28px 80px rgba(0,0,0,.70); }
.match-card:active { transform: scale(.985); }

.match-bg { position: absolute; inset: 0; background-size: cover; background-position: center; transform: scale(1.02); }
.match-overlay {
  position: absolute; inset: 0;
  background:
    radial-gradient(900px 400px at 28% 55%, rgba(0,0,0,.35), transparent 60%),

}

    .play-ico { width: 20px; height: 20px; border-radius: 50%; border: 1px solid rgba(255,255,255,.18); background: rgba(0,0,0,.25); display: grid; place-items: center; flex-shrink: 0; }

<script>
/* ══════════════════════════════════════════
   1 · GATE
══════════════════════════════════════════ */
(function(){
  var KEY   = "imftx_gate_done_v1";
  var gate  = document.getElementById("gate");
  var skip  = document.getElementById("gateSkip");

  function show(){ if(!gate) return; gate.style.display = "grid"; document.body.style.overflow = "hidden"; }
  function hide(){ if(!gate) return; gate.style.display = "none"; document.body.style.overflow = ""; localStorage.setItem(KEY,"1"); }

  if (!localStorage.getItem(KEY)) show();
  if (skip) skip.addEventListener("click", hide);
})();

/* ══════════════════════════════════════════
   2 · SPORTS PILLS
══════════════════════════════════════════ */
document.querySelectorAll('.sport-pill').forEach(function(btn){
  btn.addEventListener('click', function(){
    document.querySelectorAll('.sport-pill').forEach(function(b){ b.classList.remove('is-active'); });

function makeLogo(bg, lines, textColor){
  textColor = textColor || 'white';
  var h = 80, step = h / (lines.length + 1);
  var texts = lines.map(function(l, i){
    return "<text x='50%' y='" + Math.round(step*(i+1)) + "' dominant-baseline='middle' text-anchor='middle' font-family='Arial Black,Arial' font-weight='900' font-size='" + l[1] + "' fill='" + (l[2]||textColor) + "'>" + l[0] + "</text>";
  }).join('');
  return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(
    "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 80'>" +
    "<rect width='200' height='80' rx='10' fill='" + bg + "'/>" +
    texts + "</svg>"
  );
}

var LIVE_MS = 2.5 * 60 * 60 * 1000;

function parseTime(hhmm){ var p = hhmm.split(':'); return {h:+p[0], m:+p[1]}; }

function nextKickoff(hhmm){
  var now = new Date(), p = parseTime(hhmm), t = new Date(now);
  t.setHours(p.h, p.m, 0, 0);
  if (now.getTime() > t.getTime() + LIVE_MS){ t.setDate(t.getDate()+1); t.setHours(p.h,p.m,0,0); }
  return t;
}

function fmt(ms){
  if (ms <= 0) return "00h 00m 00s";
  var s = Math.floor(ms/1000), h = Math.floor(s/3600), m = Math.floor((s%3600)/60), sc = s%60;
  function z(n){ return String(n).padStart(2,"0"); }
  return z(h)+"h "+z(m)+"m "+z(sc)+"s";
}

function tick(){
  var now = Date.now();
  MATCHES_TODAY.forEach(function(m,idx){
    var ko  = nextKickoff(m.time).getTime();
    var end = ko + LIVE_MS;
    var tEl = document.querySelector('[data-timer="'+idx+'"]');
    var pEl = document.querySelector('[data-pill="'+idx+'"]');
    var dEl = document.querySelector('[data-dot="'+idx+'"]');
    if (!tEl||!pEl||!dEl) return;
    if (now < ko){
      tEl.textContent = fmt(ko-now);
      pEl.classList.remove('timer-live'); dEl.classList.remove('timer-dot-live');
    } else if (now<=end){
      tEl.textContent = "En Cours";
      pEl.classList.add('timer-live'); dEl.classList.add('timer-dot-live');
    } else {
      tEl.textContent = fmt(nextKickoff(m.time).getTime()-now);
      pEl.classList.remove('timer-live'); dEl.classList.remove('timer-dot-live');
    }
  });
}

(function(){
  var row   = document.getElementById('tvLiveRow');
  var left  = document.getElementById('tvCarLeft');
  var right = document.getElementById('tvCarRight');
  if (!row || !left || !right) return;

  function scrollStep(){ 
    var card = row.querySelector('.tv-card');
    return card ? Math.max(140, card.getBoundingClientRect().width * 3 + 24) : 360;
  }

  left.addEventListener('click',  function(){ row.scrollBy({ left: -scrollStep(), behavior: 'smooth' }); });
  right.addEventListener('click', function(){ row.scrollBy({ left:  scrollStep(), behavior: 'smooth' }); });

  function updateBtns(){
    var max = row.scrollWidth - row.clientWidth - 2;
    left.style.opacity  = row.scrollLeft <= 2    ? '0.3' : '1';
    right.style.opacity = row.scrollLeft >= max  ? '0.3' : '1';
  }
  row.addEventListener('scroll', function(){ requestAnimationFrame(updateBtns); });
  window.addEventListener('resize', updateBtns);
  setTimeout(updateBtns, 300); 
})();

(function(){
  var s = document.createElement('script');
  s.type = 'module';
  s.src  = './js/viewerCounter.js';

  s.onerror = function(){
    var counts = {};
    function rnd(a,b){ return Math.floor(Math.random()*(b-a+1))+a; }
    function refresh(){
      document.querySelectorAll('[data-viewer-counter]').forEach(function(el){
        var id = el.getAttribute('data-viewer-counter');
        if (!counts[id]) counts[id] = rnd(15,320);
        else counts[id] = Math.max(1, counts[id] + rnd(-4,5));
        el.textContent = counts[id];
      });
    }
    refresh();
    setInterval(refresh, 4500);
  };

  document.head.appendChild(s);
})();
</script>
