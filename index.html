<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>IMFTX+ — Live</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

  <style>
    html,body{
      height:100%;margin:0;
      font-family:'Outfit',system-ui,-apple-system,"Segoe UI",Roboto,Arial;
      background:#0b0b0c;
      color:#fff;
    }

    .match-card{
      border-radius:18px;
      overflow:hidden;
      border:1px solid rgba(255,255,255,.08);
      box-shadow:0 20px 80px rgba(0,0,0,.7);
      background:rgba(255,255,255,.04);
    }

    .match-thumb{
      height:150px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:900;
      font-size:22px;
      text-transform:uppercase;
      text-shadow:0 2px 10px rgba(0,0,0,.75);
      padding:0 15px;
      text-align:center;
    }

    .match-footer{
      height:64px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:0 16px;
      background:linear-gradient(90deg, rgba(0,0,0,.85), rgba(0,0,0,.35));
    }

    .meta{
      display:flex;
      align-items:center;
      gap:10px;
      font-weight:700;
      font-size:13px;
      opacity:.9;
    }

    .btn-watch{
      background:#ffca28;
      color:#000;
      font-weight:900;
      padding:8px 16px;
      border-radius:10px;
      font-size:13px;
      transition:.15s;
    }
    .btn-watch:hover{opacity:.9; transform:scale(1.03)}
  </style>
</head>

<body>

<!-- NAVBAR -->
<nav class="sticky top-0 z-40 bg-black/30 backdrop-blur-xl border-b border-white/5">
  <div class="max-w-screen-2xl mx-auto px-6 py-3 flex items-center justify-between">
    <div class="text-3xl font-extrabold tracking-tight">IMFTX+</div>

    <!-- RÉSEAUX -->
    <div class="flex items-center gap-4 text-lg font-bold">
      <a href="https://t.me/+jdy9nGJ3rFFiOWI0" target="_blank" class="opacity-70 hover:opacity-100">
        <i class="fa-brands fa-telegram"></i>
      </a>
      <a href="https://discord.gg/4ZFv9sa8" target="_blank" class="opacity-70 hover:opacity-100">
        <i class="fa-brands fa-discord"></i>
      </a>
      <a href="https://discord.gg/FmWwePH5ET" target="_blank"
         class="opacity-80 hover:opacity-100 text-sm px-3 py-1 rounded-full bg-white/10 border border-white/10">
        IPTV
      </a>
    </div>
  </div>
</nav>


<main class="max-w-screen-2xl mx-auto px-6 py-12">

  <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

    <!-- ✅ Algérie - RD Congo -->
    <div class="match-card">
      <div class="match-thumb" style="background:linear-gradient(90deg,#00c853,#1b5e20,#d32f2f)">
        (17h00) Algérie - Rép. Dém. Congo
      </div>

      <div class="match-footer">
        <div class="meta">
          <i class="fa-solid fa-bolt"></i>
          <span>Aujourd’hui · 17:00</span>
        </div>

        <button onclick="openCustomStream('algerie-rdc')" class="btn-watch">
          Regarder
        </button>
      </div>
    </div>

  </div>

  <footer class="w-full mt-20 text-center text-sm opacity-60 pb-6 font-semibold">
    IMFTX+ — Plateforme de streaming
  </footer>

</main>

<script>
  function openCustomStream(matchId) {
    window.location.href = matchId + ".html";
  }
</script>

</body>
</html>
