<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' };</script>
  <script>document.documentElement.classList.add('dark');</script>

  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    html, body { height:100%; }
    body { font-family:'Outfit', sans-serif; background:#000; }

    /* fond doux */
    .soft-bg{
      background:
        radial-gradient(1400px 620px at 50% -10%, rgba(255,255,255,.06), transparent 60%),
        radial-gradient(1000px 520px at 50% 30%, rgba(255,255,255,.04), transparent 62%);
    }

    /* Match card */
    .match-card{
      position: relative;
      overflow: hidden;
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.06);
      box-shadow: 0 18px 70px rgba(0,0,0,.55);
    }
    .match-bg{
      position:absolute; inset:0;
      background-size: cover;
      background-position: center;
      transform: scale(1.03);
      filter: saturate(1.04);
      opacity: .98;
    }
    .match-overlay{
      position:absolute; inset:0;
      background:
        radial-gradient(700px 320px at 28% 55%, rgba(0,0,0,.35), transparent 60%),
        linear-gradient(90deg, rgba(0,0,0,.70) 0%, rgba(0,0,0,.42) 42%, rgba(0,0,0,.16) 100%);
    }

    .pill{
      display:inline-flex; align-items:center; gap:.5rem;
      padding:.32rem .65rem;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.14);
      background: rgba(0,0,0,.30);
      backdrop-filter: blur(10px);
      font-weight: 800;
      font-size: .83rem;
      line-height: 1;
      color: rgba(255,255,255,.92);
    }
    .pill-dot{
      width:.55rem;height:.55rem;border-radius:999px;
      background:#f59e0b;
      box-shadow: 0 0 0 4px rgba(245,158,11,.18);
    }

    .team-logo{
      width:38px;height:38px;
      border-radius: 12px;
      background: rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.10);
      display:grid; place-items:center;
      overflow:hidden;
    }
    .team-logo img{ width: 86%; height: 86%; object-fit: contain; }

    .watch-pill{
      border-radius:999px;
      border:1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.10);
      backdrop-filter: blur(10px);
      color:#fff;
      font-weight: 900;
      padding:.75rem 1.1rem;
      display:inline-flex;
      align-items:center;
      gap:.65rem;
      transition: transform .15s ease, background .15s ease;
      white-space: nowrap;
    }
    .watch-pill:hover{ background: rgba(255,255,255,.14); }
    .watch-pill:active{ transform: scale(.98); }

    .play{
      width:34px;height:34px;border-radius:999px;
      border:1px solid rgba(255,255,255,.14);
      display:grid; place-items:center;
      background: rgba(0,0,0,.22);
    }

    .live-badge{
      display:inline-flex; align-items:center; gap:.55rem;
      padding:.55rem .95rem;
      border-radius:999px;
      background: rgba(34,197,94,.12);
      border:1px solid rgba(34,197,94,.30);
      color: rgba(167,243,208,.95);
      font-weight: 900;
      font-size: .9rem;
    }
    .live-dot{
      width:.55rem;height:.55rem;border-radius:999px;
      background:#22c55e;
      box-shadow: 0 0 0 4px rgba(34,197,94,.18);
    }
  </style>
</head>

<body class="min-h-screen text-white flex flex-col">

<!-- NAVBAR (collée en haut/gauche) -->
<nav class="sticky top-0 z-20 bg-black/70 backdrop-blur border-b border-white/10">
  <div class="w-full h-16 px-6 flex items-center justify-between">

    <!-- ✅ bien en haut à gauche -->
    <div class="font-extrabold tracking-tight text-3xl select-none">IMFTX+</div>

    <div class="flex items-center gap-2">
      <a href="#"
         class="hidden sm:inline-flex items-center gap-2 px-4 py-2 rounded-full bg-white text-black font-extrabold text-sm hover:bg-white/90 active:scale-95 transition">
        <span>⚡</span> ACHÈTE TON IPTV
      </a>

      <!-- X -->
      <a href="#" target="_blank"
         class="w-11 h-11 flex items-center justify-center rounded-lg ring-1 ring-white/10 hover:bg-white/5 active:scale-95 transition"
         aria-label="X">
        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none">
          <path d="M18.2 3H21l-6.4 7.3L22 21h-6.2l-4.8-6.3L5.4 21H2.6l6.9-7.8L2 3h6.3l4.3 5.7L18.2 3Z"
                fill="currentColor"/>
        </svg>
      </a>

      <!-- Telegram -->
      <a href="#" target="_blank"
         class="w-11 h-11 flex items-center justify-center rounded-lg ring-1 ring-white/10 hover:bg-white/5 active:scale-95 transition"
         aria-label="Telegram">
        <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none">
          <path d="M21.8 3.2L2.9 10.6c-1 .4-1 1.8 0 2.2l4.7 1.6 1.8 5.4c.3 1 1.6 1.2 2.2.4l2.8-3.5 5.2 3.8c.9.7 2.2.2 2.4-.9L23 4.5c.2-1-.5-1.6-1.2-1.3Z"
                stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
          <path d="M7.6 14.2l12.3-8.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </a>

      <!-- Discord -->
      <a href="#" target="_blank"
         class="w-11 h-11 flex items-center justify-center rounded-lg ring-1 ring-white/10 hover:bg-white/5 active:scale-95 transition"
         aria-label="Discord">
        <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none">
          <path d="M8 18c-1.6 0-3-1.3-3-3.1 0-5.5 3.3-9.9 7-9.9s7 4.4 7 9.9C19 16.7 17.6 18 16 18l-1.5-1.6H9.5L8 18Z"
                stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
          <path d="M9.3 12.7h.01M14.7 12.7h.01" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
        </svg>
      </a>
    </div>
  </div>
</nav>

<!-- HERO -->
<header class="soft-bg">
  <div class="w-full px-6 pt-14 pb-8 text-center">
    <h1 class="text-6xl md:text-7xl font-extrabold tracking-tight select-none">IMFTX+</h1>
    <p class="mt-4 uppercase tracking-widest text-white/70 font-semibold">
      N°1 DES MEILLEURS DIFFUSEURS FR
    </p>
  </div>
</header>

<!-- CONTENT -->
<main class="soft-bg flex-1">
  <!-- ✅ Full width container -->
  <div class="w-full px-6 pb-16">

    <!-- BOX full width -->
    <section class="w-full mt-4 border border-white/10 rounded-2xl p-6 bg-white/5 backdrop-blur-sm shadow-[0_20px_80px_rgba(0,0,0,.55)]">
      <div class="flex items-center justify-between mb-6">
        <span class="live-badge"><span class="live-dot"></span> En direct</span>
        <button class="w-10 h-10 rounded-xl bg-amber-500/90 hover:bg-amber-500 text-black flex items-center justify-center transition active:scale-95 shadow-md"
                aria-label="Rafraîchir">⟳</button>
      </div>

      <!-- ✅ 2 cards per row on desktop -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">

        <!-- CARD 1 -->
        <article class="match-card aspect-[16/9]">
          <div class="match-bg" style="background-image:url('https://empire-sport.world/upload/banners/paris-fc-vs-auxerre.png');"></div>
          <div class="match-overlay"></div>

          <!-- timer -->
          <div class="absolute left-4 top-4">
            <span class="pill"><span class="pill-dot"></span> 3h 13m 58s</span>
          </div>

          <!-- bottom content -->
          <div class="absolute inset-x-0 bottom-0 p-4 md:p-5">
            <div class="flex items-end justify-between gap-4">
              <div class="min-w-0">
                <div class="flex items-center gap-3">
                  <div class="team-logo">
                    <img alt="Paris FC" src="https://empire-sport.world/upload/teams/qcyokwrlo5qyk6e66qgmv3ffqhpbzr.png">
                  </div>
                  <span class="text-white/70 font-extrabold text-sm">VS</span>
                  <div class="team-logo">
                    <img alt="Angers" src="https://empire-sport.world/upload/teams/bhdsn0frfe5qlieltcjjhwb8h3rzab.png">
                  </div>
                </div>

                <div class="mt-3 flex items-end gap-3">
                  <div class="flex flex-col items-center gap-1">
                    <img
                      alt="Ligue 1"
                      src="https://upload.wikimedia.org/wikipedia/fr/thumb/archive/d/d9/20240912231715%21Logo_Ligue_1_2024.svg/120px-Logo_Ligue_1_2024.svg.png"
                      class="w-9 h-9 object-contain"
                    />
                    <div class="text-[11px] font-black tracking-widest text-white/70">LIGUE 1</div>
                  </div>

                  <div class="min-w-0">
                    <div class="text-lg md:text-xl font-extrabold truncate">Paris FC - Angers</div>
                    <div class="text-sm text-white/70 font-semibold">Ligue 1</div>
                    <div class="text-sm text-white/70 font-semibold">Aujourd’hui 17:15</div>
                  </div>
                </div>
              </div>

              <!-- watch pill like reference -->
              <a href="#" class="watch-pill">
                <span class="play">
                  <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none">
                    <path d="M10 8l8 4-8 4V8Z" fill="currentColor"/>
                  </svg>
                </span>
                REGARDER
              </a>
            </div>
          </div>
        </article>

        <!-- CARD 2 placeholder -->
        <article class="match-card aspect-[16/9] flex items-center justify-center text-white/35 font-extrabold">
          MATCH À AJOUTER
        </article>

      </div>
    </section>

  </div>
</main>

<footer class="border-t border-white/10 bg-black/70">
  <div class="w-full px-6 py-6 text-center text-xs text-white/40">
    Made with ❤️
  </div>
</footer>

</body>
</html>
