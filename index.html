    .match-card{

<script>
  // -------- Sidebar toggle --------
  const burgerBtn = document.getElementById('burgerBtn');
  const sidebar = document.getElementById('sidebar');
  function openSidebar(){ sidebar.classList.remove('-translate-x-full'); }
  function closeSidebar(){ sidebar.classList.add('-translate-x-full'); }
  burgerBtn?.addEventListener('click', () => {
    const isClosed = sidebar.classList.contains('-translate-x-full');
    isClosed ? openSidebar() : closeSidebar();
  });
  sidebar?.addEventListener('click', (e) => {
    if(e.target === sidebar) closeSidebar();
  });

  // -------- Theme toggle --------
  const toggle = document.getElementById('theme-toggle');
  function setTheme(mode){
    if(mode === 'dark'){
      document.documentElement.classList.add('dark');
      localStorage.setItem('theme','dark');
    } else {
      document.documentElement.classList.remove('dark');
      localStorage.setItem('theme','light');
    }
  }
  toggle?.addEventListener('click', () => {
    const isDark = document.documentElement.classList.contains('dark');
    setTheme(isDark ? 'light' : 'dark');
  });

  // -------- Timer vers 21:00 (aujourd’hui; si passé -> demain) --------
  function getTarget21(){
    const now = new Date();
    const t = new Date(now);
    t.setHours(21,0,0,0);
    if(now.getTime() > t.getTime()){
      t.setDate(t.getDate() + 1);
      t.setHours(21,0,0,0);
    }
    return t;
  }
  function formatRemaining(ms){
    if(ms <= 0) return "00h 00m 00s";
    const total = Math.floor(ms / 1000);
    const h = Math.floor(total / 3600);
    const m = Math.floor((total % 3600) / 60);
    const s = total % 60;
    const pad = (n) => String(n).padStart(2,"0");
    return `${pad(h)}h ${pad(m)}m ${pad(s)}s`;
  }

  function cardHTML(m){
    return `
      <a href="${m.href}" class="block">
        <article class="match-card">
          <div class="match-bg" style="background-image:url('${m.banner}')"></div>
          <div class="match-overlay"></div>

          <div class="absolute left-3 top-3">
            <span class="timer-pill">
              <span class="timer-dot"></span>
              <span class="timer-text" data-timer>--</span>
            </span>
          </div>

          <div class="absolute inset-x-0 bottom-0 p-4">
            <div class="flex items-end justify-between gap-4">
              <div class="min-w-0 max-w-[72%]">
                <div class="flex items-center gap-2">
                  <div class="team-logo"><img src="${m.aLogo}" alt=""></div>
                  <span class="vs">VS</span>
                  <div class="team-logo"><img src="${m.bLogo}" alt=""></div>
                </div>

                <div class="mt-2 flex items-center gap-2">
                  <div class="comp-wrap"><img src="${m.compLogo}" alt=""></div>
                  <div class="min-w-0">
                    <div class="match-title truncate">${m.title}</div>
                    <div class="match-sub">Aujourd’hui · 21:00</div>
                  </div>
                </div>
              </div>

              <span class="watch-pill">
                <span class="play">
                  <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none">
                    <path d="M10 8l8 4-8 4V8Z" fill="currentColor"/>
                  </svg>
                </span>
                REGARDER
              </span>
            </div>
          </div>
        </article>
      </a>
    `;
  }

  function render(){
    const el = document.getElementById('stream-list-principal');
    if(!el) return;
    el.innerHTML = MATCHES.map(cardHTML).join('');
  }

  function tick(){
    const diff = getTarget21().getTime() - Date.now();
    const txt = formatRemaining(diff);
    document.querySelectorAll('[data-timer]').forEach(n => n.textContent = txt);
  }

  // refresh button
  document.getElementById('refreshBtn')?.addEventListener('click', () => {
    NProgress.start();
    render();
    setTimeout(() => NProgress.done(), 350);
  });

  render();
  tick();
  setInterval(tick, 1000);
</script>
