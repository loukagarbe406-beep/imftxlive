<!DOCTYPE html>

  <meta charset="UTF-8" />

  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#000;
      --fg:rgba(255,255,255,.92);
      --card:rgba(255,255,255,.04);
      --border:rgba(255,255,255,.10);
    }
    html,body{height:100%;}
    body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--fg);}

    .soft-bg{
      background:
        radial-gradient(1400px 620px at 50% -10%, rgba(255,255,255,.05), transparent 60%),
        radial-gradient(1000px 520px at 50% 30%, rgba(255,255,255,.035), transparent 62%);
    }

    @media (prefers-reduced-motion: no-preference){
      .reveal{
        opacity:0;
        transform: translateY(14px) scale(.985);
        animation: reveal .55s cubic-bezier(.22,1,.36,1) forwards;
      }
      @keyframes reveal{
        to{ opacity:1; transform: translateY(0) scale(1); }
      }
      .hover-lift{
        transition: transform .25s ease, box-shadow .25s ease, border-color .25s ease;
      }
      .hover-lift:hover{
        transform: translateY(-4px);
        box-shadow: 0 26px 90px rgba(0,0,0,.62);
        border-color: rgba(255,255,255,.16);
      }
    }

    .match-card{
      position:relative;
      overflow:hidden;
      border-radius:18px;
      border:1px solid var(--border);
      background: var(--card);
      box-shadow:0 18px 70px rgba(0,0,0,.55);
      aspect-ratio:16/9;
    }
    .match-bg{
      position:absolute; inset:0;
      background-size:cover;
      background-position:center;
      transform:scale(1.02);
      opacity:.98;
    }
    .match-overlay{
      position:absolute; inset:0;
      background:
        radial-gradient(700px 320px at 28% 55%, rgba(0,0,0,.35), transparent 60%),
        linear-gradient(90deg, rgba(0,0,0,.70) 0%, rgba(0,0,0,.45) 45%, rgba(0,0,0,.10) 100%);
    }

    /* TIMER */
    .timer-pill{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:6px 10px;
      border-radius:999px;
      background: rgba(18,18,18,.62);
      border:1px solid rgba(255,255,255,.10);
      backdrop-filter: blur(8px);
      font-weight:800;
      font-size:12px;
      line-height:1;
      color: rgba(255,255,255,.92);
    }
    .timer-dot{
      width:8px;height:8px;border-radius:999px;background:#f59e0b;
      box-shadow:0 0 0 3px rgba(245,158,11,.12);
    }
    .timer-text{ font-variant-numeric: tabular-nums; }

    /* bouton regarder */
    .watch-pill{
      border-radius:999px;
      border:1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.10);
      backdrop-filter: blur(10px);
      color:#fff;
      font-weight:800;
      font-size:13px;
      padding:.60rem .90rem;
      display:inline-flex;
      align-items:center;
      gap:.55rem;
      transition: transform .15s ease, background .15s ease;
      white-space: nowrap;
    }
    .watch-pill:hover{ background: rgba(255,255,255,.14); }
    .watch-pill:active{ transform: scale(.98); }
    .play{
      width:32px;height:32px;border-radius:999px;
      border:1px solid rgba(255,255,255,.16);
      display:grid; place-items:center;
      background: rgba(0,0,0,.20);
    }

    @media (max-width: 640px){
      .watch-pill{ font-size:12px; padding:.55rem .80rem; }
    }
  </style>

        t.setHours(21,0,0,0);

    function cardHTML(m, i){
      const delay = Math.min(i * 55, 800);
      return `
        <article class="match-card hover-lift reveal" style="animation-delay:${delay}ms">
          <div class="match-bg" style="background-image:url('${m.banner}');"></div>
          <div class="match-overlay"></div>

          <!-- TIMER -->
          <div class="absolute left-3 top-3">
            <span class="timer-pill" data-timer>
              <span class="timer-dot"></span>
              <span class="timer-text">--</span>
            </span>
          </div>

          <!-- ✅ SUPERPOSITION CLEAN (pas de grosse étiquette) -->
          <div class="absolute left-5 bottom-5 right-5 flex items-end justify-between gap-4">

            <div class="flex flex-col gap-2 max-w-[70%]">
              <div class="flex items-center gap-2">
                <img src="${m.aLogo}" class="w-7 h-7 object-contain" alt="">
                <span class="text-white/70 text-xs font-bold">VS</span>
                <img src="${m.bLogo}" class="w-7 h-7 object-contain" alt="">
              </div>

              <div class="text-[15px] font-medium leading-tight text-white/90 truncate">
                ${m.title}
              </div>

              <div class="flex items-center gap-2 text-xs text-white/60 font-semibold">
                <img src="${m.compLogo}" class="w-5 h-5 object-contain" alt="">
                Aujourd’hui
              </div>
            </div>

            <a href="${m.href}" class="watch-pill" target="_blank" rel="noopener">
              <span class="play">
                <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none">
                  <path d="M10 8l8 4-8 4V8Z" fill="currentColor"/>
                </svg>
              </span>
              REGARDER
            </a>
          </div>

        </article>
      `;
    }

    grid.innerHTML = matches.map(cardHTML).join("");

    // TIMER
    function formatRemaining(ms){
      if(ms <= 0) return "00h 00m 00s";
      const total = Math.floor(ms / 1000);
      const h = Math.floor(total / 3600);
      const m = Math.floor((total % 3600) / 60);
      const s = total % 60;
      const pad = (n) => String(n).padStart(2,"0");
      return `${pad(h)}h ${pad(m)}m ${pad(s)}s`;
    }

    const timerEls = Array.from(document.querySelectorAll("[data-timer] .timer-text"));

    function tick(){
      const target = getTargetToday21();
      const now = new Date();
      const diff = target.getTime() - now.getTime();
      const txt = formatRemaining(diff);
      timerEls.forEach(el => el.textContent = txt);
    }
    tick();
    setInterval(tick, 1000);
  </script>
