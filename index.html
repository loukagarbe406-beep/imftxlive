<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>IMFTX+ — Live</title>

  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

  <style>
    :root{
      --max: 1600px;
      --gap: 24px;
      --r: 26px;
      --line: rgba(255,255,255,.12);
      --shadow: 0 30px 110px rgba(0,0,0,.85);
    }

    *{box-sizing:border-box}
    html,body{
      height:100%;margin:0;
      font-family:'Outfit',system-ui,-apple-system,"Segoe UI",Roboto,Arial;
      background:#000;color:#fff;
    }
    a{color:inherit;text-decoration:none}
    img{display:block}

    /* ==========================================================
       HEADER FIXED (comme ton exemple)
       ========================================================== */
    header{
      position:fixed;
      top:0;left:0;right:0;
      z-index:200;
      background:linear-gradient(180deg, rgba(0,0,0,.85), rgba(0,0,0,0));
      pointer-events:none;
    }
    .topbar{
      max-width:var(--max);
      margin:0 auto;
      padding:18px 24px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      pointer-events:auto;
    }
    .brand{
      font-weight:900;
      letter-spacing:.5px;
      font-size:18px;
      opacity:.92;
    }
    .right{
      display:flex;
      align-items:center;
      gap:12px;
    }
    .icons{
      display:flex;gap:10px;
    }
    .icons a{
      width:40px;height:40px;
      display:grid;place-items:center;
      border-radius:12px;
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.10);
      backdrop-filter: blur(14px);
      opacity:.92;
    }
    .icons a:hover{opacity:1;background:rgba(255,255,255,.10)}
    .clock{
      padding:10px 14px;
      border-radius:999px;
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.10);
      font-weight:900;
      font-size:12px;
      opacity:.9;
      backdrop-filter: blur(14px);
      white-space:nowrap;
    }

    /* ==========================================================
       HERO PLEIN ÉCRAN (le point clé)
       ========================================================== */
    .hero{
      position:relative;
      height:100vh;
      min-height:720px;
      overflow:hidden;
      display:flex;
      align-items:flex-end;
      padding-top:90px;
    }
    .bg{
      position:absolute;inset:0;
      background-size:cover;
      background-position:center;
      transform:scale(1.15);
      filter: blur(20px) saturate(1.15) brightness(.55);
      opacity:.95;
    }
    .hero::after{
      content:"";
      position:absolute;inset:0;
      background:
        radial-gradient(1400px 800px at 50% 0%, rgba(255,255,255,.10), transparent 60%),
        linear-gradient(180deg, rgba(0,0,0,.15) 0%, rgba(0,0,0,.70) 60%, rgba(0,0,0,.98) 100%),
        linear-gradient(90deg, rgba(0,0,0,.85), rgba(0,0,0,.10), rgba(0,0,0,.85));
      pointer-events:none;
    }

    .wrap{
      width:100%;
      position:relative;
      z-index:2;
      max-width:var(--max);
      margin:0 auto;
      padding:0 24px 30px;
    }

    /* ==========================================================
       TITRE TOP LEFT (comme ton exemple)
       ========================================================== */
    .heroHeader{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      margin-bottom:18px;
    }
    .heroLeft h1{
      margin:0;
      font-size:38px;
      font-weight:900;
      line-height:1.05;
      text-transform:uppercase;
      text-shadow: 0 18px 55px rgba(0,0,0,.8);
    }
    .heroLeft .meta1{
      margin-top:10px;
      font-size:14px;
      font-weight:800;
      opacity:.75;
    }
    .heroLeft .meta2{
      margin-top:4px;
      font-size:13px;
      opacity:.6;
      font-style:italic;
    }

    /* ==========================================================
       SLIDER “CINEMA” (plus grand)
       ========================================================== */
    .viewport{
      overflow:hidden;
      width:100%;
    }
    .track{
      display:flex;
      gap:var(--gap);
      transition:transform .6s ease;
      will-change:transform;
    }

    .card{
      flex:0 0 1200px;
      height:500px;
      border-radius:var(--r);
      overflow:hidden;
      position:relative;
      border:1px solid var(--line);
      box-shadow:var(--shadow);
      background:rgba(255,255,255,.05);
    }
    .poster{
      position:absolute;inset:0;
      background-size:cover;
      background-position:center;
      transform:scale(1.02);
    }
    .card::after{
      content:"";
      position:absolute;inset:0;
      background:
        linear-gradient(180deg, rgba(0,0,0,.05) 0%, rgba(0,0,0,.45) 55%, rgba(0,0,0,.92) 100%),
        linear-gradient(90deg, rgba(0,0,0,.60), rgba(0,0,0,.05), rgba(0,0,0,.60));
      pointer-events:none;
    }

    .pillTop{
      position:absolute;
      top:18px;left:18px;
      z-index:8;
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:7px 12px;
      border-radius:999px;
      background:rgba(0,0,0,.35);
      border:1px solid rgba(255,255,255,.14);
      backdrop-filter: blur(12px);
      font-weight:900;
      font-size:12px;
    }
    .dotOrange{width:9px;height:9px;border-radius:50%;background:#fb923c}
    .dotGreen{width:9px;height:9px;border-radius:50%;background:#22c55e}

    .arrow{
      position:absolute;
      top:50%;
      transform:translateY(-50%);
      width:54px;height:54px;
      border-radius:50%;
      display:grid;place-items:center;
      background:rgba(0,0,0,.35);
      border:1px solid rgba(255,255,255,.15);
      z-index:9;
      cursor:pointer;
      opacity:.85;
    }
    .arrow:hover{opacity:1}
    .arrow.left{left:18px}
    .arrow.right{right:18px}
    .arrow span{font-size:36px;line-height:1}

    .bottom{
      position:absolute;
      left:22px;right:22px;
      bottom:18px;
      z-index:8;
      display:flex;
      justify-content:space-between;
      align-items:flex-end;
      gap:18px;
    }
    .logos{
      display:flex;align-items:center;gap:10px;
      margin-bottom:10px;
    }
    .logo{
      width:34px;height:34px;
      border-radius:10px;
      background:rgba(255,255,255,.12);
      border:1px solid rgba(255,255,255,.16);
      padding:6px;
    }
    .logo img{width:100%;height:100%;object-fit:contain}
    .vs{
      width:30px;height:30px;border-radius:999px;
      display:grid;place-items:center;
      font-weight:900;font-size:11px;
      background:rgba(255,255,255,.10);
      border:1px solid rgba(255,255,255,.14);
    }
    .cardTitle{
      font-size:20px;
      font-weight:900;
      text-transform:uppercase;
    }
    .cardSub{
      margin-top:6px;
      font-size:12px;
      opacity:.65;
      font-style:italic;
    }

    .watch{
      height:58px;
      display:inline-flex;
      align-items:center;
      gap:12px;
      padding:8px 14px;
      border-radius:999px;
      background:rgba(255,255,255,.12);
      border:1px solid rgba(255,255,255,.14);
      backdrop-filter: blur(12px);
      font-weight:900;
    }
    .watch:hover{background:rgba(255,255,255,.18)}
    .play{
      width:46px;height:46px;border-radius:50%;
      display:grid;place-items:center;
      background:rgba(0,0,0,.40);
      border:1px solid rgba(255,255,255,.12);
    }

    /* dots */
    .dots{
      display:flex;
      justify-content:center;
      gap:8px;
      margin-top:14px;
    }
    .d{
      width:9px;height:9px;
      border-radius:999px;
      background:rgba(255,255,255,.20);
      border:1px solid rgba(255,255,255,.12);
      cursor:pointer;
      transition:.2s;
    }
    .d.active{
      width:38px;
      background:rgba(255,255,255,.86);
    }

    /* ==========================================================
       SECTIONS EN BAS
       ========================================================== */
    .below{
      max-width:var(--max);
      margin:0 auto;
      padding:18px 24px 60px;
      background:#000;
    }

    .sectionHead{
      display:flex;
      justify-content:space-between;
      align-items:baseline;
      margin:14px 0;
    }
    .sectionHead h2{
      margin:0;
      font-size:16px;
      font-weight:900;
      opacity:.9;
    }
    .sectionHead span{
      font-size:12px;
      opacity:.5;
      font-weight:800;
    }

    .rail{
      display:flex;
      gap:14px;
      overflow-x:auto;
      padding-bottom:8px;
      scrollbar-width:none;
    }
    .rail::-webkit-scrollbar{display:none}

    .mini{
      flex:0 0 auto;
      width:260px;
      border-radius:16px;
      overflow:hidden;
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.10);
    }
    .miniImg{
      height:130px;
      background-size:cover;
      background-position:center;
      position:relative;
    }
    .miniImg::after{
      content:"";
      position:absolute;inset:0;
      background:linear-gradient(180deg, rgba(0,0,0,.04), rgba(0,0,0,.86));
    }
    .miniTop{
      position:absolute;
      top:10px;left:10px;right:10px;
      z-index:2;
      display:flex;
      justify-content:space-between;
      gap:10px;
    }
    .pill{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:6px 12px;
      border-radius:999px;
      background:rgba(0,0,0,.36);
      border:1px solid rgba(255,255,255,.12);
      backdrop-filter: blur(10px);
      font-size:12px;
      font-weight:900;
    }
    .miniBody{padding:10px 12px 12px}
    .miniTitle{font-weight:900;font-size:13px;text-transform:uppercase}
    .miniSub{margin-top:4px;font-size:11px;opacity:.65;font-style:italic}

    footer{
      padding:18px 0;
      text-align:center;
      opacity:.55;
      border-top:1px solid rgba(255,255,255,.06);
      font-size:12px;
    }

    /* responsive */
    @media(max-width:1200px){
      .card{flex-basis: calc(100vw - 54px); height:360px;}
      .arrow{display:none;}
      .hero{min-height:640px;}
    }
  </style>
</head>

<body>

<header>
  <div class="topbar">
    <div class="brand">IMFTX+</div>
    <div class="right">
      <div class="icons">
        <a href="https://t.me/+jdy9nGJ3rFFiOWI0" target="_blank" aria-label="Telegram"><i class="fa-brands fa-telegram"></i></a>
        <a href="https://discord.gg/4ZFv9sa8" target="_blank" aria-label="Discord"><i class="fa-brands fa-discord"></i></a>
        <a href="https://discord.gg/FmWwePH5ET" target="_blank" aria-label="IPTV"><i class="fa-solid fa-tv"></i></a>
      </div>
      <div class="clock">Heure locale : <span id="clock">--:--</span></div>
    </div>
  </div>
</header>

<section class="hero">
  <div class="bg" id="bg"></div>

  <div class="wrap">
    <div class="heroHeader">
      <div class="heroLeft">
        <h1 id="heroTitle"></h1>
        <div class="meta1" id="heroLeague"></div>
        <div class="meta2" id="heroTime"></div>
      </div>
    </div>

    <div class="viewport" id="viewport">
      <div class="track" id="track"></div>
    </div>

    <div class="dots" id="dots"></div>
  </div>
</section>

<section class="below">
  <div class="sectionHead">
    <h2>À venir</h2>
    <span>Programme</span>
  </div>
  <div class="rail" id="upcoming"></div>

  <div class="sectionHead" style="margin-top:22px;">
    <h2>Événements</h2>
    <span>Matchs du jour</span>
  </div>
  <div id="eventsList"></div>

  <footer>IMFTX+ — N°1 de la diffusion FR</footer>
</section>

<script>
  const MATCHES = [
    {
      id: "liverpool-leeds",
      time: "18:30",
      comp: "Premier League",
      sport: "Football",
      title: "Liverpool - Leeds",
      a: "Liverpool",
      b: "Leeds",
      aLogo: "https://fr.wikipedia.org/wiki/Special:FilePath/Logo%20FC%20Liverpool.svg",
      bLogo: "https://fr.wikipedia.org/wiki/Special:FilePath/Logo%20Leeds%20United%20FC.svg",
      banner: "https://empire-sport.site/upload/banners/burnley-vs-arsenal_01.png"
    },
    {
      id: "sunderland-man-city",
      time: "21:00",
      comp: "Premier League",
      sport: "Football",
      title: "Sunderland - Man City",
      a: "Sunderland",
      b: "Man City",
      aLogo: "https://fr.wikipedia.org/wiki/Special:FilePath/Sunderland_A.F.C._logo.svg",
      bLogo: "https://fr.wikipedia.org/wiki/Special:FilePath/Manchester_City_FC_badge.svg",
      banner: "https://empire-sport.site/upload/events/erilvwbktz7ugfcei9tr90bnnvlauf.jpg"
    }
  ];

  function watchUrl(m){ return `pages/${m.id}.html`; }
  const MATCH_DURATION_MIN = 135;

  function timeToMinutes(hhmm){
    const [h,m] = hhmm.split(":").map(Number);
    return h*60 + (m||0);
  }

  function computeStatus(hhmm){
    const now = new Date();
    const nowMin = now.getHours()*60 + now.getMinutes();
    const start = timeToMinutes(hhmm);
    const end = start + MATCH_DURATION_MIN;
    if(nowMin < start) return "À venir";
    if(nowMin >= start && nowMin < end) return "En cours";
    return "Terminé";
  }

  function countdownTo(hhmm){
    const now = new Date();
    const target = new Date(now);
    const [h,m] = hhmm.split(":").map(Number);
    target.setHours(h, m, 0, 0);

    const diff = target.getTime() - now.getTime();
    if(diff <= 0) return "";
    const totalSec = Math.floor(diff/1000);
    const hh = Math.floor(totalSec/3600);
    const mm = Math.floor((totalSec%3600)/60);
    const ss = totalSec%60;
    return `${hh}h ${String(mm).padStart(2,"0")}m ${String(ss).padStart(2,"0")}s`;
  }

  function formatToday(hhmm){ return `Aujourd’hui · ${hhmm}`; }

  const bg = document.getElementById("bg");
  const heroTitle = document.getElementById("heroTitle");
  const heroLeague = document.getElementById("heroLeague");
  const heroTime = document.getElementById("heroTime");
  const track = document.getElementById("track");
  const dots = document.getElementById("dots");
  const viewport = document.getElementById("viewport");
  const upcoming = document.getElementById("upcoming");
  const eventsList = document.getElementById("eventsList");

  let idx = 0;
  let vm = [];
  let slider = [];

  function buildVM(){
    return MATCHES.map(m => ({
      ...m,
      status: computeStatus(m.time),
      timeLabel: formatToday(m.time),
      timeRaw: m.time
    }));
  }

  function pickForSlider(all){
    const sorted = all.slice().sort((a,b)=> timeToMinutes(a.timeRaw) - timeToMinutes(b.timeRaw));
    return sorted.slice(0,3);
  }

  function setHero(m){
    bg.style.backgroundImage = `url('${m.banner}')`;
    heroTitle.textContent = m.title.toUpperCase();
    heroLeague.textContent = m.comp;
    heroTime.textContent = m.timeLabel;
  }

  function badgeHTML(m){
    if(m.status === "En cours"){
      return `<div class="pillTop"><span class="dotGreen"></span>EN COURS</div>`;
    }
    if(m.status === "Terminé"){
      return `<div class="pillTop" style="opacity:.75"><span class="dotOrange"></span>TERMINÉ</div>`;
    }
    const cd = countdownTo(m.timeRaw);
    return `<div class="pillTop"><span class="dotOrange"></span>${cd || "À VENIR"}</div>`;
  }

  function logosBlock(m){
    return `
      <div class="logos">
        <span class="logo"><img src="${m.aLogo}" alt=""></span>
        <div class="vs">VS</div>
        <span class="logo"><img src="${m.bLogo}" alt=""></span>
      </div>
    `;
  }

  function cardHTML(m){
    return `
      <div class="card">
        <div class="poster" style="background-image:url('${m.banner}')"></div>
        ${badgeHTML(m)}

        <div class="arrow left" onclick="prevSlide()"><span>‹</span></div>
        <div class="arrow right" onclick="nextSlide()"><span>›</span></div>

        <div class="bottom">
          <div>
            ${logosBlock(m)}
            <div class="cardTitle">${m.title.toUpperCase()}</div>
            <div class="cardSub">${m.comp} · ${m.timeLabel}</div>
          </div>

          <a class="watch" href="${watchUrl(m)}">
            <div class="play">▶</div>
            <span>REGARDER</span>
          </a>
        </div>
      </div>
    `;
  }

  function dotHTML(i){
    return `<div class="d ${i===0?'active':''}" id="d${i}" onclick="goTo(${i})"></div>`;
  }

  function miniHTML(m){
    const dot = m.status === "En cours" ? "dotGreen" : "dotOrange";
    const label = m.status === "À venir" ? (countdownTo(m.timeRaw) || "À venir") : m.status;
    return `
      <a class="mini" href="${watchUrl(m)}">
        <div class="miniImg" style="background-image:url('${m.banner}')">
          <div class="miniTop">
            <span class="pill"><span class="${dot}"></span>${label}</span>
            <span class="pill">${m.sport}</span>
          </div>
        </div>
        <div class="miniBody">
          <div class="miniTitle">${m.title.toUpperCase()}</div>
          <div class="miniSub">${m.comp} · ${m.timeLabel}</div>
        </div>
      </a>
    `;
  }

  function rowHTML(m){
    const dot = m.status === "En cours" ? "dotGreen" : "dotOrange";
    const label = m.status === "À venir" ? (countdownTo(m.timeRaw) || "À venir") : m.status;
    return `
      <a class="eventRow" href="${watchUrl(m)}" style="display:block;margin-bottom:10px;padding:14px 16px;border-radius:16px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.10)">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:14px;">
          <div style="display:flex;align-items:center;gap:12px;">
            <img style="width:34px;height:34px;border-radius:999px;background:rgba(255,255,255,.10);padding:6px;border:1px solid rgba(255,255,255,.14)" src="${m.aLogo}">
            <div>
              <div style="font-weight:900;text-transform:uppercase">${m.title.toUpperCase()}</div>
              <div style="opacity:.65;font-size:12px;font-style:italic">${m.comp} · ${m.timeLabel}</div>
            </div>
          </div>

          <div style="display:flex;align-items:center;gap:10px;">
            <span style="display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:999px;background:rgba(0,0,0,.36);border:1px solid rgba(255,255,255,.12);font-weight:900;font-size:12px;">
              <span class="${dot}"></span>${label}
            </span>
            <span style="opacity:.7;font-size:12px;font-weight:900;text-transform:uppercase">${m.sport}</span>
          </div>
        </div>
      </a>
    `;
  }

  function updateDots(){
    for(let i=0;i<slider.length;i++){
      const el = document.getElementById("d"+i);
      if(el) el.classList.toggle("active", i===idx);
    }
  }

  function update(){
    const first = document.querySelector(".card");
    if(!first || !slider.length) return;

    const cardW = first.getBoundingClientRect().width;
    const gap = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--gap')) || 20;
    const vw = viewport.getBoundingClientRect().width;

    const centerOffset = Math.max(20, (vw - cardW) / 2);
    const peekBias = Math.min(120, vw * 0.08);
    const x = -(idx * (cardW + gap)) + centerOffset - peekBias;

    track.style.transform = `translateX(${x}px)`;
    setHero(slider[idx]);
    updateDots();
  }

  function nextSlide(){ idx = Math.min(idx + 1, slider.length - 1); update(); }
  function prevSlide(){ idx = Math.max(idx - 1, 0); update(); }
  function goTo(i){ idx = Math.max(0, Math.min(i, slider.length - 1)); update(); }

  window.nextSlide = nextSlide;
  window.prevSlide = prevSlide;
  window.goTo = goTo;

  function rebuild(){
    vm = buildVM();
    slider = pickForSlider(vm);

    track.innerHTML = slider.map(cardHTML).join("");
    dots.innerHTML = slider.map((_,i)=>dotHTML(i)).join("");

    upcoming.innerHTML = vm.filter(x=>x.status==="À venir").map(miniHTML).join("");
    eventsList.innerHTML = vm.map(rowHTML).join("");

    idx = Math.min(idx, slider.length - 1);
    update();
  }

  function updateClock(){
    const d = new Date();
    document.getElementById("clock").textContent =
      String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
  }

  rebuild();
  updateClock();
  window.addEventListener("resize", update);
  setInterval(()=>{rebuild();updateClock();}, 1000);
</script>

</body>
</html>
