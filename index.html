<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>IMFTX+ — Live</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

  <style>
    html,body{height:100%;margin:0;font-family:'Outfit',system-ui,-apple-system,"Segoe UI",Roboto,Arial;background:#070708;color:#fff;}
    main{min-height:100vh;width:100%}

    .live-badge{
      display:inline-flex;align-items:center;gap:10px;
      padding:10px 18px;border-radius:999px;
      background:rgba(0,0,0,.35);
      border:1px solid rgba(255,255,255,.08);
      backdrop-filter:blur(12px);
      font-weight:800;font-size:14px;color:#eaffea;
    }
    .live-dot{width:10px;height:10px;background:#22c55e;border-radius:999px;box-shadow:0 0 18px rgba(34,197,94,.9);}

    .match-card{
      position:relative;height:300px;border-radius:22px;overflow:hidden;
      border:1px solid rgba(255,255,255,.10);
      box-shadow:0 30px 120px rgba(0,0,0,.80);
      background:#111;
    }
    .match-bg{position:absolute;inset:0;background-size:cover;background-position:center;transform:scale(1.02);}
    .match-overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.08) 0%,rgba(0,0,0,.45) 55%,rgba(0,0,0,.78) 100%);}

    .time-pill{
      position:absolute;top:14px;left:14px;
      display:inline-flex;align-items:center;gap:8px;
      padding:7px 11px;border-radius:999px;
      background:rgba(0,0,0,.55);
      border:1px solid rgba(255,255,255,.10);
      font-weight:900;font-size:13px;
    }
    .time-dot{width:9px;height:9px;background:#f59e0b;border-radius:999px;box-shadow:0 0 12px rgba(245,158,11,.75);}

    .bottom-strip{
      position:absolute;left:18px;right:18px;bottom:18px;
      padding:14px 16px;border-radius:18px;
      background:rgba(255,255,255,.10);
      border:1px solid rgba(255,255,255,.12);
      backdrop-filter: blur(16px);
      display:flex;align-items:flex-end;justify-content:space-between;gap:14px;
    }

    /* ✅ ordre comme tu veux : match d’abord, compèt ensuite */
    .strip-match{
      font-weight:900;
      font-size:15px;
      line-height:1.05;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    }
    .strip-compet{
      margin-top:4px;
      font-weight:700;
      font-size:13px;
      opacity:.78;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    }

    .watch-btn{
      display:inline-flex;align-items:center;justify-content:center;gap:8px;
      padding:10px 14px;border-radius:999px;
      background:rgba(0,0,0,.28);
      border:1px solid rgba(255,255,255,.16);
      color:#fff;font-weight:900;
      transition:.15s;
      font-size:12px;
      flex-shrink:0;
      min-width:110px;
    }
    .watch-btn:hover{background:rgba(0,0,0,.38);transform:scale(1.02);}

    @media(max-width:1024px){.match-card{height:270px}}
    @media(max-width:640px){.match-card{height:235px}.watch-btn{min-width:100px}}
  </style>
</head>
<body>

  <div class="flex items-center gap-4 text-lg font-bold">
    <a href="https://t.me/+jdy9nGJ3rFFiOWI0" target="_blank" class="opacity-70 hover:opacity-100">

    <a href="https://discord.gg/4ZFv9sa8" target="_blank" class="opacity-70 hover:opacity-100">

    </a>

    </a>
  </div>
</nav>

<main class="max-w-[1600px] mx-auto px-6 pb-14">
