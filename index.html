<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="referrer" content="no-referrer-when-downgrade"/>

  <script disable-devtool-auto src="https://cdn.jsdelivr.net/npm/disable-devtool@latest" url="https://google.com"></script>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    window.tailwind = window.tailwind || {};
    tailwind.config = { darkMode: 'class' };
  </script>

  <script>
    const saved = localStorage.getItem('theme');
    if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    }
  </script>

  <script src="https://cdn.jsdelivr.net/npm/nprogress/nprogress.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/nprogress/nprogress.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <style>
    #nprogress .bar { top: 64px !important; }
    #nprogress .spinner { top: 75px !important; }

    html, body { font-family: 'Outfit', sans-serif; }

    .dark body{
      background-image: url('https://cdn.jsdelivr.net/gh/Nyx0xFF/turbo-palm-tree/noise.png');
      background-repeat: repeat;
      background-size: 96px 96px;
    }

    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb {
      background-color: rgba(100, 100, 100, 0.4);
      border-radius: 10px;
      border: 2px solid transparent;
      background-clip: content-box;
    }
    ::-webkit-scrollbar-thumb:hover { background-color: rgba(100, 100, 100, 0.6); }
    * { scrollbar-width: thin; scrollbar-color: rgba(100, 100, 100, 0.4) transparent; }

    ::selection { background-color: #444; color: white; }

    body { display:flex; flex-direction:column; }
    button * { pointer-events:none; }

    /* --------- Match Cards --------- */
    .match-card{
      position:relative;
      overflow:hidden;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.04);
      box-shadow: 0 18px 70px rgba(0,0,0,.45);
      aspect-ratio: 16 / 9;
    }
    .match-bg{
      position:absolute; inset:0;
      background-size:cover;
      background-position:center;
      transform:scale(1.02);
      opacity:.96;
    }
    .match-overlay{
      position:absolute; inset:0;
      background:
        radial-gradient(700px 320px at 28% 55%, rgba(0,0,0,.35), transparent 60%),
        linear-gradient(90deg, rgba(0,0,0,.70) 0%, rgba(0,0,0,.45) 45%, rgba(0,0,0,.10) 100%);
    }

    .timer-pill{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:6px 10px;
      border-radius:999px;
      background: rgba(18,18,18,.62);
      border:1px solid rgba(255,255,255,.10);
      backdrop-filter: blur(8px);
      font-weight:800;
      font-size:12px;
      line-height:1;
      color: rgba(255,255,255,.92);
    }
    .timer-dot{
      width:8px;height:8px;border-radius:999px;background:#f59e0b;
      box-shadow:0 0 0 3px rgba(245,158,11,.12);
    }
    .timer-dot.live{
      background:#22c55e;
      box-shadow:0 0 0 3px rgba(34,197,94,.14);
    }
    .timer-text{ font-variant-numeric: tabular-nums; }

    .team-logo{
      width:30px;height:30px;
      display:flex;align-items:center;justify-content:center;
      flex:0 0 auto;
    }
    .team-logo img{
      width:100%;
      height:100%;
      object-fit:contain;
      display:block;
      filter: drop-shadow(0 1px 0 rgba(0,0,0,.35));
    }
    .vs{
      font-weight:800;
      font-size:12px;
      color: rgba(255,255,255,.68);
      letter-spacing:.02em;
    }
    .comp-wrap{
      width:26px;height:26px;
      display:flex;align-items:center;justify-content:center;
      flex:0 0 auto;
    }
    .comp-wrap img{
      width:100%;height:100%;
      object-fit:contain;
      filter: drop-shadow(0 1px 0 rgba(0,0,0,.35));
    }

    .match-title{
      font-size:15px;
      font-weight:500;
      line-height:1.15;
      color: rgba(255,255,255,.92);
    }
    .match-sub{
      font-size:12px;
      font-weight:600;
      color: rgba(255,255,255,.70);
      line-height:1.25;
    }

    .watch-pill{
      border-radius:999px;
      border:1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.10);
      backdrop-filter: blur(10px);
      color:#fff;
      font-weight:800;
      font-size:12px;
      padding:.45rem .70rem;
      display:inline-flex;
      align-items:center;
      gap:.45rem;
      transition: transform .15s ease, background .15s ease;
      white-space: nowrap;
    }
    .watch-pill:hover{ background: rgba(255,255,255,.14); }
    .watch-pill:active{ transform: scale(.98); }
    .play{
      width:26px;height:26px;border-radius:999px;
      border:1px solid rgba(255,255,255,.16);
      display:grid; place-items:center;
      background: rgba(0,0,0,.20);
    }

    @media (max-width: 640px){
      .team-logo{ width:28px; height:28px; }
      .match-title{ font-size:14px; }
      .watch-pill{ font-size:12px; padding:.45rem .65rem; }
      .play{ width:26px; height:26px; }
    }

  </style>
</head>

<body data-page="index" class="min-h-screen bg-white text-black dark:bg-zinc-900 dark:text-white flex flex-col font-[Outfit] transition-colors duration-200">
<noscript>You need to enable JavaScript to run this website.</noscript>

<!-- NAV -->
<nav class="sticky top-0 z-10 backdrop-blur-xl border-b border-gray-200 dark:border-zinc-700 shadow-sm">
  <div class="max-w-screen-2xl mx-auto py-2 px-5 md:px-24 h-16 flex items-center justify-between">
    <button id="burgerBtn" class="flex md:hidden w-11 h-11 items-center justify-center rounded-md backdrop-blur-md ring-1 ring-zinc-300 dark:ring-zinc-700 hover:bg-zinc-100 dark:hover:bg-zinc-700 active:scale-95 transition-all duration-200">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/>
      </svg>
    </button>

    <button id="nav-pfp" type="button" class="h-11 hidden md:flex items-center gap-1">
      <div class="text-3xl font-extrabold tracking-tight">IMFTX+</div>
    </button>

    <div class="h-11 flex items-center gap-2 md:gap-5 text-xl">
      <div class="relative flex group">
        <a href="/shop" class="w-auto h-11 px-3 flex items-center justify-center rounded-md backdrop-blur-md ring-1 ring-zinc-300 dark:ring-zinc-700 hover:bg-zinc-100 dark:hover:bg-zinc-700 active:scale-95 transition-all duration-200">
          <div class="flex items-center gap-2">
            <span class="text-sm font-semibold">NOTRE IPTV 1 AN À 50€ ICI</span>
          </div>
        </a>
      </div>
    </div>
  </div>
</nav>

<!-- CONTENT -->
<div class="my_container max-w-screen-2xl mx-auto h-full w-full flex flex-grow flex-col items-center justify-center md:px-24 p-5 transition-all duration-300 ease-out">
  <div class="w-full flex flex-col gap-12 mt-10">
    <section class="bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 rounded-2xl p-6 shadow-sm dark:shadow-none w-full">
      <div class="flex items-center justify-between mb-6">
        <div class="flex items-center gap-3">
          <div class="w-3 h-3 rounded-full bg-amber-500 shadow-[0_0_10px_rgba(255,193,7,0.7)]"></div>
          <h2 class="text-xl font-bold text-zinc-900 dark:text-white">Streams principaux</h2>
        </div>

        <button type="button" id="refreshBtn" class="flex items-center justify-center w-9 h-9 rounded-xl bg-amber-500/90 hover:bg-amber-500 text-black transition-all duration-200 active:scale-95 shadow-md" aria-label="Rafraîchir">↻</button>
      </div>

      <div id="stream-list-principal" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
        <!-- Match Udinese vs Roma -->
        <a href="udinese-roma.html" class="block">
          <article class="match-card">
            <div class="match-bg" style="background-image:url('https://empire-sport.online/upload/banners/roma-vs-genoa.png')"></div>
            <div class="match-overlay"></div>

            <div class="absolute left-3 top-3">
              <span class="timer-pill">
                <span class="timer-dot"></span>
                <span class="timer-text">--</span>
              </span>
            </div>

            <div class="absolute inset-x-0 bottom-0 p-4">
              <div class="flex items-end justify-between gap-4">
                <div class="min-w-0 max-w-[72%]">
                  <div class="flex items-center gap-2">
                    <div class="team-logo"><img src="https://empire-sport.online/upload/teams/4nbx93aqgzfapkel3fotjhbbfxwty3.png" alt="Udinese"></div>
                    <span class="vs">VS</span>
                    <div class="team-logo"><img src="https://empire-sport.online/upload/teams/zpnuspg97icikleby6tuqnsjwoqbap.png" alt="Roma"></div>
                  </div>

                  <div class="mt-2 flex items-center gap-2">
                    <div class="comp-wrap"><img src="https://empire-sport.online/upload/leagues/dzgp29vldk3lr0xjwscjbyi6eqenm8.png" alt="Compétition"></div>
                    <div class="min-w-0">
                      <div class="match-title truncate">Udinese - Roma</div>
                      <div class="match-sub">Aujourd'hui · 20h45</div>
                    </div>
                  </div>
                </div>

                <span class="watch-pill">
                  <span class="play">
                    <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none">
                      <path d="M10 8l8 4-8 4V8Z" fill="currentColor"/>
                    </svg>
                  </span>
                  REGARDER
                </span>
              </div>
            </div>
          </article>
        </a>
      </div>
    </section>
  </div>
</div>

<script>
  // -------- Refresh Button --------
  document.getElementById('refreshBtn').addEventListener('click', () => {
    NProgress.start();
    setTimeout(() => NProgress.done(), 350);
  });
</script>
</body>
</html>
