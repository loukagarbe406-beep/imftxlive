<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>IMFTX+ — Live</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

  <style>
    html,body{
      height:100%;
      margin:0;
      font-family:'Outfit',system-ui,-apple-system,"Segoe UI",Roboto,Arial;
      background:#070708;
      color:#fff;
    }

    main{min-height:100vh;width:100%;}

    /* badge en direct */
    .live-badge{
      display:inline-flex;align-items:center;gap:10px;
      padding:9px 16px;border-radius:999px;
      background:rgba(0,0,0,.35);
      border:1px solid rgba(255,255,255,.08);
      backdrop-filter: blur(12px);
      font-weight:800;font-size:13px;color:#eaffea;
    }
    .live-dot{
      width:9px;height:9px;background:#22c55e;border-radius:999px;
      box-shadow:0 0 16px rgba(34,197,94,.9);
    }

    /* ✅ card plus petite + style "bande en bas" comme ton exemple */
    .match-card{
      position:relative;
      height:220px;              /* plus petit */
      border-radius:22px;
      overflow:hidden;
      border:1px solid rgba(255,255,255,.10);
      box-shadow:0 26px 90px rgba(0,0,0,.78);
      background:#0f0f10;
    }

    .match-bg{
      position:absolute; inset:0;
      background:url("https://empire-sport.work/upload/banners/celta-vigo-vs-barcelona.png") center/cover no-repeat;
      transform:scale(1.02);
      filter:saturate(1.05) contrast(1.05);
    }

    /* voile sombre global */
    .shade{
      position:absolute; inset:0;
      background:linear-gradient(180deg, rgba(0,0,0,.55) 0%, rgba(0,0,0,.55) 60%, rgba(0,0,0,.70) 100%);
    }

    /* pastille heure */
    .time-pill{
      position:absolute; top:14px; left:14px;
      display:inline-flex; align-items:center; gap:8px;
      padding:7px 11px; border-radius:999px;
      background:rgba(0,0,0,.55);
      border:1px solid rgba(255,255,255,.10);
      font-weight:900; font-size:13px;
    }
    .time-dot{
      width:9px;height:9px;border-radius:999px;
      background:#f59e0b; box-shadow:0 0 12px rgba(245,158,11,.75);
    }

    /* ✅ bande en bas (comme ton screen) */
    .bottom-strip{
      position:absolute;
      left:14px; right:14px; bottom:14px;
      height:74px;
      border-radius:18px;
      background:rgba(20,20,22,.78);
      border:1px solid rgba(255,255,255,.10);
      backdrop-filter: blur(14px);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:14px;
      padding:0 16px;
    }

    .left{
      min-width:0;
    }
    .teams{
      font-size:16px;
      font-weight:900;
      line-height:1.1;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .comp{
      margin-top:4px;
      font-size:12px;
      font-weight:800;
      color:rgba(255,255,255,.70);
    }

    /* bouton regarder compact */
    .watch-btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      padding:10px 14px;
      border-radius:999px;
      background:rgba(255,255,255,.10);
      border:1px solid rgba(255,255,255,.14);
      color:#fff;
      font-weight:900;
      font-size:12px;
      transition:.15s;
      flex-shrink:0;
    }
    .watch-btn:hover{background:rgba(255,255,255,.16); transform:scale(1.02);}

    @media(max-width:640px){
      .match-card{height:200px;}
      .bottom-strip{height:70px;}
      .teams{font-size:15px;}
      .watch-btn{padding:9px 12px;}
    }
  </style>
</head>

<body>

<!-- NAVBAR -->
<nav class="w-full px-6 py-5 flex items-center justify-between">
  <div class="text-2xl font-extrabold tracking-tight">IMFTX+</div>

  <div class="flex items-center gap-4 text-lg font-bold">
    <a href="https://t.me/+jdy9nGJ3rFFiOWI0" target="_blank" class="opacity-70 hover:opacity-100">
      <i class="fa-brands fa-telegram"></i>
    </a>
    <a href="https://discord.gg/4ZFv9sa8" target="_blank" class="opacity-70 hover:opacity-100">
      <i class="fa-brands fa-discord"></i>
    </a>

    <a href="https://discord.gg/FmWwePH5ET" target="_blank"
       class="opacity-80 hover:opacity-100 text-sm px-3 py-1 rounded-full bg-white/10 border border-white/10">
      IPTV
    </a>
  </div>
</nav>

<main class="max-w-[1200px] mx-auto px-6 pb-14">

  <header class="text-center mt-10 mb-6">
    <h1 class="text-5xl md:text-6xl font-extrabold tracking-tight">IMFTX+ LIVE</h1>
    <p class="mt-3 text-white/55 font-semibold text-lg">N°1 des meilleurs diffuseurs</p>
  </header>

  <div class="flex justify-start mb-5">
    <div class="live-badge">
      <span class="live-dot"></span>
      En direct
    </div>
  </div>

  <!-- ✅ 1 match, style comme ton exemple -->
  <section class="grid grid-cols-1 gap-6">
    <article class="match-card">
      <div class="match-bg"></div>
      <div class="shade"></div>

      <div class="time-pill"><span class="time-dot"></span> 21:00</div>

      <div class="bottom-strip">
        <div class="left">
          <div class="teams">Santander • Barcelone</div>
          <div class="comp">Coupe du Roi</div>
        </div>

        <button onclick="goMatch('santander-barcelone')" class="watch-btn">
          <i class="fa-solid fa-play"></i> REGARDER
        </button>
      </div>
    </article>
  </section>

</main>

<script>
  function goMatch(id){
    window.location.href = id + ".html";
  }
</script>

</body>
</html>
