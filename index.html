      position:absolute; inset:0;

      height:100%;

      font-size:12px;
      color: rgba(255,255,255,.68);

    }
    .comp-wrap{
      width:26px;height:26px;
      display:flex;align-items:center;justify-content:center;
      flex:0 0 auto;
    }
    .comp-wrap img{
      width:100%;height:100%;

      line-height:1.15;
      color: rgba(255,255,255,.92);
    }
    .match-sub{

      font-weight:700;
      color: rgba(255,255,255,.70);
      line-height:1.25;

      border-radius:999px;
      border:1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.10);
      backdrop-filter: blur(10px);
      color:#fff;
      font-weight:800;
      font-size:12px;
      padding:.48rem .70rem; /* + petit */

      align-items:center;
      gap:.45rem;

    .watch-pill:active{ transform: scale(.98); }
    .play{

  // -------- Theme toggle --------
  const toggle = document.getElementById('theme-toggle');
  function setTheme(mode){
    if(mode === 'dark'){
      document.documentElement.classList.add('dark');
      localStorage.setItem('theme','dark');
    } else {
      document.documentElement.classList.remove('dark');
      localStorage.setItem('theme','light');
    }
  }
  toggle?.addEventListener('click', () => {
    const isDark = document.documentElement.classList.contains('dark');
    setTheme(isDark ? 'light' : 'dark');
  });

  // -------- Helpers time --------
  function parseHHMM(str){
    // accepte "14h", "15h00", "17:15", "20h45", "17h30"
    let s = String(str).trim().toLowerCase();
    s = s.replace(' ', '');
    if(s.includes('h')){
      const [h, m] = s.split('h');
      return { h: parseInt(h,10), m: parseInt(m || "0",10) || 0 };
    }
    if(s.includes(':')){
      const [h, m] = s.split(':');
      return { h: parseInt(h,10), m: parseInt(m,10) || 0 };
    }
    // fallback
    return { h: 21, m: 0 };
  }

  function getTargetTodayOrTomorrow(h, m){
    const now = new Date();
    const t = new Date(now);
    t.setHours(h, m, 0, 0);
    if(now.getTime() > t.getTime()){
      t.setDate(t.getDate() + 1);
      t.setHours(h, m, 0, 0);
    }
    return t;
  }

  function pad2(n){ return String(n).padStart(2,"0"); }

  function formatRemaining(ms){
    if(ms <= 0) return "00h 00m 00s";
    const total = Math.floor(ms / 1000);
    const hh = Math.floor(total / 3600);
    const mm = Math.floor((total % 3600) / 60);
    const ss = total % 60;
    return `${pad2(hh)}h ${pad2(mm)}m ${pad2(ss)}s`;
  }

          <div class="absolute inset-x-0 bottom-0 p-4">
            <div class="flex items-end justify-between gap-4">
              <div class="min-w-0 max-w-[72%]">
                <div class="flex items-center gap-2">
                  <div class="team-logo"><img src="${m.aLogo}" alt=""></div>
                  <span class="vs">VS</span>
                  <div class="team-logo"><img src="${m.bLogo}" alt=""></div>
                </div>

                <div class="mt-2 flex items-center gap-2">
                  <div class="comp-wrap"><img src="${m.compLogo}" alt=""></div>
                  <div class="min-w-0">
                    <div class="match-title truncate">${m.title}</div>
                    <div class="match-sub">Aujourd’hui · ${m.time}</div>
                  </div>
                </div>
              </div>

              <span class="watch-pill">
                <span class="play">
                  <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none">
                    <path d="M10 8l8 4-8 4V8Z" fill="currentColor"/>
                  </svg>
                </span>
                REGARDER
              </span>
            </div>
          </div>
        </article>
      </a>
    `;
  }

  function render(){
    const el = document.getElementById('stream-list-principal');
    if(!el) return;
    el.innerHTML = MATCHES.map(cardHTML).join('');
  }

  function tick(){
    // met à jour chaque timer selon l'heure du match
    document.querySelectorAll('[data-timer]').forEach(node => {
      const [hStr, mStr] = node.getAttribute('data-timer').split(':');
      const h = parseInt(hStr,10);
      const m = parseInt(mStr,10);
      const target = getTargetTodayOrTomorrow(h, m);
      const diff = target.getTime() - Date.now();
      node.textContent = formatRemaining(diff);
    });
  }

  // refresh button
  document.getElementById('refreshBtn')?.addEventListener('click', () => {
    NProgress.start();
    render();
    tick();
    setTimeout(() => NProgress.done(), 350);
  });

  render();
  tick();
  setInterval(tick, 1000);
</script>

</body>
</html>
