<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>IMFTX+ — Live</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

  <style>
    html,body{
      height:100%;
      margin:0;
      font-family:'Outfit',system-ui,-apple-system,"Segoe UI",Roboto,Arial;
      background:#070708;
      color:#fff;
      overflow-x:hidden;
    }

    main{
      min-height:100vh;
      width:100%;
    }

    /* badge en direct */
    .live-badge{
      display:inline-flex;
      align-items:center;
      gap:10px;
      padding:10px 18px;
      border-radius:999px;
      background:rgba(0,0,0,.35);
      border:1px solid rgba(255,255,255,.08);
      backdrop-filter: blur(12px);
      font-weight:800;
      font-size:14px;
      color:#eaffea;
    }
    .live-dot{
      width:10px;
      height:10px;
      background:#22c55e;
      border-radius:999px;
      box-shadow:0 0 18px rgba(34,197,94,.9);
    }

    /* ✅ CARD EXACT REF */
    .match-card{
      position:relative;
      height:280px;
      border-radius:22px;
      overflow:hidden;
      border:1px solid rgba(255,255,255,.10);
      box-shadow:0 30px 120px rgba(0,0,0,.85);
      background:#111;
    }

    .match-bg{
      position:absolute;
      inset:0;
      background-size:cover;
      background-position:center;
      background-repeat:no-repeat;
    }

    /* ✅ no black sides = "cover + full inset" */
    .match-overlay{
      position:absolute;
      inset:0;
      background: linear-gradient(180deg, rgba(0,0,0,.10) 0%, rgba(0,0,0,.40) 60%, rgba(0,0,0,.80) 100%);
    }

    /* ✅ top time pill */
    .time-pill{
      position:absolute;
      top:14px;
      left:14px;
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:7px 12px;
      border-radius:999px;
      background:rgba(0,0,0,.55);
      border:1px solid rgba(255,255,255,.12);
      font-weight:900;
      font-size:13px;
      z-index:5;
    }
    .time-dot{
      width:9px;height:9px;
      background:#f59e0b;
      border-radius:999px;
      box-shadow:0 0 12px rgba(245,158,11,.8);
    }

    /* ✅ logos block (like ref) */
    .logos-top{
      position:absolute;
      left:20px;
      bottom:98px;
      display:flex;
      align-items:center;
      gap:10px;
      z-index:5;
    }

    .team-logo{
      width:46px;
      height:46px;
      object-fit:contain;
      filter: drop-shadow(0 8px 16px rgba(0,0,0,.75));
    }

    .vs{
      font-weight:900;
      font-size:14px;
      opacity:.9;
      margin:0 4px;
    }

    .comp-logo{
      width:46px;
      height:46px;
      object-fit:contain;
      filter: drop-shadow(0 8px 16px rgba(0,0,0,.75));
    }

    /* ✅ bottom info (text bottom-left) */
    .match-info{
      position:absolute;
      bottom:18px;
      left:20px;
      right:20px;
      display:flex;
      justify-content:space-between;
      align-items:flex-end;
      gap:14px;
      z-index:5;
    }

    .teams{
      font-size:24px;
      font-weight:900;
      line-height:1.05;
    }

    .meta{
      margin-top:6px;
      font-size:14px;
      color:rgba(255,255,255,.75);
      font-weight:700;
      font-style:italic;
    }

    /* ✅ button smaller */
    .watch-btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      padding:12px 18px;
      border-radius:999px;
      background:rgba(255,255,255,.16);
      border:1px solid rgba(255,255,255,.14);
      color:#fff;
      font-weight:900;
      backdrop-filter: blur(16px);
      transition:.15s;
      min-width:140px;
      font-size:13px;
    }
    .watch-btn:hover{
      background:rgba(255,255,255,.22);
      transform:scale(1.03);
    }

    @media(max-width:1024px){
      .match-card{height:250px;}
      .teams{font-size:20px;}
    }

    @media(max-width:640px){
      .match-card{height:220px;}
      .teams{font-size:18px;}
      .team-logo,.comp-logo{width:38px;height:38px;}
      .watch-btn{padding:10px 14px; min-width:115px; font-size:12px;}
    }
  </style>
</head>
<body>

<!-- NAV -->
<nav class="w-full px-6 py-5 flex items-center justify-between">
  <div class="text-2xl font-extrabold tracking-tight">IMFTX+</div>

  <div class="flex items-center gap-4 text-lg font-bold">
    <a href="https://t.me/+jdy9nGJ3rFFiOWI0" target="_blank" class="opacity-70 hover:opacity-100">
      <i class="fa-brands fa-telegram"></i>
    </a>
    <a href="https://discord.gg/4ZFv9sa8" target="_blank" class="opacity-70 hover:opacity-100">
      <i class="fa-brands fa-discord"></i>
    </a>

    <a href="https://discord.gg/FmWwePH5ET" target="_blank"
       class="opacity-80 hover:opacity-100 text-sm px-3 py-1 rounded-full bg-white/10 border border-white/10">
      IPTV
    </a>
  </div>
</nav>

<main class="max-w-[1600px] mx-auto px-6 pb-14">

  <!-- TITLE -->
  <header class="text-center mt-10 mb-6">
    <h1 class="text-5xl md:text-6xl font-extrabold tracking-tight">IMFTX+ LIVE</h1>
    <p class="mt-3 text-white/55 font-semibold text-lg">N°1 des meilleurs diffuseurs</p>
  </header>

  <!-- ✅ badge -->
  <div class="flex justify-start mb-6">
    <div class="live-badge">
      <span class="live-dot"></span>
      En direct
    </div>
  </div>

  <!-- GRID -->
  <section class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-8">

    <!-- ✅ Mali - Sénégal -->
    <article class="match-card">
      <div class="match-bg" style="background-image:url('https://empire-sport.shop/upload/banners/senegal-vs-botswana.png')"></div>
      <div class="match-overlay"></div>

      <div class="time-pill"><span class="time-dot"></span> 17:00</div>

      <div class="logos-top">
        <img class="team-logo" src="https://toppng.com/uploads/preview/mali-football-logo-png-11536013218kxm2ifpsit.png">
        <span class="vs">VS</span>
        <img class="team-logo" src="https://upload.wikimedia.org/wikipedia/fr/thumb/d/dc/Logo_F%C3%A9d%C3%A9ration_S%C3%A9n%C3%A9galaise_Football_2016.svg/langfr-250px-Logo_F%C3%A9d%C3%A9ration_S%C3%A9n%C3%A9galaise_Football_2016.svg.png">
        <img class="comp-logo" src="https://upload.wikimedia.org/wikipedia/fr/f/f7/CAN_-_Fr_-_Full_Colour.png">
      </div>

      <div class="match-info">
        <div>
          <div class="teams">Mali - Sénégal</div>
          <div class="meta">Coupe d’Afrique · Aujourd’hui 17:00</div>
        </div>
        <button onclick="goMatch('mali-senegal')" class="watch-btn">
          <i class="fa-solid fa-play"></i> REGARDER
        </button>
      </div>
    </article>

    <!-- ✅ Cameroun - Maroc -->
    <article class="match-card">
      <div class="match-bg" style="background-image:url('https://empire-sport.shop/upload/teambanks/9knwto2d3vjnqfat9nha34gmwgmbew.png')"></div>
      <div class="match-overlay"></div>

      <div class="time-pill"><span class="time-dot"></span> 20:00</div>

      <div class="logos-top">
        <img class="team-logo" src="https://upload.wikimedia.org/wikipedia/fr/thumb/e/e4/Logo_F%C3%A9d%C3%A9ration_Camerounaise_Football_%28FECAFOOT%29_2010.svg/langfr-250px-Logo_F%C3%A9d%C3%A9ration_Camerounaise_Football_%28FECAFOOT%29_2010.svg.png">
        <span class="vs">VS</span>
        <img class="team-logo" src="https://upload.wikimedia.org/wikipedia/fr/thumb/6/69/Logo_F%C3%A9d%C3%A9ration_Royale_Marocaine_Football.svg/langfr-250px-Logo_F%C3%A9d%C3%A9ration_Royale_Marocaine_Football.svg.png">
        <img class="comp-logo" src="https://upload.wikimedia.org/wikipedia/fr/f/f7/CAN_-_Fr_-_Full_Colour.png">
      </div>

      <div class="match-info">
        <div>
          <div class="teams">Cameroun - Maroc</div>
          <div class="meta">Coupe d’Afrique · Aujourd’hui 20:00</div>
        </div>
        <button onclick="goMatch('cameroun-maroc')" class="watch-btn">
          <i class="fa-solid fa-play"></i> REGARDER
        </button>
      </div>
    </article>

    <!-- ✅ Francfort - Dortmund -->
    <article class="match-card">
      <div class="match-bg" style="background-image:url('https://empire-sport.shop/upload/teambanks/djj2j8cg1nwamyc44nye0olnube1mx.png')"></div>
      <div class="match-overlay"></div>

      <div class="time-pill"><span class="time-dot"></span> 20:30</div>

      <div class="logos-top">
        <img class="team-logo" src="https://upload.wikimedia.org/wikipedia/fr/thumb/c/cb/Logo_Eintracht_Francfort.svg/langfr-250px-Logo_Eintracht_Francfort.svg.png">
        <span class="vs">VS</span>
        <img class="team-logo" src="https://upload.wikimedia.org/wikipedia/commons/thumb/6/67/Borussia_Dortmund_logo.svg/langfr-250px-Borussia_Dortmund_logo.svg.png">
        <img class="comp-logo" src="https://upload.wikimedia.org/wikipedia/fr/thumb/0/0a/Bundesliga-logo.svg/1200px-Bundesliga-logo.svg.png">
      </div>

      <div class="match-info">
        <div>
          <div class="teams">Francfort - Dortmund</div>
          <div class="meta">Bundesliga · Aujourd’hui 20:30</div>
        </div>
        <button onclick="goMatch('francfort-dortmund')" class="watch-btn">
          <i class="fa-solid fa-play"></i> REGARDER
        </button>
      </div>
    </article>

  </section>
</main>

<script>
  function goMatch(id){
    window.location.href = id + ".html";
  }
</script>

</body>
</html>
