<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: "class" };</script>
  <script>document.documentElement.classList.add("dark");</script>

  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root{ --bg:#000; }
    html,body{ height:100%; }
    body{ font-family:Outfit,system-ui,-apple-system,Segoe UI,Roboto,Arial; background:var(--bg); color:#fff; }

    .page-glow{
      background:
        radial-gradient(1200px 520px at 50% -10%, rgba(255,255,255,.06), transparent 62%),
        radial-gradient(900px 420px at 50% 20%, rgba(255,255,255,.04), transparent 60%);
    }

    /* card 16:9 */
    .match-card{
      position:relative;
      overflow:hidden;
      border-radius:18px;
      border:1px solid rgba(255,255,255,.10);
      background:rgba(255,255,255,.04);
      box-shadow: 0 18px 70px rgba(0,0,0,.55);
    }
    .match-bg{
      position:absolute; inset:0;
      background-size:cover;
      background-position:center;
      transform:scale(1.03);
    }
    .match-overlay{
      position:absolute; inset:0;
      background:
        radial-gradient(700px 320px at 30% 55%, rgba(0,0,0,.45), transparent 62%),
        linear-gradient(90deg, rgba(0,0,0,.75) 0%, rgba(0,0,0,.35) 52%, rgba(0,0,0,.08) 100%);
    }

    /* badges top */
    .pill{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:5px 9px;
      border-radius:999px;
      background:rgba(18,18,18,.72);
      border:1px solid rgba(255,255,255,.10);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      font-weight:800;
      font-size:12px;
      line-height:1;
      color:rgba(255,255,255,.92);
      user-select:none;
    }
    .dot{
      width:8px;height:8px;border-radius:999px;
      background:#f59e0b;
      box-shadow:0 0 0 3px rgba(245,158,11,.18);
    }

    /* bottom info */
    .info{
      position:absolute;
      left:14px;
      bottom:12px;
      right:14px;
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap:12px;
    }
    .left-stack{ max-width:72%; }

    /* teams row */
    .teams-row{
      display:flex;
      align-items:center;
      gap:10px;
      margin-bottom:8px;
    }
    .team-logo{
      width:34px; height:34px;
      display:grid; place-items:center;
    }
    .team-logo img{
      width:100%; height:100%;
      object-fit:contain;
      filter: drop-shadow(0 1px 0 rgba(0,0,0,.35));
      image-rendering:auto;
    }
    .vs{
      font-weight:900;
      font-size:13px;
      color:rgba(255,255,255,.72);
      letter-spacing:.06em;
    }

    /* ✅ étiquette match plus petite */
    .meta{
      display:flex;
      align-items:flex-end;
      gap:10px;
    }
    .comp-logo{
      width:30px;
      height:30px;
      object-fit:contain;
      filter: drop-shadow(0 1px 0 rgba(0,0,0,.35));
      flex:0 0 auto;
    }
    .title{
      font-weight:900;
      font-size:14px;
      line-height:1.12;
      margin-bottom:3px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .sub{
      font-weight:800;
      font-size:11px;
      line-height:1.2;
      color:rgba(255,255,255,.78);
    }

    /* ✅ 21:00 un peu plus petit */
    .time{
      font-weight:900;
      font-size:16px;
      line-height:1;
      margin-bottom:8px;
      text-align:right;
    }

    /* bouton */
    .watch{
      border-radius:999px;
      border:1px solid rgba(255,255,255,.14);
      background:rgba(255,255,255,.10);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding:9px 12px;
      display:inline-flex;
      align-items:center;
      gap:10px;
      font-weight:900;
      letter-spacing:.02em;
      transition:transform .15s ease, background .15s ease;
      white-space:nowrap;
      color:#fff;
      font-size:12.5px;
    }
    .watch:hover{ background:rgba(255,255,255,.14); }
    .watch:active{ transform:scale(.98); }
    .play{
      width:30px; height:30px; border-radius:999px;
      display:grid; place-items:center;
      background:rgba(0,0,0,.20);
      border:1px solid rgba(255,255,255,.16);
    }

    /* ✅ GRID: 3 par ligne (PC), 2 tablette, 1 mobile */
    .grid-3{
      display:grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap:16px;
    }
    @media (max-width: 1100px){
      .grid-3{ grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 720px){
      .grid-3{ grid-template-columns: 1fr; gap:14px; }
      .info{ left:12px; right:12px; bottom:12px; }
      .left-stack{ max-width:74%; }
      .team-logo{ width:32px; height:32px; }
      .comp-logo{ width:28px; height:28px; }
      .title{ font-size:13.5px; }
      .sub{ font-size:11px; }
      .time{ font-size:15px; margin-bottom:7px; }
      .watch{ padding:9px 12px; }
    }
  </style>
</head>
