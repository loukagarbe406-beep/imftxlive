<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>IMFTX+ — Paris SG - Marseille</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

  <style>
    html, body { height: 100%; margin: 0; }
    body{
      font-family: 'Outfit', system-ui, -apple-system, "Segoe UI", Roboto, Arial;
      color:#fff;
      overflow-x:hidden;
    }

    .soft-bg{
      background:
        radial-gradient(1100px 520px at 15% 15%, rgba(255,255,255,.08), transparent 55%),
        radial-gradient(900px 520px at 85% 25%, rgba(255,255,255,.06), transparent 60%),
        radial-gradient(900px 520px at 30% 95%, rgba(255,255,255,.05), transparent 62%),
        linear-gradient(135deg, #141518 0%, #0f1012 55%, #0b0c0f 100%);
    }

    .glass{
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.09);
      backdrop-filter: blur(14px);
      box-shadow: 0 30px 120px rgba(0,0,0,.75);
    }

    .player-box{
      border-radius:22px;
      overflow:hidden;
      position:relative;
    }
    iframe{ width:100%; height:100%; border:0; background:#000; display:block; }

    /* ✅ COVER bannière */
    .cover{
      position:absolute;
      inset:0;
      z-index:15;
      cursor:pointer;
      background:
        linear-gradient(180deg, rgba(0,0,0,.10) 0%, rgba(0,0,0,.35) 55%, rgba(0,0,0,.70) 100%),
        url("https://empire-sport.online/upload/events/gt43gfinofbn6ew5iktbobaeehncsc.jpg") center/cover no-repeat;
      transform: translateZ(0);
    }

    .cover-top{
      position:absolute;
      top:16px;
      left:16px;
      display:flex;
      align-items:center;
      gap:10px;
      padding:10px 12px;
      border-radius:18px;
      background:rgba(0,0,0,.40);
      border:1px solid rgba(255,255,255,.14);
      backdrop-filter: blur(14px);
    }
    .team-logo{
      width:34px;height:34px;
      object-fit:contain;
      filter: drop-shadow(0 8px 20px rgba(0,0,0,.75));
    }
    .vs{
      font-weight:900;
      font-size:14px;
      opacity:.92;
    }

    .cover-strip{
      position:absolute;
      left:16px;
      right:16px;
      bottom:16px;
      height:84px;
      border-radius:20px;
      background: rgba(160,160,160,.35);
      border: 1px solid rgba(255,255,255,.18);
      backdrop-filter: blur(16px);
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:0 18px;
    }
    .strip-left{
      display:flex;
      align-items:center;
      gap:12px;
      min-width:0;
    }
    .strip-icon{
      width:28px;height:28px;
      opacity:.9;
      filter: drop-shadow(0 6px 14px rgba(0,0,0,.35));
    }
    .strip-title{
      font-size:16px;
      font-weight:900;
      line-height:1;
    }
    .strip-sub{
      font-size:15px;
      opacity:.92;
      font-weight:600;
      line-height:1.1;
      font-style:italic;
      margin-top:4px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .strip-play{
      width:44px;height:44px;
      border-radius:999px;
      border:2px solid rgba(255,255,255,.45);
      display:grid;
      place-items:center;
      transition:.2s;
      background:rgba(0,0,0,.15);
    }
    .strip-play i{ font-size:18px; }
    .strip-play:hover{ transform:scale(1.06); background:rgba(0,0,0,.25); }

    .source-btn{
      height:42px;
      border-radius:14px;
      font-weight:900;
      font-size:13px;
      transition:.2s;
    }
    .source-btn.active{ background:#fff; color:#000; }
    .source-btn.inactive{
      background:rgba(255,255,255,.08);
      border:1px solid rgba(255,255,255,.10);
      color:#fff;
    }

    .watch-bar{
      border-radius:18px;
      background:rgba(255,255,255,.10);
      border:1px solid rgba(255,255,255,.12);
      backdrop-filter: blur(16px);
      padding:14px 16px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:14px;
    }
    .watch-left{
      display:flex;
      align-items:center;
      gap:12px;
      min-width:0;
    }
    .watch-left img{
      width:38px;height:38px;
      object-fit:contain;
      filter: drop-shadow(0 6px 14px rgba(0,0,0,.7));
      flex-shrink:0;
    }
    .watch-text{ min-width:0; line-height:1.1; }
    .watch-text .small{ opacity:.8; font-weight:700; font-size:13px; }
    .watch-text .big{
      font-weight:900;
      font-size:15px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .channel-logo{
      width:94px;
      height:auto;
      object-fit:contain;
      filter: drop-shadow(0 6px 14px rgba(0,0,0,.7));
      flex-shrink:0;
    }

    .chat-box{
      border-radius:22px;
      overflow:hidden;
      min-height:520px;
    }

    .pill{
      position:absolute;
      top:16px;
      right:16px;
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:7px 12px;
      border-radius:999px;
      background: rgba(0,0,0,.40);
      border:1px solid rgba(255,255,255,.14);
      backdrop-filter: blur(14px);
      font-weight:900;
      font-size:12px;
      z-index:20;
    }
    .dot{
      width:7px;height:7px;border-radius:999px;background:#f59e0b;
      box-shadow:0 0 0 4px rgba(245,158,11,.14);
    }
  </style>
</head>

<body class="soft-bg">

  <nav class="sticky top-0 z-40 bg-black/25 backdrop-blur-xl border-b border-white/5">
    <div class="max-w-screen-2xl mx-auto px-6 py-3 flex items-center justify-between">
      <div class="text-2xl md:text-3xl font-extrabold tracking-tight">IMFTX+</div>
      <a href="index.html"
         class="inline-flex items-center gap-2 px-4 h-10 rounded-full bg-white/10 border border-white/10 hover:bg-white/15 font-bold text-sm active:scale-95 transition">
        <i class="fa-solid fa-arrow-left"></i> Retour
      </a>
    </div>
  </nav>

  <main class="max-w-screen-2xl mx-auto px-6 py-8">
    <section class="grid grid-cols-1 lg:grid-cols-[1fr_420px] gap-6">

      <!-- LEFT -->
      <div>
        <section class="player-box glass w-full aspect-video">
          <div id="cover" class="cover" onclick="loadVideo(1)">
            <div class="pill"><span class="dot"></span>20h45</div>

            <div class="cover-top">
              <img class="team-logo"
                   src="https://empire-sport.online/upload/teams/fxdcxolvnmos15nopn7zc7qe7ornox.png"
                   alt="Paris SG">
              <span class="vs">VS</span>
              <img class="team-logo"
                   src="https://empire-sport.online/upload/teams/5box72sxig3lzrlh1xkj44xqfw9j41.png"
                   alt="Marseille">
            </div>

            <div class="cover-strip">
              <div class="strip-left">
                <img class="strip-icon"
                     src="https://empire-sport.online/upload/leagues/xdyjxerqlfl6fdgghbaev5cxxmnp2r.png"
                     alt="Compétition">
                <div style="min-width:0">
                  <div class="strip-title">Regarder Gratuitement</div>
                  <div class="strip-sub">Paris SG<br>Marseille</div>
                </div>
              </div>

              <div class="strip-play">
                <i class="fa-solid fa-play"></i>
              </div>
            </div>
          </div>

          <div id="videoTarget" class="w-full h-full"></div>
        </section>

        <!-- SOURCES -->
        <section class="mt-4 flex flex-wrap gap-3">
          <button id="btn1" onclick="loadVideo(1)" class="source-btn active px-6">🇬🇧 (1440p) (1)</button>
          <button id="btn2" onclick="loadVideo(2)" class="source-btn inactive px-6">🇫🇷 (1440p) (2)</button>
          <button id="btn3" onclick="loadVideo(3)" class="source-btn inactive px-6">🇫🇷 (1440p) (3)</button>
        </section>

        <!-- DIRECT LINK (fallback) -->
        <div id="externalLink" class="hidden mt-3 text-center">
          <a id="directLink" href="#" target="_blank" rel="noreferrer"
             class="text-amber-400 underline font-extrabold text-sm">
            Le lecteur ne s’affiche pas ? Ouvrir le lien direct
          </a>
        </div>

        <!-- VOUS REGARDEZ -->
        <section class="mt-5 watch-bar glass">
          <div class="watch-left">
            <img src="https://empire-sport.online/upload/leagues/xdyjxerqlfl6fdgghbaev5cxxmnp2r.png" alt="Compétition">
            <div class="watch-text">
              <div class="small">Vous regardez</div>
              <div class="big">Paris SG - Marseille</div>
              <div class="small">Ligue 1 (classico) · 20:45</div>
            </div>
          </div>

          <img class="channel-logo"
               src="https://empire-sport.online/upload/chaines/dw3nqnkbiqo3k02dksv9dmt7sxawk8.png"
               alt="Chaîne">
        </section>

        <div class="mt-6 text-center text-sm text-white/45 font-semibold">
          Si le stream bug, nous ne sommes pas responsables (connexion / lecteur externe). — IMFTX+
        </div>
      </div>

      <!-- RIGHT : CHAT -->
      <aside class="chat-box glass">
        <iframe id="chatFrame" src="" allow="autoplay" referrerpolicy="no-referrer-when-downgrade"></iframe>
      </aside>

    </section>
  </main>

  <script>
    // ✅ Mets tes liens OFFICIELS ici
    const SOURCES = {
      1: "https://codecost.site/default/4/default.default",
      2: "https://spiderembed.top/embed/4830646/paris-saint-germain-marseille/hd/1",
      3: "https://spiderembed.top/embed/746595/paris-saint-germain-marseille/hd/1?player=jw"
    };

    // ✅ Chat Twitch : seulement l’iframe, parent auto
    (function(){
      const parentDomain = window.location.hostname;
      const channel = "guidonrw";
      document.getElementById("chatFrame").src =
        `https://www.twitch.tv/embed/${channel}/chat?darkpopout&parent=${encodeURIComponent(parentDomain)}`;
    })();

    function setActive(id){
      [1,2,3].forEach(n=>{
        const b = document.getElementById("btn"+n);
        b.className = (n===id)
          ? "source-btn active px-6"
          : "source-btn inactive px-6";
      });
    }

    function loadVideo(id){
      document.getElementById("cover").style.display = "none";
      setActive(id);

      const ext = document.getElementById("externalLink");
      const link = document.getElementById("directLink");
      link.href = SOURCES[id] || "#";
      ext.classList.add("hidden");

      const target = document.getElementById("videoTarget");

      if(!SOURCES[id] || SOURCES[id] === "#"
         || (SOURCES[id] + "").includes("REMPLACE-MOI")){
        target.innerHTML = `
          <div class="w-full h-full grid place-items-center text-white/70 font-extrabold">
            Ajoute un lien dans SOURCES (Source ${id})
          </div>`;
        return;
      }

      // ⚠️ Pas de sandbox ici (sinon certains embeds affichent "Remove sandbox attributes")
      target.innerHTML = `
        <iframe
          id="streamFrame"
          src="${SOURCES[id]}"
          allowfullscreen
          scrolling="no"
          frameborder="0"
          allow="autoplay; fullscreen; picture-in-picture; encrypted-media"
          referrerpolicy="origin">
        </iframe>
      `;

      // fallback si embed bloqué
      setTimeout(() => {
        const iframe = document.getElementById("streamFrame");
        if(!iframe) return;
        try { iframe.contentWindow.location.href; }
        catch(e){ ext.classList.remove("hidden"); }
      }, 2000);
    }
  </script>

</body>
</html>
